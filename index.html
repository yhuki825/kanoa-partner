async function doTrackerEditSave(id){
  const r=tkRow(id); if(!r) return;
  const errEl=document.getElementById('tkeErr');
  const btn=document.getElementById('tkeBtn');
  const v=x=>((document.getElementById(x)||{}).value||'').trim();
  const name=v('tkeName');
  if(!name){ if(errEl) errEl.textContent='お名前を入力してください'; return; }
  if(v('tkeEmail') && !isEmail(v('tkeEmail'))){ if(errEl) errEl.textContent='メールアドレスの形式をご確認ください'; const _el=document.getElementById('tkeEmail'); if(_el) _el.focus(); return; }
  if(btn){ btn.disabled=true; btn.textContent='保存中…'; }
  const res=await SUPA.trackerUpdatePerson(_tkToken, _tkPw, r.kind, r.id, {
    name, kana:v('tkeKana'), phone:v('tkePhone'), email:v('tkeEmail'), area:v('tkeArea'), note:v('tkeNote')
  });
  if(btn){ btn.disabled=false; btn.textContent='保存する'; }
  if(res.error){ if(errEl) errEl.textContent='保存に失敗しました：'+res.error; return; }
  closeModal();
  await refreshTracker(true);
  toast('保存しました');
}

/* 書類のアップロード（intake は intake.docs、送客済みは documents テーブルへ） */
async function doTrackerUpload(id, docCode, file){
  const r=tkRow(id); if(!r||!file) return;
  if(file.size>25*1048576){ toast('ファイルは25MBまでです'); return; }
  // 内定承諾資料は枠ごとに種別を固定して保存する（表示は「内定承諾資料N」でも、KANOA側では正しく分類される）
  const OFFER_KIND={gensen:'源泉徴収票', kyuyo:'給与明細', shoyo:'賞与明細'};
  // 送客済みは日本語ラベル、フォーム登録は 'rireki'/'shoku' で保存する
  const kind = OFFER_KIND[docCode]
    || ((r.kind==='referral')
        ? (docCode==='rireki'?'履歴書':docCode==='shoku'?'職務経歴書':'その他')
        : docCode);
  toast('アップロード中…');
  const res=await SUPA.trackerAddDoc(_tkToken, _tkPw, r.kind, r.id, file, kind);
  if(res.error){ toast('アップロードに失敗しました：'+res.error); return; }
  await refreshTracker(true);
  openTrackerEdit(id);   // モーダルを開き直して最新の提出状況を見せる
  toast('提出しました');
}

async function doTrackerDelDoc(id, docId){
  const r=tkRow(id); if(!r) return;
  if(!confirm('この書類を取り消しますか？')) return;
  const res=await SUPA.trackerDelDoc(_tkToken, _tkPw, r.kind, r.id, docId);
  if(res.error){ toast('取り消しに失敗しました：'+res.error); return; }
  await refreshTracker(true);
  openTrackerEdit(id);
  toast('取り消しました');
}

/* boot */
(function(){
  var _q=null; try{ _q=new URLSearchParams(location.search); }catch(e){}
  // 二次パートナー向け 進捗確認リンク（ログイン不要・最優先）
  var _track = _q && _q.get('track');
  if(_track){ renderTrackerGate(_track); return; }
  var _special = !!(_q && (_q.get('form') || (_q.get('invite') && _q.get('token'))));
  if(DEMO_MODE){ CHECK_INVITE_THEN_LOGIN(); }
  else { if(_special) CHECK_INVITE_THEN_LOGIN(); SUPA.boot(); }
})();
</script>
<script>
(function(){
/* ───────────────────────────────────────────────────────────────
   KANOA ログイン背景 ── 「つながりが、大きな潮流になる」
   流れる波（潮流）の上を、個社を表すノードが連なりながら右へ流れ、
   近接でつながりを結び、ひとつの大きな流れに乗っていく。
   ─────────────────────────────────────────────────────────────── */
const canvas = document.getElementById('loginCanvas');
const ctx = (canvas && canvas.getContext) ? canvas.getContext('2d') : null;
if(!ctx || typeof requestAnimationFrame==='undefined'){ window._loginAnim={start:function(){},stop:function(){}}; return; }

let _raf=null,_running=false,W,H;
const DPR=Math.min(window.devicePixelRatio||1, 2);
function resize(){
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  initLayers();
}
const ptr={x:-9999,y:-9999,on:false};
window.addEventListener('mousemove',e=>{ ptr.x=e.clientX; ptr.y=e.clientY; ptr.on=true; });
window.addEventListener('mouseleave',()=>{ ptr.on=false; });
window.addEventListener('touchmove',e=>{ const t=e.touches&&e.touches[0]; if(t){ ptr.x=t.clientX; ptr.y=t.clientY; ptr.on=true; } },{passive:true});
window.addEventListener('touchend',()=>{ ptr.on=false; });

const NODE='96,124,160';    // soft slate-navy network
const ACCENT='31,63,99';     // brand navy highlight
function rnd(a,b){ return a+Math.random()*(b-a); }

function paintBg(alpha){
  const g=ctx.createLinearGradient(0,0,W*0.5,H);
  g.addColorStop(0,   '#ffffff');
  g.addColorStop(0.5, '#f7f9fb');
  g.addColorStop(1,   '#eef2f6');
  ctx.globalAlpha=alpha; ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
}

/* ── 波（潮流）レイヤー */
let layers=[];
function initLayers(){
  layers=[];
  const rows=[0.30,0.44,0.56,0.67,0.78,0.9];
  for(let i=0;i<rows.length;i++){
    layers.push({
      y: rows[i]*H,
      amp: 22 + i*6 + rnd(-4,4),
      wl:  240 + i*70,
      sp:  0.00016 + i*0.000045,
      ph:  rnd(0,6.283),
      op:  0.05 - i*0.006,
      w:   1.5
    });
  }
}
function waveY(L,x){
  return L.y + L.amp*Math.sin(x/L.wl + L.ph) + (L.amp*0.42)*Math.sin(x/(L.wl*0.5) - L.ph*1.25);
}
function drawWaves(){
  for(const L of layers){
    // ribbon（消えていく塗り＝奥行き）
    ctx.beginPath();
    ctx.moveTo(0, waveY(L,0));
    for(let x=14;x<=W+14;x+=16) ctx.lineTo(x, waveY(L,x));
    const top=Math.max(0,L.y-L.amp);
    const lineEndX=W+14;
    ctx.lineTo(lineEndX, top+120); ctx.lineTo(0, top+120); ctx.closePath();
    const g=ctx.createLinearGradient(0,top,0,top+120);
    g.addColorStop(0,'rgba('+NODE+','+Math.max(0.02,L.op*0.34).toFixed(3)+')');
    g.addColorStop(1,'rgba('+NODE+',0)');
    ctx.fillStyle=g; ctx.fill();
    // crest line
    ctx.beginPath();
    ctx.moveTo(0, waveY(L,0));
    for(let x=14;x<=W+14;x+=16) ctx.lineTo(x, waveY(L,x));
    ctx.strokeStyle='rgba('+NODE+','+Math.max(0.03,L.op).toFixed(3)+')';
    ctx.lineWidth=L.w; ctx.stroke();
  }
}

/* ── ノード（個社）：ゆるやかに漂う星座 */
const COUNT=(W*H>1150000)?94:66;
const R_LINK=134, R_LINK2=R_LINK*R_LINK, MAX_NODES=200;
function makeNode(init,x,y){
  const z=rnd(0.38,1);
  return { x:(x!=null)?x:rnd(0,W), y:(y!=null)?y:rnd(0,H), z,
           dir:rnd(0,6.283), sp:rnd(0.16,0.36)+z*0.22, r:0.9+z*1.7,
           accent:Math.random()<0.13, t:rnd(0,6.283), tw:rnd(0.004,0.0085),
           tk:rnd(0,6.283), rx:0, ry:0, spd:0 };
}
let nodes=[];
function build(){ nodes=Array.from({length:COUNT},()=>makeNode(true)); }

function stepNode(n){
  n.t+=n.tw;
  n.dir+=Math.sin(n.t)*0.01 + Math.cos(n.t*0.5+1.3)*0.006; // 進路がゆっくり揺らぐ
  n.x+=Math.cos(n.dir)*n.sp;
  n.y+=Math.sin(n.dir)*n.sp;
  if(ptr.on){
    const dx=n.x-ptr.x, dy=n.y-ptr.y, d=Math.hypot(dx,dy);
    if(d<175&&d>0.01){ const f=(1-d/175); const push=f*f*2.3*n.z; n.x+=dx/d*push; n.y+=dy/d*push; }
  }
  const m=90;
  if(n.x<-m)n.x=W+m; else if(n.x>W+m)n.x=-m;
  if(n.y<-m)n.y=H+m; else if(n.y>H+m)n.y=-m;
  n.spd=n.sp;
}

window.addEventListener('mousedown',e=>{
  for(let k=0;k<5;k++){ const n=makeNode(false,e.clientX+rnd(-14,14),e.clientY+rnd(-14,14)); n.accent=Math.random()<0.5; n.z=rnd(0.72,1); n.r=0.9+n.z*1.7; nodes.push(n); }
  if(nodes.length>MAX_NODES) nodes.splice(0,nodes.length-MAX_NODES);
});

function drawLinks(){
  ctx.lineWidth=1;
  for(let i=0;i<nodes.length;i++){
    const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){
      const b=nodes[j];
      const dx=a.rx-b.rx, dy=a.ry-b.ry, d2=dx*dx+dy*dy;
      if(d2<R_LINK2){
        const t=1-d2/R_LINK2, dep=(a.z+b.z)*0.5;
        ctx.strokeStyle='rgba('+NODE+','+(t*t*0.30*dep).toFixed(3)+')';
        ctx.beginPath(); ctx.moveTo(a.rx,a.ry); ctx.lineTo(b.rx,b.ry); ctx.stroke();
      }
    }
    if(ptr.on){
      const dx=a.rx-ptr.x, dy=a.ry-ptr.y, d2=dx*dx+dy*dy;
      if(d2<R_LINK2*1.7){
        const t=1-d2/(R_LINK2*1.7);
        ctx.strokeStyle='rgba('+ACCENT+','+(t*t*0.45).toFixed(3)+')';
        ctx.beginPath(); ctx.moveTo(a.rx,a.ry); ctx.lineTo(ptr.x,ptr.y); ctx.stroke();
      }
    }
  }
}
function drawNodes(){
  for(const n of nodes){
    const col=n.accent?ACCENT:NODE;
    const tw=0.6+0.4*Math.sin(n.t*2.4+n.tk);        // 明滅
    const a=tw*(0.3+0.45*n.z);
    const glow=2.4+n.r*2.6;
    const rg=ctx.createRadialGradient(n.rx,n.ry,0,n.rx,n.ry,glow);
    rg.addColorStop(0,'rgba('+col+','+(0.85*a).toFixed(3)+')');
    rg.addColorStop(1,'rgba('+col+',0)');
    ctx.fillStyle=rg;
    ctx.beginPath(); ctx.arc(n.rx,n.ry,glow,0,6.283); ctx.fill();
    ctx.fillStyle='rgba('+col+','+(0.95*a).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(n.rx,n.ry,n.r*0.6,0,6.283); ctx.fill();
  }
}

let parX=0,parY=0;
function frame(){
  for(const L of layers) L.ph += L.sp*16;
  const tpx = ptr.on ? (ptr.x/W-0.5) : 0;
  const tpy = ptr.on ? (ptr.y/H-0.5) : 0;
  parX += (tpx-parX)*0.045; parY += (tpy-parY)*0.045;
  paintBg(0.5);
  drawWaves();
  for(const n of nodes){ stepNode(n); n.rx=n.x - parX*n.z*46; n.ry=n.y - parY*n.z*46; }
  drawLinks();
  drawNodes();

  _raf=requestAnimationFrame(frame);
}

function _start(){ if(_running) return; _running=true; resize(); build(); paintBg(1); frame(); }
function _stop(){ _running=false; if(_raf){ cancelAnimationFrame(_raf); _raf=null; } }
window._loginAnim={start:_start,stop:_stop};
_start();
})();
</script>


</body></html>
