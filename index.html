   </div>\n      <div style=\"display:flex;gap:8px;margin-top:10px;flex-wrap:wrap\">\n        ${!r.resigned ? `<button class=\"btn btn-ghost btn-sm\" data-act=\"ref-resign-prompt\" data-ref=\"${r.id}\">退職を記録</button>` : ''}\n        ${r.resigned && resignStatus(r)==='reported' ? `<button class=\"btn btn-primary btn-sm\" data-act=\"resign-confirm-status\" data-ref=\"${r.id}\">退職を確認済みにする</button>` : ''}\n        ${r.resigned && refundAmount(r)>0 && !refundInvoiced(r.id) && S.role==='agency' ? `<button class=\"btn btn-danger btn-sm\" data-act=\"ref-create-one\" data-ref=\"${r.id}\">返金を請求</button>` : ''}\n        ${r.resigned ? `<button class=\"btn btn-ghost btn-sm\" data-act=\"ref-unresign\" data-ref=\"${r.id}\">退職記録を取消</button>` : ''}\n      </div>\n      ` : ''}\n      ${docsSection(r)}\n      <div class=\"dt-block-title\" style=\"margin-top:16px\">操作履歴</div>\n      <div class=\"info-card\">${refHistoryHtml(r.id)}</div>\n    </div>`;\n  openOverlay();\n}\nfunction saveRefEdit(id){\n  const r=DB.referrals.find(x=>x.id===id); if(!r) return;\n  r.name=val('dr_name'); r.kana=val('dr_kana'); r.phone=val('dr_phone'); r.email=val('dr_email');\n  r.address=val('dr_address'); r.area=val('dr_area'); r.src=val('dr_src');\n  const newStatus=document.getElementById('dr_status').value;\n  const block=advanceGuard(r, newStatus);\n  if(block && newStatus!==r.status){ toast(block); return; }\n  r.status=newStatus;\n  r.session=val('dr_session')||'—';\n  // 入社月：入力欄で選んだ月を常に優先。空にすれば「未定」へ戻せる。\n  const ym=document.getElementById('dr_joined').value;\n  const prevStatus=r.status; // statusは上で更新済みのため、変更前は newStatus 判定で扱う\n  r.joined = ym ? `${ym}-01` : '';\n  // 新たに「入社」へ切り替えた時だけ、未入力なら当月を補完（編集の手間を省く）\n  if(newStatus==='joined' && r.status!=='joined' && !r.joined){ r.joined=todayISO(); }\n  r.pj=document.getElementById('dr_pj').value;\n  r.ag=document.getElementById('dr_ag').value;\n  const note=document.getElementById('dr_note'); if(note) r.note=note.value.trim();\n  save(); updateNavCounts();\n  if(S.view==='referrals'){ renderRefChips(); renderRefTable(); }\n  else if(S.view==='projectDetail') viewProjectDetail();\n  else render();\n  toast('変更を保存しました');\n  openRefDrawer(id);\n}\n\n/* ════════════════════ DRAWER: agency cockpit ════════════════════ */\nfunction openAgencyDrawer(id){\n  const a=agency(id); if(!a) return;\n  S._agDrawer=id;\n  const rs=agencyReferrals(id);\n  const sent=rs.filter(r=>r.status!=='rejected').length;\n  const joined=rs.filter(r=>r.status==='joined').length;\n  const sp=splitEarn(rs);\n  const recent=rs.slice().sort((x,y)=>(x.created<y.created?1:-1)).slice(0,6);\n  const un=unreadKanoaBy(id);\n  const d=document.getElementById('drawer');\n  const mini=(l,v,col)=>`<div style=\"flex:1;min-width:0\"><div style=\"font-size:10.5px;color:var(--muted);font-weight:600\">${l}</div><div style=\"font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;color:${col||'var(--ink)'}\">${v}</div></div>`;\n  d.innerHTML=`\n    <div class=\"drawer-head\">\n      ${agAvatar(a,44)}\n      <div class=\"drawer-head-name\"><div class=\"drawer-title\">${esc(a.name)}</div><div class=\"drawer-sub\">${agCode(a)} · ${a.status==='active'?'提携中':a.status==='pending'?'承認待ち':'停止中'} · ${a.source==='invited'?'招待発行':'申請承認'}</div></div>\n      <button class=\"drawer-close\" data-act=\"closeoverlay\">×</button>\n    </div>\n    <div class=\"drawer-body\">\n      ${S.role==='kanoa' ? `<div class=\"dt-block-title\">パートナー招待</div>${inviteLinkPanel(a)}<div style=\"height:14px\"></div>` : ''}\n      <div class=\"info-card\">\n        <div class=\"info-row\"><span class=\"info-label\">担当</span><span class=\"info-val\">${esc(a.contact||'—')}</span></div>\n        <div class=\"info-row\"><span class=\"info-label\">メール</span><span class=\"info-val\"><a href=\"mailto:${esc(a.email)}\">${esc(a.email||'—')}</a></span>${a.email?`<button class=\"copy-btn\" data-act=\"copy\" data-v=\"${esc(a.email)}\">コピー</button>`:''}</div>\n        <div class=\"info-row\"><span class=\"info-label\">登録日</span><span class=\"info-val\">${esc(a.joined||'—')}</span></div>\n      </div>\n      <div class=\"dt-block-title\">ログイン情報</div>\n      <div class=\"info-card\" style=\"margin-bottom:16px\">\n        <div class=\"info-row\"><span class=\"info-label\">ID(メール)</span><span class=\"info-val\">${esc(a.email||'—')}</span></div>\n        <div class=\"info-row\"><span class=\"info-label\">パスワード</span><span class=\"info-val mono\">${(a.pw && a.pw!=='demo')?`<span id=\"pwReveal\">••••••••</span>`:'<span class=\"cell-sub\">未発行（招待メール方式）</span>'}</span>${(a.pw && a.pw!=='demo')?`<button class=\"copy-btn\" id=\"pwRevealBtn\" data-act=\"reveal-pw\" data-pw=\"${esc(a.pw)}\">表示</button><button class=\"copy-btn\" data-act=\"copy\" data-v=\"${esc(a.pw)}\">コピー</button>`:''}</div>\n        <div class=\"info-row\" style=\"border-top:1px solid var(--line)\"><span class=\"info-val cell-sub\" style=\"font-size:11.5px\">${(a.pw&&a.pw!=='demo')?'この場で発行したID/パスワードでログインできます':'招待メール／マジックリンクでログインします'}</span><button class=\"copy-btn\" data-act=\"reissue-pw\" data-id=\"${a.id}\">${(a.pw&&a.pw!=='demo')?'再発行':'ID/PWを発行'}</button></div>\n      </div>\n      <div class=\"dr-readout\" style=\"gap:8px\">\n        ${mini('送客',sent+'名')}${mini('入社',joined+'名','var(--g)')}${mini('確定',yen(sp.confirmed))}${mini('見込み',yen(sp.pipeline),'var(--a)')}\n      </div>\n      <div style=\"display:flex;gap:8px;margin-bottom:18px\">\n        <button class=\"btn btn-primary btn-sm\" style=\"flex:1\" data-act=\"contact-agency\" data-ag=\"${a.id}\">メッセージを送る${un?` (${un})`:''}</button>\n        ${a.status==='active'?`<button class=\"btn btn-ghost btn-sm\" data-act=\"suspend-agency\" data-id=\"${a.id}\">停止</button>`:a.status==='pending'?`<button class=\"btn btn-primary btn-sm\" data-act=\"approve-agency\" data-id=\"${a.id}\">承認</button>`:`<button class=\"btn btn-ghost btn-sm\" data-act=\"reactivate-agency\" data-id=\"${a.id}\">再開</button>`}\n      </div>\n      <div class=\"dt-block-title\" style=\"display:flex;align-items:center;gap:8px\">メンバー<button class=\"copy-btn\" data-act=\"member-add\" data-org=\"${a.id}\" style=\"margin-left:auto\">+ 追加</button></div>\n      ${orgMembers(a.id).length?`<div class=\"info-card\" style=\"margin-bottom:16px\">${orgMembers(a.id).map(m=>`<div class=\"info-row\"><div class=\"thread-av\" style=\"width:30px;height:30px;font-size:12px;background:${agColor(a.id)}\">${esc(m.name.slice(0,1))}</div><div class=\"info-val\"><strong style=\"font-weight:600\">${esc(m.name)}</strong>${m.title?` <span class=\"tag\" style=\"font-size:10px\">${esc(m.title)}</span>`:''}<div class=\"cell-sub\">${esc(m.email||'—')}</div></div><button class=\"copy-btn\" data-act=\"member-del\" data-id=\"${m.id}\">削除</button></div>`).join('')}</div>`:'<div class=\"cell-sub\" style=\"padding:4px 2px 14px\">メンバー未登録</div>'}\n      <div class=\"dt-block-title\">このパートナーの送客（${rs.length}）</div>\n      ${recent.length?`<div class=\"info-card\">${recent.map(r=>`<div class=\"info-row\" style=\"cursor:pointer\" data-act=\"open-ref\" data-id=\"${r.id}\"><div class=\"info-val\"><strong style=\"font-weight:600\">${esc(r.name)}</strong> <span class=\"cell-sub\">${esc(project(r.pj)?project(r.pj).name.replace(' パートナー送客',''):'')}</span></div>${r.joined?`<span class=\"tag\" style=\"background:var(--g-bg);color:var(--g);font-size:10.5px;margin-right:6px\">${joinedM(r)}</span>`:''}${statusBadge(r.status)}</div>`).join('')}</div>`:`<div class=\"cell-sub\" style=\"padding:8px 2px\">送客はまだありません</div>`}\n    </div>`;\n  openOverlay();\n}\n\n/* ════════════════════ MODALS ════════════════════ */\n/* ════════════════════ 資料から自動入力（ブラウザ内解析） ════════════════════ */\nasync function loadPdfJs(){\n  if(window.pdfjsLib) return window.pdfjsLib;\n  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });\n  try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; }catch(e){}\n  return window.pdfjsLib;\n}\nasync function extractPdfText(file){\n  const lib=await loadPdfJs(); const buf=await file.arrayBuffer();\n  const pdf=await lib.getDocument({data:buf}).promise; let text='';\n  for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i); const c=await pg.getTextContent(); text+=c.items.map(it=>it.str).join(' ')+'\\n'; }\n  return text;\n}\nfunction parseResumeFields(t){\n  // ── 履歴書テキストからの項目抽出（大幅強化版 v2）──\n  const clean=(t||'').replace(/\\u3000/g,' ').replace(/\\r/g,'');\n  const out={};\n  const grabAll=(res)=>{ for(const re of res){ const m=clean.match(re); if(m&&m[1]&&m[1].trim()) return m[1].trim().replace(/\\s{2,}/g,' '); } return ''; };\n\n  // ── メール（個人アドレス優先、システム系を除外）──\n  const emails=clean.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}/g);\n  if(emails&&emails.length){\n    out.email = emails.find(e=>!/(example|sample|test|noreply|no-reply|info@|support@|admin@)/i.test(e)) || emails[0];\n  }\n\n  // ── 電話（携帯優先→固定。ラベル近傍を最優先）──\n  const near=(label)=>{ const m=clean.match(new RegExp(label+'[\\\\s:：]*((?:0\\\\d[\\\\d\\\\-\\\\s()]{8,13}))')); return m?m[1]:''; };\n  let phone = near('(?:携帯|携帯電話|ケータイ|Mobile|TEL|電話|℡|Tel|電話番号|連絡先)') || '';\n  if(!phone){\n    const mobs=clean.match(/0[789]0[-\\s]?\\d{4}[-\\s]?\\d{4}/g);       // 携帯\n    const fixed=clean.match(/0\\d{1,3}[-\\s(]?\\d{1,4}[-\\s)]?\\d{4}/g); // 固定\n    phone = (mobs&&mobs[0]) || (fixed&&fixed[0]) || '';\n  }\n  if(phone) out.phone=phone.replace(/[\\s()]/g,'-').replace(/[-]+/g,'-').replace(/^-|-$/g,'');\n\n  // ── フリガナ（カタカナ/ひらがな/半角カナ。姓名分かち書き優先）──\n  out.kana=grabAll([\n    /(?:ふりがな|フリガナ|フリカナ|ﾌﾘｶﾞﾅ|カナ|かな|ヨミ|よみ|読み仮名)[\\s:：]*([ぁ-んァ-ヶー\\u30fcｦ-ﾟ]{2,10}[\\s　]+[ぁ-んァ-ヶー\\u30fcｦ-ﾟ]{2,10})/,\n    /(?:ふりがな|フリガナ|フリカナ|ﾌﾘｶﾞﾅ|カナ|かな|ヨミ|よみ)[\\s:：]*([ぁ-んァ-ヶー\\u30fcｦ-ﾟ]{2,30})/,\n  ]);\n\n  // ── 氏名（ラベル付き優先、姓名の分かち書き優先。数字・記号を含む誤爆を防ぐ）──\n  out.name=grabAll([\n    /(?:氏\\s*名|名\\s*前|お名前|氏名\\(漢字\\)|Name)[\\s:：]*([一-龥々ヶ]{1,10}[\\s　]+[一-龥々ヶ]{1,10})/,\n    /(?:氏\\s*名|名\\s*前|お名前)[\\s:：]*([一-龥々ヶ]{2,10})(?=[\\s　\\n]|$)/,\n  ]);\n  // ラベル無し履歴書：フリガナの直後や、生年月日の手前にある漢字姓名を氏名候補に\n  if(!out.name && out.kana){\n    const m=clean.match(/([一-龥々]{1,4}[\\s　]+[一-龥々]{1,4})[\\s　]*(?:\\n|生年|昭和|平成|令和|西暦|19\\d{2}|20\\d{2}|男|女)/);\n    if(m) out.name=m[1].trim().replace(/\\s{2,}/g,' ');\n  }\n\n  // ── 生年月日（複数フォーマット対応、和暦も）──\n  const bd=grabAll([\n    /(?:生年月日|生年|誕生日|Birth)[\\s:：]*((?:昭和|平成|令和|西暦)?\\s*\\d{1,4}[年\\/\\-\\.]\\s*\\d{1,2}[月\\/\\-\\.]\\s*\\d{1,2}日?)/,\n    /((?:19|20)\\d{2}[年\\/\\-\\.]\\s*\\d{1,2}[月\\/\\-\\.]\\s*\\d{1,2}日?)(?=[\\s　]*(?:生|\\(|（|満|歳|\\n))/,\n  ]);\n  if(bd) out.birth=bd.replace(/\\s+/g,'');\n\n  // ── 年齢（「満XX歳」「(XX歳)」など）──\n  const ageM=clean.match(/(?:満\\s*)?(\\d{1,2})\\s*歳/) || clean.match(/[\\(（]\\s*(\\d{1,2})\\s*[\\)）]/);\n  if(ageM && +ageM[1]>=16 && +ageM[1]<=80) out.age=ageM[1];\n\n  // ── 性別（ラベル・単独・氏名行末の男女に対応）──\n  const gm=clean.match(/(?:性別)[\\s:：]*(男性|女性|男|女)/)\n        || clean.match(/(?:^|[\\s　])(男性|女性)(?:[\\s　]|$)/m)\n        || clean.match(/[一-龥々ぁ-んァ-ヶー][\\s　]+(男|女)(?:[\\s　]|$)/m);\n  if(gm){ const g=gm[1]; out.gender = (g==='男'||g==='男性')?'男性':'女性'; }\n\n  // ── 住所（郵便番号の後 or ラベル）──\n  out.address=grabAll([\n    /(?:現\\s*住\\s*所|住\\s*所|現住所|Address)[\\s:：]*(?:〒?\\s*\\d{3}-?\\d{4}\\s*)?([一-龥ぁ-んァ-ヶーa-zA-Z0-9\\-\\s]{4,60})/,\n    /〒?\\s*\\d{3}-?\\d{4}\\s*([一-龥ぁ-んァ-ヶーa-zA-Z0-9\\-\\s]{4,60})/,\n  ]);\n  if(out.address) out.address=out.address.replace(/\\s{2,}/g,' ').trim();\n\n  // ── 郵便番号（単独でも拾う）──\n  const zip=clean.match(/〒?\\s*(\\d{3}-?\\d{4})/);\n  if(zip) out.zip=zip[1].includes('-')?zip[1]:zip[1].slice(0,3)+'-'+zip[1].slice(3);\n\n  // ── 希望エリア（ラベル優先→住所の都道府県）──\n  const areaLabel=grabAll([/(?:希望勤務地|希望エリア|勤務地希望|希望地域|希望勤務地域|勤務希望地)[\\s:：]*([^\\n]{2,20})/]);\n  if(areaLabel){ out.area=areaLabel.replace(/[、,].*$/,'').trim(); }\n  else {\n    const pref=(out.address||clean).match(/(北海道|東京都|京都府|大阪府|[一-龥]{2,3}県)/);\n    if(pref) out.area=pref[1];\n  }\n\n  return out;\n}\nasync function autofillFromDoc(file){\n  if(!file) return; toast('資料を読み取り中…');\n  try{\n    const ext=fileExt(file.name);\n    const set=(id,v)=>{ if(v){ const el=document.getElementById(id); if(el&&!el.value) el.value=v; } };\n    if(ext==='xlsx'||ext==='xls'||ext==='csv'||ext==='tsv'){\n      // 表形式ファイル：1行目を見出し扱いで自動マッピングし、最初のデータ行を反映\n      const {headers, rows} = await parseSpreadsheetFile(file);\n      if(!rows.length){ toast('データが見つかりませんでした'); return; }\n      const mapping=autoMapColumns(headers);\n      const objs=rowsToObjects([rows[0]], mapping);\n      const f=objs[0]||{};\n      set('mName',f.name); set('mKana',f.kana); set('mPhone',f.phone); set('mEmail',f.email); set('mAddress',f.address); set('mArea',f.area); set('mSrc',f.src);\n      const got=Object.values(f).filter(Boolean).length;\n      toast(got?`${got}項目を読み取りました。内容をご確認ください${rows.length>1?`（複数行検出：一括登録が便利です）`:''}`:'読み取れる項目が見つかりませんでした。手入力をお願いします');\n      return;\n    }\n    let text='';\n    if(ext==='pdf'||file.type==='application/pdf'){ text=await extractPdfText(file); }\n    else if(/^(txt|md|json)$/.test(ext)||/^text\\//.test(file.type)){ text=await file.text(); }\n    else { toast('対応形式：PDF・CSV・Excel・テキスト'); return; }\n    const f=parseResumeFields(text);\n    set('mName',f.name); set('mKana',f.kana); set('mPhone',f.phone); set('mEmail',f.email); set('mAddress',f.address); set('mArea',f.area);\n    const got=['name','kana','phone','email','address','area'].filter(k=>f[k]).length;\n    toast(got?`資料から${got}項目を読み取りました。内容をご確認ください`:'読み取れる項目が見つかりませんでした。手入力をお願いします');\n  }catch(e){ toast('読み取りに失敗しました。手入力をお願いします'); }\n}\nfunction modalNewReferral(pjId, agId){\n  const p=project(pjId);\n  const isK = S.role==='kanoa';\n  const activeAgs = DB.agencies.filter(a=>a.status!=='pending');\n  const defAg = agId || (activeAgs[0]&&activeAgs[0].id) || '';\n  const projSel = DB.projects.length>1\n    ? `<div class=\"field full\"><label>案件 *</label><select id=\"mProj\">${DB.projects.map(pp=>`<option value=\"${pp.id}\" ${pp.id===pjId?'selected':''}>${esc(pp.name)}</option>`).join('')}</select></div>`\n    : `<input type=\"hidden\" id=\"mProj\" value=\"${pjId}\">`;\n  const agSel = isK\n    ? `<div class=\"field full\"><label>送客元のパートナー *</label><select id=\"mAg\">${activeAgs.map(a=>`<option value=\"${a.id}\" ${a.id===defAg?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>`\n    : '';\n  showModal(`\n    <div class=\"modal-title\">候補者を送客</div>\n    <div class=\"modal-sub\">${esc(p?p.name:'')}</div>\n    <div id=\"singleDrop\" style=\"border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;margin-bottom:14px;cursor:pointer;background:var(--gray-bg);transition:all .15s\">\n      <input type=\"file\" id=\"singleDropInput\" accept=\".pdf,.txt,.csv,.tsv,.md,.json,.xlsx,.xls\" data-act=\"autofill-doc\" style=\"display:none\">\n      <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.8\" style=\"margin-bottom:4px\"><path d=\"M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4\"/><polyline points=\"17 8 12 3 7 8\"/><line x1=\"12\" y1=\"3\" x2=\"12\" y2=\"15\"/></svg>\n      <div style=\"font-size:12.5px;font-weight:600\">履歴書・データをドラッグ＆ドロップ</div>\n      <div style=\"font-size:11px;color:var(--soft);margin-top:2px\">PDF・CSV・Excel・テキストから自動入力（クリックでも選択可）</div>\n    </div>\n    <div class=\"modal-grid\">\n      ${projSel}\n      ${agSel}\n      <div class=\"field full\"><label>氏名 *</label><input id=\"mName\" placeholder=\"山田 太郎\"></div>\n      <div class=\"field\"><label>フリガナ</label><input id=\"mKana\" placeholder=\"ヤマダ タロウ\"></div>\n      <div class=\"field\"><label>希望エリア</label><input id=\"mArea\" placeholder=\"首都圏\"></div>\n      <div class=\"field\"><label>電話番号</label><input id=\"mPhone\" placeholder=\"090-0000-0000\"></div>\n      <div class=\"field\"><label>メール</label><input id=\"mEmail\" placeholder=\"you@example.com\"></div>\n      <div class=\"field full\"><label>住所</label><input id=\"mAddress\" placeholder=\"東京都〇〇区...\"></div>\n      <div class=\"field full\"><label>集客元<span style=\"font-weight:400;color:var(--muted);font-size:11px\">（任意・空欄でOK）</span></label><input id=\"mSrc\" placeholder=\"例：自社サイト / ◯◯エージェント / 紹介 など\"></div>\n    </div>\n    <div class=\"modal-actions\">\n      <button class=\"btn btn-ghost\" data-act=\"closemodal\">キャンセル</button>\n      <button class=\"btn btn-primary\" data-act=\"save-referral\" data-id=\"${pjId}\">送客を登録</button>\n    </div>`);\n  setTimeout(()=>{\n    const dz=document.getElementById('singleDrop'), fi=document.getElementById('singleDropInput');\n    if(!dz||!fi) return;\n    dz.addEventListener('click', ()=>fi.click());\n    fi.addEventListener('change', e=>{ if(e.target.files[0]) autofillFromDoc(e.target.files[0]); });\n    dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.style.borderColor='var(--accent)'; dz.style.background='var(--accent-soft)'; });\n    dz.addEventListener('dragleave', ()=>{ dz.style.borderColor='var(--line)'; dz.style.background='var(--gray-bg)'; });\n    dz.addEventListener('drop', e=>{ e.preventDefault(); dz.style.borderColor='var(--line)'; dz.style.background='var(--gray-bg)'; if(e.dataTransfer.files[0]) autofillFromDoc(e.dataTransfer.files[0]); });\n  }, 30);\n}\nlet agMethod='invite';\nfunction genPw(){ const a='abcdefghijkmnpqrstuvwxyz23456789'; let s=''; for(let i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)]; return 'relay-'+s; }\nlet _revealPw=new Set(); let _acctTab='accounts';\nfunction modalAccounts(){\n  _acctTab='accounts'; _revealPw.clear();\n  showModal(`\n    <div class=\"modal-title\">ログイン管理</div>\n    <div class=\"modal-sub\">各パートナーのログインID・パスワードの発行/管理とログイン履歴（${DB.agencies.filter(a=>a.status!=='pending').length}社）</div>\n    <div class=\"seg\" id=\"acctSeg\">\n      <button class=\"seg-btn on\" data-act=\"acct-tab\" data-t=\"accounts\">アカウント</button>\n      <button class=\"seg-btn\" data-act=\"acct-tab\" data-t=\"logs\">ログイン履歴</button>\n    </div>\n    <div id=\"acctBody\">${acctTable()}</div>\n    <div class=\"modal-actions\"><button class=\"btn btn-primary\" data-act=\"closemodal\">閉じる</button></div>`);\n}\nfunction acctTable(){\n  const ags=DB.agencies.filter(a=>a.status!=='pending');\n  return `<div class=\"acct-scroll\"><table class=\"tbl\"><thead><tr><th>会社</th><th>ログインID（メール）</th><th>パスワード</th><th>最終ログイン</th><th></th></tr></thead><tbody>\n  ${ags.map(a=>{ const last=lastLogin(a.id); const rev=_revealPw.has(a.id); const hasPw=a.pw && a.pw!=='demo';\n    return `<tr>\n      <td class=\"cell-strong\">${esc(a.name)}<div class=\"cell-sub\">${a.id}${a.status==='suspended'?' · 停止中':''}</div></td>\n      <td><span class=\"mono\" style=\"font-size:12px\">${esc(a.email||'—')}</span> ${a.email?`<button class=\"copy-btn\" data-act=\"copy\" data-v=\"${esc(a.email)}\">コピー</button>`:''}<button class=\"copy-btn\" data-act=\"acct-editid\" data-id=\"${a.id}\">変更</button></td>\n      <td>${hasPw?`<span class=\"mono\" style=\"font-size:12px\">${rev?esc(a.pw):'••••••••'}</span> <button class=\"copy-btn\" data-act=\"acct-reveal\" data-id=\"${a.id}\">${rev?'隠す':'表示'}</button> <button class=\"copy-btn\" data-act=\"copy\" data-v=\"${esc(a.pw)}\">コピー</button>`:'<span class=\"cell-sub\">未発行</span>'}</td>\n      <td class=\"mono cell-sub\" style=\"font-size:11.5px\">${last?esc(last.at):'—'}</td>\n      <td style=\"white-space:nowrap\"><button class=\"copy-btn\" data-act=\"acct-reissue\" data-id=\"${a.id}\">${hasPw?'PW再発行':'発行'}</button></td>\n    </tr>`; }).join('')}\n  </tbody></table></div>\n  <div class=\"cell-sub\" style=\"margin-top:10px;font-size:11px\">本番では各社のパスワードは暗号化保存し、KANOA管理のみ復号・表示できます（Edge Function認証）。詳細は IMPLEMENTATION.md。</div>`;\n}\nfunction loginLogTable(){\n  const logs=(DB.logins||[]).slice().sort((a,b)=>a.at<b.at?1:-1).slice(0,200);\n  return `<div class=\"acct-scroll\"><table class=\"tbl\"><thead><tr><th>日時</th><th>会社</th><th>結果</th><th>方法</th></tr></thead><tbody>\n   ${logs.length?logs.map(l=>{ const a=agency(l.ag); return `<tr><td class=\"mono cell-sub\" style=\"font-size:11.5px\">${esc(l.at)}</td><td>${esc(a?a.name:l.ag)}</td><td>${l.ok?'<span class=\"tag\" style=\"background:var(--g-bg);color:var(--g);font-size:10.5px\">成功</span>':'<span class=\"tag\" style=\"background:var(--r-bg);color:var(--r);font-size:10.5px\">失敗</span>'}</td><td class=\"cell-sub\">${esc(l.via||'パスワード')}</td></tr>`; }).join(''):'<tr><td colspan=\"4\"><div class=\"cell-sub\" style=\"padding:12px\">まだログイン履歴がありません</div></td></tr>'}\n  </tbody></table></div>`;\n}\nfunction modalNewAgency(){\n  showModal(`\n    <div class=\"modal-title\">パートナーを招待</div>\n    <div class=\"modal-sub\">会社情報を入力して「招待リンクを発行」。リンクを相手に送るだけで、相手がパスワードを設定してログインできます。</div>\n    <div class=\"modal-grid\">\n      <div class=\"field full\"><label>会社名 / 屋号 *</label><input id=\"agName\" placeholder=\"株式会社〇〇\"></div>\n      <div class=\"field full\"><label>メールアドレス（ログインID）*</label><input id=\"agEmail\" type=\"email\" placeholder=\"partner@example.com\"></div>\n      <div class=\"field full\"><label>担当者名</label><input id=\"agContact\" placeholder=\"山田 太郎\"></div>\n      <div class=\"field full\"><label>ライセンス</label>\n        <select id=\"agLicense\"><option value=\"\">なし（入金の2ヶ月後に支払）</option><option value=\"1\">あり（入金の1ヶ月後に支払）</option></select></div>\n      <div class=\"field full\"><label>振込先口座（任意）</label><input id=\"agBank\" placeholder=\"例：〇〇銀行 △△支店 普通 1234567\"></div>\n      <div class=\"field full\"><label>支払ルート</label>\n        <select id=\"agPayRoute\"><option value=\"A\">ルートA：RECOREから直接支払う</option><option value=\"B\">ルートB：RECORE→KANOA→このパートナー</option></select></div>\n      <div class=\"field full\"><label>特別枠</label>\n        <select id=\"agSpecial\"><option value=\"\">通常パートナー</option><option value=\"recore\">RECORE（全社の金額を閲覧可能）</option></select></div>\n    </div>\n    <div class=\"panel\" style=\"padding:11px 13px;margin-top:12px;background:var(--gray-bg)\">\n      <div style=\"font-size:12px;color:var(--soft);line-height:1.6\">\n        <strong style=\"font-weight:600\">安全性について：</strong>リンクは7日で自動失効し、1回使うと無効になります。KANOA側はパスワードを一切保持しません（相手が自分で設定）。\n      </div>\n    </div>\n    <div class=\"modal-actions\"><button class=\"btn btn-ghost\" data-act=\"closemodal\">キャンセル</button>\n      <button class=\"btn btn-primary\" data-act=\"issue-and-show\">招待リンクを発行</button></div>`);\n}\n\n/* 発行と同時に会社を作り、リンク表示モーダルへ */\n/* 招待情報をSupabaseへ即時保存し、読み返して確認（本番のみ） */\nasync function persistInvite(a){\n  if(DEMO_MODE) return {ok:true};\n  try{\n    const sb=await SUPA.ensureClient();\n    const up=await sb.from('agencies').upsert({ id:a.id, name:a.name, contact:a.contact||null, email:a.email||null, status:a.status, source:a.source||null, joined:a.joined||null, code:a.code||null, pw_hash:a.pwHash||null, invite_token:a.inviteToken, invite_issued_at:a.inviteIssuedAt, invite_used_at:a.inviteUsedAt });\n    if(up && up.error) return {ok:false, reason:(up.error.message||'DBエラー')};\n    const chk=await sb.from('agencies').select('invite_token').eq('id',a.id).maybeSingle();\n    if(!chk || !chk.data || chk.data.invite_token!==a.inviteToken) return {ok:false, reason:'invite_token が保存されていません（招待用SQLが未実行の可能性）'};\n    return {ok:true};\n  }catch(e){ return {ok:false, reason:String((e&&e.message)||e)}; }\n}\nfunction showInviteIssueError(reason){\n  showModal(`\n    <div class=\"modal-title\">招待リンクを発行できませんでした</div>\n    <div class=\"modal-sub\">リンクは相手に送らないでください（開いても無効になります）。</div>\n    <div class=\"panel\" style=\"padding:12px 14px;margin:12px 0;background:var(--r-bg,#FDEEF1)\">\n      <div style=\"font-size:12.5px;color:var(--r);line-height:1.7\">原因: ${esc(reason)}</div>\n    </div>\n    <div style=\"font-size:12.5px;color:var(--soft);line-height:1.8\">対処: Supabaseで <strong style=\"font-family:var(--mono)\">add_all_new_columns.sql</strong> の agencies 招待カラム（invite_token など）を実行してから、再度発行してください。</div>\n    <div class=\"modal-actions\"><button class=\"btn btn-primary\" data-act=\"closemodal\">閉じる</button></div>`);\n}\nasync function issueAndShowInvite(){\n  const name=val('agName'), email=val('agEmail');\n  if(!name){ toast('会社名を入力してください'); return; }\n  if(!email||!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(email)){ toast('有効なメールアドレスを入力してください'); return; }\n  const dup=DB.agencies.find(a=>(a.email||'').toLowerCase()===email.toLowerCase());\n  if(dup){\n    if(confirm(`${dup.name}（${email}）は既に登録されています。\\nこのパートナー宛の招待リンクを再発行しますか？`)){\n      const url2=issueInviteLink(dup.id);\n      const r2=await persistInvite(dup);\n      if(!r2.ok){ showInviteIssueError(r2.reason); return; }\n      showInviteResult(dup, url2);\n      if(S.view==='agencies') viewAgencies();\n    }\n    return;\n  }\n  const a={id:uid('AG'),name,contact:val('agContact'),email,status:'pending',source:'invited',joined:todayISO()};\n  DB.agencies.push(a);\n  const url=issueInviteLink(a.id);\n  const res=await persistInvite(a);\n  if(!res.ok){ showInviteIssueError(res.reason); return; }\n  DB.activity.unshift({ts:nowTS(),actor:'KANOA',action:'パートナー招待',detail:`${name}（${email}）に招待リンクを発行`});\n  save(); updateNavCounts();\n  showInviteResult(a, url);\n  if(S.view==='agencies') viewAgencies();\n}\n/* 再発行（詳細画面から）も同じ検証つきで */\nasync function reissueInvite(agId){\n  const url=issueInviteLink(agId);\n  if(!url){ toast('発行できませんでした'); return; }\n  const a=agency(agId);\n  const res=await persistInvite(a);\n  if(!res.ok){ showInviteIssueError(res.reason); return; }\n  toast('招待リンクを発行しました');\n  if(S._agDrawer) openAgencyDrawer(S._agDrawer);\n  if(S.view==='agencies') viewAgencies();\n}\n/* 招待システムの接続診断（Supabase接続・招待カラム・書き込みを実地テスト） */\nasync function diagnoseInviteSystem(){\n  if(DEMO_MODE){\n    showModal(`<div class=\"modal-title\">接続診断</div>\n      <div class=\"modal-sub\">デモモードで動作中です。データはこの端末内（localStorage）に保存され、招待リンクもこの端末で完結します。本番の診断は本番URLで実行してください。</div>\n      <div class=\"modal-actions\"><button class=\"btn btn-primary\" data-act=\"closemodal\">閉じる</button></div>`);\n    return;\n  }\n  showModal(`<div class=\"modal-title\">接続診断</div><div class=\"modal-sub\">確認しています…しばらくお待ちください。</div>`);\n  const lines=[];\n  const add=(ok,label,hint)=>lines.push(`<div class=\"info-row\"><span style=\"width:22px;flex:none\">${ok?'✅':'❌'}</span><div style=\"flex:1\"><div class=\"cell-strong\">${label}</div>${hint?`<div class=\"cell-sub\">${hint}</div>`:''}</div></div>`);\n  try{\n    const sb=await SUPA.ensureClient();\n    add(true,'Supabase接続','');\n    try{ const r=await sb.from('agencies').select('id').limit(1); add(!r.error,'agencies 読み取り', r.error?String(r.error.message||''):''); }catch(e){ add(false,'agencies 読み取り',String((e&&e.message)||e)); }\n    try{ const r=await sb.from('agencies').select('invite_token').limit(1); add(!r.error,'招待カラム（invite_token）', r.error?'add_all_new_columns.sql の agencies 部分が未実行です':''); }catch(e){ add(false,'招待カラム（invite_token）','add_all_new_columns.sql の agencies 部分が未実行です'); }\n    try{\n      const t='diag_'+Date.now();\n      const up=await sb.from('agencies').upsert({id:'AG-DIAG-TEST',name:'診断用（自動削除）',status:'pending',invite_token:t});\n      if(up && up.error){ add(false,'書き込みテスト',String(up.error.message||'')); }\n      else{\n        const chk=await sb.from('agencies').select('invite_token').eq('id','AG-DIAG-TEST').maybeSingle();\n        const okw=!!(chk && chk.data && chk.data.invite_token===t);\n        add(okw,'書き込み＋読み返し', okw?'':'invite_token が保存できていません（SQL未実行の可能性）');\n      }\n      try{ await sb.from('agencies').delete().eq('id','AG-DIAG-TEST'); }catch(e){}\n    }catch(e){ add(false,'書き込みテスト',String((e&&e.message)||e)); }\n  }catch(e){ add(false,'Supabase接続',String((e&&e.message)||e)); }\n  showModal(`<div class=\"modal-title\">接続診断の結果</div>\n    <div class=\"info-card\" style=\"margin:12px 0\">${lines.join('')}</div>\n    <div style=\"font-size:12px;color:var(--soft);line-height:1.7\">❌がある場合は、その項目のヒントに従って対処してください。すべて✅なら、発行→リンク→パスワード設定まで問題なく動きます。</div>\n    <div class=\"modal-actions\"><button class=\"btn btn-primary\" data-act=\"closemodal\">閉じる</button></div>`);\n}\n\n/* 発行済みリンクを表示（コピー用） */\nfunction showInviteResult(a, url){\n  showModal(`\n    <div class=\"modal-title\">招待リンクを発行しました</div>\n    <div class=\"modal-sub\">${esc(a.name)} 宛のリンクです。メールやチャットで送ってください。</div>\n    <div class=\"field full\" style=\"margin:14px 0\">\n      <label>招待リンク（7日間有効・1回限り）</label>\n      <div style=\"display:flex;gap:8px;margin-top:6px\">\n        <input readonly value=\"${esc(url)}\" onclick=\"this.select()\" style=\"flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:12px;font-family:var(--mono);color:var(--soft)\">\n        <button class=\"btn btn-primary btn-sm\" data-act=\"copy-invite\" data-ag=\"${a.id}\" style=\"flex-shrink:0\">コピー</button>\n      </div>\n    </div>\n    <div class=\"panel\" style=\"padding:11px 13px;background:var(--gray-bg);margin-bottom:8px\">\n      <div style=\"font-size:12px;color:var(--soft);line-height:1.7\">\n        <strong style=\"font-weight:600\">送信メッセージ例：</strong><br>\n        「KANOAパートナーポータルへのご招待です。下記リンクからパスワードを設定してご利用ください（7日以内）。」\n      </div>\n    </div>\n    <div class=\"modal-actions\"><button class=\"btn btn-primary\" data-act=\"closemodal\">完了</button></div>`);\n}\nfunction modalAgencyCreated(a){\n  showModal(`\n    <div class=\"modal-title\">アカウントを発行しました</div>\n    <div class=\"modal-sub\">${esc(a.name)} に以下を共有してください。すぐにログインできます。</div>\n    <div class=\"info-card\" style=\"margin-bottom:14px\">\n      <div class=\"info-row\"><span class=\"info-label\">ログインURL</span><span class=\"info-val mono\" style=\"font-size:11.5px\">${esc(location.href.split('#')[0])}</span><button class=\"copy-btn\" data-act=\"copy\" data-v=\"${esc(location.href.split('#')[0])}\">コピー</button></div>\n      <div class=\"info-row\"><span class=\"info-label\">メール(ID)</span><span class=\"info-val\">${esc(a.email)}</span><button class=\"copy-btn\" data-act=\"copy\" data-v=\"${esc(a.email)}\">コピー</button></div>\n      <div class=\"info-row\"><span class=\"info-label\">パスワード</span><span class=\"info-val mono\">${esc(a.pw)}</span><button class=\"copy-btn\" data-act=\"copy\" data-v=\"${esc(a.pw)}\">コピー</button></div>\n    </div>\n    <button class=\"btn btn-ghost btn-block btn-sm\" data-act=\"copy\" data-v=\"【KANOA パートナーポータル ログイン情報】\\nURL: ${esc(location.href.split('#')[0])}\\nID(メール): ${esc(a.email)}\\nパスワード: ${esc(a.pw)}\">まとめてコピー</button>\n    <div class=\"modal-actions\"><button class=\"btn btn-primary\" data-act=\"closemodal\">完了</button></div>`);\n}\nfunction modalEditProject(pjId){\n  const p = pjId?project(pjId):null;\n  const isNew=!p;\n  const v=p||{rewardType:'both',referralReward:30000,successReward:200000,status:'open',color:'#4f46e5'};\n  showModal(`\n    <div class=\"modal-title\">${isNew?'案件を追加':'案件を編集'}</div>\n    <div class=\"modal-sub\">パートナーに公開する案件票</div>\n    <div class=\"modal-grid\">\n      <div class=\"field full\"><label>案件名 *</label><input id=\"epName\" value=\"${esc(v.name||'')}\" placeholder=\"〇〇 パートナー送客\"></div>\n      <div class=\"field full\"><label>クライアント</label><input id=\"epClient\" value=\"${esc(v.client||'')}\"></div>\n      <div class=\"field\"><label>ポジション</label><input id=\"epPos\" value=\"${esc(v.position||'')}\"></div>\n      <div class=\"field\"><label>勤務地</label><input id=\"epLoc\" value=\"${esc(v.location||'')}\"></div>\n      <div class=\"field\"><label>雇用形態</label><input id=\"epEmp\" value=\"${esc(v.employment||'')}\"></div>\n      <div class=\"field\"><label>給与</label><input id=\"epSal\" value=\"${esc(v.salary||'')}\"></div>\n      <div class=\"field full\"><label>概要</label><textarea id=\"epSum\" rows=\"3\">${esc(v.summary||'')}</textarea></div>\n      <div class=\"field full\"><label>送客条件（パートナー向け・任意）</label><textarea id=\"epCond\" rows=\"2\" placeholder=\"例：18〜39歳 / 接客経験歓迎 / 顔写真付き履歴書必須 / 重複送客NG\">${esc(v.conditions||'')}</textarea></div>\n      <div class=\"field full\"><label>求める人物像（1行に1つ）</label><textarea id=\"epReq\" rows=\"3\" placeholder=\"未経験歓迎&#10;要普免（AT可）\">${esc((v.requirements||[]).join('\\n'))}</textarea></div>\n      <div class=\"field full\"><label>選考フロー（「ステップ ｜ 説明」で1行に1つ）</label><textarea id=\"epFlow\" rows=\"3\" placeholder=\"書類選考 ｜ 2〜3営業日&#10;選考会 ｜ 適性検査＋面接\">${esc((v.flow||[]).map(f=>f.t+' ｜ '+f.s).join('\\n'))}</textarea></div>\n      <div class=\"field\"><label>募集人数</label><input id=\"epHead\" value=\"${esc(v.headcount||'')}\" placeholder=\"30名（全国）\"></div>\n      <div class=\"field\"><label>説明会</label><input id=\"epSem\" value=\"${esc(v.seminar||'')}\" placeholder=\"日時・形式\"></div>\n      <div class=\"field full\"><label>書類通過の傾向（エージェント限定）</label><textarea id=\"epPass\" rows=\"2\" placeholder=\"通過しやすい候補者の特徴\">${esc(v.passNote||'')}</textarea></div>\n      <div class=\"field full\"><label>内定者事例（エージェント限定）</label><textarea id=\"epCase\" rows=\"2\" placeholder=\"決定事例\">${esc(v.caseStudy||'')}</textarea></div>\n      <div class=\"field\"><label>報酬タイプ</label><select id=\"epRType\">\n        <option value=\"both\" ${v.rewardType==='both'?'selected':''}>送客＋成功報酬</option>\n        <option value=\"referral\" ${v.rewardType==='referral'?'selected':''}>送客単価のみ</option>\n        <option value=\"success\" ${v.rewardType==='success'?'selected':''}>成功報酬のみ</option></select></div>\n      <div class=\"field\"><label>状態</label><select id=\"epStatus\">\n        <option value=\"open\" ${v.status==='open'?'selected':''}>公開中</option>\n        <option value=\"draft\" ${v.status==='draft'?'selected':''}>下書き</option>\n        <option value=\"closed\" ${v.status==='closed'?'selected':''}>終了</option></select></div>\n      <div class=\"field\"><label>送客単価 ¥</label><input id=\"epRef\" type=\"number\" value=\"${v.referralReward||0}\"></div>\n      <div class=\"field\"><label>成功報酬 ¥</label><input id=\"epSuc\" type=\"number\" value=\"${v.successReward||0}\"></div>\n      <div class=\"field\"><label>受領単価（客先→KANOA） ¥</label><input id=\"epFee\" type=\"number\" value=\"${v.clientFee||0}\" placeholder=\"自社取り分の計算に使用\"></div>\n    </div>\n    <div class=\"modal-actions\"><button class=\"btn btn-ghost\" data-act=\"closemodal\">キャンセル</button>\n      <button class=\"btn btn-primary\" data-act=\"save-project\" data-id=\"${pjId||''}\">${isNew?'追加する':'保存する'}</button></div>`);\n}\n\n/* ════════════════════ OVERLAY / MODAL / TOAST ════════════════════ */\nfunction openOverlay(){ document.getElementById('overlay').classList.add('on'); document.getElementById('drawer').classList.add('on'); }\nfunction closeOverlay(){ S._agDrawer=null; document.getElementById('overlay').classList.remove('on'); document.getElementById('drawer').classList.remove('on'); }\nfunction showModal(html){ document.getElementById('modalCard').innerHTML=html; document.getElementById('modal').classList.add('on'); }\nfunction closeModal(){ document.getElementById('modal').classList.remove('on'); }\nlet toastT;\nfunction toast(msg){ const t=document.getElementById('toast'); t.innerHTML=`<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"/></svg>${esc(msg)}`; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }\nfunction openSide(){ document.getElementById('side').classList.add('open'); document.getElementById('scrim').classList.add('on'); }\nfunction closeSide(){ document.getElementById('side').classList.remove('open'); document.getElementById('scrim').classList.remove('on'); }\n\n/* ════════════════════ CSV ════════════════════ */\nfunction downloadCSV(filename, header, rows){\n  const q=v=>`\"${String(v==null?'':v).replace(/\"/g,'\"\"')}\"`;\n  const csv='\\uFEFF'+[header.map(q).join(','), ...rows.map(r=>r.map(q).join(','))].join('\\r\\n');\n  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));\n  a.download=filename; document.body.appendChild(a); a.click(); a.remove();\n  toast('CSVを書き出しました（Googleスプレッドシートで開けます）');\n}\nfunction exportRefsRows(list){\n  const rows=list.map(r=>{ const p=project(r.pj),a=agency(r.ag); const s=docStat(r);\n    return [a?a.name:r.ag, p?p.name:r.pj, r.name, r.kana, STATUS[r.status].label, r.area, r.session==='—'?'':r.session, r.created, joinedYM(r), r.joined, s.rireki?'有':'無', s.shoku?'有':'無', s.n, r.phone, r.email, r.address, refEarning(r)]; });\n  downloadCSV(`送客一覧_${todayISO()}.csv`, ['パートナー','案件','氏名','フリガナ','ステータス','希望エリア','選考会日','送客日','入社月','入社日','履歴書','職務経歴書','資料数','電話','メール','住所','成果報酬'], rows);\n}\nfunction exportRefs(){ exportRefsRows(refFiltered()); }\nfunction exportEarn(){\n  const rows=[];\n  DB.agencies.filter(a=>a.status==='active').forEach(a=>DB.projects.forEach(p=>{\n    const rs=DB.referrals.filter(r=>r.ag===a.id&&r.pj===p.id); if(!rs.length) return;\n    const sent=rs.filter(r=>r.status!=='rejected').length, joined=rs.filter(r=>r.status==='joined').length;\n    const e=effReward(p.id,a.id);\n    const refRew=(p.rewardType!=='success')?sent*e.ref:0, sucRew=(p.rewardType!=='referral')?joined*e.suc:0;\n    rows.push([a.name,p.name,sent,joined,refRew,sucRew,refRew+sucRew]);\n  }));\n  downloadCSV(`成果報酬_${todayISO()}.csv`, ['パートナー','案件','送客','入社','送客報酬','成功報酬','合計'], rows);\n}\nfunction exportAgencies(){\n  const rows=DB.agencies.map(a=>{ const rs=agencyReferrals(a.id); const sent=rs.filter(r=>r.status!=='rejected').length; const joined=rs.filter(r=>r.status==='joined').length; const earn=rs.reduce((s,r)=>s+refEarning(r),0);\n    return [a.id,a.name,a.contact,a.email,a.status==='active'?'提携中':a.status==='pending'?'承認待ち':'停止中',a.source==='invited'?'招待発行':'申請承認',a.joined,sent,joined,earn]; });\n  downloadCSV(`パートナー一覧_${todayISO()}.csv`, ['ID','パートナー名','担当','メール','状態','経路','登録日','送客','入社','成果報酬'], rows);\n}\n\n/* ════════════════════ EVENT DELEGATION ════════════════════ */\ndocument.addEventListener('click', e=>{\n  const t=e.target.closest('[data-act]'); if(!t) return;\n  const act=t.dataset.act;\n  switch(act){\n    case 'inv-create-one': { const inv=createInvoice(S.agencyId,[t.dataset.ref]); if(inv){ invSel.delete(t.dataset.ref); render(); openInvoiceDetail(inv.id); } break; }\n    case 'inv-create-selected': { const ids=[...invSel]; if(!ids.length){ toast('発行する入社者を選択してください'); break; } const inv=createInvoice(S.agencyId,ids); if(inv){ invSel.clear(); render(); openInvoiceDetail(inv.id); } break; }\n    case 'inv-sel': { const rid=t.dataset.ref; if(t.checked) invSel.add(rid); else invSel.delete(rid); const btn=document.querySelector('[data-act=\"inv-create-selected\"]'); if(btn) btn.textContent='選択した'+invSel.size+'名で発行'; break; }\n    case 'inv-sel-all': { const cbs=document.querySelectorAll('.inv-cb'); cbs.forEach(cb=>{ cb.checked=t.checked; const rid=cb.dataset.ref; if(t.checked) invSel.add(rid); else invSel.delete(rid); }); render(); break; }\n    case 'inv-filter': { invFilter.status=t.dataset.st; render(); break; }\n    case 'inv-open': openInvoiceDetail(t.dataset.id); break;\n    case 'inv-act': invoiceAction(t.dataset.id, t.dataset.do); break;\n    case 'inv-reject-prompt': promptReject(t.dataset.id); break;\n    case 'inv-pdf': invoicePDF(t.dataset.id); break;\n    case 'ref-resign-prompt': openResignForm(t.dataset.ref); break;\n    case 'resign-confirm': confirmResign(t.dataset.ref); break;\n    case 'ref-unresign': unmarkResigned(t.dataset.ref); break;\n    case 'resign-confirm-status': confirmResignation(t.dataset.ref); break;\n    case 'ref-create-one': { const inv=createRefundInvoice(S.agencyId,[t.dataset.ref]); if(inv){ render(); openInvoiceDetail(inv.id); } break; }\n    case 'ref-create-all': { const ids=refundableRefs(S.agencyId).map(r=>r.id); const inv=createRefundInvoice(S.agencyId,ids); if(inv){ render(); openInvoiceDetail(inv.id); } break; }\n    case 'ltab': loginTab=t.dataset.tab; renderLogin(); break;\n    case 'pw-eye':{ const wrap=t.closest('.ix'); const inp=wrap&&wrap.querySelector('input'); if(inp) inp.type = inp.type==='password'?'text':'password'; break; }\n    case 'forgot-pw': {\n      if(DEMO_MODE){ toast('パスワード再設定のご案内をメールでお送りします =document.getElementById('liPw').value;\n        if(!email||!pw){ err('メールアドレスとパスワードを入力してください'); break; }\n        SUPA.signInPassword(email,pw).then(async e=>{ if(e){ err('メールまたはパスワードが違います'); return; } const ok=await SUPA.loginThen('agency'); if(!ok){ err('このアカウントはパートナーとして登録されていません'); return; } try{ SUPA.insertLoginLog(S.agencyId, true, 'パスワード'); }catch(e){} }).catch(()=>err('ログインに失敗しました')); }\n      break;\n    case 'magic-link': {\n      if(!DEMO_MODE){ const err=m=>{const e=document.getElementById('liErr');if(e)e.textContent=m;}; const email=(document.getElementById('liId').value||'').trim(); if(!email){ err('メールアドレスを入力してください'); break; } SUPA.signInOtp(email).then(e=>{ if(e) err('送信に失敗しました'); else toast('ログインリンクをメールで送信しました'); }); break; }\n      const a=resolveAgency((document.getElementById('liId').value||'').trim());\n      const err=m=>{document.getElementById('liErr').textContent=m;};\n      if(!a){ err('このメールのパートナーが見つかりません'); break; }\n      if(a.status==='pending'){ err('この申請はまだ承認待ちです'); break; }\n      if(a.status==='suspended'){ err('このアカウントは停止されています'); break; }\n      toast('ログインリンクを送信しました（デモではそのまま入ります）');\n      setTimeout(()=>doLoginAgency(a,{via:'マジックリンク'}),700); break;\n    }\n    case 'quick-agency': doLoginAgency(t.dataset.id,{via:'クイック'}); break;\n    case 'login-kanoa': {\n      if(!DEMO_MODE){ const err=m=>{const e=document.getElementById('liErr');if(e)e.textContent=m;}; const email=(document.getElementById('liId').value||'').trim(), pw=document.getElementById('liPw').value;\n        SUPA.signInPassword(email,pw).then(async e=>{ if(e){ err('メールまたはパスワードが違います'); return; } const okk=await SUPA.loginThen('kanoa'); if(!okk) err('KANOA管理者として登録されていません'); }); break; }\n      const id=(document.getElementById('liId').value||'').trim().toUpperCase(), pw=document.getElementById('liPw').value;\n      if(id==='KANOA-ADMIN'&&pw==='kanoa2026'){ S={role:'kanoa',agencyId:null,view:'overview'}; enterApp(); }\n      else document.getElementById('liErr').textContent='IDまたはパスワードが違います'; break;\n    }\n    case 'apply-submit': {\n      const name=val('apName'),contact=val('apContact'),email=val('apEmail');\n      if(!name){ document.getElementById('liErr').textContent='会社名を入力してください'; break; }\n      DB.agencies.push({id:uid('AG'),name,contact,email,status:'pending',source:'applied',joined:todayISO()});\n      DB.activity.unshift({ts:new Date().toISOString().slice(0,16).replace('T',' '),actor:contact||name,action:'掲載申請',detail:`${name} が掲載申請`});\n      save(); loginTab='agency'; renderLogin();\n      toast('申請を送信しました。承認をお待ちください'); break;\n    }\n    case 'logout': stopAutoRefresh(); try{ localStorage.removeItem('kanoa_partner_session'); }catch(e){} if(!DEMO_MODE) SUPA.signOut(); S={role:null,agencyId:null,view:null}; document.getElementById('app').classList.remove('on'); document.getElementById('loginWrap').style.display='flex'; loginTab='agency'; renderLogin(); if(window._loginAnim) window._loginAnim.start(); break;\n    case 'switch-account': stopAutoRefresh(); if(!DEMO_MODE) SUPA.signOut(); S={role:null,agencyId:null,view:null}; document.getElementById('app').classList.remove('on'); document.getElementById('loginWrap').style.display='flex'; loginTab='agency'; renderLogin(); if(window._loginAnim) window._loginAnim.start(); toast('ログアウトしました。別のアカウントでログインできます'); break;\n    case 'reset-demo': if(confirm('デモデータを初期状態に戻しますか？（追加した案件・送客・パートナーは消えます）')){ try{localStorage.removeItem(LS_KEY);}catch(e){} location.reload(); } break;\n    case 'impl-guide': modalImplGuide(); break;\n    case 'nav': if(t.dataset.view==='messages'){ S.threadAg=null; S.threadRef=null; S.threadPrefill=null; msgFilter.q=''; } go(t.dataset.view); break;\n    case 'openside': openSide(); break;\n    case 'closeside': closeSide(); break;\n\n    /* projects */\n    case 'open-project': S.detailId=t.dataset.id; go('projectDetail'); break;\n    case 'open-project-agency': S.detailId=t.dataset.id; S.view='pjDetailAgency'; closeSide(); document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('on',n.dataset.view==='pjlist')); viewAgencyProjectDetail(); break;\n    case 'new-project': modalEditProject(null); break;\n    case 'edit-project': modalEditProject(t.dataset.id); break;\n    case 'save-project': saveProject(t.dataset.id||null); break;\n\n    /* 連絡：候補者ステータスをチャットから直接変更 */\n    case 'set-ref-status': {\n      const r=DB.referrals.find(x=>x.id===t.dataset.ref); const st=t.dataset.s;\n      if(r && st && r.status!==st){\n        const block=advanceGuard(r, st);\n        if(block){ toast(block); break; }\n        r.status=st;\n        if(st==='joined' && !r.joined) r.joined=todayISO();\n        DB.activity.unshift({ts:nowTS(),actor:'KANOA',action:'ステータス変更',detail:`${r.name} を「${STATUS[st].label}」に`});\n        // 内定に進んだら、内定後の必要書類をKANOAから自動でリマインド\n        if(st==='offer'){ const need=missingDocsForStage(r,'offer'); const opt=missingOptionalForStage(r,'offer');\n          if(need.length){ const txt=`【内定おめでとうございます】オファー提示のため、至急 ${need.join('・')} のご提出をお願いします。${opt.length?`（賞与の支払いがある場合は ${opt.join('・')} も）`:''}`;\n            DB.messages.push({id:uid('M'),ag:r.ag,from:'kanoa',text:txt,ts:nowTS(),read:false,refId:r.id}); }\n        }\n        save(); updateNavCounts();\n        toast(`${r.name} を「${STATUS[st].label}」に変更しました`);\n        renderConversation(curThreadAg(), meRole());\n      }\n      break;\n    }\n    /* 連絡：日程調整メッセージを下書き */\n    case 'schedule-msg': {\n      const r=DB.referrals.find(x=>x.id===t.dataset.ref);\n      S.threadAg=t.dataset.ag||curThreadAg(); S.threadRef=t.dataset.ref;\n      S.threadPrefill=`${r?r.name+'さん':''}の選考会の日程調整のご連絡です。下記より候補日をいくつかご提示ください。\\n・第1希望：\\n・第2希望：\\n・第3希望：`;\n      renderConversation(curThreadAg(), meRole());\n      break;\n    }\n    /* 連絡：選考会リマインドを下書き */\n    case 'remind-msg': {\n      const r=DB.referrals.find(x=>x.id===t.dataset.ref);\n      S.threadAg=t.dataset.ag||curThreadAg(); S.threadRef=t.dataset.ref;\n      S.threadPrefill=`${r?r.name+'さん':''}の選考会（${r&&r.session&&r.sessi S.threadRef||null, replyTo:S.replyTo||null}); S.picker=false; S.replyTo=null; renderConversation(curThreadAg(),meRole()); break;\n    case 'emoji-send': pushMsg(curThreadAg(), meRole(), t.dataset.e, {stamp:'emoji', refId:S.threadRef||null, replyTo:S.replyTo||null}); S.picker=false; S.replyTo=null; renderConversation(curThreadAg(),meRole()); break;\n    case 'scrollto': { closeMsgMenu(); const el=document.getElementById('mw-'+t.dataset.id); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.transition='background .3s'; el.style.borderRadius='10px'; el.style.background='var(--accent-soft)'; setTimeout(()=>el.style.background='',1000); } break; }\n\n    /* tasks */\n    case 'task-toggle': {\n      const tk=DB.tasks.find(x=>x.id===t.dataset.id);\n      if(tk){\n        const wasDone=tk.done; tk.done=!tk.done;\n        // 依頼されたタスク（from≠owner）を「完了」したら、依頼元へ連絡で通知\n        if(tk.done && !wasDone && tk.from && tk.from!==tk.owner){\n          const completer=tk.owner;                       // 完了したのは担当者\n          const fromRole = completer==='kanoa' ? 'kanoa' : 'agency';\n          const ag = tk.ag || (tk.owner!=='kanoa'?tk.owner:(tk.from!=='kanoa'?tk.from:null));\n          if(ag){\n            DB.messages.push({id:uid('M'), ag, from:fromRole, text:`【タスク完了】「${tk.text}」が完了しました。`, ts:nowTS(), read:false, refId:tk.refId||null});\n            DB.activity.unshift({ts:nowTS(), actor:(completer==='kanoa'?'KANOA':(agency(ag)?agency(ag).name:ag)), action:'タスク完了', detail:tk.text});\n            toast(`${partyLabel(tk.from)}に完了を通知しました`);\n          }\n        }\n        save(); updateNavCounts(); viewTasks();\n      }\n      break;\n    }\n    case 'task-del': { const did=t.dataset.id; DB.tasks=DB.tasks.filter(x=>x.id!==did); if(!DEMO_MODE) SUPA.delRow('tasks','id',did); save(); updateNavCounts(); viewTasks(); break; }\n    case 'task-add-prompt': { const txt=prompt('タスクの内容'); if(txt&&txt.trim()){ addTask(txt.trim(),null,null); updateNavCounts(); viewTasks(); } break; }\n    case 'task-assign-prompt': modalAssignTask(t.dataset.to||null, t.dataset.ref||null); break;\n    case 'task-assign-save': saveAssignTask(); break;\n    case 'task-req-from-msg': { const m=DB.messages.find(x=>x.id===t.dataset.id); if(m){ closeMsgMenu(); const isK=S.role==='kanoa'; modalAssignTask(isK?(S.threadAg||m.ag):null, m.refId||null); const ta=document.getElementById('atText'); if(ta) ta.value=m.text; } break; }\n    case 'pj-sort': pjSort=t.dataset.s; viewAgencyProjects(); break;\n    case 'member-add': modalAddMember(t.dataset.org); break;\n    case 'member-save': { const org=t.dataset.org; const name=val('mbName'); const em=val('mbEmail'); if(!name){ toast('氏名を入力してください'); break; } addMember(org, name, em, val('mbTitle')); closeModal(); toast(em?`招待メールを送信しました → ${em}`:'メンバーを追加しました'); if(S.view==='members') viewMembers(); if(S._agDrawer) openAgencyDrawer(S._agDrawer); break; }\n    case 'member-del': if(confirm('このメンバーを削除しますか？')){ const did=t.dataset.id; DB.members=DB.members.filter(m=>m.id!==did); if(!DEMO_MODE) SUPA.delRow('members','id',did); save(); if(S.view==='members') viewMembers(); if(S._agDrawer) openAgencyDrawer(S._agDrawer); } break;\n\n    /* misc */\n    case 'copy': navigator.clipboard.writeText(t.dataset.v).then(()=>{ const o=t.textContent; t.textContent='✓'; setTimeout(()=>t.textContent=o,1200); }); break;\n    case 'closeoverlay': closeOverlay(); setTimeout(flushPendingRerender,50); break;\n    case 'closemodal': S._newRefFromMsg=false; closeModal(); setTimeout(flushPendingRerender,50); break;\n  }\n});\n\n/* change (inline edits, toggles, overrides) */\ndocument.addEventListener('change', e=>{\n  const t=e.target.closest('[data-act]'); if(!t) return;\n  const act=t.dataset.act;\n  if(act==='edit-ref'){\n    const r=DB.referrals.find(x=>x.id===t.dataset.id); if(!r) return;\n    const f=t.dataset.f; let v=t.value; if(f==='session'&&!v)v='—';\n    if(f==='status'){\n      const block=advanceGuard(r, v);\n      if(block){ toast(block); renderRefTable(); return; }\n    }\n    const _prev = f==='status' ? r.status : null;\n    if(f==='joinedMonth'){ r.joined = v?`${v}-01`:''; }\n    else { r[f]=v; }\n    if(f==='status' && _prev!==v && typeof logRef==='function'){\n      const back = STATUS_ORDER.indexOf(v) < STATUS_ORDER.indexOf(_prev);\n      logRef(r.id, `ステータス変更：${STATUS[_prev]?STATUS[_prev].label:_prev} → ${STATUS[v].label}${back?'（差し戻し）':''}`, '');\n    }\n    if(f==='status'){ t.className='icell stsel st-'+STATUS[v].cls;\n      if(v==='joined'&&!r.joined) r.joined=todayISO();\n      renderRefChips(); }\n    save(); flash(t);\n    if(f==='status'||f==='joinedMonth') renderRefTable();\n  }\n  if(act==='toggle-assign'){\n    const {pj,ag}=t.dataset; let x=assignment(pj,ag);\n    if(!x){ x={pj,ag,published:false,refOv:null,sucOv:null}; DB.assignments.push(x); }\n    x.published=t.checked; save(); updateNavCounts();\n    renderAssignPanel(pj);\n    toast(t.checked?'公開しました':'非公開にしました');\n  }\n  if(act==='set-override'){\n    const {pj,ag,kind}=t.dataset; let x=assignment(pj,ag);\n    if(!x){ x={pj,ag,published:false,refOv:null,sucOv:null}; DB.assignments.push(x); }\n    const v=t.value===''?null:Number(t.value);\n    if(kind==='ref') x.refOv=v; else x.sucOv=v;\n    save(); flash(t);\n  }\n});\n\ndocument.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeMsgMenu(); closeOverlay(); closeModal(); } });\ndocument.addEventListener('click', e=>{ const menu=document.getElementById('msgMenu'); if(menu && !e.target.closest('#msgMenu') && !e.target.closest('[data-act=\"msg-menu\"]')) closeMsgMenu(); }, true);\n/* Enter submits the active login form */\ndocument.addEventListener('keydown', e=>{\n  if(e.key!=='Enter') return;\n  if(document.getElementById('loginWrap').style.display==='none') return;\n  const t=e.target; if(!t.closest('.login-body')) return;\n  e.preventDefault();\n  if(loginTab==='agency'){ const b=document.querySelector('[data-act=\"login-agency\"]'); b&&b.click(); }\n  else if(loginTab==='kanoa'){ const b=document.querySelector('[data-act=\"login-kanoa\"]'); b&&b.click(); }\n  else { const b=document.querySelector('[data-act=\"apply-submit\"]'); b&&b.click(); }\n});\n/* live referral search */\ndocument.addEventListener('input', e=>{\n  if(e.target.id==='rSearch'){ rFilter.q=e.target.value; renderRefTable(); }\n  if(e.target.id==='msgSearch'){ msgFilter.q=e.target.value; renderMsgList();\n    // 検索クリアボタンの出し入れ（フォーカスは維持）\n    const wrap=e.target.closest('.msg-search-wrap');\n    if(wrap){ let clr=wrap.querySelector('.msg-search-clear');\n      if(e.target.value && !clr){ clr=document.createElement('button'); clr.className='msg-search-clear'; clr.setAttribute('data-act','msg-search-clear'); clr.textContent='×'; wrap.appendChild(clr); }\n      else if(!e.target.value && clr){ clr.remove(); } }\n  }\n  if(e.target.id==='subSearch'){\n    const q=(e.target.value||'').trim().toLowerCase();\n    document.querySelectorAll('#subPickList .sub-pick-row').forEach(row=>{\n      const hay=(row.getAttribute('data-search')||'').toLowerCase();\n      row.style.display = (!q || hay.includes(q)) ? '' : 'none';\n    });\n  }\n  if(e.target.id==='bulkSearch'){ bulkFilter.q=e.target.value; renderBulkList(); }\n  if(e.target.id==='assignSearch'){ assignQ=e.target.value; applyAssignFilter(); }\n  if(e.target.id==='fArea'){ rFilter.area=e.target.value; renderRefTable(); }\n  if(e.target.id==='msgInput'){\n    e.target.style.height='auto'; e.target.style.height=Math.min(e.target.scrollHeight,120)+'px';\n    const v=e.target.value;\n    if((v.endsWith('@')||v.endsWith('＠')) && !S.picker){ openMentionPicker(); }\n  }\n});\ndocument.addEventListener('keydown', e=>{\n  if(e.target.id==='msgInput'){\n    if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); const btn=document.querySelector('[data-act=\"send-msg\"]'); btn && btn.click(); return; }\n  }\n});\ndocument.addEventListener('change', e=>{\n  if(e.target.id==='rPj'){ rFilter.pj=e.target.value; renderRefChips(); renderRefTable(); }\n  if(e.target.id==='rAg'){ rFilter.ag=e.target.value; renderRefChips(); renderRefTable(); }\n  if(['fSessFrom','fSessTo','fJoinFrom','fJoinTo','fCrFrom','fCrTo'].includes(e.target.id)){ const map={fSessFrom:'sessFrom',fSessTo:'sessTo',fJoinFrom:'joinFrom',fJoinTo:'joinTo',fCrFrom:'crFrom',fCrTo:'crTo'}; rFilter[map[e.target.id]]=e.target.value; renderRefTable(); }\n  if(e.target.id==='fJoinMode'){ rFilter.joinMode=e.target.value; renderRefTable(); }\n  if(e.target.id==='fDoc'){ rFilter.docMode=e.target.value; renderRefChips(); renderRefTable(); }\n  if(e.target.id==='fSessTbd'){ rFilter.sessTbd=e.target.checked; renderRefTable(); }\n  if(e.target.dataset && e.target.dataset.act==='doc-input'){ if(e.target.files&&e.target.files.length) uploadDocs(e.target.dataset.ref, e.target.files, e.target.dataset.kind||''); }\n  if(e.target.dataset && e.target.dataset.act==='autofill-doc'){ if(e.target.files&&e.target.files[0]) autofillFromDoc(e.target.files[0]); }\n  if(e.target.dataset && e.target.dataset.act==='doc-kind'){ const r=DB.referrals.find(x=>x.id===e.target.dataset.ref); if(r){ const d=(r.docs||[]).find(x=>x.id===e.target.dataset.id); if(d){ d.kind=e.target.value; save(); if(S.view==='referrals') renderRefTable(); } } }\n});\n/* drag & drop file upload */\ndocument.addEventListener('dragover', e=>{ const z=e.target.closest&&e.target.closest('.dropzone'); if(z){ e.preventDefault(); z.classList.add('drag'); } });\ndocument.addEventListener('dragleave', e=>{ const z=e.target.closest&&e.target.closest('.dropzone'); if(z) z.classList.remove('drag'); });\ndocument.addEventListener('drop', e=>{ const z=e.target.closest&&e.target.closest('.dropzone'); if(z){ e.preventDefault(); z.classList.remove('drag'); if(e.dataTransfer&&e.dataTransfer.files.length) uploadDocs(z.dataset.ref, e.dataTransfer.files, z.dataset.kind||''); } });\n\n/* helpers */\nfunction val(id){ const el=document.getElementById(id); return el?el.value.trim():''; }\nfunction flash(el){ el.style.boxShadow='0 0 0 3px var(--g-bg)'; el.style.borderColor='var(--g)'; setTimeout(()=>{el.style.boxShadow='';el.style.borderColor='';},800); }\nfunction setAgency(id,status){ const a=agency(id); if(a){ if(status==='active'&&a.source==='applied'){} a.status=status; save(); viewAgencies(); updateNavCounts(); } }\nfunction saveAgency(){\n  const email=val('agEmail'), name=val('agName');\n  if(!email||!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(email)){ toast('有効なメールアドレスを入力してください'); return; }\n  if(!name){ toast('会社名を入力してください'); return; }\n  if(DB.agencies.some(a=>(a.email||'').toLowerCase()===email.toLowerCase())){ toast('このメールは既に登録済みです'); return; }\n  const issue = agMethod==='issue';\n  const pw = issue ? (val('agPw')||genPw()) : 'demo';\n  const a={id:uid('AG'),name,contact:val('agContact'),email,status:'active',source:'invited',joined:todayISO(),license:val('agLicense')==='1',bank:val('agBank')||'',special:val('agSpecial')||'',payRoute:val('agPayRoute')||'A',pw};\n  DB.agencies.push(a);\n  DB.activity.unshift({ts:nowTS(),actor:'KANOA',action:issue?'アカウント発行':'パートナー招待',detail:`${name}（${email}）を${issue?'発行':'招待'}`});\n  save(); updateNavCounts();\n  if(issue){ modalAgencyCreated(a); }\n  else { closeModal(); toast(`招待メールを送信しました → ${email}`); }\n  if(S.view==='agencies') viewAgencies();\n}\nfunction saveReferral(pjId){\n  const name=val('mName'); if(!name){ toast('氏名を入力してください'); return; }\n  const projEl=document.getElementById('mProj'); const proj = (projEl&&projEl.value) || pjId;\n  const agEl=document.getElementById('mAg');\n  const ag = S.role==='agency' ? S.agencyId : ((agEl&&agEl.value) || 'AG-01');\n  // 自社内の重複チェック（名前＋電話が一致する方が既にいたらブロック）\n  const _phone=val('mPhone');\n  const _dup=findOwnDuplicate(ag, name, _phone);\n  if(_dup){\n    toast(`${name} さん（${_phone}）は既に送客済みです。二重登録はできません。`);\n    return;\n  }\n  const r=mk(proj,ag,name,val('mKana'),val('mPhone'),val('mEmail'),val('mAddress'),val('mArea'),'entry','—',todayISO());\n  r.src=val('mSrc')||'';  // 集客元（任意・空欄可）\n  if(S.role==='agency') r.seenK=false;  // パートナー送客はKANOA未確認としてマーク\n  DB.referrals.unshift(r);\n  DB.activity.unshift({ts:new Date().toISOString().slice(0,16).replace('T',' '),actor:S.role==='agency'?S.agencyId:'KANOA',action:'送客登録',detail:`${name} さんを送客`});\n  save(); closeModal(); updateNavCounts();\n  // 連絡から追加した場合は、その候補者のスレッドを開いて連携を続けられるように\n  if(S._newRefFromMsg){\n    S._newRefFromMsg=false;\n    S.threadAg=ag; S.threadRef=r.id; S.replyTo=null; S.editMsg=null; S.picker=false; S.draft=null;\n    toast(`${name} さんを送客登録しました。スレッドを開きました`);\n    go('messages');\n    return;\n  }\n  // パートナーが送客したら、KANOAへ自動で連絡メッセージを送る（手動追加の手間を排除・要望2a）\n  if(S.role==='agency'){\n    const pj=project(r.pj);\n    autoNotify(r.ag, 'agency', `【新規送客】${name} さん（${pj?pj.name.replace(' パートナー送客',''):r.pj}）を送客しました。ご確認をお願いします。`, r.id);\n  }\n  toast(`「${name}」さんを送客登録しました。続けて資料をアップロードできます`);\n  if(S.view==='pjDetailAgency') viewAgencyProjectDetail(); else render();\n  openRefDrawer(r.id);\n}\nfunction saveProject(id){\n  const lines=s=>s.split('\\n').map(x=>x.trim()).filter(Boolean);\n  const flowParse=s=>lines(s).map(l=>{ const m=l.split(/[｜|]/); return {t:(m[0]||'').trim(), s:(m[1]||'').trim()}; });\n  const data={\n    name:val('epName'), client:val('epClient'), position:val('epPos'), location:val('epLoc'),\n    employment:val('epEmp'), salary:val('epSal'), summary:val('epSum'), conditions:val('epCond'),\n    requirements:lines(val('epReq')), flow:flowParse(val('epFlow')),\n    headcount:val('epHead'), seminar:val('epSem'), passNote:val('epPass'), caseStudy:val('epCase'),\n    rewardType:document.getElementById('epRType').value, status:document.getElementById('epStatus').value,\n    referralReward:Number(val('epRef'))||0, successReward:Number(val('epSuc'))||0,\n    clientFee:Number(val('epFee'))||0,\n  };\n  if(!data.name){ toast('案件名を入力してください'); return; }\n  if(id){ Object.assign(project(id),data); }\n  else { DB.projects.push(Object.assign({id:uid('PJ'),logo:data.name.slice(0,1),color:'#4f46e5'},data)); }\n  save(); closeModal(); updateNavCounts();\n  if(id && S.view==='projectDetail') viewProjectDetail(); else go('projects');\n  toast(id?'保存しました':'案件を追加しました');\n}\n\n/* ════════════════════ 請求管理（自動注入） ════════════════════ */\n/* 請求モジュール専用ヘルパ（既存のローカル関数 row/id に依存しない） */\nfunction invMakeId(){ return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():('INV-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)); }\nfunction invRow(l,v){ return `<div class=\"info-row\"><span class=\"info-label\">${l}</span><span class=\"info-val\">${v}</span></div>`; }\n/* ════════════════════════════════════════════════════════════\n   請求管理モジュール（KANOA Portal v13）\n   ─────────────────────────────────────────────────────────────\n   ・パートナーが入社確定者(status=joined)から請求書を発行\n   ・個別／まとめて発行\n   ・ライフサイクル: draft → submitted → accepted/rejected → paid\n   ・差し戻し(rejected)は理由つき・修正して再提出\n   ・二重請求ガード・状態履歴・PDFダウンロード\n   ════════════════════════════════════════════════════════════ */\n\n/* ── ステータス定義 ── */\nconst INV_STATUS = {\n  draft:     { label:'下書き',   color:'var(--muted)',  bg:'var(--surface)' },\n  submitted: { label:'提出済',   color:'#B45309',       bg:'#FDF2E2' },\n  accepted:  { label:'受理',     color:'#1D4ED8',       bg:'#EFF4FF' },\n  rejected:  { label:'差し戻し', color:'#BE123C',       bg:'#FDEEF1' },\n  paid:      { label:'支払済',   color:'#15803D',       bg:'#E8F6EE' },\n};\nconst INV_ORDER = ['draft','submitted','accepted','rejected','paid'];\n\nfunction invStatusBadge(st){\n  const s=INV_STATUS[st]||INV_STATUS.draft;\n  return `<span class=\"tag\" style=\"background:${s.bg};color:${s.color};font-weight:600\">${s.label}</span>`;\n}\n\n/* ── DB初期化（invoices配列を保証） ── */\nfunction ensureInvoices(){ if(!DB.invoices) DB.invoices=[]; return DB.invoices; }\n\n/* ── 採番: KANOA-INV-YYYYMM-連番 ── */\nfunction nextInvoiceNo(){\n  ensureInvoices();\n  const ym=todayISO().slice(0,7).replace('-','');\n  const seq=DB.invoices.filter(v=>(v.no||'').includes(`-${ym}-`)).length+1;\n  return `KANOA-INV-${ym}-${String(seq).padStart(3,'0')}`;\n}\n\n/* ── ある候補者が既に有効な請求に含まれているか（二重請求ガード） ── */\nfunction refInvoiced(refId){\n  ensureInvoices();\n  // rejected を除く請求（draft/submitted/accepted/paid）に含まれていれば請求済み扱い\n  return DB.invoices.some(v=> v.status!=='rejected' && (v.items||[]).some(it=>it.refId===refId));\n}\n\n/* ── 請求対象になり得る入社確定者（未請求のみ） ── */\nfunction billableRefs(agId){\n  return DB.referrals\n    .filter(r=> r.ag===agId && r.status==='joined' && refEarning(r)>0 && !refInvoiced(r.id));\n}\n\n/* ── 状態履歴を1件追加 ── */\nfunction pushInvHistory(inv, action, note){\n  inv.history=inv.history||[];\n  inv.history.push({ at:nowTS(), by:meRole(), byId:(S.role==='kanoa'?'KANOA':S.agencyId), action, note:note||'' });\n}\n\n/* ── 請求書を作成（候補者ID配列から） ── */\nfunction createInvoice(agId, refIds){\n  ensureInvoices();\n  const ids=refIds.filter(rid=>!refInvoiced(rid)); // 念のため二重ガード\n  if(!ids.length){ toast('請求できる入社者がありません（すでに請求済みの可能性）'); return null; }\n  const items=ids.map(rid=>{\n    const r=DB.referrals.find(x=>x.id===rid);\n    return { refId:rid, name:r.name, pj:r.pj, pjName:(project(r.pj)?project(r.pj).name:r.pj),\n             joined:r.joined||'', amount:refEarning(r) };\n  });\n  // ★退職者の未請求返金を、この請求書にマイナス明細として自動で差し引く\n  const refundTargets=refundableRefs(agId);\n  refundTargets.forEach(r=>{\n    const amt=refundAmount(r);\n    if(amt>0){\n      items.push({ refId:r.id, name:r.name, pj:r.pj, pjName:(project(r.pj)?project(r.pj).name:r.pj),\n        joined:r.joined||'', resignedOn:r.resignedOn||'', rateLabel:refundRateLabel(r),\n        isRefund:true, amount:-amt });\n    }\n  });\n  const subtotal=items.reduce((s,it)=>s+it.amount,0);\n  const inv={\n    id:invMakeId(), no:nextInvoiceNo(), agId, status:'draft',\n    items, subtotal, tax:0, total:subtotal,   // 税は0（必要なら後で）\n    issuedOn:todayISO(), submittedOn:null, decidedOn:null, paidOn:null,\n    rejectReason:'', history:[]\n  };\n  pushInvHistory(inv,'created',`${items.length}名で作成`);\n  items.forEach(it=>{ if(!it.isRefund) logRef(it.refId,'請求書を発行',`${inv.no} · ${yen(it.amount)}`); });\n  DB.invoices.push(inv);\n  save();\n  return inv;\n}\n\n/* ── 状態遷移（ガード付き） ── */\nfunction invoiceAction(invId, action, note){\n  const inv=DB.invoices.find(v=>v.id===invId); if(!inv) return;\n  const role=meRole();\n  // 権限・遷移バリデーション\n  const can = {\n    submit:  role==='agency' && (inv.status==='draft' || inv.status==='rejected'),\n    accept:  role==='kanoa'  && inv.status==='submitted',\n    reject:  role==='kanoa'  && inv.status==='submitted',\n    pay:     role==='kanoa'  && inv.status==='accepted',\n    cancel:  role==='agency' && inv.status==='draft',  // 下書きの取消(削除)\n    reopen:  role==='kanoa'  && inv.status==='accepted', // 受理を取り消して差し戻しに戻す（誤操作対策）\n  };\n  if(!can[action]){ toast('この操作は実行できません（権限または状態が不正）'); return; }\n\n  switch(action){\n    case 'submit':\n      inv.status='submitted'; inv.submittedOn=todayISO(); inv.rejectReason='';\n      pushInvHistory(inv,'submitted'); toast('請求書を提出しました');\n      break;\n    case 'accept':\n      inv.status='accepted'; inv.decidedOn=todayISO();\n      pushInvHistory(inv,'accepted'); toast('請求書を受理しました');\n      break;\n    case 'reject':\n      if(!note || !note.trim()){ toast('差し戻し理由を入力してください'); return; }\n      inv.status='rejected'; inv.decidedOn=todayISO(); inv.rejectReason=note.trim();\n      pushInvHistory(inv,'rejected',note.trim()); toast('差し戻しました');\n      break;\n    case 'pay':\n      inv.status='paid'; inv.paidOn=todayISO();\n      pushInvHistory(inv,'paid'); toast('支払済みにしました');\n      break;\n    case 'reopen':\n      inv.status='submitted'; inv.decidedOn=null;\n      pushInvHistory(inv,'reopened','受理を取消'); toast('受理を取り消しました');\n      break;\n    case 'cancel':\n      DB.invoices=DB.invoices.filter(v=>v.id!==invId);\n      save(); toast('下書きを削除しました');\n      if(S.view==='invoices') render(); return;\n  }\n  save();\n  if(S.view==='invoices') render();\n  if(document.querySelector('.drawer.on')) openInvoiceDetail(invId);\n}\n\n/* ── 集計（KPI用） ── */\nfunction invSummary(list){\n  const sum={ count:list.length, total:0, paid:0, pending:0, rejected:0 };\n  list.forEach(v=>{\n    sum.total+=v.total;\n    if(v.status==='paid') sum.paid+=v.total;\n    else if(v.status==='rejected') sum.rejected+=v.total;\n    else sum.pending+=v.total;\n  });\n  return sum;\n}\n\n/* ════════════════════ 請求一覧ビュー（正しいクラスで再構築） ════════════════════ */\nlet invFilter={ status:'', q:'' };\nlet invSel=new Set();\n\nfunction viewInvoices(){\n  ensureInvoices();\n  const isK = S.role==='kanoa';\n  setHeader('請求', isK?'パートナーからの請求の受理・支払い管理':'入社確定者の請求書発行と進捗管理');\n  const c=document.getElementById('content');\n\n  const mine = isK ? DB.invoices.slice() : DB.invoices.filter(v=>v.agId===S.agencyId);\n  let list = mine.slice().sort((a,b)=> (b.issuedOn||'').localeCompare(a.issuedOn||''));\n  if(invFilter.status) list=list.filter(v=>v.status===invFilter.status);\n  if(invFilter.q){ const q=invFilter.q.toLowerCase();\n    list=list.filter(v=> (v.no||'').toLowerCase().includes(q)\n      || (v.items||[]).some(it=>(it.name||'').toLowerCase().includes(q))\n      || (agency(v.agId)?agency(v.agId).name:'').toLowerCase().includes(q)); }\n\n  const sum=invSummary(mine);\n  const billable = !isK ? billableRefs(S.agencyId) : [];\n\n  const filterTabs = ['', ...INV_ORDER].map(stt=>{\n    const lbl = stt===''?'すべて':INV_STATUS[stt].label;\n    const n = stt===''?mine.length:mine.filter(v=>v.status===stt).length;\n    return `<button class=\"seg-btn ${invFilter.status===stt?'on':''}\" data-act=\"inv-filter\" data-st=\"${stt}\">${lbl}（${n}）</button>`;\n  }).join('');\n\n  const billHead = billable.length\n    ? `<button class=\"btn btn-primary btn-sm\" data-act=\"inv-create-selected\">選択した${invSel.size}名を発行</button>`\n    : '';\n\n  c.innerHTML=`<div class=\"content-narrow\">\n    <div class=\"kpi-grid\">\n      ${kpi('請求総額','<span class=\"yen\">¥</span>'+sum.total.toLocaleString('ja-JP'),'var(--ink)')}\n      ${kpi('支払済','<span class=\"yen\">¥</span>'+sum.paid.toLocaleString('ja-JP'),'var(--g)')}\n      ${kpi('処理中','<span class=\"yen\">¥</span>'+sum.pending.toLocaleString('ja-JP'),'var(--a)')}\n      ${kpi('請求件数',sum.count+'<span class=\"unit\">件</span>','var(--accent)')}\n    </div>\n\n    ${!isK ? `\n    <div class=\"sect\">\n      <div class=\"sect-head\"><div class=\"sect-title\">請求できる入社確定者</div><div style=\"flex:1\"></div>${billHead}</div>\n      ${billable.length ? `\n      <div class=\"panel tbl-wrap\"><table class=\"tbl\"><thead><tr>\n        <th style=\"width:42px\"><input type=\"checkbox\" data-act=\"inv-sel-all\"></th>\n        <th>氏名</th><th>案件</th><th>入社月</th><th class=\"num\">金額</th><th style=\"width:84px\"></th>\n      </tr></thead><tbody>\n        ${billable.map(r=>`<tr>\n          <td><input type=\"checkbox\" class=\"inv-cb\" data-act=\"inv-sel\" data-ref=\"${r.id}\" ${invSel.has(r.id)?'checked':''}></td>\n          <td class=\"cell-strong\">${esc(r.name)}</td>\n          <td><span class=\"tag\">${esc((project(r.pj)?project(r.pj).name:r.pj).replace(' パートナー送客',''))}</span></td>\n          <td>${r.joined?esc(r.joined.slice(0,7)):'<span class=\"cell-sub\">—</span>'}</td>\n          <td class=\"num cell-strong\">${yen(refEarning(r))}</td>\n          <td><button class=\"btn btn-ghost btn-sm\" data-act=\"inv-create-one\" data-ref=\"${r.id}\">発行</button></td>\n        </tr>`).join('')}\n      </tbody></table></div>`\n      : `<div class=\"panel\" style=\"padding:22px\">${emptyState('請求できる入社者がいません','入社が確定し未請求の方がここに表示されます')}</div>`}\n    </div>` : ''}\n\n    <div class=\"sect\">\n      <div class=\"sect-head\"><div class=\"sect-title\">請求書一覧</div></div>\n      <div class=\"seg\">${filterTabs}</div>\n      ${list.length ? `\n      <div class=\"panel tbl-wrap\"><table class=\"tbl\"><thead><tr>\n        <th>請求番号</th>${isK?'<th>パートナー</th>':''}<th class=\"num\">金額</th><th>対象</th><th>状態</th><th>発行日</th><th style=\"width:120px\"></th>\n      </tr></thead><tbody>\n        ${list.map(v=>`<tr style=\"cursor:pointer\" data-act=\"inv-open\" data-id=\"${v.id}\">\n          <td class=\"cell-strong\" style=\"font-family:var(--mono);font-size:12px\">${esc(v.no)}</td>\n          ${isK?`<td>${esc(agency(v.agId)?agency(v.agId).name:v.agId)}</td>`:''}\n          <td class=\"num cell-strong\">${yen(v.total)}</td>\n          <td><span class=\"cell-sub\">${(v.items||[]).length}名</span></td>\n          <td>${invStatusBadge(v.status)}${v.status==='rejected'&&v.rejectReason?`<div class=\"cell-sub\" style=\"color:var(--r);margin-top:3px\">差戻: ${esc(v.rejectReason.slice(0,20))}</div>`:''}</td>\n          <td><span class=\"cell-sub\">${esc(v.issuedOn||'')}</span></td>\n          <td>${invQuickActions(v)}</td>\n        </tr>`).join('')}\n      </tbody></table></div>`\n      : `<div class=\"panel\" style=\"padding:22px\">${emptyState('請求書がありません',isK?'パートナーが請求書を提出するとここに表示されます':'上の一覧から請求書を発行できます')}</div>`}\n    </div>\n  </div>`;\n}\n\nfunction invQuickActions(v){\n  const role=meRole(); const stop='onclick=\"event.stopPropagation()\"';\n  if(role==='agency'){\n    if(v.status==='draft')    return `<button class=\"btn btn-primary btn-sm\" ${stop} data-act=\"inv-act\" data-id=\"${v.id}\" data-do=\"submit\">提出</button>`;\n    if(v.status==='rejected') return `<button class=\"btn btn-primary btn-sm\" ${stop} data-act=\"inv-act\" data-id=\"${v.id}\" data-do=\"submit\">再提出</button>`;\n  } else {\n    if(v.status==='accepted')  return `<button class=\"btn btn-primary btn-sm\" ${stop} data-act=\"inv-act\" data-id=\"${v.id}\" data-do=\"pay\">支払済に</button>`;\n  }\n  return '';\n}\n\n/* ════════════════════ 請求書 詳細ドロワー ════════════════════ */\nfunction openInvoiceDetail(invId){\n  const v=DB.invoices.find(x=>x.id===invId); if(!v) return;\n  const role=meRole(); const ag=agency(v.agId);\n  const drawer=document.getElementById('drawer');\n\n  const histHtml=(v.history||[]).slice().reverse().map(h=>{\n    const lbl={created:'作成',submitted:'提出',accepted:'受理',rejected:'差し戻し',paid:'支払済',reopened:'受理取消'}[h.action]||h.action;\n    return `<div class=\"info-row\"><div style=\"flex:1\"><strong style=\"font-weight:600\">${lbl}</strong>${h.note?`<span class=\"cell-sub\"> · ${esc(h.note)}</span>`:''}</div>\n      <span class=\"cell-sub\">${esc(h.at)}</span></div>`;\n  }).join('') || '<div class=\"info-row\"><span class=\"cell-sub\">履歴なし</span></div>';\n\n  let actions='';\n  if(role==='agency'){\n    if(v.status==='draft') actions=`<button class=\"btn btn-primary\" data-act=\"inv-act\" data-id=\"${v.id}\" data-do=\"submit\">提出する</button><button class=\"btn btn-ghost\" data-act=\"inv-act\" data-id=\"${v.id}\" data-do=\"cancel\">削除</button>`;\n    else if(v.status==='rejected') actions=`<button class=\"btn btn-primary\" data-act=\"inv-act\" data-id=\"${v.id}\" data-do=\"submit\">修正して再提出</button>`;\n  } else {\n    if(v.status==='submitted') actions=`<button class=\"btn btn-primary\" data-act=\"inv-act\" data-id=\"${v.id}\" data-do=\"accept\">受理する</button><button class=\"btn btn-danger\" data-act=\"inv-reject-prompt\" data-id=\"${v.id}\">差し戻し</button>`;\n    else if(v.status==='accepted') actions=`<button class=\"btn btn-primary\" data-act=\"inv-act\" data-id=\"${v.id}\" data-do=\"pay\">支払済みにする</button><button class=\"btn btn-ghost\" data-act=\"inv-act\" data-id=\"${v.id}\" data-do=\"reopen\">受理取消</button>`;\n  }\n\n  drawer.innerHTML=`\n    <div class=\"drawer-head\">\n      <div style=\"flex:1\"><div class=\"drawer-title\" style=\"font-family:var(--mono);font-size:15px\">${esc(v.no)}</div>\n        <div class=\"drawer-sub\">${esc(ag?ag.name:v.agId)} · ${invStatusBadge(v.status)}</div></div>\n      <button class=\"drawer-close\" data-act=\"closeoverlay\">×</button>\n    </div>\n    <div class=\"drawer-body\">\n      ${v.status==='rejected'&&v.rejectReason?`<div class=\"panel\" style=\"padding:13px 15px;background:var(--r-bg,#FDEEF1);border-color:#f3cdd6;margin-bottom:18px\">\n        <div style=\"color:var(--r);font-weight:600;font-size:11px;letter-spacing:.05em;margin-bottom:5px\">差し戻し理由</div>\n        <div style=\"font-size:13px;line-height:1.6\">${esc(v.rejectReason)}</div></div>`:''}\n\n      <div class=\"dt-block-title\">請求内容</div>\n      <div class=\"panel tbl-wrap\" style=\"margin-bottom:18px\"><table class=\"tbl\"><thead><tr><th>氏名</th><th>案件</th><th>入社月</th><th class=\"num\">金額</th></tr></thead><tbody>\n        ${(v.items||[]).map(it=>`<tr><td class=\"cell-strong\">${esc(it.name)}${it.isRefund?'<span class=\"tag\" style=\"background:var(--r-bg,#FDEEF1);color:var(--r);margin-left:6px;font-size:10px\">返金</span>':''}</td>\n          <td><span class=\"cell-sub\">${esc((it.pjName||'').replace(' パートナー送客',''))}${it.isRefund&&it.rateLabel?' · '+esc(it.rateLabel):''}</span></td>\n          <td>${it.joined?esc(it.joined.slice(0,7)):'—'}</td>\n          <td class=\"num\" style=\"${it.amount<0?'color:var(--r)':''}\">${it.amount<0?'-'+yen(-it.amount):yen(it.amount)}</td></tr>`).join('')}\n        ${(()=>{ const charge=(v.items||[]).filter(it=>!it.isRefund&&it.amount>0).reduce((s,it)=>s+it.amount,0);\n                 const refund=(v.items||[]).filter(it=>it.isRefund||it.amount<0).reduce((s,it)=>s+it.amount,0);\n                 let html='';\n                 if(refund<0){\n                   html+=`<tr><td colspan=\"3\" class=\"num\">本来の請求</td><td class=\"num\">${yen(charge)}</td></tr>`;\n                   html+=`<tr><td colspan=\"3\" class=\"num\" style=\"color:var(--r)\">返金差引</td><td class=\"num\" style=\"color:var(--r)\">-${yen(-refund)}</td></tr>`;\n                 }\n                 html+=`<tr><td colspan=\"3\" class=\"num cell-strong\">差引合計</td><td class=\"num cell-strong\" style=\"font-size:15px\">${yen(v.total)}</td></tr>`;\n                 return html; })()}\n      </tbody></table></div>\n\n      <div class=\"dt-block-title\">日付</div>\n      <div class=\"info-card\">\n        ${invRow('発行日',esc(v.issuedOn||'—'))}\n        ${invRow('提出日',esc(v.submittedOn||'—'))}\n        ${invRow('受理/差戻日',esc(v.decidedOn||'—'))}\n        ${invRow('支払日',esc(v.paidOn||'—'))}\n      </div>\n\n      <div class=\"dt-block-title\">変更履歴</div>\n      <div class=\"info-card\">${histHtml}</div>\n\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:8px\">\n        <button class=\"btn btn-ghost\" data-act=\"inv-pdf\" data-id=\"${v.id}\">PDFダウンロード</button>\n        ${actions}\n      </div>\n    </div>`;\n  openOverlay();\n}\n\nfunction promptReject(invId){\n  const reason=window.prompt('差し戻し理由を入力してください（パートナーに表示されます）');\n  if(reason===null) return;\n  if(!reason.trim()){ toast('理由を入力してください'); return; }\n  invoiceAction(invId,'reject',reason);\n}\n\n/* ════════════════════ PDF（印刷ダイアログ経由） ════════════════════ */\nfunction invoicePDF(invId){\n  const v=DB.invoices.find(x=>x.id===invId); if(!v) return;\n  const ag=agency(v.agId);\n  const rows=(v.items||[]).map(it=>`<tr>\n    <td>${esc(it.name)}</td><td>${esc((it.pjName||'').replace(' パートナー送客',''))}</td>\n    <td>${it.joined?esc(it.joined.slice(0,7)):'-'}</td>\n    <td style=\"text-align:right\">¥${(it.amount||0).toLocaleString('ja-JP')}</td></tr>`).join('');\n  const win=window.open('','_blank');\n  if(!win){ toast('ポップアップを許可してください'); return; }\n  win.document.write(`<!DOCTYPE html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n  <title>${esc(v.no)}</title>\n  <style>\n    *{box-sizing:border-box} body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#1a1a1a;margin:0;padding:40px;font-size:13px}\n    h1{font-size:24px;letter-spacing:2px;margin:0 0 4px} .sub{color:#888;font-size:12px}\n    .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:30px;border-bottom:2px solid #1a1a1a;padding-bottom:16px}\n    .meta{text-align:right;font-size:12px;line-height:1.7}\n    .to{font-size:16px;font-weight:bold;border-bottom:1px solid #ccc;padding-bottom:8px;margin-bottom:8px}\n    table{width:100%;border-collapse:collapse;margin:20px 0}\n    th,td{padding:9px 10px;border-bottom:1px solid #ddd;text-align:left}\n    th{background:#f5f5f5;font-size:11px;color:#555}\n    .total{display:flex;justify-content:flex-end;margin-top:16px}\n    .total-box{min-width:240px}\n    .total-row{display:flex;justify-content:space-between;padding:6px 0}\n    .grand{border-top:2px solid #1a1a1a;font-size:18px;font-weight:bold;padding-top:10px;margin-top:6px}\n    .from{margin-top:50px;font-size:12px;color:#444;line-height:1.8}\n    .badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:bold;background:#eef;color:#33c}\n    @media print{ body{padding:20px} .noprint{display:none} }\n  </style></head><body>\n    <div class=\"top\">\n      <div><h1>${v.kind==='refund'?'返金請求書':'請求書'}</h1><div class=\"sub\">${v.kind==='refund'?'REFUND':'INVOICE'}</div></div>\n      <div class=\"meta\"><div><strong>${esc(v.no)}</strong></div>\n        <div>発行日: ${esc(v.issuedOn||'')}</div>\n        <div>状態: <span class=\"badge\">${(INV_STATUS[v.status]||{}).label||v.status}</span></div></div>\n    </div>\n    <div class=\"to\">${esc(ag?ag.name:v.agId)} 御中</div>\n    <div class=\"sub\">下記の通りご請求申し上げます。</div>\n    <table><thead><tr><th>氏名（入社者）</th><th>案件</th><th>入社月</th><th style=\"text-align:right\">金額</th></tr></thead>\n      <tbody>${rows}</tbody></table>\n    <div class=\"total\"><div class=\"total-box\">\n      <div class=\"total-row\"><span>小計</span><span>¥${(v.subtotal||0).toLocaleString('ja-JP')}</span></div>\n      <div class=\"total-row\"><span>消費税</span><span>¥${(v.tax||0).toLocaleString('ja-JP')}</span></div>\n      <div class=\"total-row grand\"><span>合計</span><span>¥${(v.total||0).toLocaleString('ja-JP')}</span></div>\n    </div></div>\n    <div class=\"from\"><strong>発行元</strong><br>${esc(ag?ag.name:'')}<br>\n      担当: ${esc(ag?(ag.contact||''):'')}<br>請求先: 株式会社KANOA</div>\n    <div class=\"noprint\" style=\"margin-top:30px;text-align:center\">\n      <button onclick=\"window.print()\" style=\"padding:10px 24px;font-size:14px;cursor:pointer;background:#4F46E5;color:#fff;border:
