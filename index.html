Notify(it.ag,'agency',`【新規送客】${it.name} さん（${p?p.name.replace(' パートナー送客',''):pj}）を送客しました。ご確認をお願いします。`, r.id);\n  }\n  save();\n  toast(`「${it.name}」さんを選考会へ登録しました`);\n  render(); updateNavCounts();\n}\n\n/* 1件を見送る（受信箱から削除） */\nfunction rejectIntake(id){\n  const idx=(DB.intake||[]).findIndex(x=>x.id===id);\n  if(idx<0) return;\n  const it=DB.intake[idx];\n  DB.intake.splice(idx,1);\n  if(!DEMO_MODE){ try{ SUPA.delRow('intake','id',id); }catch(e){} }\n  save();\n  toast(`「${it.name}」さんを見送りました`);\n  render(); updateNavCounts();\n}\n\n/* 受信箱ビュー */\nfunction viewIntake(){\n  setHeader('パートナー連携', '代理店・二次パートナーから届いた応募を確認し、選考会に進めるか選びます',\n    S.role==='agency'\n      ? `<button class=\"btn btn-primary btn-sm\" data-act=\"form-share\" style=\"margin-right:8px\">紹介フォームを発行</button><button class=\"btn btn-ghost btn-sm\" data-act=\"intake-import\" style=\"margin-right:8px\">CSV取込</button>`\n      : '');\n  const c=document.getElementById('content');\n  const items=myIntake();\n  if(!items.length){\n    c.innerHTML=`<div class=\"content-narrow\"><div class=\"empty-state\" style=\"text-align:center;padding:60px 20px\">\n      <svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--line-2)\" stroke-width=\"1.5\" style=\"margin-bottom:14px\"><path d=\"M22 12h-6l-2 3h-4l-2-3H2\"/><path d=\"M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z\"/></svg>\n      <div style=\"font-weight:600;font-size:15px;margin-bottom:6px\">まだ応募はありません</div>\n      <div class=\"cell-sub\">Googleフォームやスプレッドシート（CSV）から応募が届くと、ここに一時保存されます。<br>内容を確認して、選考会に進める方だけを送客できます。</div>\n      ${S.role==='agency'?'<button class=\"btn btn-primary btn-sm\" data-act=\"intake-import\" style=\"margin-top:16px\">CSVから取り込む</button>':''}\n    </div></div>`;\n    return;\n  }\n  const projs = S.role==='agency'\n    ? DB.projects.filter(p=>(DB.assignments||[]).some(a=>a.pj===p.id && a.ag===S.agencyId && a.published))\n    : DB.projects;\n  const projOpts = (projs.length?projs:DB.projects).map(p=>`<option value=\"${p.id}\">${esc((p.name||p.id).replace(' パートナー送客',''))}</option>`).join('');\n  const rows=items.map(it=>{\n    const p=it.pj?project(it.pj):null;\n    const badge = it.source_type==='csv' ? 'CSV' : (it.source_type==='form'?'フォーム':'手動');\n    return `<div class=\"intake-card\" style=\"border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--surface)\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap\">\n        <div style=\"flex:1;min-width:200px\">\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:4px\">\n            <strong style=\"font-weight:700;font-size:14px\">${esc(it.name||'（氏名未入力）')}</strong>\n            <span class=\"tag\" style=\"font-size:10px;background:var(--gray-bg);color:var(--soft)\">${badge}</span>\n            ${it.company?`<span class=\"tag\" style=\"font-size:10px;background:var(--accent-soft);color:var(--accent);font-weight:600\">${esc(it.company)}</span>`:''}\n            ${S.role==='kanoa'?`<span class=\"cell-sub\" style=\"font-size:11px\">${esc(agency(it.ag)?agency(it.ag).name:it.ag)}</span>`:''}\n          </div>\n          <div class=\"cell-sub\" style=\"font-size:12px;line-height:1.7\">\n            ${it.kana?`<span style=\"margin-right:12px\">${esc(it.kana)}</span>`:''}\n            ${it.phone?`<span style=\"margin-right:12px\">📞 ${esc(it.phone)}</span>`:''}\n            ${it.email?`<span style=\"margin-right:12px\">✉ ${esc(it.email)}</span>`:''}\n            ${it.area?`<span style=\"margin-right:12px\">📍 ${esc(it.area)}</span>`:''}\n          </div>\n          ${it.note?`<div class=\"cell-sub\" style=\"font-size:11.5px;margin-top:4px;color:var(--soft)\">${esc(it.note)}</div>`:''}\n          ${(it.docs&&it.docs.length)?`<div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:7px\">${it.docs.map((d,di)=>`<button type=\"button\" data-act=\"intake-doc\" data-ik=\"${it.id}\" data-di=\"${di}\" style=\"display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:11px;cursor:pointer;color:var(--ink)\">📎 ${esc(d.kind==='rireki'?'履歴書':d.kind==='shoku'?'職務経歴書':d.name)}</button>`).join('')}</div>`:''}\n          <div class=\"cell-sub\" style=\"font-size:11px;margin-top:5px;color:var(--muted)\">受信: ${esc(it.created||'')}</div>\n        </div>\n        ${S.role==='agency'?`<div style=\"display:flex;flex-direction:column;gap:7px;min-width:180px\">\n          <select id=\"intake-pj-${it.id}\" style=\"padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:12px\">\n            <option value=\"\">案件を選択…</option>${projOpts}\n          </select>\n          <div style=\"display:flex;gap:7px\">\n            <button class=\"btn btn-primary btn-sm\" style=\"flex:1\" data-act=\"intake-approve\" data-id=\"${it.id}\">選考会へ送客</button>\n            <button class=\"btn btn-ghost btn-sm\" data-act=\"intake-reject\" data-id=\"${it.id}\">見送り</button>\n          </div>\n        </div>`:`<span class=\"cell-sub\" style=\"font-size:11px\">パートナーが選考中</span>`}\n      </div>\n    </div>`;\n  }).join('');\n  c.innerHTML=`<div class=\"content-narrow\">\n    <div class=\"meta-row\" style=\"margin-bottom:14px\"><span class=\"meta-count\">${items.length} 件の応募が届いています</span>\n      <span class=\"cell-sub\">選考会に進める方を選んで送客してください。見送った方は履歴に残りません。</span></div>\n    ${rows}\n  </div>`;\n}\n\n/* intakeに応募を追加（フォーム/CSVの取込口） */\nfunction addIntakeRows(objs, sourceType){\n  const ag = S.role==='agency' ? S.agencyId : (DB.agencies[0]?DB.agencies[0].id:'AG-01');\n  let n=0;\n  objs.forEach(o=>{\n    if(!o.name || !String(o.name).trim()) return;\n    DB.intake.unshift({\n      id:uid('IK'), ag, pj:o.pj||'', name:String(o.name).trim(),\n      kana:o.kana||'', phone:o.phone||'', email:o.email||'', address:o.address||'',\n      area:o.area||'', src:o.src||'', company:o.company||'', note:o.note||'', docs:[],\n      source_type:sourceType||'form', created:nowTS()\n    });\n    n++;\n  });\n  save(); updateNavCounts();\n  return n;\n}\n\n\n\n\n/* 受信箱へのCSV取込（既存のparseSpreadsheetFile/autoMapColumnsを再利用） */\nfunction openIntakeImport(){\n  showModal(`\n    <div class=\"modal-title\">CSVから受信箱に取り込む</div>\n    <div class=\"modal-sub\">スプレッドシートやCSVをアップロードすると、受信箱に一時保存されます。内容を確認してから送客できます。</div>\n    <div id=\"ikDrop\" style=\"border:2px dashed var(--line);border-radius:12px;padding:30px 18px;text-align:center;cursor:pointer;background:var(--gray-bg);margin-bottom:12px\">\n      <input type=\"file\" id=\"ikFile\" accept=\".csv,.xlsx,.xls,.tsv\" style=\"display:none\">\n      <svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.6\" style=\"margin-bottom:8px\"><path d=\"M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4\"/><polyline points=\"17 8 12 3 7 8\"/><line x1=\"12\" y1=\"3\" x2=\"12\" y2=\"15\"/></svg>\n      <div style=\"font-weight:600;font-size:13px\">ファイルをドラッグ＆ドロップ</div>\n      <div style=\"font-size:11.5px;color:var(--soft);margin-top:3px\">またはクリックして選択（.csv / .xlsx）</div>\n    </div>\n    <div id=\"ikErr\" style=\"color:var(--r);font-size:12.5px;min-height:16px\"></div>\n    <div class=\"modal-actions\"><button class=\"btn btn-ghost\" data-act=\"closemodal\">閉じる</button>\n      <button class=\"btn btn-ghost btn-sm\" data-act=\"bulk-template\">テンプレートDL</button></div>`);\n  setTimeout(()=>{\n    const dz=document.getElementById('ikDrop'), fi=document.getElementById('ikFile');\n    if(!dz||!fi) return;\n    dz.addEventListener('click', ()=>fi.click());\n    fi.addEventListener('change', e=>{ if(e.target.files[0]) ikHandleFile(e.target.files[0]); });\n    dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.style.borderColor='var(--accent)'; dz.style.background='var(--accent-soft)'; });\n    dz.addEventListener('dragleave', ()=>{ dz.style.borderColor='var(--line)'; dz.style.background='var(--gray-bg)'; });\n    dz.addEventListener('drop', e=>{ e.preventDefault(); if(e.dataTransfer.files[0]) ikHandleFile(e.dataTransfer.files[0]); });\n  }, 30);\n}\nasync function ikHandleFile(file){\n  const err=document.getElementById('ikErr');\n  try{\n    const {headers, rows}=await parseSpreadsheetFile(file);\n    if(!rows.length){ if(err) err.textContent='データが見つかりませんでした。'; return; }\n    const mapping=autoMapColumns(headers);\n    const objs=rowsToObjects(rows, mapping);\n    const n=addIntakeRows(objs, 'csv');\n    closeModal();\n    toast(`${n}件を受信箱に取り込みました。内容を確認して送客してください`);\n    if(S.view==='intake') render(); else go('intake');\n  }catch(e){ if(err) err.textContent=(e&&e.message)||'読み込みに失敗しました。'; }\n}\n\n/* Googleフォーム連携の案内 */\nfunction showIntakeFormInfo(){\n  showModal(`\n    <div class=\"modal-title\">Googleフォーム連携</div>\n    <div class=\"modal-sub\">応募フォームからの回答を、この受信箱に自動で流し込めます。</div>\n    <div style=\"font-size:13px;line-height:1.9;color:var(--ink)\">\n      <p style=\"margin:0 0 12px\">求職者や紹介元に <strong>Googleフォーム</strong> を配布し、回答を受信箱に集約する運用です。</p>\n      <ol style=\"margin:0 0 12px;padding-left:20px\">\n        <li>Googleフォームに「氏名・フリガナ・電話・メール・希望エリア」などの項目を用意</li>\n        <li>回答をスプレッドシートに集約（フォームの標準機能）</li>\n        <li>そのスプレッドシートをCSVで書き出し、上の「CSV取込」から取り込む</li>\n      </ol>\n      <div style=\"background:var(--gray-bg);border-radius:10px;padding:11px 13px;font-size:12px;color:var(--soft)\">\n        取り込まれた応募は、いったんこの受信箱に「一時保存」されます。<strong style=\"color:var(--ink)\">選考会に進める方だけ</strong>を選んで送客できるので、質を保ったまま管理できます。<br><br>\n        ※ フォーム→受信箱の完全自動連携（リアルタイム流し込み）も構築可能です。ご希望の場合はサーバー側の設定をご案内します。\n      </div>\n    </div>\n    <div class=\"modal-actions\"><button class=\"btn btn-primary\" data-act=\"closemodal\">わかりました</button></div>`);\n}\n\n/* ════════════════════ 二次パートナー向けフォーム（自動注入） ════════════════════ */\n/* ════════════════════════════════════════════════════════════\n   二次パートナー向け 応募フォーム（ログイン不要）\n   フローの入口：\n   1) 一次パートナーが「フォーム発行」→ ?form=<agencyId> のURLを配布\n   2) 二次パートナー/求職者がURLを開いてフォーム入力\n   3) 送信 → その一次パートナーの受信箱(intake)に入る\n   4) 一次パートナーが受信箱で確認 →「選考へ進める」で正式送客\n   ════════════════════════════════════════════════════════════ */\n\n/* 起動時：?form= があればフォーム画面を出す（招待リンクより先に判定される） */\nasync function handleFormUrl(agId, pjParam){\n  inviteScreen(`<div style=\"font-family:var(--display);font-weight:800;font-size:18px;margin-bottom:8px\">読み込み中…</div>\n    <div style=\"font-size:13px;color:var(--soft)\">応募フォームを準備しています。</div>`);\n  // パートナー名を取得（本番はSupabaseから直接。無ければIDのまま）\n  let name=agId;\n  // 公開された案件（URLの pj で指定された案件だけを表示。未指定なら案件選択なし）\n  const pjIds = (pjParam||'').split(',').map(x=>x.trim()).filter(Boolean);\n  let projList=[];\n  try{\n    if(!DEMO_MODE){\n      const sb=await SUPA.ensureClient();\n      const r=await sb.from('agencies').select('name').eq('id',agId).maybeSingle();\n      if(r&&r.data&&r.data.name) name=r.data.name;\n      if(pjIds.length){\n        const pr=await sb.from('projects').select('id,name').in('id',pjIds);\n        projList=(pr&&pr.data)||[];\n      }\n    } else {\n      const a=(DB.agencies||[]).find(x=>x.id===agId); if(a) name=a.name;\n      if(pjIds.length){ projList=(DB.projects||[]).filter(p=>pjIds.includes(p.id)).map(p=>({id:p.id,name:p.name})); }\n    }\n  }catch(e){}\n  renderIntakeForm(agId, name, projList);\n}\n\nfunction renderIntakeForm(agId, partnerName, projList){\n  const el=document.getElementById('app')||document.body;\n  el.style.display='block';\n  el.innerHTML=`<div style=\"min-height:100vh;background:var(--bg,#0b1220);padding:20px;display:flex;align-items:flex-start;justify-content:center\">\n    <div style=\"width:100%;max-width:460px;margin-top:24px\">\n      <div style=\"background:var(--surface,#fff);border-radius:18px;padding:30px 26px;box-shadow:0 20px 60px rgba(0,0,0,.18)\">\n        <div style=\"font-family:var(--display,'Inter');font-weight:800;font-size:19px;color:var(--ink,#1f3f63);margin-bottom:4px\">求職者ご紹介フォーム</div>\n        <div style=\"font-size:12.5px;color:var(--soft,#64748b);margin-bottom:20px\">${esc(partnerName)} 宛に、ご紹介する求職者の情報をご入力ください。</div>\n        <div id=\"ikfError\" style=\"color:#BE123C;font-size:12.5px;margin-bottom:10px;min-height:0\"></div>\n        <div style=\"display:flex;flex-direction:column;gap:13px\">\n          ${ikField('御社名（貴社名）', 'ikfCompany', 'text', '株式会社◯◯', true)}\n          ${(projList&&projList.length)?`<div>\n            <label style=\"display:block;font-size:12px;font-weight:600;color:var(--ink,#1f3f63);margin-bottom:5px\">紹介する案件 <span style=\"color:#BE123C\">*</span></label>\n            <select id=\"ikfProject\" style=\"width:100%;padding:10px 12px;border:1px solid var(--line,#e2e8f0);border-radius:9px;font-size:14px;box-sizing:border-box;background:#fff\">\n              <option value=\"\">案件を選択してください</option>\n              ${projList.map(p=>`<option value=\"${p.id}\">${esc((p.name||p.id).replace(' パートナー送客',''))}</option>`).join('')}\n            </select>\n          </div>`:''}\n          ${ikField('お名前', 'ikfName', 'text', '山田 太郎', true)}\n          ${ikField('フリガナ', 'ikfKana', 'text', 'ヤマダ タロウ', false)}\n          ${ikField('電話番号', 'ikfPhone', 'tel', '090-1234-5678', false)}\n          ${ikField('メールアドレス', 'ikfEmail', 'email', 'taro@example.com', false)}\n          ${ikField('希望エリア', 'ikfArea', 'text', '東京', false)}\n          <div>\n            <label style=\"display:block;font-size:12px;font-weight:600;color:var(--ink,#1f3f63);margin-bottom:5px\">履歴書・職務経歴書の添付</label>\n            <div id=\"ikfDropZone\" style=\"border:1.5px dashed var(--line,#e2e8f0);border-radius:10px;padding:16px;text-align:center;cursor:pointer;background:var(--gray-bg,#f8fafc)\">\n              <input id=\"ikfFiles\" type=\"file\" multiple accept=\".pdf,.doc,.docx,.jpg,.jpeg,.png\" style=\"display:none\">\n              <div style=\"font-size:12.5px;color:var(--soft,#64748b)\">ここにファイルをドラッグ、またはタップして選択</div>\n              <div style=\"font-size:11px;color:var(--muted,#94a3b8);margin-top:3px\">PDF・Word・画像（複数可）</div>\n            </div>\n            <div id=\"ikfFileList\" style=\"margin-top:8px;display:flex;flex-direction:column;gap:5px\"></div>\n          </div>\n          <div>\n            <label style=\"display:block;font-size:12px;font-weight:600;color:var(--ink,#1f3f63);margin-bottom:5px\">補足・備考</label>\n            <textarea id=\"ikfNote\" rows=\"3\" placeholder=\"経歴やアピールポイントなど（任意）\" style=\"width:100%;padding:10px 12px;border:1px solid var(--line,#e2e8f0);border-radius:9px;font-size:14px;box-sizing:border-box;resize:vertical;font-family:inherit\"></textarea>\n          </div>\n        </div>\n        <button id=\"ikfSubmit\" style=\"width:100%;margin-top:20px;padding:13px;border:none;border-radius:10px;background:var(--accent,#4f46e5);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer\">この内容で紹介する</button>\n        <div style=\"font-size:11px;color:var(--muted,#94a3b8);text-align:center;margin-top:12px;line-height:1.6\">送信された情報は ${esc(partnerName)} が確認し、選考に進めるか判断します。</div>\n      </div>\n    </div>\n  </div>`;\n  window._ikfFiles=[];  // 選択されたファイルの保持\n  setTimeout(()=>{\n    const btn=document.getElementById('ikfSubmit');\n    if(btn) btn.addEventListener('click', ()=>submitIntakeForm(agId, partnerName));\n    const dz=document.getElementById('ikfDropZone'), fi=document.getElementById('ikfFiles');\n    if(dz&&fi){\n      dz.addEventListener('click', ()=>fi.click());\n      fi.addEventListener('change', e=>ikfAddFiles(e.target.files));\n      dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.style.borderColor='var(--accent,#4f46e5)'; });\n      dz.addEventListener('dragleave', ()=>{ dz.style.borderColor='var(--line,#e2e8f0)'; });\n      dz.addEventListener('drop', e=>{ e.preventDefault(); dz.style.borderColor='var(--line,#e2e8f0)'; ikfAddFiles(e.dataTransfer.files); });\n    }\n  }, 30);\n}\nfunction ikfAddFiles(fileList){\n  const arr=Array.from(fileList||[]);\n  for(const f of arr){\n    if(f.size>10*1048576){ const el=document.getElementById('ikfError'); if(el) el.textContent=`${f.name} は10MBを超えています。`; continue; }\n    window._ikfFiles.push(f);\n  }\n  ikfRenderFileList();\n}\nfunction ikfRenderFileList(){\n  const box=document.getElementById('ikfFileList'); if(!box) return;\n  box.innerHTML=(window._ikfFiles||[]).map((f,idx)=>\n    `<div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;background:var(--surface,#fff);border:1px solid var(--line,#e2e8f0);border-radius:7px;font-size:12px\">\n      <span style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">📄 ${esc(f.name)}</span>\n      <button type=\"button\" data-ikf-rm=\"${idx}\" style=\"border:none;background:none;color:var(--muted,#94a3b8);cursor:pointer;font-size:15px;line-height:1\">×</button>\n    </div>`).join('');\n  box.querySelectorAll('[data-ikf-rm]').forEach(b=>b.addEventListener('click', e=>{\n    window._ikfFiles.splice(+e.target.dataset.ikfRm,1); ikfRenderFileList();\n  }));\n}\n\nfunction ikField(label, id, type, ph, required){\n  return `<div>\n    <label style=\"display:block;font-size:12px;font-weight:600;color:var(--ink,#1f3f63);margin-bottom:5px\">${esc(label)}${required?' <span style=\"color:#BE123C\">*</span>':''}</label>\n    <input id=\"${id}\" type=\"${type}\" placeholder=\"${esc(ph)}\" style=\"width:100%;padding:10px 12px;border:1px solid var(--line,#e2e8f0);border-radius:9px;font-size:14px;box-sizing:border-box\">\n  </div>`;\n}\n\nasync function submitIntakeForm(agId, partnerName){\n  const err=document.getElementById('ikfError');\n  const val=id=>{ const el=document.getElementById(id); return el?el.value.trim():''; };\n  const company=val('ikfCompany');\n  if(!company){ if(err) err.textContent='御社名は必須です。'; return; }   // 会社名を必須化\n  const name=val('ikfName');\n  if(!name){ if(err) err.textContent='お名前は必須です。'; return; }\n  const email=val('ikfEmail');\n  if(email && !/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(email)){ if(err) err.textContent='メールアドレスの形式をご確認ください。'; return; }\n  const btn=document.getElementById('ikfSubmit');\n  if(btn){ btn.disabled=true; btn.textContent='送信中…'; }\n  const ikId='IK-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);\n  const files=(window._ikfFiles||[]).slice();\n  const docs=[];\n  try{\n    // 添付ファイルを先にアップロード（intake IDに紐付けて保存）\n    if(files.length){\n      if(!DEMO_MODE){\n        const sb=await SUPA.ensureClient();\n        for(const f of files){\n          const did=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('D'+Math.random().toString(36).slice(2,9));\n          const ext=(/\\.[A-Za-z0-9]+$/.exec(f.name)||[''])[0];\n          const path=`intake/${ikId}/${did}${ext}`;\n          const up=await sb.storage.from('candidate-docs').upload(path, f, {contentType:f.type||'application/octet-stream', upsert:false});\n          if(up.error) throw up.error;\n          docs.push({ id:did, name:f.name, size:f.size, type:f.type, kind:inferFormDocKind(f.name), path, uploaded:nowTS() });\n        }\n      } else {\n        // デモ：ファイル名のみ記録\n        for(const f of files){ docs.push({ id:'D'+Math.random().toString(36).slice(2,9), name:f.name, size:f.size, type:f.type, kind:inferFormDocKind(f.name), path:'(demo)', uploaded:nowTS() }); }\n      }\n    }\n    const selPj=val('ikfProject')||null;\n    const rec={\n      id:ikId, agency_id:agId, project_id:selPj, name,\n      kana:val('ikfKana')||null, phone:val('ikfPhone')||null, email:email||null,\n      address:null, area:val('ikfArea')||null, source:company, company:company,\n      note:val('ikfNote')||null, docs:JSON.stringify(docs), source_type:'form'\n    };\n    if(!DEMO_MODE){\n      const sb=await SUPA.ensureClient();\n      const { error }=await sb.from('intake').insert(rec);\n      if(error) throw error;\n    } else {\n      DB.intake=DB.intake||[];\n      DB.intake.unshift({ id:ikId, ag:agId, pj:selPj||'', name, kana:rec.kana||'', phone:rec.phone||'', email:rec.email||'', address:'', area:rec.area||'', src:company, company, note:rec.note||'', docs, source_type:'form', created:nowTS() });\n      try{ persist(DB); }catch(e){}\n    }\n    window._ikfFiles=[];\n    intakeFormDone(partnerName);\n  }catch(e){\n    if(err) err.textContent='送信に失敗しました。ファイル形式やサイズをご確認のうえ、再度お試しください。';\n    if(btn){ btn.disabled=false; btn.textContent='この内容で紹介する'; }\n  }\n}\n/* フォーム添付の種別推定（履歴書/職務経歴書） */\nfunction inferFormDocKind(fname){\n  const n=(fname||'').toLowerCase();\n  if(/職務|経歴|shokumu|career|cv/.test(n)) return 'shoku';\n  if(/履歴|rireki|resume/.test(n)) return 'rireki';\n  return 'other';\n}\n\nfunction intakeFormDone(partnerName){\n  const el=document.getElementById('app')||document.body;\n  el.innerHTML=`<div style=\"min-height:100vh;background:var(--bg,#0b1220);padding:20px;display:flex;align-items:center;justify-content:center\">\n    <div style=\"width:100%;max-width:420px;background:var(--surface,#fff);border-radius:18px;padding:38px 30px;box-shadow:0 20px 60px rgba(0,0,0,.18);text-align:center\">\n      <div style=\"width:56px;height:56px;border-radius:50%;background:#E8F6EE;display:flex;align-items:center;justify-content:center;margin:0 auto 16px\">\n        <svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#15803D\" stroke-width=\"2.5\"><polyline points=\"20 6 9 17 4 12\"/></svg>\n      </div>\n      <div style=\"font-family:var(--display,'Inter');font-weight:800;font-size:18px;color:var(--ink,#1f3f63);margin-bottom:8px\">ご紹介ありがとうございます</div>\n      <div style=\"font-size:13px;color:var(--soft,#64748b);line-height:1.7\">${esc(partnerName)} に情報が届きました。<br>内容を確認のうえ、選考へ進めさせていただきます。</div>\n      <button onclick=\"location.reload()\" style=\"margin-top:22px;padding:11px 22px;border:1px solid var(--line,#e2e8f0);border-radius:9px;background:var(--surface,#fff);color:var(--ink,#1f3f63);font-weight:600;font-size:13px;cursor:pointer\">続けて別の方を紹介する</button>\n    </div>\n  </div>`;\n}\n\n/* パートナーがフォームURLを発行するモーダル */\nlet _formShareProjs = null;  // フォームに公開する案件（Set of pjId）。nullなら全公開\nfunction openFormShare(){\n  const agId=S.agencyId;\n  const projs = agencyProjects(agId);   // このパートナーに公開されている案件\n  // 初期は全案件を公開対象に\n  if(_formShareProjs===null) _formShareProjs = new Set(projs.map(p=>p.id));\n  renderFormShareModal();\n}\nfunction renderFormShareModal(){\n  const agId=S.agencyId;\n  const projs = agencyProjects(agId);\n  const sel = _formShareProjs || new Set();\n  const base=location.origin+location.pathname;\n  // 選択された案件をURLに含める（公開する案件だけをパートナーに見せる）\n  const chosen = projs.filter(p=>sel.has(p.id)).map(p=>p.id);\n  const pjParam = (chosen.length && chosen.length<projs.length) ? `&pj=${encodeURIComponent(chosen.join(','))}` : '';\n  const url=`${base}?form=${encodeURIComponent(agId)}${pjParam}`;\n  const projRows = projs.length ? projs.map(p=>{\n    const on=sel.has(p.id);\n    return `<label style=\"display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid ${on?'var(--accent)':'var(--line)'};border-radius:9px;cursor:pointer;background:${on?'var(--accent-soft)':'var(--surface)'};margin-bottom:6px\">\n      <input type=\"checkbox\" data-act=\"fshare-toggle\" data-pj=\"${p.id}\" ${on?'checked':''} style=\"width:16px;height:16px;cursor:pointer\">\n      <span style=\"font-size:13px;font-weight:${on?'600':'500'};color:${on?'var(--accent)':'var(--ink)'}\">${esc(shortPjName(p.id))}</span>\n    </label>`;\n  }).join('') : '<div class=\"cell-sub\" style=\"font-size:12px\">公開できる案件がありません（KANOAから案件が割り当てられると表示されます）</div>';\n  showModal(`\n    <div class=\"modal-title\">紹介フォームを発行</div>\n    <div class=\"modal-sub\">パートナーに見せる案件を選び、URLを共有してください。選んだ案件だけがフォームに表示されます。</div>\n    <div class=\"field full\">\n      <label>このパートナーに公開する案件（${sel.size}/${projs.length}）</label>\n      <div style=\"max-height:26vh;overflow-y:auto\">${projRows}</div>\n    </div>\n    <div class=\"field full\" style=\"margin-top:8px\">\n      <label>フォームURL</label>\n      <div style=\"display:flex;gap:8px\">\n        <input id=\"formUrlInput\" readonly value=\"${esc(url)}\" style=\"flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:12px;background:var(--gray-bg)\">\n        <button class=\"btn btn-primary btn-sm\" data-act=\"copy-form-url\">コピー</button>\n      </div>\n    </div>\n    <div class=\"panel\" style=\"padding:11px 13px;margin-top:10px;background:var(--gray-bg)\">\n      <div style=\"font-size:12px;color:var(--soft);line-height:1.8\">\n        <strong style=\"color:var(--ink)\">使い方</strong><br>\n        1. 公開する案件を選ぶ（チェックを外した案件は相手に見えません）<br>\n        2. URLをパートナーに配布<br>\n        3. 相手はフォームで「案件を選んで」求職者情報を送信<br>\n        4. あなたの「パートナー連携」に届き、確認して送客できます\n      </div>\n    </div>\n    <div class=\"modal-actions\"><button class=\"btn btn-primary\" data-act=\"closemodal\">閉じる</button></div>`);\n}\n\n\n\n/* パートナー連携の添付書類を開く（署名URL） */\nasync function openIntakeDoc(ikId, di){\n  const it=(DB.intake||[]).find(x=>x.id===ikId);\n  if(!it||!it.docs||!it.docs[di]) return;\n  const d=it.docs[di];\n  if(DEMO_MODE || !d.path || d.path==='(demo)'){ toast('デモモードではファイルの中身は保存されません'); return; }\n  try{\n    const url=await SUPA.docUrl(d.path);\n    if(url) window.open(url,'_blank');\n    else toast('ファイルを開けませんでした');\n  }catch(e){ toast('ファイルを開けませんでした'); }\n}\n\n\n/* ── 入金タイミングの計算 ──\n   売上（クライアント→KANOA/RECORE）入金日を起点に、\n   ライセンスありのパートナー = 1ヶ月後、なし = 2ヶ月後に支払う。 */\nfunction payoutDelayMonths(ag){\n  const a = (typeof ag==='object') ? ag : agency(ag);\n  return (a && a.license) ? 1 : 2;\n}\n// addMonths は既存の共通関数を使用（重複定義を削除）\n/* 請求（invoice）の入金日を起点にした、パートナーへの支払予定日 */\nfunction payoutDueDate(inv){\n  if(!inv) return '';\n  const base = inv.paidOn || inv.decidedOn || inv.issuedOn;   // 入金確定日を優先\n  if(!base) return '';\n  return addMonths(base, payoutDelayMonths(inv.agId));\n}\n\n/* ════════════════════ RECORE特別枠（自動注入） ════════════════════ */\n/* ════════════════════════════════════════════════════════════\n   株式会社RECORE 特別枠ダッシュボード\n   ・全パートナーの金額を閲覧できる（通常パートナーは自社のみ）\n   ・KANOAの売上を一度RECOREが受ける資金フローを可視化\n   ・入金タイミング（ライセンス有=1ヶ月/無=2ヶ月）を表示\n   ・各社の口座情報を表示\n   RECORE判定：agency.special==='recore'\n   ════════════════════════════════════════════════════════════ */\n\nfunction isRecore(){ return S.role==='agency' && agency(S.agencyId) && agency(S.agencyId).special==='recore'; }\n\nfunction viewRecore(){\n  ensureInvoices();\n  setHeader('RECORE 収支管理', 'クライアント→KANOA→RECORE→各社の資金フローを一元管理');\n  const c=document.getElementById('content');\n\n  const joined=DB.referrals.filter(r=>r.status==='joined');\n  const payoutOf=r=>refEarning(r)||0;\n  const feeOf=r=>{ const p=project(r.pj); return (p&&+p.clientFee)?+p.clientFee:0; };\n  const routeOf=r=>{ const a=agency(r.ag); return (a&&a.payRoute==='B')?'B':'A'; };\n\n  // ── 全体金額 ──\n  const recoreIn = joined.reduce((s,r)=>s+feeOf(r),0);        // KANOA→RECORE に入った総額（＝売上）\n  const totalPay = joined.reduce((s,r)=>s+payoutOf(r),0);      // 各パートナーへの支払総額\n  const toPartnerDirect = joined.filter(r=>routeOf(r)==='A').reduce((s,r)=>s+payoutOf(r),0);  // ルートA：RECORE→各社\n  const backToKanoa     = joined.filter(r=>routeOf(r)==='B').reduce((s,r)=>s+payoutOf(r),0);  // ルートB：RECORE→KANOA→各社\n  const recoreMargin = recoreIn - totalPay;                    // RECORE/KANOAの留保（差益）\n\n  // ── 月次推移（RECORE入金 vs 各社支払）──\n  const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-(5-i));return d.toISOString().slice(0,7);});\n  const inM=months.map(m=>joined.filter(r=>(r.joined||'').slice(0,7)===m).reduce((s,r)=>s+feeOf(r),0));\n  const payM=months.map(m=>joined.filter(r=>(r.joined||'').slice(0,7)===m).reduce((s,r)=>s+payoutOf(r),0));\n  const maxV=Math.max(1,...inM,...payM);\n  const chart=`<svg viewBox=\"0 0 560 210\" style=\"width:100%;height:auto\" role=\"img\">\n    <text x=\"30\" y=\"14\" font-size=\"10\" fill=\"var(--g)\">■ RECORE入金（KANOA→RECORE）</text>\n    <text x=\"290\" y=\"14\" font-size=\"10\" fill=\"var(--accent)\">■ 各社への支払</text>\n    ${months.map((m,i)=>{\n      const x=34+i*84; const hi=Math.round(inM[i]/maxV*135); const hp=Math.round(payM[i]/maxV*135);\n      return `<rect x=\"${x}\" y=\"${172-hi}\" width=\"26\" height=\"${Math.max(hi,1)}\" rx=\"4\" fill=\"var(--g)\"><title>${m} 入金 ${yen(inM[i])}</title></rect>\n        <rect x=\"${x+30}\" y=\"${172-hp}\" width=\"26\" height=\"${Math.max(hp,1)}\" rx=\"4\" fill=\"var(--accent)\"><title>${m} 支払 ${yen(payM[i])}</title></rect>\n        <text x=\"${x+28}\" y=\"190\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">${m.slice(5)}月</text>`;\n    }).join('')}\n  </svg>`;\n\n  // ── パートナー別の明細 ──\n  const rowsAg=DB.agencies.filter(a=>a.special!=='recore').map(a=>{\n    const js=joined.filter(r=>r.ag===a.id);\n    const pay=js.reduce((s,r)=>s+payoutOf(r),0);\n    const fee=js.reduce((s,r)=>s+feeOf(r),0);\n    const inv=DB.invoices.filter(v=>v.agId===a.id);\n    const latestPaid=inv.filter(v=>v.paidOn).sort((x,y)=>x.paidOn<y.paidOn?1:-1)[0];\n    const due = latestPaid ? payoutDueDate(latestPaid) : '';\n    const route = (a.payRoute==='B')?'B':'A';\n    return {a, n:js.length, pay, fee, due, route};\n  }).filter(x=>x.n>0).sort((x,y)=>y.pay-x.pay);\n\n  // ── KANOAに戻す明細（ルートBのみ）──\n  const backRows = rowsAg.filter(x=>x.route==='B');\n  const backTotal = backRows.reduce((s,x)=>s+x.pay,0);\n\n  c.innerHTML=`<div class=\"content-narrow\">\n    <div class=\"panel\" style=\"padding:12px 15px;margin-bottom:16px;background:linear-gradient(135deg,var(--accent-soft),transparent);border:1px solid var(--accent)\">\n      <div style=\"font-size:12.5px;color:var(--ink);line-height:1.8\">\n        <strong style=\"font-weight:700\">資金フロー（パートナーごとにルートが決まっています）</strong><br>\n        <span style=\"color:var(--g);font-weight:600\">ルートA：</span>クライアント → KANOA → <strong style=\"color:var(--accent)\">RECORE</strong> → 各パートナー（直接支払）<br>\n        <span style=\"color:var(--b);font-weight:600\">ルートB：</span>クライアント → KANOA → <strong style=\"color:var(--accent)\">RECORE</strong> → <strong>KANOA</strong> → 各パートナー（一度KANOAに戻す）<br>\n        <span style=\"font-size:11.5px;color:var(--soft)\">支払時期：ライセンスありは入金の1ヶ月後、なしは2ヶ月後。</span>\n      </div>\n    </div>\n    <div class=\"kpi-grid\">\n      ${kpi('RECOREに入った金額','<span class=\"yen\">¥</span>'+recoreIn.toLocaleString('ja-JP'),'var(--g)')}\n      ${kpi('RECORE→各社（ルートA）','<span class=\"yen\">¥</span>'+toPartnerDirect.toLocaleString('ja-JP'),'var(--accent)')}\n      ${kpi('RECORE→KANOAに戻す（ルートB）','<span class=\"yen\">¥</span>'+backToKanoa.toLocaleString('ja-JP'),'var(--b)')}\n      ${kpi('差益（留保）','<span class=\"yen\">¥</span>'+recoreMargin.toLocaleString('ja-JP'), recoreMargin>=0?'var(--g)':'var(--r)')}\n    </div>\n    <div class=\"sect\"><div class=\"sect-head\"><div class=\"sect-title\">月次推移（RECORE入金 vs 各社支払）</div></div>\n      <div class=\"panel\" style=\"padding:14px 16px 8px\">${chart}</div></div>\n\n    <div class=\"sect\"><div class=\"sect-head\"><div class=\"sect-title\">KANOAに戻す金額（ルートB）</div></div>\n      <div class=\"panel tbl-wrap\"><table class=\"tbl\"><thead><tr>\n        <th>パートナー</th><th class=\"num\">戻す金額</th><th>戻す予定日</th>\n      </tr></thead><tbody>\n      ${backRows.length?backRows.map(x=>`<tr>\n        <td class=\"cell-strong\">${esc(x.a.name)}</td>\n        <td class=\"num cell-strong\" style=\"color:var(--b)\">${yen(x.pay)}</td>\n        <td>${x.due?`<span style=\"font-size:12px\">${esc(x.due)}</span>`:'<span class=\"cell-sub\">—</span>'}</td>\n      </tr>`).join('')+`<tr><td class=\"cell-strong\" style=\"background:var(--gray-bg)\">合計</td><td class=\"num cell-strong\" style=\"background:var(--gray-bg);color:var(--b)\">${yen(backTotal)}</td><td style=\"background:var(--gray-bg)\"></td></tr>`:'<tr><td colspan=\"3\"><span class=\"cell-sub\">ルートB（KANOAに戻す）のパートナーはいません</span></td></tr>'}\n      </tbody></table></div></div>\n\n    <div class=\"sect\"><div class=\"sect-head\"><div class=\"sect-title\">パートナー別の支払管理（全社）</div></div>\n      <div class=\"panel tbl-wrap\"><table class=\"tbl\"><thead><tr>\n        <th>パートナー</th><th>ルート</th><th>ライセンス</th><th class=\"num\">入社</th><th class=\"num\">支払額</th>\n        <th>支払予定日</th><th>口座情報</th>\n      </tr></thead><tbody>\n      ${rowsAg.length?rowsAg.map(x=>`<tr>\n        <td class=\"cell-strong\">${esc(x.a.name)}</td>\n        <td>${x.route==='B'?'<span class=\"tag\" style=\"font-size:10px;background:#EAF0FB;color:#1D4ED8;font-weight:600\">B：KANOA経由</span>':'<span class=\"tag\" style=\"font-size:10px;background:#E8F6EE;color:#15803D;font-weight:600\">A：直接</span>'}</td>\n        <td>${x.a.license?'<span class=\"tag\" style=\"font-size:10px;background:#E8F6EE;color:#15803D;font-weight:600\">あり（1ヶ月）</span>':'<span class=\"tag\" style=\"font-size:10px;background:var(--gray-bg);color:var(--soft)\">なし（2ヶ月）</span>'}</td>\n        <td class=\"num\">${x.n}</td>\n        <td class=\"num cell-strong\">${yen(x.pay)}</td>\n        <td>${x.due?`<span style=\"font-size:12px\">${esc(x.due)}</span>`:'<span class=\"cell-sub\">—</span>'}</td>\n        <td>${x.a.bank?`<span style=\"font-size:11.5px;color:var(--soft)\">${esc(x.a.bank)}</span>`:'<span class=\"cell-sub\" style=\"font-size:11px\">未登録</span>'}</td>\n      </tr>`).join(''):'<tr><td colspan=\"7\"><span class=\"cell-sub\">支払実績のあるパートナーがまだいません</span></td></tr>'}\n      </tbody></table></div></div>\n  </div>`;\n}\n\n\n/* ════════════════════ 二次パートナー管理（自動注入） ════════════════════ */\n/* ════════════════════════════════════════════════════════════\n   二次パートナー管理（各パートナーが自分のパートナーを管理）\n   ・二次パートナーがフォームから送客すると、その会社名で自動的にリスト化される\n   ・二次パートナーごとに、送客人数・ステータス内訳・候補者一覧が見える\n   ・チャット/金額はなし。シンプルにリストとステータスのみ\n   データ源：referral.src / intake.company（＝入力された会社名）\n   ════════════════════════════════════════════════════════════ */\n\n/* 自社(ag)に紐づく二次パートナーを、会社名でグルーピングして返す */\nfunction subPartnersOf(ag){\n  const map = new Map();  // 会社名 -> { name, refs:[], pending:[] }\n  const norm = s => (s||'').trim();\n  // 正式送客済み（referrals、src＝二次パートナー名）\n  DB.referrals.filter(r=>r.ag===ag && norm(r.src)).forEach(r=>{\n    const key = norm(r.src);\n    if(!map.has(key)) map.set(key, {name:key, refs:[], pending:[]});\n    map.get(key).refs.push(r);\n  });\n  // 未承認（intake、company＝二次パートナー名）\n  (DB.intake||[]).filter(x=>x.ag===ag && norm(x.company)).forEach(x=>{\n    const key = norm(x.company);\n    if(!map.has(key)) map.set(key, {name:key, refs:[], pending:[]});\n    map.get(key).pending.push(x);\n  });\n  // 配列化＋集計\n  return Array.from(map.values()).map(sp=>{\n    const joined = sp.refs.filter(r=>r.status==='joined').length;\n    const active = sp.refs.filter(r=>r.status!=='rejected'&&r.status!=='declined').length;\n    // 書類不足の候補者数（選考中で、必要書類が揃っていない人）\n    const needDocs = sp.refs.filter(r=>{\n      if(r.status==='rejected'||r.status==='declined') return false;\n      if(typeof missingDocsForStage!=='function') return false;\n      const m=[...missingDocsForStage(r,'interview'), ...(r.status==='offer'?missingDocsForStage(r,'offer'):[])];\n      return m.length>0;\n    }).length;\n    return {...sp, total:sp.refs.length, pending:sp.pending, pendingCount:sp.pending.length, joined, active, needDocs};\n  }).sort((a,b)=> (b.needDocs-a.needDocs) || (b.total+b.pendingCount)-(a.total+a.pendingCount));\n}\n\n/* KANOA視点：全パートナーの下の二次パートナーを俯瞰 */\nfunction allSubPartners(){\n  const out=[];\n  DB.agencies.filter(a=>a.special!=='recore').forEach(a=>{\n    subPartnersOf(a.id).forEach(sp=>out.push({...sp, parent:a}));\n  });\n  return out;\n}\n\nlet _openSubPartner = null;  // 展開中の二次パートナー名\n\nconst statusMini = r => `<span class=\"badge bd-${STATUS[r.status].cls}\" style=\"font-size:10px\">${STATUS[r.status].label}</span>`;\nfunction subPartnerCard(sp, isK){\n\n    const key = (isK?sp.parent.id+'::':'')+sp.name;\n    const open = _openSubPartner===key;\n    // ステータス内訳のミニ集計\n    const counts = {};\n    sp.refs.forEach(r=>{ counts[r.status]=(counts[r.status]||0)+1; });\n    const breakdown = Object.keys(STATUS).filter(s=>counts[s]).map(s=>\n      `<span class=\"tag\" style=\"font-size:10px;background:var(--gray-bg);color:var(--soft)\">${STATUS[s].label} ${counts[s]}</span>`\n    ).join(' ');\n\n    return `<div class=\"panel\" style=\"margin-bottom:10px;overflow:hidden\">\n      <div style=\"display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer\" data-act=\"toggle-subpartner\" data-key=\"${esc(key)}\">\n        <div style=\"width:36px;height:36px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px\">${esc(sp.name.slice(0,1))}</div>\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n            <strong style=\"font-weight:700;font-size:14px\">${esc(sp.name)}</strong>\n            ${isK?`<span class=\"cell-sub\" style=\"font-size:11px\">← ${esc(sp.parent.name)}</span>`:''}\n            ${sp.pendingCount?`<span class=\"tag\" style=\"font-size:10px;background:#FDF2E2;color:#B45309;font-weight:600\">未確認 ${sp.pendingCount}</span>`:''}\n            ${(!isK&&sp.needDocs)?`<span class=\"tag\" style=\"font-size:10px;background:#FDEEF1;color:#BE123C;font-weight:600\">書類不足 ${sp.needDocs}</span>`:''}\n          </div>\n          <div style=\"margin-top:4px\">${breakdown||'<span class=\"cell-sub\" style=\"font-size:11px\">送客実績なし</span>'}</div>\n        </div>\n        <div style=\"text-align:right\">\n          <div style=\"font-weight:700;font-size:16px\">${sp.total}<span class=\"cell-sub\" style=\"font-size:11px;font-weight:400\">名</span></div>\n          <div class=\"cell-sub\" style=\"font-size:10.5px\">入社 ${sp.joined}</div>\n          ${!isK?`<button class=\"btn btn-ghost btn-sm\" style=\"padding:2px 8px;font-size:10.5px;margin-top:4px\" data-act=\"issue-subacc\" data-company=\"${esc(sp.name)}\">${subAccountFor(S.agencyId, sp.name)?'ログイン情報':'アカウント発行'}</button>`:''}\n        </div>\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"2\" style=\"transform:rotate(${open?'90':'0'}deg);transition:transform .15s\"><path d=\"M9 18l6-6-6-6\"/></svg>\n      </div>\n      ${open?`<div style=\"border-top:1px solid var(--line);padding:6px 16px 12px\">\n        ${sp.pendingCount?`<div style=\"margin:8px 0 4px;font-size:11.5px;color:#B45309;font-weight:600\">未確認（パートナー連携で確認してください）</div>\n          ${sp.pending.map(x=>`<div style=\"display:flex;justify-content:space-between;padding:6px 0;font-size:12.5px;border-bottom:1px solid var(--line)\"><span>${esc(x.name)}</span><span class=\"cell-sub\" style=\"font-size:11px\">${esc(x.created||'')}</span></div>`).join('')}`:''}\n        ${sp.refs.length?`<div style=\"margin:8px 0 4px;font-size:11.5px;color:var(--soft);font-weight:600\">送客済み候補者</div>\n          <table class=\"tbl\" style=\"font-size:12.5px\">${!isK?'<thead><tr><th>氏名</th><th>案件</th><th style=\"text-align:center\">状況</th><th>書類</th><th></th></tr></thead>':''}<tbody>\n          ${sp.refs.map(r=>{\n            // 書類の不足を判定（選考会・内定に必要な書類）\n            const missIv = (typeof missingDocsForStage==='function') ? missingDocsForStage(r,'interview') : [];\n            const missOf = (typeof missingDocsForStage==='function' && r.status==='offer') ? missingDocsForStage(r,'offer') : [];\n            const miss = [...new Set([...missIv, ...missOf])];\n            const docCell = !isK ? (\n              (r.status==='rejected'||r.status==='declined') ? '<span class=\"cell-sub\" style=\"font-size:11px\">—</span>'\n              : miss.length ? `<span style=\"display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#BE123C;font-weight:600\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"/><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"/></svg>${miss.join('・')}</span>`\n              : `<span style=\"display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#15803D\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><polyline points=\"20 6 9 17 4 12\"/></svg>書類OK</span>`\n            ) : '';\n            return `<tr>\n            <td class=\"cell-strong\">${esc(r.name)}</td>\n            <td><span class=\"tag\" style=\"font-size:10px\">${esc(shortPjName?shortPjName(r.pj):(project(r.pj)?project(r.pj).name:r.pj))}</span></td>\n            <td style=\"text-align:center\">${statusMini(r)}</td>\n            ${!isK?`<td style=\"text-align:left\">${docCell}</td>`:''}\n            ${!isK?`<td style=\"text-align:right;width:130px;white-space:nowrap\">${miss.length&&r.status!=='rejected'&&r.status!=='declined'?`<button class=\"btn btn-primary btn-sm\" style=\"padding:3px 9px;font-size:11px;margin-right:5px\" data-act=\"open-ref\" data-id=\"${r.id}\">書類を出す</button>`:''}<button class=\"btn btn-ghost btn-sm\" style=\"padding:3px 9px;font-size:11px\" data-act=\"open-ref\" data-id=\"${r.id}\">詳細</button></td>`:''}\n          </tr>`;}).join('')}\n          </tbody></table>`:''}\n      </div>`:''}\n    </div>`;\n  \n}\n\nfunction viewSubPartners(){\n  const isK = S.role==='kanoa';\n  setHeader(isK?'二次パートナー':'パートナー', isK?'一次パートナーの下にいる二次パートナーと送客状況を一覧で確認できます':'代理店パートナーごとに、紹介された方の進捗・書類の不足・提出を管理できます',\n    isK?'':'<button class=\"btn btn-primary btn-sm\" data-act=\"form-share\">紹介フォームを発行</button>');\n  const c=document.getElementById('content');\n\n  const list = isK ? allSubPartners() : subPartnersOf(S.agencyId);\n  if(!list.length){\n    c.innerHTML=`<div class=\"content-narrow\"><div class=\"empty-state\" style=\"text-align:center;padding:60px 20px\">\n      <svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--line-2)\" stroke-width=\"1.5\" style=\"margin-bottom:14px\"><path d=\"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 00-3-3.87\"/><path d=\"M16 3.13a4 4 0 010 7.75\"/></svg>\n      <div style=\"font-weight:600;font-size:15px;margin-bottom:6px\">パートナーはまだいません</div>\n      <div class=\"cell-sub\">${isK?'各パートナーが自分のパートナーから送客を受けると、ここに紐づいて表示されます。':'「紹介フォームを発行」でパートナーにURLを配り、送客を受けると自動でここに登録されます。'}</div>\n    </div></div>`;\n    return;\n  }\n\n\n  const cards = list.map(sp=>subPartnerCard(sp, isK)).join('');\n\n  const totalSub = list.length;\n  const totalRefs = list.reduce((s,x)=>s+x.total,0);\n  const totalPending = list.reduce((s,x)=>s+x.pendingCount,0);\n\n  // KANOA側は「一次パートナーごと」にグループ化して階層を分かりやすく表示\n  let bodyHtml = cards;\n  if(isK){\n    const groups = new Map();  // 一次パートナーid -> {parent, subs:[]}\n    list.forEach(sp=>{\n      const pid = sp.parent.id;\n      if(!groups.has(pid)) groups.set(pid, {parent:sp.parent, subs:[]});\n      groups.get(pid).subs.push(sp);\n    });\n    bodyHtml = Array.from(groups.values()).sort((a,b)=>b.subs.length-a.subs.length).map(g=>{\n      const gRefs = g.subs.reduce((s,x)=>s+x.total,0);\n      const gPending = g.subs.reduce((s,x)=>s+x.pendingCount,0);\n      const subCards = g.subs.map(sp=>subPartnerCard(sp, true)).join('');\n      return `<div style=\"margin-bottom:22px\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--line)\">\n          <div style=\"width:32px;height:32px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px\">${esc(g.parent.name.slice(0,1))}</div>\n          <div style=\"flex:1\">\n            <div style=\"font-weight:700;font-size:14.5px;color:var(--ink)\">${esc(g.parent.name)}<span class=\"cell-sub\" style=\"font-size:11px;font-weight:400;margin-left:8px\">一次パートナー</span></div>\n          </div>\n          <div style=\"text-align:right\">\n            <div style=\"font-size:12px;color:var(--soft)\">二次 <b style=\"color:var(--ink)\">${g.subs.length}</b>社 ・ 送客 <b style=\"color:var(--ink)\">${gRefs}</b>名${gPending?` ・ <span style=\"color:#B45309\">未確認 ${gPending}</span>`:''}</div>\n          </div>\n        </div>\n        ${subCards}\n      </div>`;\n    }).join('') || '<div class=\"cell-sub\" style=\"text-align:center;padding:30px\">二次パートナーはまだいません</div>';\n  }\n\n  c.innerHTML=`<div class=\"content-narrow\">\n    <div class=\"kpi-grid\" style=\"margin-bottom:16px\">\n      ${kpi(isK?'二次パートナー':'パートナー', totalSub+'<span class=\"unit\">社</span>','var(--accent)')}\n      ${kpi('送客（累計）', totalRefs+'<span class=\"unit\">名</span>','var(--b)')}\n      ${kpi('未確認', totalPending+'<span class=\"unit\">名</span>', totalPending?'var(--a)':'var(--muted)')}\n    </div>\n    ${bodyHtml}\n  </div>`;\n}\n\n\n/* ════════════════════ 二次パートナーアカウント（自動注入） ════════════════════ */\n/* ════════════════════════════════════════════════════════════\n   二次パートナー アカウント（一次パートナーが発行・二次がログイン）\n   ・一次パートナーが二次パートナーにID/パスを発行\n   ・二次パートナーはログインして「自分が紹介した人」だけ見られる\n   ・見えるもの：リスト・ステータス・書類の不足/提出・書類アップロード\n   ・見えないもの：売上/金額、他社の情報、チャット\n   ロール：S.role==='sub'、S.parentAg（親一次パートナー）、S.subCompany（自社名）\n   保存：DB.subaccounts = [{id, ag, company, email, pw, created}]\n   ════════════════════════════════════════════════════════════ */\n\n/* 二次パートナーのアカウントを取得（親ag×会社名） */\nfunction subAccountFor(ag, company){\n  return (DB.subaccounts||[]).find(x=>x.ag===ag && x.company===company);\n}\n\n/* アカウント発行（一次パートナーが実行） */\nfunction issueSubAccount(company){\n  const ag = S.agencyId;\n  const norm = (company||'').trim();\n  if(!norm){ toast('会社名がありません'); return; }\n  let acc = subAccountFor(ag, norm);\n  if(acc){ modalSubAccount(acc); return; }  // 既存があれば表示\n  // メールは会社名ベースの仮ID（後で編集可）、パスワードは自動生成\n  const pw = (typeof genPw==='function') ? genPw() : ('sub'+Math.random().toString(36).slice(2,8));\n  acc = {\n    id: 'SUB-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),\n    ag, company:norm,\n    email: '', pw,\n    created: (typeof nowTS==='function'?nowTS():new Date().toISOString().slice(0,16))\n  };\n  DB.subaccounts = DB.subaccounts||[];\n  DB.subaccounts.push(acc);\n  if(typeof save==='function') save();\n  modalSubAccount(acc);\n}\n\n/* 発行済みアカウントのID/パス共有モーダル */\nfunction modalSubAccount(acc){\n  const base = location.origin+location.pathname;\n  showModal(`\n    <div class=\"modal-title\">パートナー用ログインを発行しました</div>\n    <div class=\"modal-sub\">${esc(acc.company)} に以下を共有してください。ログインすると、紹介した方の進捗・書類状況を確認できます（売上は表示されません）。</div>\n    <div class=\"info-card\" style=\"margin-bottom:14px\">\n      <div class=\"info-row\"><span class=\"info-label\">ログインURL</span><span class=\"info-val mono\" style=\"font-size:11.5px\">${esc(base)}</span><button class=\"copy-btn\" data-act=\"copy\" data-v=\"${esc(base)}\">コピー</button></div>\n      <div class=\"info-row\"><span class=\"info-label\">ログインID</span><span class=\"info-val mono\">${esc(acc.email||acc.id)}</span><button class=\"copy-btn\" data-act=\"copy\" data-v=\"${esc(acc.email||acc.id)}\">コピー</button></div>\n      <div class=\"info-row\"><span class=\"info-label\">パスワード</span><span class=\"info-val mono\">${esc(acc.pw)}</span><button class=\"copy-btn\" data-act=\"copy\" data-v=\"${esc(acc.pw)}\">コピー</button></div>\n    </div>\n    <div class=\"field full\">\n      <label>ログインID（メール等・任意で変更可）</label>\n      <input id=\"subAccEmail\" value=\"${esc(acc.email||'')}\" placeholder=\"例：partner@example.com（未設定ならID使用）\">\n    </div>\n    <div class=\"modal-actions\">\n      <button class=\"btn btn-ghost\" data-act=\"closemodal\">閉じる</button>\n      <button class=\"btn btn-primary\" data-act=\"save-subacc-email\" data-id=\"${acc.id}\">保存</button>\n    </div>`);\n}\n\n/* 二次パートナーのログイン照合（ID/メール＋パスワード） */\nfunction resolveSubAccount(loginId){\n  const v=(loginId||'').trim().toLowerCase();\n  if(!v) return null;\n  return (DB.subaccounts||[]).find(x=>\n    (x.email||'').toLowerCase()===v || (x.id||'').toLowerCase()===v\n  );\n}\n\n/* 二次パートナー視点：自分が紹介した候補者だけ */\nfunction subReferrals(){\n  return DB.referrals.filter(r=>r.ag===S.parentAg && (r.src||'').trim()===S.subCompany);\n}\n\n/* ───────── 二次パートナー専用ビュー ───────── */\nfunction viewSubHome(){\n  setHeader('紹介した方の状況', `${S.subCompany} さまの送客状況・書類の確認`);\n  const c=document.getElementById('content');\n  const rows = subReferrals();\n  const active = rows.filter(r=>r.status!=='rejected'&&r.status!=='declined');\n  const joined = rows.filter(r=>r.status==='joined').length;\n  // 書類不足のカウント\n  const needDocs = active.filter(r=>{\n    if(typeof missingDocsForStage!=='function') return false;\n    const m=[...missingDocsForStage(r,'interview'), ...(r.status==='offer'?missingDocsForStage(r,'offer'):[])];\n    return m.length>0;\n  });\n\n  const statusMiniLocal = r => `<span class=\"badge bd-${STATUS[r.status].cls}\">${STATUS[r.status].label}</span>`;\n\n  const rowsHtml = rows.length ? rows.map(r=>{\n    const miss = (typeof missingDocsForStage==='function' && r.status!=='rejected' && r.status!=='declined')\n      ? [...new Set([...missingDocsForStage(r,'interview'), ...(r.status==='offer'?missingDocsForStage(r,'offer'):[])])] : [];\n    const docCell = (r.status==='rejected'||r.status==='declined') ? '<span class=\"cell-sub\">—</span>'\n      : miss.length ? `<span style=\"display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#BE123C;font-weight:600\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"/><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"/></svg>${miss.join('・')}</span>`\n      : `<span style=\"display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#15803D\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><polyline points=\"20 6 9 17 4 12\"/></svg>提出済み</span>`;\n    return `<tr>\n      <td class=\"cell-strong\">${esc(r.name)}</td>\n      <td><span class=\"tag\" style=\"font-size:10px\">${esc(shortPjName?shortPjName(r.pj):(project(r.pj)?project(r.pj).name:r.pj))}</span></td>\n      <td style=\"text-align:center\">${statusMiniLocal(r)}</td>\n      <td>${docCell}</td>\n      <td style=\"text-align:right;white-space:nowrap\">${miss.length&&r.status!=='rejected'&&r.status!=='declined'?`<button class=\"btn btn-primary btn-sm\" style=\"padding:3px 9px;font-size:11px;margin-right:5px\" data-act=\"open-ref\" data-id=\"${r.id}\">書類を出す</button>`:''}<button class=\"btn btn-ghost btn-sm\" style=\"padding:3px 9px;font-size:11px\" data-act=\"open-ref\" data-id=\"${r.id}\">詳細</button></td>\n    </tr>`;\n  }).join('') : '<tr><td colspan=\"5\"><span class=\"cell-sub\">まだ紹介した方がいません。フォームから送客するとここに表示されます。</span></td></tr>';\n\n  c.innerHTML=`<div class=\"content-narrow\">\n    <div class=\"kpi-grid\" style=\"margin-bottom:16px\">\n      ${kpi('紹介した方', rows.length+'<span class=\"unit\">名</span>','var(--accent)')}\n      ${kpi('選考中', active.length+'<span class=\"unit\">名</span>','var(--b)')}\n      ${kpi('入社', joined+'<span class=\"unit\">名</span>','var(--g)')}\n      ${kpi('書類不足', needDocs.length+'<span class=\"unit\">名</span>', needDocs.length?'var(--r)':'var(--muted)')}\n    </div>\n    ${needDocs.length?`<div class=\"panel\" style=\"padding:11px 14px;margin-bottom:14px;background:#FDEEF1;border:1px solid #F5C2CE\">\n      <div style=\"font-size:12.5px;color:#BE123C;font-weight:600;margin-bottom:2px\">書類の提出をお願いします（${needDocs.length}名）</div>\n      <div style=\"font-size:11.5px;color:#9F1239\">下の一覧で「書類を出す」から提出できます。書類が揃うと選考がスムーズに進みます。</div>\n    </div>`:''}\n    <div class=\"sect\"><div class=\"sect-head\"><div class=\"sect-title\">紹介した方の一覧</div></div>\n      <div class=\"panel tbl-wrap\"><table class=\"tbl\"><thead><tr>\n        <th>お名前</th><th>案件</th><th style=\"text-align:center\">選考状況</th><th>書類</th><th></th>\n      </tr></thead><tbody>${rowsHtml}</tbody></table></div></div>\n  </div>`;\n}\n\n\n/* ════════════════════ KANOA側RECORE残高（自動注入） ════════════════════ */\n/* ════════════════════════════════════════════════════════════\n   KANOA管理側：RECORE残高ビュー\n   ・KANOAがRECOREにいくら入れているか\n   ・RECORE→各社への支払（ルートA）\n   ・RECORE→KANOAに戻ってくる金額と日付（ルートB）\n   ════════════════════════════════════════════════════════════ */\nfunction viewKanoaRecore(){\n  ensureInvoices();\n  setHeader('RECORE 残高・資金管理', 'RECOREに入れた金額と、各社への支払・KANOAへの戻りを把握');\n  const c=document.getElementById('content');\n\n  const joined=DB.referrals.filter(r=>r.status==='joined');\n  const payoutOf=r=>refEarning(r)||0;\n  const feeOf=r=>{ const p=project(r.pj); return (p&&+p.clientFee)?+p.clientFee:0; };\n  const routeOf=r=>{ const a=agency(r.ag); return (a&&a.payRoute==='B')?'B':'A'; };\n\n  const putInRecore = joined.reduce((s,r)=>s+feeOf(r),0);           // KANOA→RECORE\n  const paidToPartners = joined.reduce((s,r)=>s+payoutOf(r),0);      // RECORE→各社（総額）\n  const routeA = joined.filter(r=>routeOf(r)==='A').reduce((s,r)=>s+payoutOf(r),0);  // 直接\n  const routeB = joined.filter(r=>routeOf(r)==='B').reduce((s,r)=>s+payoutOf(r),0);  // KANOAに戻る\n  const balance = putInRecore - paidToPartners;                     // RECORE内に残っている想定額\n\n  // ── KANOAに戻ってくる明細（ルートB）──\n  const backRows = DB.agencies.filter(a=>a.special!=='recore' && a.payRoute==='B').map(a=>{\n    const js=joined.filter(r=>r.ag===a.id);\n    const pay=js.reduce((s,r)=>s+payoutOf(r),0);\n    const inv=DB.invoices.filter(v=>v.agId===a.id);\n    const latestPaid=inv.filter(v=>v.paidOn).sort((x,y)=>x.paidOn<y.paidOn?1:-1)[0];\n    const due=latestPaid?payoutDueDate(latestPaid):'';\n    return {a, n:js.length, pay, due};\n  }).filter(x=>x.n>0).sort((x,y)=>y.pay-x.pay);\n  const backTotal = backRows.reduce((s,x)=>s+x.pay,0);\n\n  // ── 月次：RECOREに入れた額 ──\n  const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-(5-i));return d.toISOString().slice(0,7);});\n  const inM=months.map(m=>joined.filter(r=>(r.joined||'').slice(0,7)===m).reduce((s,r)=>s+feeOf(r),0));\n  const maxV=Math.max(1,...inM);\n  const chart=`<svg viewBox=\"0 0 560 205\" style=\"width:100%;height:auto\" role=\"img\">\n    <text x=\"30\" y=\"14\" font-size=\"10\" fill=\"var(--accent)\">■ RECOREに入れた金額（月次）</text>\n    ${months.map((m,i)=>{\n      const x=44+i*80; const h=Math.round(inM[i]/maxV*135);\n      return `<rect x=\"${x}\" y=\"${168-h}\" width=\"40\" height=\"${Math.max(h,1)}\" rx=\"5\" fill=\"var(--accent)\"><title>${m} ${yen(inM[i])}</title></rect>\n        <text x=\"${x+20}\" y=\"${162-h}\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--soft)\">${inM[i]?('¥'+(inM[i]/10000).toFixed(inM[i]>=100000?0:1)+'万'):''}</text>\n        <text x=\"${x+20}\" y=\"186\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">${m.slice(5)}月</text>`;\n    }).join('')}\n  </svg>`;\n\n  c.innerHTML=`<div class=\"content-narrow\">\n    <div class=\"panel\" style=\"padding:12px 15px;margin-bottom:16px;background:var(--gray-bg)\">\n      <div style=\"font-size:12.5px;color:var(--ink);line-height:1.8\">\n        <strong style=\"font-weight:700\">RECOREとの資金の流れ</strong><br>\n        KANOAはクライアントから受け取った売上を、一度 <strong style=\"color:var(--accent)\">RECORE</strong> に入れます。<br>\n        <span style=\"color:var(--g);font-weight:600\">ルートA：</span>RECOREが各パートナーに直接支払う<br>\n        <span style=\"color:var(--b);font-weight:600\">ルートB：</span>RECOREからKANOAに戻し、KANOAが各パートナーに支払う\n      </div>\n    </div>\n    <div class=\"kpi-grid\">\n      ${kpi('RECOREに入れた金額','<span class=\"yen\">¥</span>'+putInRecore.toLocaleString('ja-JP'),'var(--accent)')}\n      ${kpi('RECORE→各社（ルートA）','<span class=\"yen\">¥</span>'+routeA.toLocaleString('ja-JP'),'var(--g)')}\n      ${kpi('KANOAに戻る（ルートB）','<span class=\"yen\">¥</span>'+routeB.toLocaleString('ja-JP'),'var(--b)')}\n      ${kpi('RECORE残高（想定）','<span class=\"yen\">¥</span>'+balance.toLocaleString('ja-JP'), balance>=0?'var(--g)':'var(--r)')}\n    </div>\n    <div class=\"sect\"><div class=\"sect-head\"><div class=\"sect-title\">RECOREに入れた金額（直近6ヶ月）</div></div>\n      <div class=\"panel\" style=\"padding:14px 16px 8px\">${chart}</div></div>\n\n    <div class=\"sect\"><div class=\"sect-head\"><div class=\"sect-title\">KANOAに戻ってくる金額（ルートB）</div></div>\n      <div class=\"panel tbl-wrap\"><table class=\"tbl\"><thead><tr>\n        <th>パートナー</th><th class=\"num\">入社</th><th class=\"num\">戻る金額</th><th>戻る予定日</th>\n      </tr></thead><tbody>\n      ${backRows.length?backRows.map(x=>`<tr>\n        <td class=\"cell-strong\">${esc(x.a.name)}</td>\n        <td class=\"num\">${x.n}</td>\n        <td class=\"num cell-strong\" style=\"color:var(--b)\">${yen(x.pay)}</td>\n        <td>${x.due?`<span style=\"font-size:12px\">${esc(x.due)}</span>`:'<span class=\"cell-sub\">—</span>'}</td>\n      </tr>`).join('')+`<tr><td class=\"cell-strong\" style=\"background:var(--gray-bg)\">合計</td><td style=\"background:var(--gray-bg)\"></td><td class=\"num cell-strong\" style=\"background:var(--gray-bg);color:var(--b)\">${yen(backTotal)}</td><td style=\"background:var(--gray-bg)\"></td></tr>`:'<tr><td colspan=\"4\"><span class=\"cell-sub\">ルートB（KANOAに戻す）のパートナーはいません</span></td></tr>'}\n      </tbody></table></div>\n      <div class=\"cell-sub\" style=\"font-size:11px;margin-top:6px\">※ 戻る予定日：ライセンスありは入金の1ヶ月後、なしは2ヶ月後</div></div>\n  </div>`;\n}\n\n\n/* ════════════════════ 送客の重複チェック（自動注入） ════════════════════ */\n/* ════════════════════════════════════════════════════════════\n   送客の重複チェック（名前完全一致 ＋ 電話番号一致で同一人物と判定）\n   ・自社内の重複 → 登録ブロック（saveReferralで使用）\n   ・他社との重複 → 管理ページで可視化、エントリーが早い方を優先\n   ════════════════════════════════════════════════════════════ */\n\n/* 氏名の正規化（前後空白・全角/半角スペースを吸収） */\nfunction normName(s){ return String(s||'').replace(/[\\s　]+/g,'').trim(); }\n\n/* 同一人物か（名前完全一致 かつ 電話番号一致。どちらかが空なら不一致扱い） */\nfunction isSamePerson(a, b){\n  const n1=normName(a.name), n2=normName(b.name);\n  const p1=normPhone(a.phone), p2=normPhone(b.phone);\n  if(!n1 || !p1 || !n2 || !p2) return false;\n  return n1===n2 && p1===p2;\n}\n\n/* 送客のエントリー日時（比較用の文字列。created + id で安定ソート） */\nfunction refEntryKey(r){ return (r.created||'') + '#' + (r.id||''); }\n\n/* ある送客と同一人物の送客を全件返す（自分自身を除く） */\nfunction duplicatesOf(ref){\n  return DB.referrals.filter(r=> r.id!==ref.id && r.status!=='rejected' && r.status!=='declined' && isSamePerson(r, ref));\n}\n\n/* 同一人物グループの中で最先着（優先）の送客を返す */\nfunction primaryOf(ref){\n  const group=[ref, ...duplicatesOf(ref)].filter(Boolean);\n  group.sort((a,b)=> refEntryKey(a)<refEntryKey(b)?-1:1);\n  return group[0];\n}\n\n/* この送客が最先着（優先）かどうか */\nfunction isPrimaryRef(ref){\n  const p=primaryOf(ref);\n  return !!p && p.id===ref.id;\n}\n\n/* 他社との重複があるか（自社以外に同一人物がいる） */\nfunction hasCrossAgencyDup(ref){\n  return duplicatesOf(ref).some(r=> r.ag!==ref.ag);\n}\n\n/* 自社内に同一人物の送客が既にあるか（登録ブロック用） */\nfunction findOwnDuplicate(ag, name, phone){\n  const target={name, phone};\n  return DB.referrals.find(r=> r.ag===ag && r.status!=='rejected' && r.status!=='declined' && isSamePerson(r, target)) || null;\n}\n\n/* 候補者詳細ドロワーの他社重複セクション（KANOA管理画面のみ・先着/後着を並べて表示） */\nfunction dupDetailSection(r){\n  if(typeof S==='undefined' || S.role!=='kanoa') return '';\n  const dups=duplicatesOf(r);\n  if(!dups.length) return '';\n  // 自分＋重複を先着順に並べる\n  const group=[r, ...dups].sort((a,b)=> refEntryKey(a)<refEntryKey(b)?-1:1);\n  const rows=group.map((g,idx)=>{\n    const a=agency(g.ag);\n    const isFirst=idx===0;\n    const isSelf=g.id===r.id;\n    const p=project(g.pj);\n    return `<div style=\"display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;margin-bottom:5px;background:${isSelf?'var(--accent-soft)':'var(--gray-bg)'};border:1px solid ${isFirst?'#BBF7D0':'var(--line,#eef1f5)'}\">\n      <span style=\"font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:${isFirst?'#15803D':'#B45309'};color:#fff\">${isFirst?'先着・優先':(idx+1)+'番目'}</span>\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-size:12.5px;font-weight:600\">${esc(a?a.name:g.ag)}${isSelf?' <span style=\"font-size:10px;color:var(--soft)\">（表示中）</span>':''}</div>\n        <div style=\"font-size:11px;color:var(--soft)\">${esc(p?p.name.replace(' パートナー送客',''):g.pj)} · 送客日 ${esc(g.created||'—')} · ${STATUS[g.status]?STATUS[g.status].label:g.status}</div>\n      </div>\n      ${!isSelf?`<button class=\"btn btn-ghost btn-sm\" style=\"padding:3px 9px;font-size:11px\" data-act=\"open-ref\" data-id=\"${g.id}\">開く</button>`:''}\n    </div>`;\n  }).join('');\n  return `<div class=\"dt-block-title\" style=\"color:#B45309\">重複送客（${group.length}社）</div>\n    <div style=\"padding:2px 0 4px\">\n      <div style=\"font-size:11.5px;color:var(--soft);margin-bottom:7px;line-height:1.6\">同じ方（氏名・電話番号が一致）が複数社から送客されています。<strong style=\"color:#15803D\">エントリーが早い方が優先</strong>されます。</div>\n      ${rows}\n    </div>`;\n}\n\n/* 送客一覧に出す他社重複バッジ（KANOA管理画面のみ・先着/後着を表示） */\nfunction crossDupBadge(r){\n  if(typeof S==='undefined' || S.role!=='kanoa') return '';\n  if(!hasCrossAgencyDup(r)) return '';\n  const primary=isPrimaryRef(r);\n  if(primary){\n    return `<span class=\"dup-badge dup-primary\" data-act=\"open-ref\" data-id=\"${r.id}\" title=\"複数社から送客あり。この送客が最先着（優先）です。\" style=\"display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:6px;background:#E8F6EE;color:#15803D;cursor:pointer\"><svg width=\"9\" height=\"9\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><polyline points=\"20 6 9 17 4 12\"/></svg>重複・先着</span>`;\n  }\n  return `<span class=\"dup-badge dup-later\" data-act=\"open-ref\" data-id=\"${r.id}\" title=\"他社が先に同じ方を送客済み（後着）。先着が優先されます。\" style=\"display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:6px;background:#FEF3C7;color:#B45309;cursor:pointer\"><svg width=\"9\" height=\"9\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"/><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"/></svg>重複・後着</span>`;\n}\n\n\n/* boot */\n(function(){\n  var _q=null; try{ _q=new URLSearchParams(location.search); }catch(e){}\n  var _special = !!(_q && (_q.get('form') || (_q.get('invite') && _q.get('token'))));\n  if(DEMO_MODE){ CHECK_INVITE_THEN_LOGIN(); }\n  else { if(_special) CHECK_INVITE_THEN_LOGIN(); SUPA.boot(); }\n})();\n<\/script>\n<script>\n(function(){\n/* ───────────────────────────────────────────────────────────────\n   KANOA ログイン背景 ── 「つながりが、大きな潮流になる」\n   流れる波（潮流）の上を、個社を表すノードが連なりながら右へ流れ、\n   近接でつながりを結び、ひとつの大きな流れに乗っていく。\n   ─────────────────────────────────────────────────────────────── */\nconst canvas = document.getElementById('loginCanvas');\nconst ctx = (canvas && canvas.getContext) ? canvas.getContext('2d') : null;\nif(!ctx || typeof requestAnimationFrame==='undefined'){ window._loginAnim={start:function(){},stop:function(){}}; return; }\n\nlet _raf=null,_running=false,W,H;\nconst DPR=Math.min(window.devicePixelRatio||1, 2);\nfunction resize(){\n  W=window.innerWidth; H=window.innerHeight;\n  canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);\n  canvas.style.width=W+'px'; canvas.style.height=H+'px';\n  ctx.setTransform(DPR,0,0,DPR,0,0);\n  initLayers();\n}\nconst ptr={x:-9999,y:-9999,on:false};\nwindow.addEventListener('mousemove',e=>{ ptr.x=e.clientX; ptr.y=e.clientY; ptr.on=true; });\nwindow.addEventListener('mouseleave',()=>{ ptr.on=false; });\nwindow.addEventListener('touchmove',e=>{ const t=e.touches&&e.touches[0]; if(t){ ptr.x=t.clientX; ptr.y=t.clientY; ptr.on=true; } },{passive:true});\nwindow.addEventListener('touchend',()=>{ ptr.on=false; });\n\nconst NODE='96,124,160';    // soft slate-navy network\nconst ACCENT='31,63,99';     // brand navy highlight\nfunction rnd(a,b){ return a+Math.random()*(b-a); }\n\nfunction paintBg(alpha){\n  const g=ctx.createLinearGradient(0,0,W*0.5,H);\n  g.addColorStop(0,   '#ffffff');\n  g.addColorStop(0.5, '#f7f9fb');\n  g.addColorStop(1,   '#eef2f6');\n  ctx.globalAlpha=alpha; ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;\n}\n\n/* ── 波（潮流）レイヤー */\nlet layers=[];\nfunction initLayers(){\n  layers=[];\n  const rows=[0.30,0.44,0.56,0.67,0.78,0.9];\n  for(let i=0;i<rows.length;i++){\n    layers.push({\n      y: rows[i]*H,\n      amp: 22 + i*6 + rnd(-4,4),\n      wl:  240 + i*70,\n      sp:  0.00016 + i*0.000045,\n      ph:  rnd(0,6.283),\n      op:  0.05 - i*0.006,\n      w:   1.5\n    });\n  }\n}\nfunction waveY(L,x){\n  return L.y + L.amp*Math.sin(x/L.wl + L.ph) + (L.amp*0.42)*Math.sin(x/(L.wl*0.5) - L.ph*1.25);\n}\nfunction drawWaves(){\n  for(const L of layers){\n    // ribbon（消えていく塗り＝奥行き）\n    ctx.beginPath();\n    ctx.moveTo(0, waveY(L,0));\n    for(let x=14;x<=W+14;x+=16) ctx.lineTo(x, waveY(L,x));\n    const top=Math.max(0,L.y-L.amp);\n    const lineEndX=W+14;\n    ctx.lineTo(lineEndX, top+120); ctx.lineTo(0, top+120); ctx.closePath();\n    const g=ctx.createLinearGradient(0,top,0,top+120);\n    g.addColorStop(0,'rgba('+NODE+','+Math.max(0.02,L.op*0.34).toFixed(3)+')');\n    g.addColorStop(1,'rgba('+NODE+',0)');\n    ctx.fillStyle=g; ctx.fill();\n    // crest line\n    ctx.beginPath();\n    ctx.moveTo(0, waveY(L,0));\n    for(let x=14;x<=W+14;x+=16) ctx.lineTo(x, waveY(L,x));\n    ctx.strokeStyle='rgba('+NODE+','+Math.max(0.03,L.op).toFixed(3)+')';\n    ctx.lineWidth=L.w; ctx.stroke();\n  }\n}\n\n/* ── ノード（個社）：ゆるやかに漂う星座 */\nconst COUNT=(W*H>1150000)?94:66;\nconst R_LINK=134, R_LINK2=R_LINK*R_LINK, MAX_NODES=200;\nfunction makeNode(init,x,y){\n  const z=rnd(0.38,1);\n  return { x:(x!=null)?x:rnd(0,W), y:(y!=null)?y:rnd(0,H), z,\n           dir:rnd(0,6.283), sp:rnd(0.16,0.36)+z*0.22, r:0.9+z*1.7,\n           accent:Math.random()<0.13, t:rnd(0,6.283), tw:rnd(0.004,0.0085),\n           tk:rnd(0,6.283), rx:0, ry:0, spd:0 };\n}\nlet nodes=[];\nfunction build(){ nodes=Array.from({length:COUNT},()=>makeNode(true)); }\n\nfunction stepNode(n){\n  n.t+=n.tw;\n  n.dir+=Math.sin(n.t)*0.01 + Math.cos(n.t*0.5+1.3)*0.006; // 進路がゆっくり揺らぐ\n  n.x+=Math.cos(n.dir)*n.sp;\n  n.y+=Math.sin(n.dir)*n.sp;\n  if(ptr.on){\n    const dx=n.x-ptr.x, dy=n.y-ptr.y, d=Math.hypot(dx,dy);\n    if(d<175&&d>0.01){ const f=(1-d/175); const push=f*f*2.3*n.z; n.x+=dx/d*push; n.y+=dy/d*push; }\n  }\n  const m=90;\n  if(n.x<-m)n.x=W+m; else if(n.x>W+m)n.x=-m;\n  if(n.y<-m)n.y=H+m; else if(n.y>H+m)n.y=-m;\n  n.spd=n.sp;\n}\n\nwindow.addEventListener('mousedown',e=>{\n  for(let k=0;k<5;k++){ const n=makeNode(false,e.clientX+rnd(-14,14),e.clientY+rnd(-14,14)); n.accent=Math.random()<0.5; n.z=rnd(0.72,1); n.r=0.9+n.z*1.7; nodes.push(n); }\n  if(nodes.length>MAX_NODES) nodes.splice(0,nodes.length-MAX_NODES);\n});\n\nfunction drawLinks(){\n  ctx.lineWidth=1;\n  for(let i=0;i<nodes.length;i++){\n    const a=nodes[i];\n    for(let j=i+1;j<nodes.length;j++){\n      const b=nodes[j];\n      const dx=a.rx-b.rx, dy=a.ry-b.ry, d2=dx*dx+dy*dy;\n      if(d2<R_LINK2){\n        const t=1-d2/R_LINK2, dep=(a.z+b.z)*0.5;\n        ctx.strokeStyle='rgba('+NODE+','+(t*t*0.30*dep).toFixed(3)+')';\n        ctx.beginPath(); ctx.moveTo(a.rx,a.ry); ctx.lineTo(b.rx,b.ry); ctx.stroke();\n      }\n    }\n    if(ptr.on){\n      const dx=a.rx-ptr.x, dy=a.ry-ptr.y, d2=dx*dx+dy*dy;\n      if(d2<R_LINK2*1.7){\n        const t=1-d2/(R_LINK2*1.7);\n        ctx.strokeStyle='rgba('+ACCENT+','+(t*t*0.45).toFixed(3)+')';\n        ctx.beginPath(); ctx.moveTo(a.rx,a.ry); ctx.lineTo(ptr.x,ptr.y); ctx.stroke();\n      }\n    }\n  }\n}\nfunction drawNodes(){\n  for(const n of nodes){\n    const col=n.accent?ACCENT:NODE;\n    const tw=0.6+0.4*Math.sin(n.t*2.4+n.tk);        // 明滅\n    const a=tw*(0.3+0.45*n.z);\n    const glow=2.4+n.r*2.6;\n    const rg=ctx.createRadialGradient(n.rx,n.ry,0,n.rx,n.ry,glow);\n    rg.addColorStop(0,'rgba('+col+','+(0.85*a).toFixed(3)+')');\n    rg.addColorStop(1,'rgba('+col+',0)');\n    ctx.fillStyle=rg;\n    ctx.beginPath(); ctx.arc(n.rx,n.ry,glow,0,6.283); ctx.fill();\n    ctx.fillStyle='rgba('+col+','+(0.95*a).toFixed(3)+')';\n    ctx.beginPath(); ctx.arc(n.rx,n.ry,n.r*0.6,0,6.283); ctx.fill();\n  }\n}\n\nlet parX=0,parY=0;\nfunction frame(){\n  for(const L of layers) L.ph += L.sp*16;\n  const tpx = ptr.on ? (ptr.x/W-0.5) : 0;\n  const tpy = ptr.on ? (ptr.y/H-0.5) : 0;\n  parX += (tpx-parX)*0.045; parY += (tpy-parY)*0.045;\n  paintBg(0.5);\n  drawWaves();\n  for(const n of nodes){ stepNode(n); n.rx=n.x - parX*n.z*46; n.ry=n.y - parY*n.z*46; }\n  drawLinks();\n  drawNodes();\n\n  _raf=requestAnimationFrame(frame);\n}\n\nfunction _start(){ if(_running) return; _running=true; resize(); build(); paintBg(1); frame(); }\nfunction _stop(){ _running=false; if(_raf){ cancelAnimationFrame(_raf); _raf=null; } }\nwindow._loginAnim={start:_start,stop:_stop};\n_start();\n})();\n<\/script>\n\n\n</body></html>"</script>
