r.status==='entry'||r.status==='screening') && !(ds.rireki&&ds.shoku);\n    html+=`<button class=\"cand-item ${on?'on':''}\" data-act=\"open-subthread\" data-ag=\"${ag}\" data-ref=\"${rid}\">\n      <span class=\"ci-dot\" style=\"background:${stColor}\"></span>\n      <span class=\"ci-main\"><span class=\"ci-name\">${esc(r.name)}${un?`<span style=\"display:inline-block;margin-left:6px;padding:0px 6px;border-radius:999px;background:var(--r);color:#fff;font-size:9px;font-weight:700;vertical-align:1px\">New</span>`:''}</span><span class=\"ci-sub\">${esc(shortPjName(r.pj))} · ${STATUS[r.status].label}</span></span>\n      ${needDocs?`<span class=\"ci-flag\" title=\"書類が未提出\"></span>`:''}\n      ${un?`<span class=\"ci-un\">${un}</span>`:''}\n    </button>`;\n  });\n  if(!items.length){ html+=`<div class=\"cell-sub\" style=\"padding:10px 12px;line-height:1.5\">${pjF?'この案件の送客スレッドはまだありません。':'送客スレッドはまだありません。'}<br>「＋」から候補者を追加できます。</div>`; }\n  html+=`</div></aside>`;\n  return html;\n}\n/* コンテキストヘッダー（誰の/どの案件か常時表示） */\n// 候補者の「次にやるべきこと」をステータス＋書類状況から提案\nfunction nextActionHint(r, viewer){\n  const K = viewer==='kanoa';\n  const hasSession = r.session && r.session!=='—';\n  const missIv = missingDocsForStage(r,'interview');     // 選考会に必要な未提出書類\n  const missOf = missingDocsForStage(r,'offer');         // 内定後に必要な未提出書類\n  const optOf  = missingOptionalForStage(r,'offer');\n  switch(r.status){\n    case 'entry':\n      if(missIv.length) return { b:'選考会に必要な書類を依頼', s:`${missIv.join('・')}が未提出（選考会に進めません）`, act:K?{label:'依頼を送る',a:'request-docs',ref:r.id,ag:r.ag}:{label:'資料を出す',a:'open-ref',id:r.id} };\n      return { b:'書類選考へ進める', s:'必要書類が揃いました', act:K?{label:'書類選考に',a:'set-ref-status',ref:r.id,s:'screening'}:null };\n    case 'screening':\n      if(missIv.length) return { b:'選考会に必要な書類を依頼', s:`${missIv.join('・')}が未提出（揃わないと選考会に進めません）`, act:K?{label:'依頼を送る',a:'request-docs',ref:r.id,ag:r.ag}:{label:'資料を出す',a:'open-ref',id:r.id} };\n      return { b:'選考会へ — 日程を調整', s:'書類が揃いました。選考会へ進めます', act:K?{label:'日程調整',a:'schedule-msg',ref:r.id,ag:r.ag}:null };\n    case 'interview':\n      if(hasSession) return { b:`選考会 ${esc(r.session)}`, s:'前日にリマインドを', act:K?{label:'リマインド',a:'remind-msg',ref:r.id,ag:r.ag}:null };\n      return { b:'選考会へ — 日程調整', s:'日程が未設定', act:K?{label:'日程調整',a:'schedule-msg',ref:r.id,ag:r.ag}:null };\n    case 'offer':\n      if(missOf.length) return { b:'内定後の必要書類を回収', s:`至急 ${missOf.join('・')} が必要${optOf.length?`（賞与があれば${optOf.join('・')}も）`:''}`, act:K?{label:'依頼を送る',a:'request-docs',ref:r.id,ag:r.ag}:{label:'資料を出す',a:'open-ref',id:r.id} };\n      return { b:'内定 — 入社日を確定', s:'必要書類は回収済み。条件のすり合わせを', act:K?{label:'入社で確定',a:'set-ref-status',ref:r.id,s:'joined'}:null };\n    case 'joined':\n      return { b:`入社済み ${joinedYM(r)}`, s:'入社後フォロー', act:null };\n    case 'rejected':\n      return { b:'見送り', s:'このスレッドはクローズ', act:null };\n  }\n  return null;\n}\n\nfunction pipelineStepper(r, viewer){\n  const stages = ['entry','screening','interview','offer','joined'];\n  const editable = viewer==='kanoa' && r.status!=='rejected';\n  const curIdx = stages.indexOf(r.status);\n  let h = `<div class=\"cmd-pipe ${editable?'editable':''}\">`;\n  stages.forEach((s,i)=>{\n    const done = curIdx>i;\n    const cur = curIdx===i;\n    if(i>0) h += `<span class=\"pipe-line ${curIdx>=i?'done':''}\"></span>`;\n    const tap = editable ? `data-act=\"set-ref-status\" data-ref=\"${r.id}\" data-s=\"${s}\"` : '';\n    h += `<div class=\"pipe-step ${done?'done':''} ${cur?'cur':''}\" ${tap} title=\"${STATUS[s].label}に変更\">\n      <span class=\"pdot\">${done?'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"/></svg>':(cur?'<i></i>':'')}</span>\n      <span>${STATUS[s].label}</span>\n    </div>`;\n  });\n  h += `</div>`;\n  return h;\n}\n\nfunction threadCtxHeader(ag, viewer, curRef){\n  if((curRef||null)===null){\n    const a=agency(ag);\n    return `<div class=\"thread-ctx general\">\n      <div class=\"thread-ctx-av\">${esc((viewer==='kanoa'?(a?a.name:'?'):'K').slice(0,1))}</div>\n      <div class=\"thread-ctx-main\">\n        <div class=\"thread-ctx-name\">全体連絡 <span class=\"tag\" style=\"font-size:10px\">案件・候補者に紐づかない連絡</span></div>\n        <div class=\"thread-ctx-meta\">${viewer==='kanoa'?esc(a?a.name:ag):'KANOA 事務局'}・お知らせや一般的なやり取り</div>\n      </div>\n    </div>`;\n  }\n  const r=DB.referrals.find(x=>x.id===curRef); if(!r) return '';\n  const p=project(r.pj);\n  const pjName = esc((p?p.name:r.pj).replace(' パートナー送客',''));\n  const ds = docStat(r);\n  const K = viewer==='kanoa';\n  const hint = nextActionHint(r, viewer);\n  const hasSession = r.session && r.session!=='—';\n\n  // 書類チップ（提出済=緑/未=黄＋タップで依頼orアップロード）\n  const docChip = (label, ok, opt) => {\n    if(ok) return `<span class=\"fact-chip ok\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><polyline points=\"20 6 9 17 4 12\"/></svg>${label}</span>`;\n    const act = K ? `data-act=\"request-docs\" data-ref=\"${r.id}\" data-ag=\"${ag}\"` : `data-act=\"open-ref\" data-id=\"${r.id}\"`;\n    return `<span class=\"fact-chip ${opt?'':'warn'}\" ${act} title=\"${K?'提出を依頼':'アップロード'}\">${label} <span class=\"fc-k\">${opt?'任意':'未'}</span></span>`;\n  };\n  // 現在のステージで必要な書類チップを出し分け\n  let docChips='';\n  if(r.status==='offer'||r.status==='joined'){\n    const req=stageReq(r.pj,'offer');\n    if(req){\n      (req.required||[]).forEach(k=>{ docChips+=docChip(k, ds.has(k)); });\n      (req.optional||[]).forEach(k=>{ docChips+=docChip(k, ds.has(k), true); });\n    } else { docChips+=docChip('履歴書', ds.rireki)+docChip('職務経歴書', ds.shoku); }\n  } else {\n    const req=stageReq(r.pj,'interview')||{required:['履歴書','職務経歴書']};\n    (req.required||[]).forEach(k=>{ docChips+=docChip(k, ds.has(k)); });\n  }\n\n  return `<div class=\"cmd\">\n    <div class=\"cmd-top\">\n      <div class=\"cmd-av\">${esc((r.name||'？').slice(0,1))}</div>\n      <div class=\"cmd-id\">\n        <div class=\"cmd-name\">${esc(r.name)} ${statusBadge(r.status)}</div>\n        <div class=\"cmd-link\">\n          <span class=\"ag\">${esc(agency(ag)?agency(ag).name:ag)}</span>\n          <span class=\"arr\">→</span>\n          <span class=\"pj\" data-act=\"${K?'open-project':'open-project-agency'}\" data-id=\"${r.pj}\" title=\"案件を見る\">${pjName}</span>\n        </div>\n      </div>\n      <div class=\"cmd-actions\">\n        <button class=\"thread-ctx-btn\" data-act=\"open-ref\" data-id=\"${r.id}\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>候補者カード</button>\n      </div>\n    </div>\n    ${pipelineStepper(r, viewer)}\n    <div class=\"cmd-facts\">\n      ${docChips}\n      <span class=\"fact-chip\" data-act=\"${hasSession?'open-ref':'schedule-msg'}\" ${hasSession?`data-id=\"${r.id}\"`:`data-ref=\"${r.id}\" data-ag=\"${ag}\"`}>\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M16 2v4M8 2v4M3 10h18\"/></svg>\n        選考会 ${hasSession?esc(r.session):'<span class=\"fc-k\">調整</span>'}\n      </span>\n      ${r.joined?`<span class=\"fact-chip ok\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"M9 11l3 3L22 4\"/></svg>入社 ${joinedYM(r)}</span>`:''}\n    </div>\n    ${hint?`<div class=\"next-hint\">\n      <span class=\"nh-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><path d=\"M13 2L3 14h9l-1 8 10-12h-9z\"/></svg></span>\n      <span class=\"nh-text\"><b>${hint.b}</b> <span>· ${hint.s}</span></span>\n      ${hint.act?`<button class=\"nh-act\" data-act=\"${hint.act.a}\" ${hint.act.ref?`data-ref=\"${hint.act.ref}\"`:''} ${hint.act.ag?`data-ag=\"${hint.act.ag}\"`:''} ${hint.act.id?`data-id=\"${hint.act.id}\"`:''} ${hint.act.s?`data-s=\"${hint.act.s}\"`:''}>${hint.act.label}</button>`:''}\n    </div>`:''}\n  </div>`;\n}\nfunction renderConversation(ag, viewer){\n  // 現在のサブスレッド（S.threadRef）。未指定なら全体連絡\n  const curRef = S.threadRef || null;\n  markReadSub(ag, curRef, viewer); save(); updateNavCounts();\n  const a=agency(ag);\n  setHeader('連絡', viewer==='kanoa'?(a?a.name:ag):'KANOA 事務局', '');\n  const ms=subThread(ag, curRef);\n  const lastOutRead = (()=>{ for(let i=ms.length-1;i>=0;i--){ if(ms[i].from===viewer && !ms[i].deleted) return ms[i].read?ms[i].id:null; } return null; })();\n  const pinned=ms.filter(m=>m.pinned && !m.deleted);\n  let body='', lastDay='';\n  if(!ms.length){\n    const r=curRef?DB.referrals.find(x=>x.id===curRef):null;\n    body=`<div class=\"chat-empty\">${r?`「${esc(r.name)}」についてのスレッドです。`:''}<br>まだメッセージはありません。下の入力欄から送信できます。</div>`;\n  }\n  else { body=ms.map(m=>{\n    const day=m.ts.slice(0,10); let d=''; if(day!==lastDay){ lastDay=day; d=`<div class=\"msg-day\">${day.replace(/-/g,'/')}</div>`; }\n    const out=(m.from===viewer);\n    if(m.deleted){ return `${d}<div class=\"msg-wrap ${out?'out':'in'}\"><div class=\"msg ${out?'msg-out':'msg-in'}\"><span class=\"msg-deleted\">送信を取り消しました</span></div></div>`; }\n    let quote='';\n    if(m.replyTo){ const o=ms.find(x=>x.id===m.replyTo)||DB.messages.find(x=>x.id===m.replyTo); if(o){ quote=`<div class=\"msg-quote\" data-act=\"scrollto\" data-id=\"${o.id}\"><span class=\"q-from\">${esc(msgSenderName(o,viewer))}</span>${esc((o.deleted?'（取り消されたメッセージ）':o.text).slice(0,60))}</div>`; } }\n    // reactions\n    const reacts=m.reactions&&Object.keys(m.reactions).length?`<div class=\"msg-reacts\">${Object.entries(m.reactions).map(([e,arr])=>{ const mine=arr.includes(meId())?'mine':''; const isText=/[ぁ-んァ-ヶー一-龥A-Za-z]/.test(e); if(isText){ return `<button class=\"react-pill text-react ${mine}\" data-act=\"react-toggle\" data-id=\"${m.id}\" data-e=\"${esc(e)}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"/></svg>${esc(e)}${arr.length>1?`<span class=\"rc\">${arr.length}</span>`:''}</button>`; } return `<button class=\"react-pill ${mine}\" data-act=\"react-toggle\" data-id=\"${m.id}\" data-e=\"${e}\">${e}<span class=\"rc\">${arr.length}</span></button>`; }).join('')}</div>`:'';\n    const menuBtn=`<button class=\"msg-task\" data-act=\"msg-menu\" data-id=\"${m.id}\" title=\"メニュー\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><circle cx=\"5\" cy=\"12\" r=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/><circle cx=\"19\" cy=\"12\" r=\"2\"/></svg></button>`;\n    const receipt=(out && m.id===lastOutRead)?`<div class=\"msg-receipt\">既読</div>`:'';\n    const edited=m.edited?`<span class=\"msg-edited\">編集済み</span>`:'';\n    let inner;\n    if(m.stamp==='emoji'){ inner=`<div class=\"msg is-emoji\" data-mid=\"${m.id}\">${esc(m.text)}<div class=\"msg-time\">${esc(m.ts.slice(11,16))}</div></div>`; }\n    else if(m.stamp){ inner=`<div class=\"msg is-stamp ${out?'msg-out':'msg-in'}\" data-mid=\"${m.id}\"><span class=\"stamp-pill\">${esc(m.text)}</span><div class=\"msg-time\" style=\"text-align:${out?'right':'left'}\">${esc(m.ts.slice(11,16))}</div></div>`; }\n    else { inner=`<div class=\"msg ${out?'msg-out':'msg-in'}\" data-mid=\"${m.id}\">${quote}${renderMsgText(m.text, ag)}${edited}<div class=\"msg-time\">${esc(m.ts.slice(11,16))}</div></div>`; }\n    return `${d}<div class=\"msg-wrap ${out?'out':'in'}\" id=\"mw-${m.id}\">${menuBtn}<div style=\"display:flex;flex-direction:column;${out?'align-items:flex-end':'align-items:flex-start'};min-width:0\">${inner}${reacts}</div></div>${receipt}`;\n  }).join(''); }\n  const c=document.getElementById('content');\n  c.style.padding='0';\n  const replyMsg = S.replyTo?ms.find(x=>x.id===S.replyTo):null;\n  const editing = S.editMsg?ms.find(x=>x.id===S.editMsg):null;\n  const composerPlaceholder = (curRef\n    ? `「${esc((DB.referrals.find(x=>x.id===curRef)||{}).name||'')}」についてのメッセージ`\n    : 'メッセージを入力（改行OK / 送信ボタン または ⌘Enter）');\n  c.innerHTML=`<div class=\"conv\">\n    ${subThreadNav(ag, viewer, curRef)}\n    <div class=\"chat\">\n    <div class=\"chat-head\">\n      ${viewer==='kanoa'?`<button class=\"chat-back\" data-act=\"back-threads\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 12H5M12 19l-7-7 7-7\"/></svg></button>`:''}\n      <div class=\"thread-av\" style=\"width:34px;height:34px;font-size:13px;background:${viewer==='kanoa'?agColor(ag):'var(--ink)'}\">${esc((viewer==='kanoa'?a.name:'K').slice(0,1))}</div>\n      <div style=\"flex:1\"><div style=\"font-weight:700;font-size:14px\">${viewer==='kanoa'?esc(a.name):'KANOA 事務局'}</div>\n        <div style=\"font-size:11px;color:var(--muted)\">${viewer==='kanoa'?esc(agCode(a))+' · メンバー'+orgMembers(ag).length+'名':'KANOA 事務局 · 担当'+orgMembers('kanoa').length+'名'}</div></div>\n      <button class=\"thread-ctx-btn\" data-act=\"bulk-open\" title=\"候補者へ一括送信\" style=\"margin-left:auto\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-right:4px;vertical-align:-2px\"><path d=\"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M19 8v6M22 11h-6\"/></svg>一括送信</button>\n    </div>\n    ${threadCtxHeader(ag, viewer, curRef)}\n    ${pinned.length?`<div class=\"pin-bar\" data-act=\"scrollto\" data-id=\"${pinned[pinned.length-1].id}\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M16 4v6l2 3v2H6v-2l2-3V4z\"/><path d=\"M12 17v4\" stroke=\"currentColor\" stroke-width=\"2\"/></svg><span class=\"pb-text\">${esc((pinned[pinned.length-1].text||'').slice(0,40))}</span><span class=\"cell-sub\">ピン ${pinned.length}</span></div>`:''}\n    <div class=\"chat-body\" id=\"chatBody\">${body}</div>\n    ${replyMsg?`<div class=\"reply-bar\"><div class=\"rb-main\"><div class=\"rb-from\">${esc(msgSenderName(replyMsg,viewer))} に返信</div><div class=\"rb-text\">${esc((replyMsg.text||'').slice(0,50))}</div></div><button data-act=\"reply-cancel\">×</button></div>`:''}\n    ${editing?`<div class=\"reply-bar\" style=\"border-left-color:var(--a)\"><div class=\"rb-main\"><div class=\"rb-from\" style=\"color:var(--a)\">メッセージを編集中</div><div class=\"rb-text\">${esc((editing.text||'').slice(0,50))}</div></div><button data-act=\"edit-cancel\">×</button></div>`:''}\n    ${S.picker?renderPicker():''}\n    <div class=\"composer-tools\">\n      <button class=\"tool-btn ${S.picker&&S.pickerTab!=='mention'?'on':''}\" data-act=\"picker-toggle\" title=\"スタンプ・絵文字・定型文\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M8 14s1.5 2 4 2 4-2 4-2\"/><line x1=\"9\" y1=\"9\" x2=\"9.01\" y2=\"9\"/><line x1=\"15\" y1=\"9\" x2=\"15.01\" y2=\"9\"/></svg></button>\n      <button class=\"tool-btn ${S.picker&&S.pickerTab==='mention'?'on':''}\" data-act=\"mention-open\" title=\"メンション\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M16 8v5a3 3 0 006 0v-1a10 10 0 10-3.92 7.94\"/></svg></button>\n    </div>\n    <div class=\"composer\">\n      <textarea id=\"msgInput\" rows=\"1\" placeholder=\"${composerPlaceholder}\"></textarea>\n      <button class=\"btn btn-primary\" data-act=\"send-msg\" data-ag=\"${ag}\">${editing?'保存':'送信'}</button>\n    </div>\n    </div>\n  </div>`;\n  const cb=document.getElementById('chatBody'); if(cb) cb.scrollTop=cb.scrollHeight;\n  const ta=document.getElementById('msgInput'); if(ta){\n    if(editing){ ta.value=editing.text||''; }\n    else if(S.threadPrefill){ ta.value=S.threadPrefill; S.threadPrefill=null; }\n    else if(S.draft!=null){ ta.value=S.draft; S.draft=null; }\n    if(ta.value){ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,120)+'px'; }\n    ta.focus();\n  }\n}\nfunction renderPicker(){\n  const tab=S.pickerTab||'stamp';\n  let inner='';\n  if(tab==='stamp') inner=`<div class=\"stamp-grid\">${STAMPS.map(s=>`<button class=\"st\" data-act=\"stamp-send\" data-t=\"${esc(s)}\">${esc(s)}</button>`).join('')}</div>`;\n  else if(tab==='emoji') inner=`<div class=\"emoji-grid\">${STAMP_EMOJI.map(e=>`<button data-act=\"emoji-send\" data-e=\"${e}\">${e}</button>`).join('')}</div>`;\n  else if(tab==='mention'){ const ms=threadMembers(curThreadAg()); inner=`<div class=\"mention-list\">${ms.length?ms.map(m=>`<button class=\"mention-opt\" data-act=\"mention-pick\" data-name=\"${esc(m.name)}\"><span class=\"thread-av\" style=\"width:26px;height:26px;font-size:11px;background:${m.org==='kanoa'?'var(--ink)':agColor(m.org)}\">${esc(m.name.slice(0,1))}</span><span><b>${esc(m.name)}</b> <span class=\"cell-sub\">${esc(orgLabel(m.org))}${m.title?' · '+esc(m.title):''}</span></span></button>`).join(''):'<div class=\"cell-sub\" style=\"padding:10px\">メンバーがいません</div>'}</div>`; }\n  else inner=`<div class=\"stamp-grid\">${MSG_TEMPLATES.map((t,i)=>`<button class=\"st\" data-act=\"tmpl\" data-i=\"${i}\">${esc(t.label)}</button>`).join('')}</div>`;\n  return `<div class=\"picker\">\n    <div class=\"picker-tabs\">\n      <button class=\"picker-tab ${tab==='stamp'?'on':''}\" data-act=\"picker-tab\" data-t=\"stamp\">スタンプ</button>\n      <button class=\"picker-tab ${tab==='emoji'?'on':''}\" data-act=\"picker-tab\" data-t=\"emoji\">絵文字</button>\n      <button class=\"picker-tab ${tab==='mention'?'on':''}\" data-act=\"picker-tab\" data-t=\"mention\">@ メンション</button>\n      <button class=\"picker-tab ${tab==='tmpl'?'on':''}\" data-act=\"picker-tab\" data-t=\"tmpl\">定型文</button>\n    </div>\n    <div class=\"picker-body\">${inner}</div>\n  </div>`;\n}\nfunction rerenderChat(){ const ta=document.getElementById('msgInput'); if(ta) S.draft=ta.value; renderConversation(curThreadAg(), meRole()); }\nfunction openMentionPicker(){ S.picker=true; S.pickerTab='mention'; rerenderChat(); }\nfunction renderMsgText(text, ag){\n  let h=esc(text);\n  const names=threadMembers(ag).map(m=>m.name).sort((a,b)=>b.length-a.length);\n  names.forEach(n=>{ const en=esc(n); const span=`<span class=\"mention\">@${en}</span>`; h=h.split('@'+en).join(span).split('＠'+en).join(span); });\n  return h;\n}\nfunction sendCurrent(ag){\n  const ta=document.getElementById('msgInput'); if(!ta) return;\n  const text=ta.value.trim();\n  if(S.editMsg){ const m=DB.messages.find(x=>x.id===S.editMsg); if(m && text){ m.text=text; m.edited=true; save(); } S.editMsg=null; S.picker=false; renderConversation(ag, meRole()); return; }\n  if(!text) return;\n  const mentions=threadMembers(ag).filter(m=>text.includes('@'+m.name)||text.includes('＠'+m.name)).map(m=>m.id);\n  // 現在開いているサブスレッド（S.threadRef）に紐づけて送信。スレッドは維持。\n  pushMsg(ag, meRole(), text, {refId:S.threadRef||null, replyTo:S.replyTo||null, mentions});\n  S.replyTo=null; S.draft=null; S.picker=false;\n  renderConversation(ag, meRole());\n}\nfunction openMsgMenu(msgId, anchor){\n  closeMsgMenu();\n  const m=DB.messages.find(x=>x.id===msgId); if(!m) return;\n  const own=(m.from===meRole());\n  const menu=document.createElement('div');\n  menu.className='msg-menu'; menu.id='msgMenu';\n  menu.innerHTML=`\n    <div class=\"react-row\">${REACTIONS.map(e=>`<button data-act=\"react-pick\" data-id=\"${msgId}\" data-e=\"${e}\">${e}</button>`).join('')}</div>\n    <div class=\"react-row text\">${TEXT_REACTIONS.map(e=>`<button class=\"txt-stamp\" data-act=\"react-pick\" data-id=\"${msgId}\" data-e=\"${esc(e)}\">${esc(e)}</button>`).join('')}</div>\n    <button class=\"mi\" data-act=\"reply-set\" data-id=\"${msgId}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 17 4 12 9 7\"/><path d=\"M20 18v-2a4 4 0 00-4-4H4\"/></svg>返信</button>\n    <button class=\"mi\" data-act=\"task-from-msg\" data-id=\"${msgId}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M9 11l3 3L22 4\"/><path d=\"M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11\"/></svg>マイタスクに追加</button>\n    <button class=\"mi\" data-act=\"task-req-from-msg\" data-id=\"${msgId}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z\"/></svg>${meRole()==='kanoa'?'パートナーに依頼':'KANOAに依頼'}</button>\n    <button class=\"mi\" data-act=\"pin-msg\" data-id=\"${msgId}\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M16 4v6l2 3v2H6v-2l2-3V4z\"/></svg>${m.pinned?'ピンを外す':'ピン留め'}</button>\n    ${own&&!m.stamp?`<button class=\"mi\" data-act=\"edit-set\" data-id=\"${msgId}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7\"/><path d=\"M18.5 2.5a2.1 2.1 0 013 3L12 15l-4 1 1-4z\"/></svg>編集</button>`:''}\n    ${own?`<button class=\"mi danger\" data-act=\"del-msg\" data-id=\"${msgId}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2\"/></svg>送信を取り消す</button>`:''}\n  `;\n  document.body.appendChild(menu);\n  const r=anchor.getBoundingClientRect();\n  let top=r.bottom+6, left=Math.min(r.left, window.innerWidth-menu.offsetWidth-10);\n  if(top+menu.offsetHeight>window.innerHeight-10) top=r.top-menu.offsetHeight-6;\n  menu.style.top=Math.max(10,top)+'px'; menu.style.left=Math.max(10,left)+'px';\n}\nfunction closeMsgMenu(){ const m=document.getElementById('msgMenu'); if(m) m.remove(); }\n\n/* ════════════════════ MY TASKS ════════════════════ */\n/* ════════════════════ MEMBERS ════════════════════ */\nfunction viewMembers(){\n  const org=myOrg();\n  setHeader('メンバー', (S.role==='kanoa'?'KANOA':agency(org)?agency(org).name:'自社')+' のメンバー管理',\n    `<button class=\"btn btn-primary btn-sm\" data-act=\"member-add\" data-org=\"${org}\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/></svg>メンバーを追加</button>`);\n  const c=document.getElementById('content');\n  c.innerHTML=`<div class=\"content-narrow\">${memberPanel(org, true)}</div>`;\n}\nfunction memberPanel(org, canManage){\n  const ms=orgMembers(org);\n  const av=(m)=>`<div class=\"thread-av\" style=\"width:36px;height:36px;font-size:14px;background:${org==='kanoa'?'var(--ink)':agColor(org)}\">${esc(m.name.slice(0,1))}</div>`;\n  return `<div class=\"panel\">${ms.length?ms.map(m=>`\n    <div class=\"info-row\" style=\"padding:12px 16px\">\n      ${av(m)}\n      <div class=\"info-val\"><strong style=\"font-weight:600\">${esc(m.name)}</strong>${m.title?` <span class=\"tag\" style=\"font-size:10px\">${esc(m.title)}</span>`:''}\n        <div class=\"cell-sub\">${esc(m.email||'—')}</div></div>\n      ${canManage?`<button class=\"copy-btn\" data-act=\"member-del\" data-id=\"${m.id}\">削除</button>`:''}\n    </div>`).join(''):emptyState('メンバーがいません','「メンバーを追加」から登録')}</div>`;\n}\nfunction modalAddMember(org){\n  showModal(`\n    <div class=\"modal-title\">メンバーを追加</div>\n    <div class=\"modal-sub\">${esc(orgLabel(org))} に追加します（招待メールで参加）</div>\n    <div class=\"modal-grid\">\n      <div class=\"field full\"><label>氏名 *</label><input id=\"mbName\" placeholder=\"山田 太郎\"></div>\n      <div class=\"field\"><label>メール</label><input id=\"mbEmail\" type=\"email\" placeholder=\"you@example.com\"></div>\n      <div class=\"field\"><label>役割（任意）</label><input id=\"mbTitle\" placeholder=\"CA / 営業 など\"></div>\n    </div>\n    <div class=\"modal-actions\"><button class=\"btn btn-ghost\" data-act=\"closemodal\">キャンセル</button>\n      <button class=\"btn btn-primary\" data-act=\"member-save\" data-org=\"${org}\">追加して招待</button></div>`);\n}\n/* ════════════════════ ACCOUNTS ════════════════════ */\n/* パスワードハッシュ (SHA-256 via Web Crypto) */\nasync function hashPw(plain){\n  try{\n    const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('kanoa_salt_2026::'+plain));\n    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');\n  }catch(e){ return plain; }\n}\nasync function verifyPw(plain, stored){\n  if(!stored) return false;\n  // hashed形式（64hex）かどうか\n  if(/^[0-9a-f]{64}$/.test(stored)){\n    const h=await hashPw(plain); return h===stored;\n  }\n  return plain===stored; // デモ平文フォールバック\n}\n/* ブルートフォース制限 */\nconst _loginFails={}; // agId -> {count, lockUntil}\nfunction checkLoginLock(agId){\n  const f=_loginFails[agId]; if(!f) return false;\n  if(f.lockUntil && Date.now()<f.lockUntil) return true;\n  if(f.lockUntil && Date.now()>=f.lockUntil) { delete _loginFails[agId]; return false; }\n  return false;\n}\nfunction recordLoginFail(agId){\n  if(!_loginFails[agId]) _loginFails[agId]={count:0};\n  _loginFails[agId].count++;\n  if(_loginFails[agId].count>=5) _loginFails[agId].lockUntil=Date.now()+5*60*1000; // 5分ロック\n}\nfunction clearLoginFails(agId){ delete _loginFails[agId]; }\n\nfunction viewAccounts(){\n  setHeader('アカウント管理', 'パートナーのログイン情報（メール・パスワード）を管理',\n    `<button class=\"btn btn-primary btn-sm\" data-act=\"add-account\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/></svg>アカウントを追加</button>`);\n  const c=document.getElementById('content');\n  const ags=DB.agencies.filter(a=>a.status!=='pending');\n  c.innerHTML=`<div class=\"content-narrow\">\n    <div class=\"panel-pad\" style=\"background:var(--accent-soft);border:1px solid #dcdcfb;border-radius:var(--r-md);margin-bottom:18px;font-size:13px;line-height:1.7;color:#2e2b73\">\n      <strong>Supabaseで管理しているログイン情報を登録できます</strong><br>\n      ここで登録したメール・パスワードは、Supabase Authentication で同じ内容のユーザーを作成し、各社の <span class=\"mono\">auth_user_id</span> に紐付けてください（紐付け用SQLは「アカウントを追加」時に表示します）。本番ではこのテーブルはRLSにより管理者のみ閲覧可能です。\n    </div>\n    <div class=\"panel tbl-wrap\">\n      <table class=\"tbl\"><thead><tr>\n        <th>パートナー</th><th>担当者</th><th>メール（ログインID）</th><th>パスワード</th><th>最終ログイン</th><th>状態</th><th style=\"width:200px\"></th>\n      </tr></thead><tbody>\n      ${ags.map(a=>{\n        const ll=lastLogin(a.id);\n        const locked=checkLoginLock(a.id);\n        return `<tr>\n          <td class=\"cell-strong\">${esc(a.name)}</td>\n          <td class=\"cell-sub\">${esc(a.contact||'—')}</td>\n          <td><span class=\"mono\" style=\"font-size:12px\">${esc(a.email||'—')}</span>${a.email?` <button class=\"copy-btn\" data-act=\"copy\" data-v=\"${esc(a.email)}\">コピー</button>`:''} <button class=\"copy-btn\" data-act=\"edit-account-email\" data-id=\"${a.id}\">変更</button></td>\n          <td>\n            <span class=\"mono pw-mask\" id=\"pw-${a.id}\" style=\"font-size:12px;color:var(--muted)\">••••••••</span>\n            <button class=\"copy-btn\" style=\"margin-left:6px\" data-act=\"reveal-pw-acc\" data-id=\"${a.id}\">表示</button>\n            ${(a.pw&&a.pw!=='demo')?`<button class=\"copy-btn\" style=\"margin-left:4px\" data-act=\"copy\" data-v=\"${esc(a.pw)}\">コピー</button>`:''}\n          </td>\n          <td class=\"cell-sub\">${ll?ll.at:'—'}</td>\n          <td>${locked?'<span class=\"badge bd-rejected\">ロック中</span>':(a.status==='active'?'<span class=\"badge bd-joined\">有効</span>':'<span class=\"badge bd-entry\">停止</span>')}</td>\n          <td style=\"text-align:right;white-space:nowrap\">\n            <button class=\"copy-btn\" data-act=\"edit-account-pw\" data-id=\"${a.id}\">PW変更</button>\n            <button class=\"copy-btn\" data-act=\"regen-account-pw\" data-id=\"${a.id}\" style=\"margin-left:4px\">再発行</button>\n            ${locked?`<button class=\"copy-btn\" data-act=\"unlock-account\" data-id=\"${a.id}\" style=\"margin-left:4px;color:var(--g)\">解除</button>`:''}\n          </td>\n        </tr>`;\n      }).join('')}\n      </tbody></table>\n    </div>\n  </div>`;\n}\nfunction modalAddAccount(){\n  showModal(`\n    <div class=\"modal-title\">アカウントを追加</div>\n    <div class=\"modal-sub\">Supabaseで管理するログイン情報（メール・パスワード）を登録します</div>\n    <div class=\"modal-grid\">\n      <div class=\"field full\"><label>会社名 / 屋号 *</label><input id=\"aaName\" placeholder=\"株式会社〇〇\"></div>\n      <div class=\"field full\"><label>担当者名</label><input id=\"aaContact\" placeholder=\"山田 太郎\"></div>\n      <div class=\"field full\"><label>メールアドレス（ログインID）*</label><input id=\"aaEmail\" type=\"email\" placeholder=\"partner@example.com\"></div>\n      <div class=\"field full\"><label>パスワード *</label>\n        <div style=\"display:flex;gap:8px\"><input id=\"aaPw\" type=\"text\" value=\"${genPw()}\" style=\"flex:1\"><button class=\"btn btn-ghost btn-sm\" data-act=\"aa-genpw\" style=\"flex-shrink:0\">生成</button></div></div>\n    </div>\n    <div class=\"cell-sub\" style=\"margin:2px 2px 6px;font-size:11px;line-height:1.6\">※登録後、Supabase → Authentication → Add user で<strong>同じメール・パスワード</strong>のユーザーを作成し、表示される紐付けSQLを実行してください。</div>\n    <div class=\"modal-actions\"><button class=\"btn btn-ghost\" data-act=\"closemodal\">キャンセル</button>\n      <button class=\"btn btn-primary\" data-act=\"save-new-account\">追加</button></div>`);\n}\nfunction saveNewAccount(){\n  const name=(val('aaName')||'').trim(), contact=(val('aaContact')||'').trim(), email=(val('aaEmail')||'').trim(), pw=(val('aaPw')||'').trim();\n  if(!name){ toast('会社名を入力してください'); return; }\n  if(!email||!/.+@.+\\..+/.test(email)){ toast('メールアドレスを入力してください'); return; }\n  if(!pw||pw.length<4){ toast('4文字以上のパスワードを入力してください'); return; }\n  let n=DB.agencies.length, nid; do{ nid='AG-'+String(n).padStart(2,'0'); n++; }while(DB.agencies.some(a=>a.id===nid));\n  DB.agencies.push({id:nid, code:'', name, contact, email, status:'active', source:'manual', joined:todayISO(), pw});\n  save(); closeModal(); toast(`${name} を追加しました`);\n  viewAccounts();\n  showModal(`\n    <div class=\"modal-title\">Supabaseでの紐付け</div>\n    <div class=\"modal-sub\">${esc(name)}（${esc(email)}）を本番でログインできるようにする手順</div>\n    <ol style=\"font-size:13px;line-height:1.8;padding-left:20px;margin:4px 0 12px\">\n      <li>Supabase → Authentication → <strong>Add user</strong> で、メール <span class=\"mono\">${esc(email)}</span> ／ 上記パスワードのユーザーを作成（Auto Confirm User をオン）</li>\n      <li>作成したユーザーの <strong>UID</strong> をコピー</li>\n      <li>SQL Editor で下記を実行（UIDを差し替え）：</li>\n    </ol>\n    <div class=\"field\"><textarea rows=\"3\" readonly style=\"font-family:var(--mono);font-size:11.5px\">update agencies set auth_user_id = 'ここにUID' where id = '${nid}';</textarea></div>\n    <div class=\"modal-actions\"><button class=\"btn btn-primary\" data-act=\"closemodal\">閉じる</button></div>`);\n}\nfunction modalChangeEmail(agId){\n  const a=agency(agId); if(!a) return;\n  showModal(`\n    <div class=\"modal-title\">メールアドレス変更</div>\n    <div class=\"modal-sub\">${esc(a.name)} のログインID（メール）を変更します</div>\n    <div class=\"field full\"><label>メールアドレス</label><input id=\"newEmailInput\" type=\"email\" value=\"${esc(a.email||'')}\"></div>\n    <div class=\"cell-sub\" style=\"margin:2px 2px 6px;font-size:11px\">※Supabase Authentication 側のメールも同じ値に揃えてください。</div>\n    <div class=\"modal-actions\"><button class=\"btn btn-ghost\" data-act=\"closemodal\">キャンセル</button>\n      <button class=\"btn btn-primary\" data-act=\"save-account-email\" data-id=\"${agId}\">保存</button></div>`);\n}\nfunction saveAccountEmail(agId){\n  const a=agency(agId); if(!a) return;\n  const email=(val('newEmailInput')||'').trim();\n  if(email&&!/.+@.+\\..+/.test(email)){ toast('正しいメールアドレスを入力してください'); return; }\n  a.email=email; save(); closeModal(); toast('メールアドレスを更新しました'); viewAccounts();\n}\nfunction viewLoginLogs(){\n  setHeader('ログイン履歴', '各パートナーのログイン記録');\n  const c=document.getElementById('content');\n  const logs=(DB.logins||[]).slice().sort((a,b)=>a.at<b.at?1:-1).slice(0,200);\n  const agSearch=document.createElement('div'); // filter state\n  c.innerHTML=`<div class=\"content-narrow\">\n    <div class=\"toolbar\" style=\"margin-bottom:14px\">\n      <div class=\"search\" style=\"max-width:280px\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"M21 21l-4.35-4.35\"/></svg>\n        <input id=\"logSearch\" placeholder=\"パートナー名で絞り込み\"></div>\n      <select class=\"fsel\" id=\"logResult\">\n        <option value=\"\">すべて</option>\n        <option value=\"ok\">成功</option>\n        <option value=\"fail\">失敗</option>\n      </select>\n    </div>\n    <div class=\"panel tbl-wrap\">\n      <table class=\"tbl\" id=\"logTable\"><thead><tr>\n        <th>日時</th><th>パートナー</th><th>担当</th><th>方法</th><th>結果</th>\n      </tr></thead><tbody id=\"logBody\">\n      ${renderLogRows(logs, '', '')}\n      </tbody></table>\n    </div>\n  </div>`;\n  document.getElementById('logSearch').addEventListener('input', e=>rerenderLogs());\n  document.getElementById('logResult').addEventListener('change', ()=>rerenderLogs());\n}\nfunction renderLogRows(logs, q, result){\n  if(!logs.length) return `<tr><td colspan=\"5\">${emptyState('ログインログがありません','パートナーがログインすると記録されます')}</td></tr>`;\n  return logs.filter(l=>{\n    const a=agency(l.ag);\n    if(q && !(a&&a.name.includes(q))) return false;\n    if(result==='ok' && !l.ok) return false;\n    if(result==='fail' && l.ok) return false;\n    return true;\n  }).map(l=>{\n    const a=agency(l.ag);\n    return `<tr>\n      <td class=\"mono cell-sub\" style=\"white-space:nowrap\">${esc(l.at)}</td>\n      <td class=\"cell-strong\">${esc(a?a.name:l.ag)}</td>\n      <td class=\"cell-sub\">${esc(a?a.contact||'—':'—')}</td>\n      <td class=\"cell-sub\">${esc(l.via||'パスワード')}</td>\n      <td>${l.ok?'<span class=\"badge bd-joined\">成功</span>':'<span class=\"badge bd-rejected\">失敗</span>'}</td>\n    </tr>`;\n  }).join('') || `<tr><td colspan=\"5\" style=\"text-align:center;color:var(--muted);padding:20px\">該当なし</td></tr>`;\n}\nfunction rerenderLogs(){\n  const q=(document.getElementById('logSearch').value||'').trim();\n  const result=document.getElementById('logResult').value;\n  const logs=(DB.logins||[]).slice().sort((a,b)=>a.at<b.at?1:-1).slice(0,200);\n  const body=document.getElementById('logBody');\n  if(body) body.innerHTML=renderLogRows(logs, q, result);\n}\nfunction modalChangePw(agId, regen){\n  const a=agency(agId); if(!a) return;\n  if(regen){\n    const newPw=genPw();\n    if(!confirm(`${a.name} のパスワードを再発行しますか？\\n新パスワード: ${newPw}`)) return;\n    a.pw=newPw; save();\n    toast(`新パスワードを発行しました: ${newPw}`);\n    viewAccounts(); return;\n  }\n  showModal(`\n    <div class=\"modal-title\">パスワード変更</div>\n    <div class=\"modal-sub\">${esc(a.name)} のログインパスワードを変更します</div>\n    <div class=\"field\"><label>新しいパスワード</label>\n      <div style=\"display:flex;gap:8px\">\n        <input id=\"newPwInput\" type=\"text\" value=\"${genPw()}\" style=\"flex:1\">\n        <button class=\"btn btn-ghost btn-sm\" data-act=\"genpw-modal\">生成</button>\n      </div>\n    </div>\n    <div class=\"modal-actions\">\n      <button class=\"btn btn-ghost\" data-act=\"closemodal\">キャンセル</button>\n      <button class=\"btn btn-primary\" data-act=\"save-account-pw\" data-id=\"${agId}\">保存</button>\n    </div>`);\n}\nfunction saveAccountPw(agId){\n  const a=agency(agId); if(!a) return;\n  const pw=(document.getElementById('newPwInput').value||'').trim();\n  if(!pw||pw.length<4){ toast('4文字以上のパスワードを入力してください'); return; }\n  a.pw=pw; save(); closeModal();\n  toast(`${a.name} のパスワードを変更しました`);\n  viewAccounts();\n}\n\nfunction viewTasks(){\n  const isK=S.role==='kanoa';\n  setHeader('タスク', isK?'自分のTODOと、パートナーへの依頼':'自分のTODOと、KANOAへの依頼',\n    `<button class=\"btn btn-ghost btn-sm\" data-act=\"task-add-prompt\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/></svg>自分のタスク</button>\n     <button class=\"btn btn-primary btn-sm\" data-act=\"task-assign-prompt\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z\"/></svg>${isK?'パートナーに依頼':'KANOAに依頼'}</button>`);\n  const me=meId();\n  const mine=myTasks();                 // 自分が担当\n  const sent=tasksIAssigned();          // 自分が依頼した（相手担当）\n  const open=mine.filter(t=>!t.done), done=mine.filter(t=>t.done);\n  const sentOpen=sent.filter(t=>!t.done), sentDone=sent.filter(t=>t.done);\n  const c=document.getElementById('content');\n\n  // 担当タスク行（依頼元バッジつき）\n  const taskRow=t=>{ const a=t.ag?agency(t.ag):null; const fromOther=(t.from||t.owner)!==me;\n    const overdue=t.due && t.due<todayISO() && !t.done;\n    return `<div class=\"info-row\">\n      <button class=\"task-check ${t.done?'on':''}\" data-act=\"task-toggle\" data-id=\"${t.id}\">${t.done?'<svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"M20 6L9 17l-5-5\"/></svg>':''}</button>\n      <div class=\"info-val\"><div style=\"${t.done?'text-decoration:line-through;color:var(--muted)':'font-weight:500'}\">${fromOther?`<span class=\"task-tag task-tag-req\">${esc(partyLabel(t.from))}から依頼</span> `:''}${esc(t.text)}</div>\n        <div class=\"cell-sub\" style=\"margin-top:2px\">${a&&isK?esc(a.name)+' · ':''}${t.due?`<span style=\"${overdue?'color:var(--r);font-weight:600':''}\">期限 ${esc(t.due)}</span>`:'期限なし'}</div></div>\n      ${taskThreadBtn(t)}\n      <button class=\"copy-btn\" data-act=\"task-del\" data-id=\"${t.id}\">削除</button>\n    </div>`;\n  };\n  // 依頼中タスク行（依頼先＋進捗）\n  const sentRow=t=>{ const overdue=t.due && t.due<todayISO() && !t.done;\n    return `<div class=\"info-row\">\n      <span class=\"task-check ${t.done?'on':''}\" style=\"cursor:default\">${t.done?'<svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"M20 6L9 17l-5-5\"/></svg>':''}</span>\n      <div class=\"info-val\"><div style=\"${t.done?'color:var(--muted)':'font-weight:500'}\"><span class=\"task-tag task-tag-to\">${esc(partyLabel(t.owner))}へ依頼</span> ${esc(t.text)}</div>\n        <div class=\"cell-sub\" style=\"margin-top:2px\">${t.done?'<span style=\"color:var(--g);font-weight:600\">完了済み</span>':`<span style=\"${overdue?'color:var(--r);font-weight:600':''}\">${t.due?'期限 '+esc(t.due):'相手の対応待ち'}</span>`}</div></div>\n      ${taskThreadBtn(t)}\n      <button class=\"copy-btn\" data-act=\"task-del\" data-id=\"${t.id}\">取消</button>\n    </div>`;\n  };\n\n  c.innerHTML=`<div class=\"content-narrow\">\n    <div class=\"kpi-grid\" style=\"grid-template-columns:repeat(3,1fr);max-width:560px\">\n      ${kpi('未完了', open.length+'<span class=\"unit\">件</span>','var(--accent)')}\n      ${kpi('依頼中', sentOpen.length+'<span class=\"unit\">件</span>','var(--a)')}\n      ${kpi('完了', done.length+'<span class=\"unit\">件</span>','var(--g)')}\n    </div>\n    <div class=\"sect\"><div class=\"sect-head\"><div class=\"sect-title\">自分のタスク（未完了）</div></div>\n      <div class=\"panel\">${open.length?open.map(taskRow).join(''):emptyState('未完了のタスクはありません','連絡の受信メッセージから「タスク化」「相手に依頼」できます')}</div></div>\n    <div class=\"sect\"><div class=\"sect-head\"><div class=\"sect-title\">${isK?'パートナーへ依頼中':'KANOAへ依頼中'}</div><div class=\"sect-sub\">相手が対応するタスク</div></div>\n      <div class=\"panel\">${sentOpen.length?sentOpen.map(sentRow).join(''):`<div class=\"cell-sub\" style=\"padding:10px 2px\">依頼中のタスクはありません。「${isK?'パートナーに依頼':'KANOAに依頼'}」から投げられます。</div>`}\n        ${sentDone.length?sentDone.map(sentRow).join(''):''}</div></div>\n    ${done.length?`<div class=\"sect\"><div class=\"sect-head\"><div class=\"sect-title\">完了</div></div><div class=\"panel\">${done.map(taskRow).join('')}</div></div>`:''}\n  </div>`;\n}\n// タスクに紐づく連絡へのリンク（相手スレッド or 候補者スレッド）\nfunction taskThreadBtn(t){\n  const isK=S.role==='kanoa';\n  if(isK){\n    const ag = t.ag || (t.owner!=='kanoa'?t.owner:(t.from!=='kanoa'?t.from:null));\n    if(!ag) return '';\n    if(t.refId) return `<button class=\"copy-btn\" data-act=\"open-cand-thread\" data-ag=\"${ag}\" data-ref=\"${t.refId}\">連絡</button>`;\n    return `<button class=\"copy-btn\" data-act=\"open-thread\" data-ag=\"${ag}\">連絡</button>`;\n  } else {\n    if(t.refId) return `<button class=\"copy-btn\" data-act=\"open-cand-thread\" data-ag=\"${S.agencyId}\" data-ref=\"${t.refId}\">連絡</button>`;\n    return `<button class=\"copy-btn\" data-act=\"open-general-thread\">連絡</button>`;\n  }\n}\n// タスク依頼モーダル（相手にタスクを投げる）\nfunction modalAssignTask(presetTo, presetRef){\n  const isK=S.role==='kanoa';\n  let agOptions='';\n  if(isK){\n    const ags=DB.agencies.filter(a=>a.status==='active');\n    agOptions=`<div class=\"field full\"><label>依頼先パートナー</label><select id=\"atTo\">${ags.map(a=>`<option value=\"${a.id}\" ${presetTo===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>`;\n  }\n  // 候補者（任意）：KANOAは依頼先の送客、パートナーは自社の送客\n  const refScope = isK ? null : S.agencyId;\n  const candSelect = `<div class=\"field full\"><label>関連する候補者（任意）</label><select id=\"atRef\"><option value=\"\">指定しない</option>${\n    DB.referrals.filter(r=> isK ? true : r.ag===S.agencyId).map(r=>`<option value=\"${r.id}\" data-ag=\"${r.ag}\" ${presetRef===r.id?'selected':''}>${esc(r.name)} · ${esc(shortPjName(r.pj))}${isK?' ('+esc(partyLabel(r.ag))+')':''}</option>`).join('')\n  }</select></div>`;\n  showModal(`\n    <div class=\"modal-title\">${isK?'パートナーにタスクを依頼':'KANOAにタスクを依頼'}</div>\n    <div class=\"modal-sub\">「これやっておいて」を相手のタスクとして投げます。相手の連絡にも自動で通知されます。</div>\n    ${agOptions}\n    ${candSelect}\n    <div class=\"field full\"><label>依頼内容</label><textarea id=\"atText\" rows=\"3\" placeholder=\"例：${isK?'田中さんの履歴書を顔写真付きで再提出してください':'石川さんの内定通知書の発行をお願いします'}\"></textarea></div>\n    <div class=\"field full\"><label>期限（任意）</label><input type=\"date\" id=\"atDue\"></div>\n    <div class=\"modal-actions\"><button class=\"btn btn-ghost\" data-act=\"closemodal\">キャンセル</button>\n      <button class=\"btn btn-primary\" data-act=\"task-assign-save\">依頼を送る</button></div>`);\n}\nfunction saveAssignTask(){\n  const isK=S.role==='kanoa';\n  const text=val('atText'); if(!text){ toast('依頼内容を入力してください'); return; }\n  const to = isK ? (val('atTo')||null) : 'kanoa';\n  if(isK && !to){ toast('依頼先を選んでください'); return; }\n  const refId = val('atRef')||null;\n  const due = val('atDue')||'';\n  // 候補者が指定されていれば、その送客のパートナーを ag とする\n  let ag = isK ? to : S.agencyId;\n  if(refId){ const r=DB.referrals.find(x=>x.id===refId); if(r) ag=r.ag; }\n  assignTask(text, to, ag, refId, due);\n  // 相手の連絡（候補者スレッド or 全体）に依頼メッセージを自動投稿\n  const note = `【タスク依頼】${text}${due?`（期限 ${due}）`:''}`;\n  if(isK){ DB.messages.push({id:uid('M'), ag:to, from:'kanoa', text:note, ts:nowTS(), read:false, refId:refId||null}); }\n  else   { DB.messages.push({id:uid('M'), ag:S.agencyId, from:'agency', text:note, ts:nowTS(), read:false, refId:refId||null}); }\n  save(); closeModal(); updateNavCounts();\n  toast(`${isK?partyLabel(to):'KANOA'}にタスクを依頼しました`);\n  viewTasks();\n}\nfunction modalImplGuide(){\n  showModal(`\n    <div class=\"modal-title\">実装ガイド（Supabase）</div>\n    <div class=\"modal-sub\"><b>シンプル設計：KANOAアドミンのみ Supabase Auth。パートナーは agencies テーブルのID/PW照合。</b></div>\n    <div style=\"font-size:13px;line-height:1.7;color:var(--ink-soft)\">\n      <div class=\"flow-steps\">\n        <div class=\"flow-step\"><div class=\"flow-num\">1</div><div class=\"flow-body\"><strong>スキーマ投入</strong><span>SQL Editor で <b>relay-schema.sql</b> を実行。<b>login_logs</b>テーブルも含まれます。</span></div></div>\n        <div class=\"flow-step\"><div class=\"flow-num\">2</div><div class=\"flow-body\"><strong>KANOAアドミンのみ Auth 設定</strong><span>Auth でKANOA管理者のユーザーを作成 → UUID を <b>kanoa_admins</b> に insert。パートナーは Auth 不使用。</span></div></div>\n        <div class=\"flow-step\"><div class=\"flow-num\">3</div><div class=\"flow-body\"><strong>RLS設定</strong><span>agencies テーブルの pw_hash 列は KANOA管理者のみ SELECT 可（RLSポリシー）。login_logsもKANOAのみ閲覧。パートナーは自社行のみ読み取り。</span></div></div>\n        <div class=\"flow-step\"><div class=\"flow-num\">4</div><div class=\"flow-body\"><strong>パートナーログイン照合</strong><span>本番は Edge Function <b>partner-login</b> を使用（service_role で pw_hash 照合）。またはKANOAサーバー経由で照合してセッショントークン発行。</span></div></div>\n        <div class=\"flow-step\"><div class=\"flow-num\">5</div><div class=\"flow-body\"><strong>キーを設定してデプロイ</strong><span>CONFIG.SB_URL / SB_ANON_KEY を設定 → 本番モードに自動切替。Netlify / Vercel にHTTPSでデプロイ。</span></div></div>\n      </div>\n    </div>\n    <div class=\"modal-actions\"><button class=\"btn btn-primary\" data-act=\"closemodal\">閉じる</button></div>`);\n}\nlet bcSelected = null;  // 一斉連絡の送信先（Set of agencyId）。nullなら未初期化\nfunction modalBroadcast(){\n  const ags=DB.agencies.filter(a=>a.status==='active');\n  // 初期状態は全選択（従来の挙動を維持）\n  bcSelected = new Set(ags.map(a=>a.id));\n  renderBroadcastModal();\n}\nfunction renderBroadcastModal(){\n  const ags=DB.agencies.filter(a=>a.status==='active');\n  const sel=bcSelected||new Set();\n  const chips = ags.map(a=>{\n    const on=sel.has(a.id);\n    return `<button type=\"button\" class=\"bc-chip\" data-act=\"bc-toggle\" data-ag=\"${a.id}\"\n      style=\"display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;cursor:pointer;font-size:12.5px;transition:all .12s;\n      border:1.5px solid ${on?'var(--accent)':'var(--line)'};background:${on?'var(--accent-soft)':'var(--surface)'};color:${on?'var(--accent)':'var(--muted)'};font-weight:${on?'600':'500'}\">\n      <span style=\"width:20px;height:20px;border-radius:50%;background:${agColor(a.id)};color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700\">${esc((a.name||'?').slice(0,1))}</span>\n      ${esc(a.name)}\n      <span style=\"font-size:14px;line-height:1;opacity:${on?'1':'0.3'}\">${on?'×':'＋'}</span>\n    </button>`;\n  }).join('');\n  const cnt=sel.size;\n  showModal(`\n    <div class=\"modal-title\">一斉連絡</div>\n    <div class=\"modal-sub\">送信先を選んでメッセージを送ります。不要な相手はタップで解除できます。</div>\n    <div class=\"field full\" style=\"margin-bottom:6px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px\">\n        <label style=\"margin:0\">送信先（${cnt}/${ags.length}社）</label>\n        <div style=\"display:flex;gap:6px\">\n          <button type=\"button\" class=\"btn btn-ghost btn-sm\" data-act=\"bc-all\" style=\"padding:3px 10px;font-size:11.5px\">全選択</button>\n          <button type=\"button\" class=\"btn btn-ghost btn-sm\" data-act=\"bc-none\" style=\"padding:3px 10px;font-size:11.5px\">全解除</button>\n        </div>\n      </div>\n      <div style=\"display:flex;flex-wrap:wrap;gap:7px;max-height:26vh;overflow-y:auto;padding:2px\">${chips||'<span class=\"cell-sub\">提携中のパートナーがいません</span>'}</div>\n    </div>\n    <div class=\"field full\"><label>メッセージ</label><textarea id=\"bcInput\" rows=\"5\" placeholder=\"例：【新案件のご案内】楽天案件に加え、来週より新しい大型案件を公開予定です。送客枠を確保したい方はご連絡ください。\">${esc(bcDraft||'')}</textarea></div>\n    <div class=\"modal-actions\"><button class=\"btn btn-ghost\" data-act=\"closemodal\">キャンセル</button>\n      <button class=\"btn btn-primary\" data-act=\"send-broadcast\" ${cnt?'':'disabled'}>${cnt}社へ送信</button></div>`);\n  const ta=document.getElementById('bcInput');\n  if(ta) ta.addEventListener('input', ()=>{ bcDraft=ta.value; });\n}\nlet bcDraft='';\nfunction sendBroadcast(){\n  const text=val('bcInput'); if(!text){ toast('メッセージを入力してください'); return; }\n  const sel=bcSelected||new Set();\n  const ags=DB.agencies.filter(a=>a.status==='active' && sel.has(a.id));\n  if(!ags.length){ toast('送信先を1社以上選んでください'); return; }\n  ags.forEach(a=>DB.messages.push({id:uid('M'),ag:a.id,from:'kanoa',text,ts:nowTS(),read:false,refId:null}));\n  bcDraft=''; bcSelected=null;\n  save(); closeModal(); updateNavCounts();\n  if(S.view==='messages' && !S.threadAg) viewMessages();\n  toast(`${ags.length}社へ一斉連絡を送信しました`);\n}\n\n/* ════════════════════ 候補者へ一括送信 ════════════════════ */\nconst BULK_TEMPLATES=[\n  {label:'選考会のご案内', text:'【選考会のご案内】\\n選考会の詳細が確定しましたのでご案内します。\\n■日時：〇月〇日（〇）〇〇:〇〇〜\\n■形式：オンライン（Web）\\n■URL：（当日のミーティングURL）\\n■所要時間：約1時間（一次＋最終）\\n■持ち物：本人確認書類、筆記用具\\n候補者へのご共有をお願いします。'},\n  {label:'オンラインURL', text:'オンライン選考会のURLをお送りします。\\nURL：https://\\n開始5分前にはご入室いただくよう、候補者へご案内をお願いします。'},\n  {label:'書類リマインド', text:'必要書類のご提出リマインドです。\\n・選考会前：履歴書／職務経歴書\\n・内定後：源泉徴収票／直近3ヶ月の給与明細（賞与があれば賞与明細も）\\n本ポータルの資料欄へのアップロードをお願いします。'},\n  {label:'日程候補のお願い', text:'選考会の日程調整です。下記より候補日を3つほどご提示ください。\\n・第1希望：\\n・第2希望：\\n・第3希望：'},\n  {label:'結果のご連絡', text:'選考結果のご連絡です。詳細は各候補者のスレッドにてお伝えします。引き続きよろしくお願いします。'},\n];\nlet bulkSel=new Set();\nlet bulkFilter={q:'',pj:'',status:''};\nfunction bulkCandidates(){\n  let rs=DB.referrals.filter(r=>r.status!=='rejected');\n  if(S.role!=='kanoa') rs=rs.filter(r=>r.ag===S.agencyId);\n  return rs;\n}\nfunction bulkFiltered(){\n  const q=(bulkFilter.q||'').trim().toLowerCase();\n  return bulkCandidates().filter(r=>{\n    if(bulkFilter.pj && r.pj!==bulkFilter.pj) return false;\n    if(bulkFilter.status && r.status!==bulkFilter.status) return false;\n    if(q){ const hay=`${r.name||''} ${r.kana||''} ${agency(r.ag)?agency(r.ag).name:''}`.toLowerCase(); if(!hay.includes(q)) return false; }\n    return true;\n  });\n}\nfunction renderBulkList(){\n  const wrap=document.getElementById('bulkList'); if(!wrap) return;\n  const rows=bulkFiltered();\n  const isK=S.role==='kanoa';\n  wrap.innerHTML = rows.length ? rows.map(r=>{\n    const checked=bulkSel.has(r.id);\n    return `<label class=\"bulk-row ${checked?'on':''}\">\n      <input type=\"checkbox\" class=\"bulk-cb\" data-act=\"bulk-sel\" data-id=\"${r.id}\" ${checked?'checked':''}>\n      <span class=\"bulk-av\" style=\"background:${agColor(r.ag)}\">${esc((r.name||'？').slice(0,1))}</span>\n      <span class=\"bulk-main\"><span class=\"bulk-name\">${esc(r.name)} ${statusBadge(r.status)}</span>\n        <span class=\"bulk-sub\">${esc(shortPjName(r.pj))}${isK?' · '+esc(agency(r.ag)?agency(r.ag).name:r.ag):''}</span></span>\n    </label>`;\n  }).join('') : `<div class=\"cell-sub\" style=\"padding:14px;text-align:center\">該当する候補者がいません</div>`;\n  updateBulkCount();\n}\nfunction updateBulkCount(){\n  const cnt=document.getElementById('bulkCount'); if(cnt) cnt.textContent=`${bulkSel.size}名を選択`;\n  const btn=document.getElementById('bulkSendBtn'); if(btn) btn.textContent=`${bulkSel.size||''}名に送信`.replace('名に送信',bulkSel.size?'名に送信':'送信');\n  const all=document.getElementById('bulkSelAll'); if(all){ const rows=bulkFiltered(); all.checked = rows.length>0 && rows.every(r=>bulkSel.has(r.id)); }\n}\n/* ════════════════════ Supabase 接続設定 ════════════════════ */\nfunction supaCfgGet(){ try{ return JSON.parse(localStorage.getItem('kanoa_supa_cfg')||'null')||{}; }catch(e){ return {}; } }\nfunction modalSupaConfig(){\n  const cfg=supaCfgGet();\n  const curUrl = (cfg && typeof cfg.url==='string') ? cfg.url : CONFIG.SB_URL;\n  const curKey = (cfg && typeof cfg.key==='string') ? cfg.key : CONFIG.SB_ANON_KEY;\n  showModal(`\n    <div class=\"modal-title\">Supabase 接続設定</div>\n    <div class=\"modal-sub\">${DEMO_MODE?'現在は<b>デモモード</b>です。':'現在 <b style=\"color:var(--g)\">本番モード（接続中）</b>。'}Supabase の <b>Project URL</b> と <b>anon / publishable key</b>（Settings → API）を貼り付けて切り替えできます。</div>\n    <div class=\"field full\"><label>Project URL</label><input id=\"supaUrl\" placeholder=\"https://xxxxxxxx.supabase.co\" value=\"${esc(curUrl)}\" autocomplete=\"off\" spellcheck=\"false\"></div>\n    <div class=\"field full\"><label>anon / publishable key</label><input id=\"supaKey\" placeholder=\"sb_publishable_... または eyJ...\" value=\"${esc(curKey)}\" autocomplete=\"off\" spellcheck=\"false\"></div>\n    <div id=\"supaTestMsg\" class=\"cell-sub\" style=\"margin:2px 2px 6px;line-height:1.5;min-height:18px\"></div>\n    <div style=\"background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:11.5px;color:var(--muted);line-height:1.6;margin-bottom:6px\">\n      事前に必要：① Supabaseプロジェクト ② <b>relay-schema.sql</b> を実行 ③ KANOA管理者を <code>kanoa_admins</code> に登録 ④ 各パートナーを <code>agencies.auth_user_id</code> に紐付け。<br>※anon / publishable key は公開鍵です（RLSで保護）。\n    </div>\n    <div class=\"modal-actions\">\n      <button class=\"btn btn-ghost\" data-act=\"supa-demo\">デモに戻す</button>\n      <button class=\"btn btn-ghost\" data-act=\"supa-test\">接続テスト</button>\n      <button class=\"btn btn-primary\" data-act=\"supa-save\">保存して接続</button>\n    </div>`);\n}\nasync function supaTest(){\n  const el=document.getElementById('supaTestMsg');\n  const url=(val('supaUrl')||'').trim(), key=(val('supaKey')||'').trim();\n  if(!url||!key){ if(el) el.innerHTML='<span style=\"color:var(--a)\">URL と anon key を入力してください</span>'; return; }\n  if(el) el.textContent='接続中…';\n  try{\n    if(!window.supabase){ await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }\n    const c=window.supabase.createClient(url,key);\n    const { error } = await c.from('agencies').select('id').limit(1);\n    if(error){ if(el) el.innerHTML='<span style=\"color:var(--a)\">接続はできましたが agencies テーブルが見つかりません。先に relay-schema.sql を実行してください。（'+esc(error.message)+'）</span>'; }\n    else { if(el) el.innerHTML='<span style=\"color:var(--g)\">✓ 接続成功・スキーマ確認OK。「保存して接続」で本番モードに切り替わります。</span>'; }\n  }catch(e){ if(el) el.innerHTML='<span style=\"color:var(--r)\">接続に失敗しました。URL / key をご確認ください。</span>'; }\n}\n\nfunction modalBulkSend(preIds){\n  bulkSel = new Set(preIds||[]);\n  bulkFilter = {q:'', pj:(S.role==='kanoa'?msgFilter.pj:''), status:''};\n  const isK=S.role==='kanoa';\n  const projects=DB.projects;\n  const pjChips = (isK && projects.length>1) ? `<div class=\"chips\" style=\"margin-bottom:8px\">\n    <button class=\"chip ${!bulkFilter.pj?'on':''}\" data-act=\"bulk-pj\" data-pj=\"\">全案件</button>\n    ${projects.map(p=>`<button class=\"chip ${bulkFilter.pj===p.id?'on':''}\" data-act=\"bulk-pj\" data-pj=\"${p.id}\">${esc(shortPjName(p.id).slice(0,8))}</button>`).join('')}\n  </div>` : '';\n  const statusChips = `<div class=\"chips\" style=\"margin-bottom:10px\">\n    <button class=\"chip ${!bulkFilter.status?'on':''}\" data-act=\"bulk-status-filter\" data-s=\"\">全ステータス</button>\n    ${['entry','screening','interview','offer','joined'].map(s=>`<button class=\"chip ${bulkFilter.status===s?'on':''}\" data-act=\"bulk-status-filter\" data-s=\"${s}\">${STATUS[s].label}</button>`).join('')}\n  </div>`;\n  showModal(`\n    <div class=\"modal-title\">候補者へ一括送信</div>\n    <div class=\"modal-sub\">選んだ候補者それぞれの連絡スレッドに、同じ内容をまとめて送ります（自由入力）。${isK?'相手のパートナーに届きます。':'KANOAに届きます。'}</div>\n    <input id=\"bulkSearch\" class=\"msg-search\" style=\"padding-left:12px;margin-bottom:8px\" placeholder=\"候補者名・パートナーで絞り込み\" autocomplete=\"off\">\n    ${pjChips}${statusChips}\n    <div class=\"bulk-list-head\">\n      <label style=\"display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px;font-weight:600\"><input type=\"checkbox\" id=\"bulkSelAll\" data-act=\"bulk-sel-all\">表示中をすべて選択</label>\n      <span id=\"bulkCount\" class=\"cell-sub\">0名を選択</span>\n    </div>\n    <div id=\"bulkList\" class=\"bulk-list\"></div>\n    <div class=\"bulk-tmpls\">${BULK_TEMPLATES.map((t,i)=>`<button class=\"tmpl-chip\" data-act=\"bulk-tmpl\" data-i=\"${i}\">${esc(t.label)}</button>`).join('')}</div>\n    <div class=\"field full\"><label>送信内容</label><textarea id=\"bulkText\" rows=\"6\" placeholder=\"例）【選考会のご案内】日時・オンラインURL・持ち物など。テンプレートから挿入して編集できます。\"></textarea></div>\n    <div class=\"modal-actions\"><button class=\"btn btn-ghost\" data-act=\"closemodal\">キャンセル</button>\n      <button class=\"btn btn-primary\" id=\"bulkSendBtn\" data-act=\"bulk-send\">送信</button></div>`);\n  renderBulkList();\n}\nfunction sendBulk(){\n  const text=val('bulkText'); if(!text||!text.trim()){ toast('送信内容を入力してください'); return; }\n  if(!bulkSel.size){ toast('送信先の候補者を選んでください'); return; }\n  const role=meRole(); let n=0;\n  bulkSel.forEach(id=>{ const r=DB.referrals.find(x=>x.id===id); if(!r) return;\n    DB.messages.push({id:uid('M'), ag:r.ag, from:role, text:text.trim(), ts:nowTS(), read:false, refId:r.id}); n++; });\n  DB.activity.unshift({ts:nowTS(), actor:(role==='kanoa'?'KANOA':(agency(S.agencyId)?agency(S.agencyId).name:S.agencyId)), action:'一括送信', detail:`${n}名の候補者へ送信`});\n  save(); bulkSel.clear(); closeModal(); updateNavCounts();\n  toast(`${n}名の候補者へ送信しました`);\n  if(S.view==='messages') viewMessages();\n}\n\n/* ════════════════════ EMPTY ════════════════════ */\nfunction selDataCard(refs){\n  const d=selData(refs);\n  const cell=(v,l,pct)=>`<div class=\"seldata-cell\"><div class=\"seldata-v\">${v}</div><div class=\"seldata-l\">${l}</div>${pct!=null?`<div class=\"seldata-bar\"><span style=\"width:${pct}%\"></span></div>`:''}</div>`;\n  return `<div class=\"seldata\">${cell(d.N,'送客',null)}${cell(d.docRate+'%','書類通過率',d.docRate)}${cell(d.offerRate+'%','内定率',d.offerRate)}${cell(d.joinRate+'%','入社率',d.joinRate)}</div>`;\n}\nfunction agentInfoBlock(p){\n  if(!(p.headcount||p.passNote||p.caseStudy||p.seminar)) return '';\n  const row=(l,v)=>v?`<div class=\"info-row\"><span class=\"info-label\">${l}</span><span class=\"info-val\">${esc(v)}</span></div>`:'';\n  return `<div class=\"dt-block\"><div class=\"dt-block-title\">エージェント限定情報</div>\n    <div class=\"info-card\">${row('募集人数',p.headcount)}${row('書類通過の傾向',p.passNote)}${row('内定者事例',p.caseStudy)}${row('説明会',p.seminar)}</div></div>`;\n}\n// 案件詳細の拡張セクション（会社概要・年収・インセンティブ・キャリアパス・選考会・面接・報酬/返金・FAQ・リンク）\nfunction ulBlock(title, items){ if(!items||!items.length) return ''; return `<div class=\"dt-block\"><div class=\"dt-block-title\">${title}</div><ul class=\"req-list\">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`; }\nfunction projectRichSections(p){\n  let h='';\n  // 必要書類（ステージ別）\n  if(p.docReqs){\n    const iv=p.docReqs.interview, of=p.docReqs.offer;\n    h+=`<div class=\"cond-card\"><div class=\"eyebrow\">必要書類（ステージ別）</div>\n      ${iv?`<p style=\"margin:0 0 5px\"><b>選考会へ進む前：</b>${esc((iv.required||[]).join('・'))} が揃わないと選考会に進めません。</p>`:''}\n      ${of?`<p style=\"margin:0\"><b>内定後すぐ：</b>${esc((of.required||[]).join('・'))}${of.optional&&of.optional.length?`（賞与の支払いがあれば ${esc(of.optional.join('・'))} も）`:''}。オファー提示に必要です。</p>`:''}</div>`;\n  }\n  h+=ulBlock('会社概要', p.companyOverview);\n  h+=ulBlock('想定年収', p.incomeRange);\n  h+=ulBlock('インセンティブ・賞与', p.incentives);\n  if(p.careerPath&&p.careerPath.length){\n    h+=`<div class=\"dt-block\"><div class=\"dt-block-title\">キャリアパス</div>\n      <div class=\"career-path\">${p.careerPath.map((s,i)=>`<span class=\"cp-step\">${esc(s)}</span>${i<p.careerPath.length-1?'<span class=\"cp-arrow\">→</span>':''}`).join('')}</div>\n      ${p.careerNote?`<p class=\"cell-sub\" style=\"margin-top:9px;line-height:1.6\">${esc(p.careerNote)}</p>`:''}</div>`;\n  }\n  if(p.selection){\n    h+=`<div class=\"dt-block\"><div class=\"dt-block-title\">1Day選考会</div><dl class=\"kv\">\n      ${p.selection.format?`<dt>形式</dt><dd>${esc(p.selection.format)}</dd>`:''}\n      ${p.selection.start?`<dt>開催</dt><dd>${esc(p.selection.start)}</dd>`:''}\n      ${p.selection.deadline?`<dt>締切</dt><dd style=\"color:var(--r);font-weight:600\">${esc(p.selection.deadline)}</dd>`:''}\n    </dl></div>`;\n  }\n  if((p.preTasks&&p.preTasks.length)||(p.preDocs&&p.preDocs.length)){\n    h+=`<div class=\"cond-card\"><div class=\"eyebrow\">選考会前の事前対応・書類回収（送客者対応）</div>\n      ${p.preTasks&&p.preTasks.length?`<p style=\"margin:0 0 6px\"><b>事前対応：</b>${p.preTasks.map(esc).join(' ／ ')}</p>`:''}\n      ${p.preDocs&&p.preDo \"2.5\"><path d=\"M20 6L9 17l-5-5\"/></svg>入社 ${joinedYM(r)}</span>`:''}</div>`;\n\n  if(S.role==='kanoa'){\n    // FULL EDIT FORM\n    const opts=(arr,sel,lab,val2)=>arr.map(o=>`<option value=\"${o[val2||'id']}\" ${o[val2||'id']===sel?'selected':''}>${esc(o[lab])}</option>`).join('');\n    d.innerHTML=`\n      <div class=\"drawer-head\">\n        <div class=\"drawer-avatar\">${esc((r.name||'？').slice(0,1))}</div>\n        <div class=\"drawer-head-name\"><div class=\"drawer-title\">送客を編集</div><div class=\"drawer-sub\">${r.id} · 送客日 ${esc(r.created||'—')}</div></div>\n        <button class=\"drawer-close\" data-act=\"closeoverlay\">×</button>\n      </div>\n      <div class=\"drawer-body\">\n        ${chips}\n        <div class=\"dt-block-title\" style=\"margin-top:2px\">進捗</div>\n        ${stepBar(r)}\n        ${checksBlock(r)}\n        <div class=\"dr-readout\">\n          <div><div class=\"l\">入社月</div><div class=\"v\" style=\"color:${r.joined?'var(--g)':'var(--faint)'}\">${r.joined?joinedYM(r):'未定'}</div></div>\n          ${S.role!=='sub'?`<div><div class=\"l\">成果報酬</div><div class=\"v\">${refEarning(r)?yen(refEarning(r)):(successRewardFor(r)?yen(successRewardFor(r))+'（見込）':'—')}</div></div>`:''}\n        </div>\n        ${rewardBreakdown(r,false)}\n        ${dupDetailSection(r)}\n        <div class=\"dt-block-title\">ステータス・入社</div>\n        <div class=\"dr-form\">\n          <div class=\"field\"><label>ステータス</label><select id=\"dr_status\">${STATUS_ORDER.map(k=>`<option value=\"${k}\" ${k===r.status?'selected':''}>${STATUS[k].label}</option>`).join('')}</select></div>\n          <div class=\"field\"><label>入社月<span style=\"font-weight:400;color:var(--muted);font-size:11px\"> （空にすると未定）</span></label><input type=\"month\" id=\"dr_joined\" value=\"${r.joined?esc(r.joined.slice(0,7)):''}\"></div>\n          <div class=\"field\"><label>選考会日${S.role==='kanoa'?`<button class=\"btn btn-ghost btn-sm\" style=\"padding:1px 8px;font-size:10.5px;margin-left:8px;vertical-alig
