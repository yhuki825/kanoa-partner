none;border-radius:8px\">PDFとして保存 / 印刷</button>\n    </div>\n  </body></html>`);\n  win.document.close();\n}\n\n\n/* ════════════════════ 退職・返金（自動注入） ════════════════════ */\n/* ════════════════════════════════════════════════════════════\n   退職・返金（クローバック）管理モジュール\n   ─────────────────────────────────────────────────────────────\n   楽天案件(rewardModel='rakuten')の入社者が退職した場合、\n   在籍期間に応じた返金規定を自動適用し、返金請求(マイナス請求)を発行。\n\n   返金規定（楽天）:\n     入社1ヶ月以内退職        → 80%返金\n     1ヶ月超〜3ヶ月以内退職    → 50%返金\n     3ヶ月超〜6ヶ月以内退職    → 10%返金\n     6ヶ月超退職             → 返金なし(0%)\n     経歴詐称が発覚          → 退職時期に関わらず100%返金\n   ════════════════════════════════════════════════════════════ */\n\n/* 楽天案件かどうか */\nfunction isRakutenProject(pj){ const p=project(pj); return !!(p && p.rewardModel==='rakuten'); }\n\n/* 在籍月数を計算（入社日→退職日。満たない端数も考慮し、日数ベースで月換算） */\nfunction tenureMonths(joinedISO, resignedISO){\n  if(!joinedISO || !resignedISO) return null;\n  const j=new Date(joinedISO), q=new Date(resignedISO);\n  if(isNaN(j)||isNaN(q)||q<j) return null;\n  // 月数 = 年差*12 + 月差、ただし日が足りなければ-1\n  let months=(q.getFullYear()-j.getFullYear())*12 + (q.getMonth()-j.getMonth());\n  if(q.getDate()<j.getDate()) months-=1;\n  return months; // 0 = 1ヶ月未満\n}\n\n/* 返金率を返す（0〜1）。楽天以外は0。経歴詐称は1。 */\nfunction refundRate(r){\n  if(!isRakutenProject(r.pj)) return 0;\n  if(r.resignFraud) return 1;               // 経歴詐称 → 全額\n  const m=tenureMonths(r.joined, r.resignedOn);\n  if(m===null) return 0;\n  if(m < 1)  return 0.8;   // 1ヶ月以内\n  if(m < 3)  return 0.5;   // 1〜3ヶ月\n  if(m < 6)  return 0.1;   // 3〜6ヶ月\n  return 0;                // 6ヶ月超\n}\n\n/* 返金額（円）= 既に支払われた成果報酬 × 返金率 */\nfunction refundAmount(r){\n  const base=refEarning(r);  // この候補者の成果報酬\n  return Math.round(base * refundRate(r));\n}\n\n/* 返金率の表示ラベル */\nfunction refundRateLabel(r){\n  if(!isRakutenProject(r.pj)) return '対象外';\n  if(r.resignFraud) return '経歴詐称・全額(100%)';\n  const m=tenureMonths(r.joined, r.resignedOn);\n  if(m===null) return '—';\n  if(m<1) return '1ヶ月以内・80%';\n  if(m<3) return '1〜3ヶ月・50%';\n  if(m<6) return '3〜6ヶ月・10%';\n  return '6ヶ月超・返金なし';\n}\n\n/* この候補者が既に返金請求済みか */\nfunction refundInvoiced(refId){\n  ensureInvoices();\n  return DB.invoices.some(v=> v.kind==='refund' && v.status!=='rejected'\n    && (v.items||[]).some(it=>it.refId===refId));\n}\n\n/* 退職を記録（退職日・経歴詐称フラグ） */\nfunction markResigned(refId, resignedOn, fraud){\n  const r=DB.referrals.find(x=>x.id===refId); if(!r) return;\n  r.resignedOn=resignedOn||todayISO();\n  r.resignFraud=!!fraud;\n  r.resigned=true;\n  logRef(r.id,'退職を記録',`退職日 ${r.resignedOn}${fraud?'・経歴詐称':''}`);\n  save();\n  if(['referrals','myrefs','refunds','posthire'].includes(S.view)) render();\n  if(document.querySelector('.drawer.on')) { try{ openRefDrawer(refId); }catch(e){} }\n  toast('退職を記録しました');\n}\n\n/* 退職の取消 */\nfunction unmarkResigned(refId){\n  const r=DB.referrals.find(x=>x.id===refId); if(!r) return;\n  if(refundInvoiced(refId)){ toast('返金請求が発行済みのため取消できません。先に返金請求を削除してください'); return; }\n  r.resigned=false; r.resignedOn=null; r.resignFraud=false; r.resignConfirmed=false;\n  logRef(r.id,'退職記録を取消','');\n  save();\n  if(['referrals','myrefs','refunds','posthire'].includes(S.view)) render();\n  if(document.querySelector('.drawer.on')) { try{ openRefDrawer(refId); }catch(e){} }\n  toast('退職記録を取り消しました');\n}\n\n/* 退職した入社者で、返金が発生し未請求の人 */\nfunction refundableRefs(agId){\n  return DB.referrals.filter(r=>\n    r.ag===agId && r.status==='joined' && r.resigned\n    && refundAmount(r)>0 && !refundInvoiced(r.id));\n}\n\n/* 返金請求（マイナス請求）を作成 */\nfunction createRefundInvoice(agId, refIds){\n  ensureInvoices();\n  const ids=refIds.filter(rid=>!refundInvoiced(rid));\n  if(!ids.length){ toast('返金請求できる退職者がありません'); return null; }\n  const items=ids.map(rid=>{\n    const r=DB.referrals.find(x=>x.id===rid);\n    const amt=refundAmount(r);\n    return { refId:rid, name:r.name, pj:r.pj, pjName:(project(r.pj)?project(r.pj).name:r.pj),\n             joined:r.joined||'', resignedOn:r.resignedOn||'', rateLabel:refundRateLabel(r),\n             amount:-amt };  // マイナス額\n  });\n  const subtotal=items.reduce((s,it)=>s+it.amount,0); // 負の合計\n  const inv={\n    id:invMakeId(), no:nextRefundNo(), agId, status:'draft', kind:'refund',\n    items, subtotal, tax:0, total:subtotal,\n    issuedOn:todayISO(), submittedOn:null, decidedOn:null, paidOn:null,\n    rejectReason:'', history:[]\n  };\n  pushInvHistory(inv,'created',`返金 ${items.length}名`);\n  items.forEach(it=> logRef(it.refId,'返金を請求',`${inv.no} · ${yen(-it.amount)}`));\n  DB.invoices.push(inv);\n  save();\n  return inv;\n}\n\n/* 返金請求の採番: KANOA-REF-YYYYMM-001 */\nfunction nextRefundNo(){\n  ensureInvoices();\n  const ym=todayISO().slice(0,7).replace('-','');\n  const seq=DB.invoices.filter(v=>v.kind==='refund' && (v.no||'').includes(`-${ym}-`)).length+1;\n  return `KANOA-REF-${ym}-${String(seq).padStart(3,'0')}`;\n}\n\n/* ════════════════════ 退職ステータス＋強化ロジック（自動注入） ════════════════════ */\n/* ════════════════════════════════════════════════════════════\n   退職ステータス管理（4段階）＋返金期限アラート（強化版）\n   ─────────────────────────────────────────────────────────────\n   ①退職報告あり reported → ②退職確認済 confirmed\n     → ③返金請求中 billing → ④返金完了 settled\n   返金不要(0円)の場合は confirmed で完了扱い。\n   ════════════════════════════════════════════════════════════ */\n\nconst RESIGN_STATUS = {\n  reported:  { label:'退職報告あり', color:'#B45309', bg:'#FDF2E2', step:1 },\n  confirmed: { label:'退職確認済',   color:'#1D4ED8', bg:'#EFF4FF', step:2 },\n  billing:   { label:'返金請求中',   color:'#7C3AED', bg:'#F3EEFF', step:3 },\n  settled:   { label:'返金完了',     color:'#15803D', bg:'#E8F6EE', step:4 },\n};\nfunction resignBadge(st){ const x=RESIGN_STATUS[st]||RESIGN_STATUS.reported;\n  return `<span class=\"tag\" style=\"background:${x.bg};color:${x.color};font-weight:600\">${x.label}</span>`; }\n\n/* 退職者の現在ステータスを算出（保存値＋請求状態から動的に） */\nfunction resignStatus(r){\n  if(!r.resigned) return null;\n  // 返金不要なら確認済みで完了\n  if(refundAmount(r)<=0) return r.resignConfirmed ? 'confirmed' : 'reported';\n  // 返金ありの場合、請求の進み具合で判定\n  const inv=DB.invoices.find(v=>v.kind==='refund' && (v.items||[]).some(it=>it.refId===r.id));\n  if(inv){\n    if(inv.status==='paid') return 'settled';\n    return 'billing';\n  }\n  return r.resignConfirmed ? 'confirmed' : 'reported';\n}\n\n\n/* ── 返金フローの「今どちらのボールか」──────────────────── */\nfunction refundBall(r){\n  if(!r.resigned || !isRakutenProject(r.pj)) return null;\n  const rs=resignStatus(r);\n  if(rs==='settled') return {side:null, act:'返金が完了しました', prep:''};\n  if(rs==='reported') return {side:'kanoa', act:'退職を確認する', prep:'パートナー側の準備：退職日の根拠（本人連絡・書面など）を共有'};\n  if(rs==='confirmed'){\n    if(refundAmount(r)<=0) return {side:null, act:'返金対象外（在籍6ヶ月超など）', prep:''};\n    return {side:'agency', act:'返金請求を発行する', prep:'金額は自動計算済み。退職・返金画面から1クリックで発行'};\n  }\n  const inv=DB.invoices.find(v=>v.kind==='refund' && (v.items||[]).some(it=>it.refId===r.id));\n  if(inv){\n    if(inv.status==='draft')     return {side:'agency', act:'返金請求を提出する', prep:''};\n    if(inv.status==='submitted') return {side:'kanoa',  act:'請求内容を確認して受理する', prep:'内容確認 → 受理 or 差戻し'};\n    if(inv.status==='accepted')  return {side:'kanoa',  act:'支払処理をして「支払済み」にする', prep:'振込または次回請求との相殺を実施'};\n    if(inv.status==='rejected')  return {side:'agency', act:'差戻し理由を確認して再提出する', prep:''};\n  }\n  return {side:'agency', act:'返金請求を発行する', prep:''};\n}\nfunction refundBallHtml(r, compact){\n  const b=refundBall(r); if(!b) return '';\n  if(!b.side) return `<span class=\"tag\" style=\"background:#E8F6EE;color:#15803D;font-weight:600\">✓ ${esc(b.act)}</span>`;\n  const mine=(S.role==='kanoa'&&b.side==='kanoa')||(S.role==='agency'&&b.side==='agency');\n  const who=b.side==='kanoa'?'KANOA':'パートナー';\n  const badge=mine\n    ? `<span class=\"tag\" style=\"background:#FDEEF1;color:var(--r);font-weight:700\">● あなたの番（${who}）</span>`\n    : `<span class=\"tag\" style=\"background:var(--gray-bg);color:var(--muted);font-weight:600\">相手待ち（${who}）</span>`;\n  if(compact) return `${badge}<div style=\"font-size:11.5px;margin-top:3px;color:var(--soft)\">${esc(b.act)}</div>`;\n  return `${badge}<div style=\"font-size:12.5px;margin-top:5px\"><strong style=\"font-weight:600\">${esc(b.act)}</strong>${b.prep?`<div class=\"cell-sub\" style=\"margin-top:2px\">${esc(b.prep)}</div>`:''}</div>`;\n}\n\n/* 退職を確認済みにする（②へ） */\nfunction confirmResignation(refId){\n  const r=DB.referrals.find(x=>x.id===refId); if(!r) return;\n  r.resignConfirmed=true;\n  logRef(r.id,'退職を確認','返金額を確定');\n  save();\n  if(['referrals','myrefs','refunds','posthire'].includes(S.view)) render();\n  if(document.querySelector('.drawer.on')){ try{ openRefDrawer(refId); }catch(e){} }\n  toast('退職を確認済みにしました');\n}\n\n/* ── 返金期限アラート ───────────────────────────────\n   返金率が変わる節目（1/3/6ヶ月）まであと何日かを計算。\n   在籍中の楽天入社者向けに「もうすぐ返金率が下がる/返金義務が消える」を警告。 */\nfunction daysUntil(dateISO){\n  const t=new Date(dateISO); if(isNaN(t)) return null;\n  return Math.ceil((t - new Date(todayISO())) / 86400000);\n}\nfunction addMonths(dateISO, m){\n  const d=new Date(dateISO); if(isNaN(d)) return null;\n  d.setMonth(d.getMonth()+m);\n  return d.toISOString().slice(0,10);\n}\n/* 在籍中の楽天入社者について、次の節目とその残日数を返す */\nfunction refundMilestone(r){\n  if(!isRakutenProject(r.pj) || !r.joined || r.resigned) return null;\n  const m=tenureMonths(r.joined, todayISO());\n  let nextMonth, nextLabel, nextRate;\n  if(m<1){ nextMonth=1; nextLabel='返金80%→50%'; nextRate='50%'; }\n  else if(m<3){ nextMonth=3; nextLabel='返金50%→10%'; nextRate='10%'; }\n  else if(m<6){ nextMonth=6; nextLabel='返金10%→なし'; nextRate='返金なし'; }\n  else return { done:true };  // 6ヶ月超 = 返金義務消滅済み\n  const boundary=addMonths(r.joined, nextMonth);\n  const days=daysUntil(boundary);\n  return { nextMonth, nextLabel, nextRate, boundary, days };\n}\n\n/* 期限が近い在籍者（30日以内に節目）を返す */\nfunction refundAlerts(agId){\n  return DB.referrals\n    .filter(r=> r.status==='joined' && !r.resigned && isRakutenProject(r.pj) && (!agId || r.ag===agId))\n    .map(r=>({ r, ms:refundMilestone(r) }))\n    .filter(x=> x.ms && !x.ms.done && x.ms.days!=null && x.ms.days<=30 && x.ms.days>=0)\n    .sort((a,b)=> a.ms.days - b.ms.days);\n}\n\n/* 「今やるべきこと」: 役割別の未処理アクション一覧 */\nfunction resignTodos(){\n  const isK=S.role==='kanoa'; const agId=isK?null:S.agencyId;\n  const todos=[];\n  // 退職報告あり・未確認\n  DB.referrals.filter(r=> r.resigned && resignStatus(r)==='reported' && isRakutenProject(r.pj) && (isK||r.ag===agId))\n    .forEach(r=> todos.push({ kind:'confirm', r, label:`${r.name} の退職を確認`, sub:'退職報告あり → 確認待ち' }));\n  if(!isK){\n    // パートナー: 返金請求できる\n    refundableRefs(agId).forEach(r=> todos.push({ kind:'bill', r, label:`${r.name} の返金を請求`, sub:`${refundRateLabel(r)} · -${yen(refundAmount(r))}` }));\n  } else {\n    // KANOA: 返金請求の受理待ち\n    DB.invoices.filter(v=> v.kind==='refund' && v.status==='submitted')\n      .forEach(v=> todos.push({ kind:'accept', inv:v, label:`返金請求 ${v.no} を確認`, sub:`${esc(agency(v.agId)?agency(v.agId).name:v.agId)} · ${yen(-v.total)}` }));\n  }\n  return todos;\n}\n\n\n/* ════════════════════ 退職・返金ビュー（再設計・強化版） ════════════════════ */\nfunction viewRefunds(){\n  ensureInvoices();\n  const isK=S.role==='kanoa';\n  const agId=isK?null:S.agencyId;\n  setHeader('退職・返金', '入社後の退職と返金を、抜け漏れなく管理');\n  const c=document.getElementById('content');\n\n  const resigned = DB.referrals.filter(r=> r.status==='joined' && r.resigned && isRakutenProject(r.pj) && (isK||r.ag===agId));\n  const active   = DB.referrals.filter(r=> r.status==='joined' && !r.resigned && isRakutenProject(r.pj) && (isK||r.ag===agId));\n  const todos    = resignTodos();\n  const alerts   = refundAlerts(agId);\n  const totalRefund = resigned.reduce((s,r)=>s+refundAmount(r),0);\n  const settledN = resigned.filter(r=>resignStatus(r)==='settled').length;\n\n  c.innerHTML=`<div class=\"content-narrow\">\n    <div class=\"kpi-grid\">\n      ${kpi('要対応',todos.length+'<span class=\"unit\">件</span>', todos.length?'var(--r)':'var(--g)')}\n      ${kpi('退職者',resigned.length+'<span class=\"unit\">名</span>','var(--ink)')}\n      ${kpi('返金総額','<span class=\"yen\">¥</span>'+totalRefund.toLocaleString('ja-JP'),'var(--r)')}\n      ${kpi('返金完了',settledN+'<span class=\"unit\">名</span>','var(--g)')}\n    </div>\n\n    ${todos.length?`\n    <div class=\"sect\">\n      <div class=\"sect-head\"><div class=\"sect-title\" style=\"color:var(--r)\">● 今やるべきこと</div></div>\n      <div class=\"panel\">\n        ${todos.map(t=>`<div class=\"info-row\" style=\"cursor:pointer\" data-act=\"${\n          t.kind==='confirm'?'open-ref\" data-id=\"'+t.r.id:\n          t.kind==='bill'?'ref-create-one\" data-ref=\"'+t.r.id:\n          'inv-open\" data-id=\"'+t.inv.id}\">\n          <div style=\"width:30px;height:30px;border-radius:8px;background:var(--r-bg,#FDEEF1);color:var(--r);display:flex;align-items:center;justify-content:center;flex:none;font-weight:700\">!</div>\n          <div style=\"flex:1\"><div class=\"cell-strong\">${esc(t.label)}</div><div class=\"cell-sub\">${t.sub}</div></div>\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"2\"><polyline points=\"9 18 15 12 9 6\"/></svg>\n        </div>`).join('')}\n      </div>\n    </div>`:''}\n\n    ${alerts.length?`\n    <div class=\"sect\">\n      <div class=\"sect-head\"><div class=\"sect-title\" style=\"color:var(--a)\">⚠ 返金期限が近い在籍者</div></div>\n      <div class=\"panel tbl-wrap\"><table class=\"tbl\"><thead><tr>\n        <th>氏名</th>${isK?'<th>パートナー</th>':''}<th>入社</th><th>節目まで</th><th>変化</th>\n      </tr></thead><tbody>\n        ${alerts.map(({r,ms})=>`<tr>\n          <td class=\"cell-strong\">${esc(r.name)}</td>\n          ${isK?`<td>${esc(agency(r.ag)?agency(r.ag).name:r.ag)}</td>`:''}\n          <td>${esc((r.joined||'').slice(0,7))}</td>\n          <td><span class=\"tag\" style=\"background:#FDF2E2;color:#B45309;font-weight:600\">あと${ms.days}日</span></td>\n          <td><span class=\"cell-sub\">${ms.nextLabel}（${esc(ms.boundary)}）</span></td>\n        </tr>`).join('')}\n      </tbody></table></div>\n    </div>`:''}\n\n    <div class=\"panel\" style=\"padding:13px 15px;margin:6px 0 20px;background:var(--gray-bg)\">\n      <div style=\"font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--muted);margin-bottom:6px\">楽天 返金規定</div>\n      <div style=\"font-size:12.5px;line-height:1.7;color:var(--soft)\">\n        1ヶ月以内 <strong>80%</strong> ／ 1〜3ヶ月 <strong>50%</strong> ／ 3〜6ヶ月 <strong>10%</strong> ／ 6ヶ月超 返金なし ／ 経歴詐称 <strong>全額</strong>\n      </div>\n    </div>\n\n    <div class=\"sect\">\n      <div class=\"sect-head\"><div class=\"sect-title\">退職者一覧</div></div>\n      ${resigned.length?`\n      <div class=\"panel tbl-wrap\"><table class=\"tbl\"><thead><tr>\n        <th>氏名</th>${isK?'<th>パートナー</th>':''}<th>退職</th><th>在籍</th><th>規定</th><th class=\"num\">返金額</th><th>進捗</th><th>次のアクション</th>\n      </tr></thead><tbody>\n        ${resigned.map(r=>{\n          const m=tenureMonths(r.joined,r.resignedOn);\n          const rs=resignStatus(r);\n          return `<tr style=\"cursor:pointer\" data-act=\"open-ref\" data-id=\"${r.id}\">\n            <td class=\"cell-strong\">${esc(r.name)}${r.resignFraud?'<span class=\"tag\" style=\"background:#FDEEF1;color:var(--r);margin-left:6px;font-size:10px\">経歴詐称</span>':''}</td>\n            ${isK?`<td>${esc(agency(r.ag)?agency(r.ag).name:r.ag)}</td>`:''}\n            <td>${esc((r.resignedOn||'—'))}</td>\n            <td><span class=\"cell-sub\">${m===null?'—':m+'ヶ月'}</span></td>\n            <td><span class=\"cell-sub\">${esc(refundRateLabel(r))}</span></td>\n            <td class=\"num cell-strong\" style=\"color:${refundAmount(r)>0?'var(--r)':'var(--muted)'}\">${refundAmount(r)>0?'-'+yen(refundAmount(r)):'—'}</td>\n            <td>${resignBadge(rs)}</td>\n            <td>${refundBallHtml(r,true)}</td>\n          </tr>`;\n        }).join('')}\n      </tbody></table></div>`\n      :`<div class=\"panel\" style=\"padding:22px\">${emptyState('退職者はいません','楽天案件の入社者が退職するとここで管理できます')}</div>`}\n    </div>\n\n    <div class=\"sect\">\n      <div class=\"sect-head\"><div class=\"sect-title\">在籍中の入社者（楽天）</div></div>\n      ${active.length?`\n      <div class=\"panel tbl-wrap\"><table class=\"tbl\"><thead><tr>\n        <th>氏名</th>${isK?'<th>パートナー</th>':''}<th>入社月</th><th>在籍</th><th>返金期限</th><th style=\"width:120px\"></th>\n      </tr></thead><tbody>\n        ${active.map(r=>{\n          const m=tenureMonths(r.joined, todayISO());\n          const ms=refundMilestone(r);\n          const dleft = ms&&!ms.done&&ms.days!=null ? (ms.days<=30?`<span class=\"tag\" style=\"background:#FDF2E2;color:#B45309;font-weight:600\">あと${ms.days}日で${ms.nextRate}</span>`:`<span class=\"cell-sub\">${ms.days}日後に変化</span>`) : '<span class=\"cell-sub\">返金義務なし</span>';\n          return `<tr>\n            <td class=\"cell-strong\">${esc(r.name)}</td>\n            ${isK?`<td>${esc(agency(r.ag)?agency(r.ag).name:r.ag)}</td>`:''}\n            <td>${esc((r.joined||'').slice(0,7))}</td>\n            <td><span class=\"cell-sub\">${m===null?'—':m+'ヶ月'}</span></td>\n            <td>${dleft}</td>\n            <td><button class=\"btn btn-ghost btn-sm\" data-act=\"ref-resign-prompt\" data-ref=\"${r.id}\">退職を記録</button></td>\n          </tr>`;\n        }).join('')}\n      </tbody></table></div>`\n      :`<div class=\"panel\" style=\"padding:22px\">${emptyState('在籍中の楽天入社者はいません','')}</div>`}\n    </div>\n  </div>`;\n}\n\n\n\n\n\n/* ════════════════════ 退職フォーム（自動注入） ════════════════════ */\n/* ════════════════════ 退職フォーム（モーダル・分かりやすい版） ════════════════════ */\nfunction openResignForm(refId){\n  const r=DB.referrals.find(x=>x.id===refId); if(!r) return;\n  const curM = tenureMonths(r.joined, todayISO());\n  showModal(`\n    <div class=\"modal-head\"><div class=\"modal-title\">退職を記録</div>\n      <button class=\"drawer-close\" data-act=\"closemodal\">×</button></div>\n    <div class=\"modal-body\">\n      <div class=\"info-card\" style=\"margin-bottom:16px\">\n        <div class=\"info-row\"><span class=\"info-label\">氏名</span><span class=\"info-val\">${esc(r.name)}</span></div>\n        <div class=\"info-row\"><span class=\"info-label\">案件</span><span class=\"info-val\">${esc((project(r.pj)?project(r.pj).name:r.pj).replace(' パートナー送客',''))}</span></div>\n        <div class=\"info-row\"><span class=\"info-label\">入社月</span><span class=\"info-val\">${esc((r.joined||'').slice(0,7)||'—')}</span></div>\n        <div class=\"info-row\"><span class=\"info-label\">現在の在籍</span><span class=\"info-val\">${curM===null?'—':curM+'ヶ月'}</span></div>\n      </div>\n\n      <div class=\"field full\" style=\"margin-bottom:14px\">\n        <label>退職日</label>\n        <input type=\"date\" id=\"resignDate\" value=\"${todayISO()}\">\n      </div>\n\n      <div class=\"field full\" style=\"margin-bottom:8px\">\n        <label>退職の理由</label>\n        <label class=\"lcheck\" style=\"display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-top:6px;cursor:pointer\">\n          <input type=\"checkbox\" id=\"resignFraud\">\n          <span>経歴詐称の発覚による退職（返金率に関わらず<strong>全額返金</strong>）</span>\n        </label>\n      </div>\n\n      <div id=\"refundPreview\" class=\"panel\" style=\"padding:13px 15px;margin:14px 0;background:var(--gray-bg)\">\n        <div style=\"font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px\">返金見込み</div>\n        <div id=\"refundPreviewBody\" style=\"font-size:14px;font-weight:600\"></div>\n      </div>\n\n      <div style=\"display:flex;gap:8px;margin-top:18px\">\n        <button class=\"btn btn-ghost\" data-act=\"closemodal\" style=\"flex:1\">キャンセル</button>\n        <button class=\"btn btn-danger\" data-act=\"resign-confirm\" data-ref=\"${r.id}\" style=\"flex:1\">退職を記録する</button>\n      </div>\n    </div>`);\n  // プレビュー更新を仕込む\n  const upd=()=>{\n    const d=document.getElementById('resignDate').value;\n    const fraud=document.getElementById('resignFraud').checked;\n    const tmp={...r, resignedOn:d, resignFraud:fraud};\n    const amt=refundAmount(tmp);\n    const lbl=refundRateLabel(tmp);\n    const el=document.getElementById('refundPreviewBody');\n    if(el) el.innerHTML = isRakutenProject(r.pj)\n      ? (amt>0?`<span style=\"color:var(--r)\">-${yen(amt)}</span> <span class=\"cell-sub\" style=\"font-weight:400\">（${lbl}）</span>`\n             : `返金なし <span class=\"cell-sub\" style=\"font-weight:400\">（${lbl}）</span>`)\n      : '<span class=\"cell-sub\" style=\"font-weight:400\">この案件は返金規定の対象外です</span>';\n  };\n  setTimeout(()=>{\n    const dt=document.getElementById('resignDate'), fr=document.getElementById('resignFraud');\n    if(dt) dt.addEventListener('change',upd);\n    if(fr) fr.addEventListener('change',upd);\n    upd();\n  },30);\n}\n\nfunction confirmResign(refId){\n  const d=document.getElementById('resignDate').value;\n  const fraud=document.getElementById('resignFraud').checked;\n  if(!d){ toast('退職日を入力してください'); return; }\n  closeModal();\n  markResigned(refId, d, fraud);\n}\n\n\n/* ════════════════════ 入社後トラッキング（自動注入） ════════════════════ */\n/* ════════════════════════════════════════════════════════════\n   入社後トラッキング強化モジュール\n   ① 候補者別アクティビティ履歴（誰がいつ何をしたか・監査ログ）\n   ② 候補者詳細のステップバー（今どの段階か視覚化）\n   ③ 入社後一元ビュー（入社者のその後を追う）\n   ════════════════════════════════════════════════════════════ */\n\n/* 候補者別の履歴を1件追加（refId付き） */\nfunction logRef(refId, action, detail){\n  if(!DB.reflog) DB.reflog=[];\n  DB.reflog.unshift({\n    id:(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('L'+Date.now()+Math.random()),\n    refId, ts:nowTS(),\n    by:(S.role==='kanoa'?'KANOA':(agency(S.agencyId)?agency(S.agencyId).name:S.agencyId)),\n    byRole:S.role,\n    action, detail:detail||''\n  });\n}\nfunction refLogs(refId){ return (DB.reflog||[]).filter(l=>l.refId===refId); }\n\n/* ステップバー: 送客→入社→(退職→返金完了) の進捗を視覚化 */\nfunction stepBar(r){\n  // 基本ステップ（送客〜入社）\n  const base=[\n    {k:'entry',label:'送客'},\n    {k:'screening',label:'書類'},\n    {k:'interview',label:'選考会'},\n    {k:'offer',label:'内定'},\n    {k:'joined',label:'入社'},\n  ];\n  const orderIdx = STATUS_ORDER.indexOf(r.status);\n  const joinedIdx = STATUS_ORDER.indexOf('joined');\n  const isRejected = r.status==='rejected';\n\n  // 退職している楽天案件は、入社の先に返金ステップを追加\n  let steps=base.slice();\n  let curIdx = base.findIndex(s=>s.k===r.status);\n  if(r.status==='joined') curIdx=4;\n  if(orderIdx>=0 && orderIdx<joinedIdx) curIdx=orderIdx;\n\n  if(r.status==='joined' && r.resigned && isRakutenProject(r.pj)){\n    const rs=resignStatus(r);\n    const rmap={reported:0,confirmed:1,billing:2,settled:3};\n    steps=steps.concat([\n      {k:'r_reported',label:'退職報告'},\n      {k:'r_confirmed',label:'退職確認'},\n      {k:'r_billing',label:'返金請求'},\n      {k:'r_settled',label:'返金完了'},\n    ]);\n    curIdx = 4 + (rmap[rs]!=null?rmap[rs]:0);\n  }\n\n  return `<div class=\"stepbar\" style=\"display:flex;align-items:flex-start;gap:0;margin:4px 0 8px;overflow-x:auto\">\n    ${steps.map((st,idx)=>{\n      const done = idx<curIdx;\n      const cur = idx===curIdx;\n      const isRefundStep = st.k.startsWith('r_');\n      const color = isRejected ? 'var(--muted)'\n        : cur ? (isRefundStep?'var(--r)':'var(--accent)')\n        : done ? (isRefundStep?'var(--r)':'var(--g)')\n        : 'var(--line)';\n      const textColor = (cur||done) ? 'var(--ink)' : 'var(--muted)';\n      return `<div style=\"display:flex;flex-direction:column;align-items:center;flex:1;min-width:52px;position:relative\">\n        ${idx>0?`<div style=\"position:absolute;left:-50%;top:9px;width:100%;height:2px;background:${done||cur?color:'var(--line)'}\"></div>`:''}\n        <div style=\"width:18px;height:18px;border-radius:50%;background:${(done||cur)?color:'var(--surface)'};border:2px solid ${color};z-index:1;display:flex;align-items:center;justify-content:center\">\n          ${done?'<svg width=\"10\" height=\"10\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\"><polyline points=\"20 6 9 17 4 12\"/></svg>':''}\n        </div>\n        <div style=\"font-size:10px;margin-top:5px;color:${textColor};font-weight:${cur?'600':'400'};text-align:center;white-space:nowrap\">${st.label}</div>\n      </div>`;\n    }).join('')}\n  </div>`;\n}\n\n/* 候補者履歴のHTML（詳細ドロワー用） */\nfunction refHistoryHtml(refId){\n  const logs=refLogs(refId);\n  if(!logs.length) return '<div class=\"info-row\"><span class=\"cell-sub\">履歴はまだありません</span></div>';\n  return logs.map(l=>`<div class=\"info-row\">\n    <div style=\"flex:1\"><span class=\"cell-strong\" style=\"font-size:12.5px\">${esc(l.action)}</span>${l.detail?`<span class=\"cell-sub\"> · ${esc(l.detail)}</span>`:''}</div>\n    <span class=\"cell-sub\" style=\"white-space:nowrap\">${esc(l.ts)} · ${l.byRole==='kanoa'?'KANOA':esc(l.by)}</span>\n  </div>`).join('');\n}\n\n/* ════════════════════ 入社後トラッキング ビュー ════════════════════ */\nfunction viewPostHire(){\n  ensureInvoices();\n  const isK=S.role==='kanoa';\n  const agId=isK?null:S.agencyId;\n  setHeader('入社後トラッキング', '入社した方の「その後」を一元管理');\n  const c=document.getElementById('content');\n\n  const joined = DB.referrals.filter(r=> r.status==='joined' && (isK||r.ag===agId));\n  const active = joined.filter(r=>!r.resigned);\n  const resigned = joined.filter(r=>r.resigned);\n  const rakutenActive = active.filter(r=>isRakutenProject(r.pj));\n\n  // 返金期限アラート\n  const alerts = refundAlerts(agId);\n  const todos = resignTodos();\n\n  const monthsSince=(iso)=>{ const m=tenureMonths(iso,todayISO()); return m===null?'—':m+'ヶ月'; };\n\n  c.innerHTML=`<div class=\"content-narrow\">\n    <div class=\"kpi-grid\">\n      ${kpi('入社者',joined.length+'<span class=\"unit\">名</span>','var(--g)')}\n      ${kpi('在籍中',active.length+'<span class=\"unit\">名</span>','var(--ink)')}\n      ${kpi('退職',resigned.length+'<span class=\"unit\">名</span>','var(--r)')}\n      ${kpi('要対応',todos.length+'<span class=\"unit\">件</span>',todos.length?'var(--r)':'var(--g)')}\n    </div>\n\n    ${todos.length?`\n    <div class=\"sect\">\n      <div class=\"sect-head\"><div class=\"sect-title\" style=\"color:var(--r)\">● 今やるべきこと</div></div>\n      <div class=\"panel\">\n        ${todos.map(t=>`<div class=\"info-row\" style=\"cursor:pointer\" data-act=\"${\n          t.kind==='confirm'?'open-ref\" data-id=\"'+t.r.id:\n          t.kind==='bill'?'ref-create-one\" data-ref=\"'+t.r.id:\n          'inv-open\" data-id=\"'+t.inv.id}\">\n          <div style=\"width:28px;height:28px;border-radius:8px;background:var(--r-bg,#FDEEF1);color:var(--r);display:flex;align-items:center;justify-content:center;flex:none;font-weight:700\">!</div>\n          <div style=\"flex:1\"><div class=\"cell-strong\">${esc(t.label)}</div><div class=\"cell-sub\">${t.sub}</div></div>\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"2\"><polyline points=\"9 18 15 12 9 6\"/></svg>\n        </div>`).join('')}\n      </div>\n    </div>`:''}\n\n    ${alerts.length?`\n    <div class=\"sect\">\n      <div class=\"sect-head\"><div class=\"sect-title\" style=\"color:var(--a)\">⚠ 返金期限が近い（楽天・在籍中）</div></div>\n      <div class=\"panel\">\n        ${alerts.map(({r,ms})=>`<div class=\"info-row\" style=\"cursor:pointer\" data-act=\"open-ref\" data-id=\"${r.id}\">\n          <div style=\"flex:1\"><span class=\"cell-strong\">${esc(r.name)}</span> <span class=\"cell-sub\">${isK?esc(agency(r.ag)?agency(r.ag).name:r.ag):''}</span></div>\n          <span class=\"tag\" style=\"background:#FDF2E2;color:#B45309;font-weight:600\">あと${ms.days}日で${ms.nextRate}</span>\n        </div>`).join('')}\n      </div>\n    </div>`:''}\n\n    <div class=\"sect\">\n      <div class=\"sect-head\"><div class=\"sect-title\">在籍中（${active.length}名）</div></div>\n      ${active.length?`\n      <div class=\"panel tbl-wrap\"><table class=\"tbl\"><thead><tr>\n        <th>氏名</th>${isK?'<th>パートナー</th>':''}<th>案件</th><th>入社月</th><th>在籍</th><th>返金期限</th>\n      </tr></thead><tbody>\n        ${active.map(r=>{\n          const isR=isRakutenProject(r.pj);\n          const ms=isR?refundMilestone(r):null;\n          const deadline = !isR ? '<span class=\"cell-sub\">対象外</span>'\n            : (ms&&ms.done) ? '<span class=\"cell-sub\">返金義務なし</span>'\n            : (ms&&ms.days!=null) ? (ms.days<=30?`<span class=\"tag\" style=\"background:#FDF2E2;color:#B45309;font-weight:600\">あと${ms.days}日</span>`:`<span class=\"cell-sub\">${ms.days}日後</span>`)\n            : '—';\n          return `<tr style=\"cursor:pointer\" data-act=\"open-ref\" data-id=\"${r.id}\">\n            <td class=\"cell-strong\">${esc(r.name)}</td>\n            ${isK?`<td>${esc(agency(r.ag)?agency(r.ag).name:r.ag)}</td>`:''}\n            <td><span class=\"tag\" style=\"font-size:10.5px\">${esc((project(r.pj)?project(r.pj).name:r.pj).replace(' パートナー送客',''))}</span></td>\n            <td>${esc((r.joined||'').slice(0,7))}</td>\n            <td><span class=\"cell-sub\">${monthsSince(r.joined)}</span></td>\n            <td>${deadline}</td>\n          </tr>`;\n        }).join('')}\n      </tbody></table></div>`\n      :`<div class=\"panel\" style=\"padding:22px\">${emptyState('在籍中の入社者はいません','')}</div>`}\n    </div>\n\n    ${resigned.length?`\n    <div class=\"sect\">\n      <div class=\"sect-head\"><div class=\"sect-title\">退職（${resigned.length}名）</div></div>\n      <div class=\"panel tbl-wrap\"><table class=\"tbl\"><thead><tr>\n        <th>氏名</th>${isK?'<th>パートナー</th>':''}<th>退職月</th><th>在籍</th><th class=\"num\">返金額</th><th>進捗</th>\n      </tr></thead><tbody>\n        ${resigned.map(r=>`<tr style=\"cursor:pointer\" data-act=\"open-ref\" data-id=\"${r.id}\">\n          <td class=\"cell-strong\">${esc(r.name)}${r.resignFraud?'<span class=\"tag\" style=\"background:#FDEEF1;color:var(--r);margin-left:6px;font-size:10px\">経歴詐称</span>':''}</td>\n          ${isK?`<td>${esc(agency(r.ag)?agency(r.ag).name:r.ag)}</td>`:''}\n          <td>${esc(r.resignedOn||'—')}</td>\n          <td><span class=\"cell-sub\">${tenureMonths(r.joined,r.resignedOn)||0}ヶ月</span></td>\n          <td class=\"num cell-strong\" style=\"color:${refundAmount(r)>0?'var(--r)':'var(--muted)'}\">${refundAmount(r)>0?'-'+yen(refundAmount(r)):'—'}</td>\n          <td>${resignBadge(resignStatus(r))}</td>\n        </tr>`).join('')}\n      </tbody></table></div>\n    </div>`:''}\n  </div>`;\n}\n\n\n/* ════════════════════ カスケード削除（KANOAをマスターに） ════════════════════ */\n/* 候補者を削除すると、紐付く書類・メッセージ・請求・履歴・退職情報も連動削除。\n   KANOA側の操作を基準に、パートナー側の関連データも消える。 */\nfunction cascadeDeleteReferral(refId){\n  const r=DB.referrals.find(x=>x.id===refId);\n  const name=r?r.name:'';\n  // 1) 紐付く書類（documents）— Storage実体も含めて削除\n  const docs=(DB.documents||[]).filter(d=>d.refId===refId || d.ref===refId || d.referral_id===refId);\n  docs.forEach(d=>{ try{ if(!DEMO_MODE && d.id) SUPA.delRow('documents','id',d.id); }catch(e){} });\n  if(DB.documents) DB.documents=DB.documents.filter(d=>!(d.refId===refId||d.ref===refId||d.referral_id===refId));\n\n  // 2) 候補者に紐付くメッセージ（ref_id）\n  const msgs=(DB.messages||[]).filter(m=>m.refId===refId||m.ref_id===refId);\n  msgs.forEach(m=>{ try{ if(!DEMO_MODE && m.id) SUPA.delRow('messages','id',m.id); }catch(e){} });\n  DB.messages=(DB.messages||[]).filter(m=>!(m.refId===refId||m.ref_id===refId));\n\n  // 3) 候補者に紐付くタスク\n  const tasks=(DB.tasks||[]).filter(t=>t.refId===refId||t.ref_id===refId);\n  tasks.forEach(t=>{ try{ if(!DEMO_MODE && t.id) SUPA.delRow('tasks','id',t.id); }catch(e){} });\n  DB.tasks=(DB.tasks||[]).filter(t=>!(t.refId===refId||t.ref_id===refId));\n\n  // 4) この候補者を含む請求（通常・返金）— 明細から除去し、空になれば請求ごと削除\n  ensureInvoices();\n  const affected=[];\n  DB.invoices.forEach(v=>{\n    if((v.items||[]).some(it=>it.refId===refId)){\n      v.items=v.items.filter(it=>it.refId!==refId);\n      v.subtotal=(v.items||[]).reduce((sm,it)=>sm+it.amount,0);\n      v.total=v.subtotal+(v.tax||0);\n      affected.push(v);\n    }\n  });\n  const emptied=DB.invoices.filter(v=>affected.includes(v) && (!v.items||!v.items.length));\n  emptied.forEach(v=>{ try{ if(!DEMO_MODE && v.id) SUPA.delRow('invoices','id',v.id); }catch(e){} });\n  DB.invoices=DB.invoices.filter(v=>!emptied.includes(v));\n\n  // 5) 操作履歴（reflog）\n  const logs=(DB.reflog||[]).filter(l=>l.refId===refId);\n  logs.forEach(l=>{ try{ if(!DEMO_MODE && l.id) SUPA.delRow('reflog','id',l.id); }catch(e){} });\n  DB.reflog=(DB.reflog||[]).filter(l=>l.refId!==refId);\n\n  // 6) 候補者本体（referrals）— 退職・返金情報はreferral内なので同時に消える\n  DB.referrals=DB.referrals.filter(x=>x.id!==refId);\n  try{ if(!DEMO_MODE) SUPA.delRow('referrals','id',refId); }catch(e){}\n\n  return { name, docs:docs.length, msgs:msgs.length, tasks:tasks.length, invoices:affected.length };\n}\n\n/* パートナーが集客元だけを編集・保存（他の権限には触れない） */\nfunction saveSourceInline(refId){\n  const r=DB.referrals.find(x=>x.id===refId); if(!r) return;\n  const el=document.getElementById('src_inline_'+refId);\n  if(!el) return;\n  const v=(el.value||'').trim();\n  if(v===(r.src||'')){ toast('変更はありません'); return; }\n  const old=r.src||'';\n  r.src=v;\n  if(typeof logRef==='function') logRef(r.id,'集客元を更新', v?`${old?old+' → ':''}${v}`:'（空に）');\n  save();\n  toast('集客元を保存しました');\n  if(document.querySelector('.drawer.on')){ try{ openRefDrawer(refId); }catch(e){} }\n}\n\n/* ════════════════════ パートナー招待リンク（自動注入） ════════════════════ */\n/* ════════════════════════════════════════════════════════════\n   パートナー招待リンク（URL発行 → 受諾 → パスワード設定）\n   ─────────────────────────────────────────────────────────────\n   ・KANOAがパートナーごとに招待URLを発行\n   ・URL形式: <origin>/?invite=<agencyId>&token=<ランダム>\n   ・7日で失効\n   ・パートナーがURLを開く → 会社名確認 → 自分でパスワード設定 → 完了\n   ════════════════════════════════════════════════════════════ */\n\nconst INVITE_TTL_DAYS = 7;\n\n/* ランダムトークン生成 */\nfunction genInviteToken(){\n  const arr=new Uint8Array(18);\n  (window.crypto||{}).getRandomValues ? crypto.getRandomValues(arr) : arr.forEach((_,i)=>arr[i]=Math.floor(Math.random()*256));\n  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');\n}\n\n/* 招待リンクを発行（トークンと発行日時をパートナーに保存） */\nfunction issueInviteLink(agId){\n  const a=agency(agId); if(!a) return null;\n  a.inviteToken=genInviteToken();\n  a.inviteIssuedAt=new Date().toISOString();\n  a.inviteUsedAt=null;\n  save();\n  return buildInviteUrl(a);\n}\n\n/* パートナーの現在の招待URLを組み立て（無ければnull） */\nfunction buildInviteUrl(a){\n  if(!a || !a.inviteToken) return null;\n  const base=location.origin + location.pathname;\n  return `${base}?invite=${encodeURIComponent(a.id)}&token=${encodeURIComponent(a.inviteToken)}`;\n}\n\n/* トークンの有効性を判定 */\nfunction inviteState(a){\n  if(!a || !a.inviteToken) return 'none';\n  if(a.inviteUsedAt) return 'used';\n  if(a.inviteIssuedAt){\n    const ageDays=(Date.now() - new Date(a.inviteIssuedAt).getTime())/86400000;\n    if(ageDays > INVITE_TTL_DAYS) return 'expired';\n  }\n  return 'valid';\n}\nfunction inviteExpiryLabel(a){\n  if(!a.inviteIssuedAt) return '';\n  const exp=new Date(new Date(a.inviteIssuedAt).getTime()+INVITE_TTL_DAYS*86400000);\n  return exp.toISOString().slice(0,10);\n}\n\n/* KANOA: パートナー詳細に出す招待リンクのUI */\nfunction agInviteBadge(a){\n  if(a.status==='suspended') return '<span class=\"tag\" style=\"background:var(--gray-bg);color:var(--muted);font-weight:600\">停止中</span>';\n  const stt=inviteState(a);\n  if(stt==='used' || a.pwHash) return '<span class=\"tag\" style=\"background:#E8F6EE;color:#15803D;font-weight:600\">設定完了</span>';\n  if(stt==='valid'){ const d=Math.max(0, Math.ceil(INVITE_TTL_DAYS - (Date.now()-new Date(a.inviteIssuedAt).getTime())/86400000)); return `<span class=\"tag\" style=\"background:#FDF2E2;color:#B45309;font-weight:600\">招待中・あと${d}日</span>`; }\n  if(stt==='expired') return '<span class=\"tag\" style=\"background:#FDEEF1;color:#BE123C;font-weight:600\">期限切れ</span>';\n  return '<span class=\"tag\" style=\"background:var(--gray-bg);color:var(--muted)\">未招待</span>';\n}\nfunction inviteLinkPanel(a){\n  const stt=inviteState(a);\n  const url=buildInviteUrl(a);\n  if(stt==='none'){\n    return `<div style=\"margin-top:6px\">\n      <button class=\"btn btn-primary btn-sm\" data-act=\"issue-invite\" data-ag=\"${a.id}\">招待リンクを発行</button>\n    </div>`;\n  }\n  const badge = stt==='valid' ? `<span class=\"tag\" style=\"background:#E8F6EE;color:#15803D;font-weight:600\">有効 · ${inviteExpiryLabel(a)}まで</span>`\n    : stt==='used' ? '<span class=\"tag\" style=\"background:#EFF4FF;color:#1D4ED8;font-weight:600\">設定完了</span>'\n    : '<span class=\"tag\" style=\"background:#FDEEF1;color:#BE123C;font-weight:600\">期限切れ</span>';\n  return `<div style=\"margin-top:6px\">\n    <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\">${badge}</div>\n    ${stt!=='used'?`<div style=\"display:flex;gap:6px;align-items:center\">\n      <input readonly value=\"${esc(url)}\" onclick=\"this.select()\" style=\"flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:11.5px;font-family:var(--mono);color:var(--soft)\">\n      <button class=\"btn btn-ghost btn-sm\" data-act=\"copy-invite\" data-ag=\"${a.id}\">コピー</button>\n    </div>\n    <div style=\"margin-top:8px\"><button class=\"btn btn-ghost btn-sm\" data-act=\"issue-invite\" data-ag=\"${a.id}\">再発行</button></div>`\n    : `<div class=\"cell-sub\">このパートナーはパスワード設定済みです。ログインできなくなった場合は、再設定リンクを発行して送ってください（本人が新しいパスワードを設定します）。</div>\n    <div style=\"margin-top:8px\"><button class=\"btn btn-ghost btn-sm\" data-act=\"issue-invite\" data-ag=\"${a.id}\">パスワード再設定リンクを発行</button></div>`}\n  </div>`;\n}\n\n/* コピー処理 */\nfunction copyInviteLink(agId){\n  const a=agency(agId); const url=buildInviteUrl(a);\n  if(!url){ toast('リンクがありません'); return; }\n  try{\n    navigator.clipboard.writeText(url).then(()=>toast('招待リンクをコピーしました'),()=>fallbackCopy(url));\n  }catch(e){ fallbackCopy(url); }\n}\nfunction fallbackCopy(text){\n  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();\n  try{ document.execCommand('copy'); toast('招待リンクをコピーしました'); }catch(e){ toast('コピーできませんでした'); }\n  document.body.removeChild(ta);\n}\n\n/* ── 招待URLを開いたときの受諾画面 ── */\n\n\nfunction inviteScreen(inner){\n  hideBootSplash();\n  const el=document.getElementById('app')||document.body;\n  if(el && el.id==='app') el.style.display='block';\n  el.innerHTML=`<div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg,#0b1220);padding:20px\">\n    <div style=\"width:100%;max-width:420px;background:var(--surface,#fff);border-radius:18px;padding:34px 30px;box-shadow:0 20px 60px rgba(0,0,0,.18)\">\n      ${inner}\n    </div></div>`;\n}\nfunction renderInviteError(msg){\n  inviteScreen(`\n    <div style=\"font-family:var(--display);font-weight:800;font-size:20px;margin-bottom:10px\">リンクエラー</div>\n    <div style=\"font-size:14px;color:var(--soft);line-height:1.7\">${esc(msg)}</div>\n    <button class=\"btn btn-primary btn-block\" style=\"margin-top:22px\" onclick=\"location.href=location.origin+location.pathname\">ログイン画面へ</button>\n  `);\n}\nfunction renderInviteAccept(a){\n  inviteScreen(`\n    <div style=\"font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.08em;color:var(--accent);margin-bottom:4px\">KANOA パートナー招待</div>\n    <div style=\"font-family:var(--display);font-weight:800;font-size:22px;margin-bottom:6px\">${esc(a.name)} 様</div>\n    <div style=\"font-size:13.5px;color:var(--soft);line-height:1.7;margin-bottom:22px\">KANOAパートナーポータルへの招待です。ログイン用のパスワードを設定してください。</div>\n    <div class=\"field full\" style=\"margin-bottom:12px\"><label>ログインID</label>\n      <input value=\"${esc(a.email||a.id)}\" readonly style=\"background:var(--gray-bg)\"></div>\n    <div class=\"field full\" style=\"margin-bottom:12px\"><label>パスワード（8文字以上）</label>\n      <input type=\"password\" id=\"invPw1\" placeholder=\"新しいパスワード\"></div>\n    <div class=\"field full\" style=\"margin-bottom:6px\"><label>パスワード（確認）</label>\n      <input type=\"password\" id=\"invPw2\" placeholder=\"もう一度入力\"></div>\n    <div id=\"invErr\" style=\"color:var(--r);font-size:12px;min-height:18px;margin:6px 0\"></div>\n    <button class=\"btn btn-primary btn-block\" data-act=\"invite-set-pw\" data-ag=\"${a.id}\">パスワードを設定して開始</button>\n  `);\n}\n\nasync function acceptInvite(agId){\n  const a=agency(agId); if(!a) return;\n  const p1=document.getElementById('invPw1').value||'';\n  const p2=document.getElementById('invPw2').value||'';\n  const err=m=>{ const e=document.getElementById('invErr'); if(e)e.textContent=m; };\n  if(p1.length<8){ err('パスワードは8文字以上にしてください'); return; }\n  if(!/[a-zA-Z]/.test(p1)||!/[0-9]/.test(p1)){ err('英字と数字を両方含めてください'); return; }\n  if(p1!==p2){ err('パスワードが一致しません'); return; }\n  try{\n    const hash=await hashPwAsync(p1);\n    a.pwHash=hash;\n    a.status='active';\n    a.inviteUsedAt=new Date().toISOString();\n    if(!DEMO_MODE){\n      try{\n        const sb=await SUPA.ensureClient();\n        await sb.from('agencies').update({pw_hash:hash,status:'active',invite_used_at:a.inviteUsedAt}).eq('id',a.id);\n      }catch(e){}\n    } else { save(); }\n    toast('パスワードを設定しました。ログインします。');\n    try{ history.replaceState(null,'',location.pathname); }catch(e){}\n    if(!DEMO_MODE){ try{ DB=await SUPA.loadAll(); }catch(e){} }\n    S.role='agency'; S.agencyId=a.id; S.view='pjlist';\n    if(typeof enterApp==='function'){ enterApp(); } else { location.href=location.pathname; }\n  }catch(e){ err('設定に失敗しました。もう一度お試しください。'); }\n}\n\n\n/* ════════════════════ 送客一括登録（自動注入） ════════════════════ */\n/* ════════════════════════════════════════════════════════════\n   送客の一括登録（パートナー）\n   複数の求職者を1画面でまとめて登録する。\n   ════════════════════════════════════════════════════════════ */\n\nlet bulkRegRows = [];  // [{name,kana,phone,email,area,src,pj}]\n\nfunction openBulkRegister(){\n  const isK = S.role==='kanoa';\n  const ag = isK ? '' : S.agencyId;\n  // 登録先の案件候補\n  const projs = isK ? DB.projects : DB.projects.filter(p=> (DB.assignments||[]).some(a=>a.pj===p.id && a.ag===S.agencyId && a.published));\n  const projList = projs.length ? projs : DB.projects;\n  // 初期3行\n  bulkRegRows = [newBulkRow(projList), newBulkRow(projList), newBulkRow(projList)];\n  renderBulkRegisterModal(projList);\n}\n\nfunction newBulkRow(projList){\n  return { name:'', kana:'', phone:'', email:'', area:'', src:'', pj:(projList[0]&&projList[0].id)||'' };\n}\n\nfunction renderBulkRegisterModal(projList){\n  const projOpts = projList.map(p=>`<option value=\"${p.id}\">${esc((p.name||p.id).replace(' パートナー送客',''))}</option>`).join('');\n  const rowsHtml = bulkRegRows.map((r,idx)=>`\n    <tr>\n      <td style=\"padding:4px\"><input data-bulk=\"name\" data-i=\"${idx}\" value=\"${esc(r.name)}\" placeholder=\"氏名 *\" style=\"width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px\"></td>\n      <td style=\"padding:4px\"><input data-bulk=\"kana\" data-i=\"${idx}\" value=\"${esc(r.kana)}\" placeholder=\"フリガナ\" style=\"width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px\"></td>\n      <td style=\"padding:4px\"><input data-bulk=\"phone\" data-i=\"${idx}\" value=\"${esc(r.phone)}\" placeholder=\"電話\" style=\"width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px\"></td>\n      <td style=\"padding:4px\"><input data-bulk=\"email\" data-i=\"${idx}\" value=\"${esc(r.email)}\" placeholder=\"メール\" style=\"width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px\"></td>\n      <td style=\"padding:4px\"><input data-bulk=\"area\" data-i=\"${idx}\" value=\"${esc(r.area)}\" placeholder=\"希望エリア\" style=\"width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px\"></td>\n      <td style=\"padding:4px\"><input data-bulk=\"src\" data-i=\"${idx}\" value=\"${esc(r.src)}\" placeholder=\"集客元\" style=\"width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px\"></td>\n      <td style=\"padding:4px\"><select data-bulk=\"pj\" data-i=\"${idx}\" style=\"width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px\">${projOpts.replace('value=\"'+r.pj+'\"','value=\"'+r.pj+'\" selected')}</select></td>\n      <td style=\"padding:4px;text-align:center\"><button class=\"btn btn-ghost btn-sm\" data-act=\"bulk-reg-delrow\" data-i=\"${idx}\" style=\"padding:4px 8px\">×</button></td>\n    </tr>`).join('');\n\n  showModal(`\n    <div class=\"modal-title\">送客を一括登録</div>\n    <div class=\"modal-sub\">複数の求職者をまとめて送客登録します。氏名は必須です。</div>\n    <div class=\"tbl-wrap\" style=\"max-height:44vh;overflow:auto;margin:14px 0;border:1px solid var(--line);border-radius:10px\">\n      <table class=\"tbl\" style=\"min-width:840px\">\n        <thead><tr>\n          <th style=\"font-size:11px\">氏名 *</th><th style=\"font-size:11px\">フリガナ</th><th style=\"font-size:11px\">電話</th>\n          <th style=\"font-size:11px\">メール</th><th style=\"font-size:11px\">エリア</th><th style=\"font-size:11px\">集客元</th><th style=\"font-size:11px\">案件</th><th></th>\n        </tr></thead>\n        <tbody>${rowsHtml}</tbody>\n      </table>\n    </div>\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px\">\n      <button class=\"btn btn-ghost btn-sm\" data-act=\"bulk-reg-addrow\">＋ 行を追加</button>\n      <div style=\"display:flex;gap:8px\">\n        <button class=\"btn btn-ghost\" data-act=\"closemodal\">キャンセル</button>\n        <button class=\"btn btn-primary\" data-act=\"bulk-reg-submit\">一括登録する</button>\n      </div>\n    </div>\n  `);\n  // 入力を保持するためのリスナー\n  setTimeout(()=>{\n    document.querySelectorAll('[data-bulk]').forEach(el=>{\n      el.addEventListener('input', e=>{\n        const i=+e.target.dataset.i, key=e.target.dataset.bulk;\n        if(bulkRegRows[i]) bulkRegRows[i][key]=e.target.value;\n      });\n      el.addEventListener('change', e=>{\n        const i=+e.target.dataset.i, key=e.target.dataset.bulk;\n        if(bulkRegRows[i]) bulkRegRows[i][key]=e.target.value;\n      });\n    });\n  },30);\n}\n\nfunction bulkRegAddRow(){\n  syncBulkRowsFromDom();\n  const isK=S.role==='kanoa';\n  const projs = isK ? DB.projects : DB.projects.filter(p=> (DB.assignments||[]).some(a=>a.pj===p.id && a.ag===S.agencyId && a.published));\n  const projList = projs.length ? projs : DB.projects;\n  bulkRegRows.push(newBulkRow(projList));\n  renderBulkRegisterModal(projList);\n}\nfunction bulkRegDelRow(idx){\n  syncBulkRowsFromDom();\n  bulkRegRows.splice(idx,1);\n  const isK=S.role==='kanoa';\n  const projs = isK ? DB.projects : DB.projects.filter(p=> (DB.assignments||[]).some(a=>a.pj===p.id && a.ag===S.agencyId && a.published));\n  renderBulkRegisterModal(projs.length?projs:DB.projects);\n}\nfunction syncBulkRowsFromDom(){\n  document.querySelectorAll('[data-bulk]').forEach(el=>{\n    const i=+el.dataset.i, key=el.dataset.bulk;\n    if(bulkRegRows[i]) bulkRegRows[i][key]=el.value;\n  });\n}\n\nfunction bulkRegSubmit(){\n  syncBulkRowsFromDom();\n  const isK=S.role==='kanoa';\n  const valid = bulkRegRows.filter(r=>r.name && r.name.trim());\n  if(!valid.length){ toast('氏名を入力した行がありません'); return; }\n  let n=0;\n  valid.forEach(row=>{\n    const ag = isK ? 'AG-01' : S.agencyId;  // KANOA一括時は既定。通常はパートナー\n    const r=mk(row.pj, ag, row.name.trim(), row.kana||'', row.phone||'', row.email||'', '', row.area||'', 'entry','—', todayISO());\n    r.src=row.src||'';\n    if(!isK) r.seenK=false;\n    DB.referrals.unshift(r);\n    if(typeof logRef==='function') logRef(r.id,'送客登録','一括登録');\n    n++;\n  });\n  DB.activity.unshift({ts:new Date().toISOString().slice(0,16).replace('T',' '),actor:isK?'KANOA':S.agencyId,action:'一括送客登録',detail:`${n}名を送客登録`});\n  save(); closeModal(); updateNavCounts();\n  toast(`${n}名を一括登録しました`);\n  render();\n}\n\n\n/* ════════════════════ SPI・コンプラ受検管理（自動注入） ════════════════════ */\n/* ════════════════════════════════════════════════════════════\n   SPI・コンプライアンスチェック 受検管理\n   楽天案件で、書類選考が終わり選考会が決まったタイミングで、\n   本人がSPI／コンプライアンスチェックを受検済みかを管理する。\n   ════════════════════════════════════════════════════════════ */\n\nconst CHECK_STATUS = {\n  none:      { label:'未案内',   color:'#6B7280', bg:'#F3F4F6' },\n  sent:      { label:'案内済み', color:'#B45309', bg:'#FDF2E2' },\n  done:      { label:'受検済み', color:'#15803D', bg:'#E8F6EE' },\n};\nfunction checkBadge(v){ const x=CHECK_STATUS[v||'none']||CHECK_STATUS.none;\n  return `<span class=\"tag\" style=\"background:${x.bg};color:${x.color};font-weight:600\">${x.label}</span>`; }\n\n/* SPI/コンプラの管理対象か（楽天案件 & 書類選考以降 & 見送り/辞退でない） */\nfunction needsChecks(r){\n  if(!isRakutenProject(r.pj)) return false;\n  const idx=STATUS_ORDER.indexOf(r.status);\n  const scr=STATUS_ORDER.indexOf('screening');\n  return idx>=scr && r.status!=='rejected' && r.status!=='declined';\n}\n\n/* 受検ステータスを進める（none→sent→done を循環的にセット） */\nfunction setCheckStatus(refId, which, value){\n  const r=DB.referrals.find(x=>x.id===refId); if(!r) return;\n  const key = which==='spi' ? 'spi' : 'compliance';\n  r[key]=value;\n  const nm = which==='spi' ? 'SPI' : 'コンプライアンスチェック';\n  if(typeof logRef==='function') logRef(r.id, `${nm}：${(CHECK_STATUS[value]||{}).label||value}`, '');\n  save();\n  if(document.querySelector('.drawer.on, .overlay.on')){ try{ openRefDrawer(refId); }catch(e){} }\n  else render();\n}\n\n/* 候補者詳細に出す受検管理ブロック（KANOA・パートナー共通） */\nfunction checksBlock(r){\n  if(!needsChecks(r)) return '';\n  const rowFor=(which,label)=>{\n    const cur = which==='spi' ? (r.spi||'none') : (r.compliance||'none');\n    const btn=(v,txt)=>`<button class=\"btn ${cur===v?'btn-primary':'btn-ghost'} btn-sm\" data-act=\"set-check\" data-ref=\"${r.id}\" data-which=\"${which}\" data-val=\"${v}\" style=\"padding:4px 10px\">${txt}</button>`;\n    return `<div class=\"info-row\" style=\"align-items:center\">\n      <span class=\"info-label\">${label}</span>\n      <span class=\"info-val\" style=\"display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap\">\n        ${checkBadge(cur)}\n        <span style=\"display:inline-flex;gap:4px;margin-left:4px\">${btn('none','未案内')}${btn('sent','案内済み')}${btn('done','受検済み')}</span>\n      </span></div>`;\n  };\n  return `<div class=\"dt-block-title\" style=\"margin-top:16px\">SPI・コンプライアンスチェック</div>\n    <div class=\"cell-sub\" style=\"margin:-2px 0 8px\">楽天から案内される適性検査です。選考会前に受検状況を管理します。</div>\n    <div class=\"info-card\">\n      ${rowFor('spi','SPI')}\n      ${rowFor('compliance','コンプライアンスチェック')}\n    </div>`;\n}\n\n\n\n\n\n/* ════════════════════ 収支ダッシュボード（KANOA） ════════════════════ */\nfunction viewFinance(){\n  ensureInvoices();\n  setHeader('収支', '全体の売上・パートナー支払・自社取り分を一元管理');\n  const c=document.getElementById('content');\n  const joined=DB.referrals.filter(r=>r.status==='joined');\n  const payoutOf=r=>refEarning(r)||0;\n  const refundOf=r=> (r.resigned&&isRakutenProject(r.pj))?refundAmount(r):0;\n  const totalPay=joined.reduce((s,r)=>s+payoutOf(r),0);\n  const totalRef=joined.reduce((s,r)=>s+refundOf(r),0);\n  const net=totalPay-totalRef;\n  const paid=DB.invoices.filter(v=>v.status==='paid').reduce((s,v)=>s+(v.total||0),0);\n  const pending=DB.invoices.filter(v=>['submitted','accepted'].includes(v.status)).reduce((s,v)=>s+(v.total||0),0);\n  const feeOf=r=>{const p=project(r.pj);return (p&&+p.clientFee)?+p.clientFee:0;};\n  const totalIn=joined.reduce((s,r)=>s+feeOf(r),0);\n  const gross=totalIn-net;\n  const hasFee=DB.projects.some(p=>+p.clientFee>0);\n  const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-(5-i));return d.toISOString().slice(0,7);});\n  const payM=months.map(m=>joined.filter(r=>(r.joined||'').slice(0,7)===m).reduce((s,r)=>s+payoutOf(r),0));\n  const refM=months.map(m=>joined.filter(r=>r.resigned&&(r.resignedOn||'').slice(0,7)===m).reduce((s,r)=>s+refundOf(r),0));\n  const maxV=Math.max(1,...payM,...refM);\n  const chart=`<svg viewBox=\"0 0 560 205\" style=\"width:100%;height:auto\" role=\"img\">\n    <text x=\"30\" y=\"14\" font-size=\"10\" fill=\"var(--muted)\">■ 支払（パートナー報酬）</text>\n    <text x=\"170\" y=\"14\" font-size=\"10\" fill=\"var(--r)\">■ 返金</text>\n    ${months.map((m,i)=>{\n      const x=30+i*88; const hp=Math.round(payM[i]/maxV*130); const hr=Math.round(refM[i]/maxV*130);\n      return `<rect x=\"${x}\" y=\"${170-hp}\" width=\"30\" height=\"${Math.max(hp,1)}\" rx=\"4\" fill=\"var(--accent)\"><title>${m} 支払 ${yen(payM[i])}</title></rect>\n        <rect x=\"${x+34}\" y=\"${170-hr}\" width=\"18\" height=\"${Math.max(hr,1)}\" rx=\"4\" fill=\"var(--r)\"><title>${m} 返金 ${yen(refM[i])}</title></rect>\n        <text x=\"${x+24}\" y=\"188\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">${m.slice(5)}月</text>`;\n    }).join('')}\n  </svg>`;\n  const rowsAg=DB.agencies.map(a=>{\n    const js=joined.filter(r=>r.ag===a.id);\n    const pay=js.reduce((s,r)=>s+payoutOf(r),0);\n    const rf=js.reduce((s,r)=>s+refundOf(r),0);\n    const paidA=DB.invoices.filter(v=>v.agId===a.id&&v.status==='paid').reduce((s,v)=>s+(v.total||0),0);\n    return {a,n:js.length,pay,rf,net:pay-rf,paidA};\n  }).filter(x=>x.n>0||x.paidA!==0).sort((x,y)=>y.net-x.net);\n  c.innerHTML=`<div class=\"content-narrow\">\n    <div class=\"kpi-grid\">\n      ${kpi('売上（支払確定）','<span class=\"yen\">¥</span>'+totalPay.toLocaleString('ja-JP'),'var(--accent)')}\n      ${kpi('返金差引', (totalRef?'-':'')+'<span class=\"yen\">¥</span>'+totalRef.toLocaleString('ja-JP'), totalRef?'var(--r)':'var(--muted)')}\n      ${kpi('純支払額','<span class=\"yen\">¥</span>'+net.toLocaleString('ja-JP'),'var(--ink)')}\n      ${kpi('未払い（要対応）','<span class=\"yen\">¥</span>'+pending.toLocaleString('ja-JP'), pending?'var(--a)':'var(--g)')}\n    </div>\n    ${hasFee?`<div class=\"kpi-grid\">\n      ${kpi('総受領（客先→KANOA）','<span class=\"yen\">¥</span>'+totalIn.toLocaleString('ja-JP'),'var(--g)')}\n      ${kpi('自社取り分（粗利）','<span class=\"yen\">¥</span>'+gross.toLocaleString('ja-JP'), gross>=0?'var(--g)':'var(--r)')}\n      ${kpi('支払済み','<span class=\"yen\">¥</span>'+paid.toLocaleString('ja-JP'),'var(--ink)')}\n      ${kpi('入社数', joined.length+'<span class=\"unit\">名</span>','var(--ink)')}\n    </div>`:''}\n    <div class=\"sect\"><div class=\"sect-head\"><div class=\"sect-title\">月次推移（直近6ヶ月）</div></div>\n      <div class=\"panel\" style=\"padding:14px 16px 8px\">${chart}</div></div>\n    ${hasFee?'':`<div class=\"panel\" style=\"padding:11px 13px;margin:0 0 18px;background:var(--gray-bg)\">\n      <div style=\"font-size:12px;color:var(--soft);line-height:1.7\">自社取り分（粗利）を表示するには、各案件の編集で<strong style=\"font-weight:600\">「受領単価（客先→KANOA）」</strong>を設定してください。設定すると受領・粗利がここに表示されます。</div></div>`}\n    <div class=\"sect\"><div class=\"sect-head\"><div class=\"sect-title\">パートナー別の売上</div></div>\n      <div class=\"panel tbl-wrap\"><table class=\"tbl\"><thead><tr>\n        <th>パートナー</th><th class=\"num\">入社</th><th class=\"num\">報酬計</th><th class=\"num\">返金</th><th class=\"num\">差引</th><th class=\"num\">支払済</th>\n      </tr></thead><tbody>\n      ${rowsAg.length?rowsAg.map(x=>`<tr>\n        <td class=\"cell-strong\">${esc(x.a.name)}</td><td class=\"num\">${x.n}</td>\n        <td class=\"num\">${yen(x.pay)}</td>\n        <td class=\"num\" style=\"color:${x.rf?'var(--r)':'var(--muted)'}\">${x.rf?'-'+yen(x.rf):'—'}</td>\n        <td class=\"num cell-strong\">${yen(x.net)}</td><td class=\"num\">${yen(x.paidA)}</td>\n      </tr>`).join(''):'<tr><td colspan=\"6\"><span class=\"cell-sub\">入社実績のあるパートナーがまだいません</span></td></tr>'}\n      </tbody></table></div></div>\n  </div>`;\n}\n\n/* ════════════════════ 一括登録：CSV/Excel（自動注入） ════════════════════ */\n/* ════════════════════════════════════════════════════════════\n   一括登録ウィザード（CSV / Excel）＋ 単体登録の全面ドラッグ&ドロップ対応\n   ════════════════════════════════════════════════════════════ */\n\n/* ── 列の自動マッピング ─────────────────────────────\n   スプレッドシートのヘッダー文字列から、システムのフィールドを推定する。 */\nconst FIELD_ALIASES = {\n  name:  ['氏名','名前','お名前','氏名（フルネーム）','フルネーム','name','fullname','full name'],\n  kana:  ['フリガナ','ふりがな','カナ','かな','kana','furigana'],\n  phone: ['電話','電話番号','携帯','携帯電話','tel','phone','telephone','mobile'],\n  email: ['メール','メールアドレス','email','mail','e-mail'],\n  area:  ['エリア','希望エリア','勤務地','勤務地希望','希望勤務地','area','location'],\n  address:['住所','現住所','address'],\n  src:   ['集客元','流入元','経路','媒体','集客経路','source','src','channel'],\n  project:['案件','案件名','応募案件','希望案件','project','job','position'],\n};\nfunction normalizeHeader(h){\n  return String(h||'').trim().toLowerCase().replace(/[\\s　_\\-（）()]/g,'');\n}\nfunction autoMapColumns(headers){\n  const map={};  // headerIndex -> fieldKey\n  const usedFields=new Set();\n  headers.forEach((h,idx)=>{\n    const nh=normalizeHeader(h);\n    if(!nh) return;\n    for(const [field,aliases] of Object.entries(FIELD_ALIASES)){\n      if(usedFields.has(field)) continue;\n      if(aliases.some(a=>normalizeHeader(a)===nh)){ map[idx]=field; usedFields.add(field); return; }\n    }\n    // 部分一致（第2優先）\n    for(const [field,aliases] of Object.entries(FIELD_ALIASES)){\n      if(usedFields.has(field)) continue;\n      if(aliases.some(a=>{const na=normalizeHeader(a); return na.length>=2 && (nh.includes(na)||na.includes(nh));})){\n        map[idx]=field; usedFields.add(field); return;\n      }\n    }\n  });\n  return map;  // {0:'name', 2:'phone', ...}\n}\n\n/* ── 電話番号の正規化（重複検出用） ── */\nfunction normPhone(p){ return String(p||'').replace(/[^0-9]/g,''); }\nfunction normEmail(e){ return String(e||'').trim().toLowerCase(); }\n\n/* ── 行データの検証 ──\n   必須: 氏名のみ。メール形式・重複（既存データ＋アップロード内）を検出。 */\nfunction validateBulkRow(row, idx, allRows, existingRefs){\n  const issues=[];\n  if(!row.name || !String(row.name).trim()) issues.push({level:'error', msg:'氏名が未入力です'});\n  if(row.email && !/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(row.email)) issues.push({level:'warn', msg:'メール形式が不正な可能性'});\n  // 既存データとの重複\n  if(row.email){\n    const ne=normEmail(row.email);\n    if(existingRefs.some(r=>normEmail(r.email)===ne && ne)) issues.push({level:'warn', msg:'既存の候補者と同じメールアドレス'});\n  }\n  if(row.phone){\n    const np=normPhone(row.phone);\n    if(np.length>=10 && existingRefs.some(r=>normPhone(r.phone)===np)) issues.push({level:'warn', msg:'既存の候補者と同じ電話番号'});\n  }\n  // アップロードファイル内での重複（自分より前の行と同一）\n  const dupInFile = allRows.slice(0,idx).some(r2=>\n    (row.email && normEmail(r2.email)===normEmail(row.email)) ||\n    (row.phone && normPhone(r2.phone).length>=10 && normPhone(r2.phone)===normPhone(row.phone)) ||\n    (r2.name && row.name && r2.name.trim()===row.name.trim() && r2.kana && row.kana && r2.kana.trim()===row.kana.trim())\n  );\n  if(dupInFile) issues.push({level:'warn', msg:'ファイル内に同じ内容の行があります'});\n  return issues;\n}\n\n/* ── ファイルの解析（CSV / Excel） ──\n   外部ライブラリを動的読み込み（PapaParse / SheetJS）。 */\nlet _papaLoaded=false, _xlsxLoaded=false;\nasync function ensurePapa(){\n  if(_papaLoaded && window.Papa) return;\n  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });\n  _papaLoaded=true;\n}\nasync function ensureXlsxLib(){\n  if(_xlsxLoaded && window.XLSX) return;\n  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });\n  _xlsxLoaded=true;\n}\n\n/* ファイルを読み、{headers:[], rows:[[...]]} 形式で返す */\nasync function parseSpreadsheetFile(file){\n  const ext=(file.name.split('.').pop()||'').toLowerCase();\n  if(ext==='csv' || ext==='tsv' || /^text\\/(csv|plain)$/.test(file.type)){\n    await ensurePapa();\n    const text=await file.text();\n    const result=window.Papa.parse(text.trim(), { skipEmptyLines:true, delimiter: ext==='tsv'?'\\t':undefined });\n    const all=result.data;\n    if(!all.length) return {headers:[], rows:[]};\n    return { headers:all[0], rows:all.slice(1) };\n  }\n  if(ext==='xlsx' || ext==='xls'){\n    await ensureXlsxLib();\n    const buf=await file.arrayBuffer();\n    const wb=window.XLSX.read(buf, {type:'array'});\n    const sheet=wb.Sheets[wb.SheetNames[0]];\n    const all=window.XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', raw:false});\n    const nonEmpty=all.filter(r=>r.some(c=>String(c||'').trim()!==''));\n    if(!nonEmpty.length) return {headers:[], rows:[]};\n    return { headers:nonEmpty[0], rows:nonEmpty.slice(1) };\n  }\n  throw new Error('対応していないファイル形式です（CSV / Excel のみ対応）');\n}\n\n/* rows(配列の配列) + mapping(列index→field) → オブジェクト配列 */\nfunction rowsToObjects(rows, mapping){\n  return rows.map(r=>{\n    const o={name:'',kana:'',phone:'',email:'',area:'',address:'',src:'',project:''};\n    Object.entries(mapping).forEach(([idx,field])=>{ if(o.hasOwnProperty(field)) o[field]=String(r[idx]??'').trim(); });\n    return o;\n  }).filter(o=>Object.values(o).some(v=>v));  // 完全空行は除去\n}\n\n/* CSVテンプレートを生成してダウンロード */\nfunction downloadBulkTemplate(){\n  const headers=['氏名','フリガナ','電話番号','メール','希望エリア','住所','集客元'];\n  const sample=['山田 太郎','ヤマダ タロウ','090-1234-5678','taro@example.com','東京','東京都千代田区…','自社サイト'];\n  const csv='\\uFEFF'+[headers,sample].map(r=>r.map(v=>`\"${String(v).replace(/\"/g,'\"\"')}\"`).join(',')).join('\\r\\n');\n  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});\n  const url=URL.createObjectURL(blob);\n  const a=document.createElement('a'); a.href=url; a.download='送客登録テンプレート.csv'; document.body.appendChild(a); a.click();\n  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);\n}\n\n\n/* ════════════════════════════════════════════════════════════\n   一括登録ウィザード UI\n   ════════════════════════════════════════════════════════════ */\n\nlet BULK_WZ = null;  // {step, file, headers, rawRows, mapping, objects, included:Set, projList}\n\nfunction openBulkImportWizard(){\n  const isK=S.role==='kanoa';\n  const projs = isK ? DB.projects : DB.projects.filter(p=> (DB.assignments||[]).some(a=>a.pj===p.id && a.ag===S.agencyId && a.published));\n  BULK_WZ = { step:1, file:null, headers:[], rawRows:[], mapping:{}, objects:[], included:new Set(), projList: projs.length?projs:DB.projects, defaultProj:(projs[0]||DB.projects[0]||{}).id||'' };\n  renderBulkWizard();\n}\n\nfunction renderBulkWizard(){\n  const w=BULK_WZ; if(!w) return;\n  const steps=['ファイル選択','列の確認','プレビュー','完了'];\n  const stepIdx = w.step>=4 ? 3 : w.step-1;\n  const stepsHtml=`<div style=\"display:flex;gap:6px;margin-bottom:18px\">\n    ${steps.map((s,i)=>`<div style=\"flex:1;text-align:center\">\n      <div style=\"width:26px;height:26px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:${i<=stepIdx?'var(--accent)':'var(--line)'};color:${i<=stepIdx?'#fff':'var(--muted)'}\">${i<stepIdx?'✓':i+1}</div>\n      <div style=\"font-size:10.5px;color:${i<=stepIdx?'var(--ink)':'var(--muted)'};font-weight:${i===stepIdx?'600':'400'}\">${s}</div>\n    </div>`).join('')}\n  </div>`;\n\n  let body='';\n  if(w.step===1) body=bulkStep1();\n  else if(w.step===2) body=bulkStep2();\n  else if(w.step===3) body=bulkStep3();\n  else body=bulkStep4();\n\n  showModal(`\n    <div class=\"modal-title\">求職者を一括登録</div>\n    <div class=\"modal-sub\">CSV・Excelファイルから、まとめて送客登録します。</div>\n    ${stepsHtml}\n    ${body}\n  `);\n  setTimeout(bulkWireEvents, 30);\n}\n\n/* ── Step 1: ファイル選択（ドラッグ&ドロップ） ── */\nfunction bulkStep1(){\n  return `\n    <div id=\"bulkDrop\" style=\"border:2px dashed var(--line);border-radius:14px;padding:38px 20px;text-align:center;cursor:pointer;transition:all .15s;background:var(--gray-bg)\">\n      <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.6\" style=\"margin-bottom:10px\"><path d=\"M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4\"/><polyline points=\"17 8 12 3 7 8\"/><line x1=\"12\" y1=\"3\" x2=\"12\" y2=\"15\"/></svg>\n      <div style=\"font-weight:600;font-size:14px;margin-bottom:4px\">ここにファイルをドラッグ＆ドロップ</div>\n      <div style=\"font-size:12px;color:var(--soft);margin-bottom:14px\">またはクリックしてファイルを選択（.csv / .xlsx / .xls）</div>\n      <input type=\"file\" id=\"bulkFileInput\" accept=\".csv,.xlsx,.xls,.tsv\" style=\"display:none\">\n      <button class=\"btn btn-primary btn-sm\" type=\"button\" onclick=\"document.getElementById('bulkFileInput').click()\">ファイルを選択</button>\n    </div>\n    <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:14px\">\n      <button class=\"btn btn-ghost btn-sm\" data-act=\"bulk-template\">📄 テンプレートをダウンロード</button>\n      <span class=\"cell-sub\" style=\"font-size:11px\">1列目に見出し（氏名・電話番号など）があれば自動で認識します</span>\n    </div>\n    <div id=\"bulkErr\" style=\"color:var(--r);font-size:12.5px;margin-top:10px;min-height:16px\"></div>\n    <div class=\"modal-actions\"><button class=\"btn btn-ghost\" data-act=\"closemodal\">キャンセル</button></div>\n  `;\n}\n\n/* ── Step 2: 列マッピングの確認・調整 ── */\nfunction bulkStep2(){\n  const w=BULK_WZ;\n  const fieldOpts=[\n    ['','（使用しない）'],['name','氏名 *'],['kana','フリガナ'],['phone','電話番号'],['email','メール'],\n    ['area','希望エリア'],['address','住所'],['src','集客元'],['project','案件名'],\n  ];\n  const rows = w.headers.map((h,idx)=>{\n    const cur = w.mapping[idx] || '';\n    const sample = (w.rawRows[0]&&w.rawRows[0][idx]) || '';\n    return `<tr>\n      <td class=\"cell-strong\" style=\"font-size:12.5px\">${esc(h||'（無題の列）')}</td>\n      <td><span class=\"cell-sub\" style=\"font-size:11.5px\">${esc(String(sample).slice(0,20))}</span></td>\n      <td><select data-bulk-map data-idx=\"${idx}\" style=\"width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px\">\n        ${fieldOpts.map(([v,l])=>`<option value=\"${v}\" ${v===cur?'selected':''}>${l}</option>`).join('')}\n      </select></td>\n    </tr>`;\n  }).join('');\n  const nameMapped=Object.values(w.mapping).includes('name');\n  return `\n    <div class=\"cell-sub\" style=\"margin-bottom:10px\">「${esc(w.file?w.file.name:'')}」を読み込みました（${w.rawRows.length}行）。列の割り当てを確認してください。自動判定できなかった列は手動で選んでください。</div>\n    <div class=\"tbl-wrap\" style=\"max-height:38vh;overflow:auto;border:1px solid var(--line);border-radius:10px\">\n      <table class=\"tbl\"><thead><tr><th style=\"font-size:11px\">元の列</th><th style=\"font-size:11px\">サンプル値</th><th style=\"font-size:11px\">割り当て先</th></tr></thead>\n      <tbody>${rows}</tbody></table>\n    </div>\n    <div class=\"field full\" style=\"margin-top:14px\"><label>登録先の案件（列で指定がない行に使用）</label>\n      <div class=\"cell-sub\" style=\"font-size:11px;margin:2px 0 6px;color:var(--soft)\">💡 CSVに「案件」列があれば、その名前で行ごとに自動で案件を振り分けます。無い行はここで選んだ案件に登録されます。</div>\n      <select id=\"bulkDefProj\">${w.projList.map(p=>`<option value=\"${p.id}\" ${p.id===w.defaultProj?'selected':''}>${esc((p.name||p.id).replace(' パートナー送客',''))}</option>`).join('')}</select></div>\n    ${!nameMapped?'<div style=\"color:var(--r);font-size:12px;margin-top:8px\">「氏名」列の割り当てが必要です</div>':''}\n    <div class=\"modal-actions\">\n      <button class=\"btn btn-ghost\" data-act=\"bulk-back\">戻る</button>\n      <button class=\"btn btn-primary\" data-act=\"bulk-to-preview\" ${nameMapped?'':'disabled'}>プレビューへ進む</button>\n    </div>\n  `;\n}\n\n/* ── Step 3: プレビュー＋検証 ── */\nfunction bulkStep3(){\n  const w=BULK_WZ;\n  const existing = DB.referrals;\n  const rows = w.objects.map((o,idx)=>{\n    const issues=validateBulkRow(o, idx, w.objects, existing);\n    const hasError=issues.some(i=>i.level==='error');\n    const included = w.included.has(idx) && !hasError;\n    const proj = o.projectMatch || w.defaultProj;\n    return `<tr style=\"${hasError?'opacity:.55':''}\">\n      <td style=\"text-align:center\"><input type=\"checkbox\" data-bulk-inc data-idx=\"${idx}\" ${included?'checked':''} ${hasError?'disabled':''}></td>\n      <td class=\"cell-strong\" style=\"font-size:12.5px\">${esc(o.name)||'<span style=\"color:var(--r)\">未入力</span>'}</td>\n      <td style=\"font-size:12px\">${esc(o.phone)}</td>\n      <td style=\"font-size:12px\">${esc(o.email)}</td>\n      <td style=\"font-size:12px\">${esc(o.area)}</td>\n      <td>${issues.length?issues.map(i=>`<span class=\"tag\" style=\"font-size:10px;background:${i.level==='error'?'#FDEEF1':'#FDF2E2'};color:${i.level==='error'?'var(--r)':'#B45309'};margin-right:3px\">${esc(i.msg)}</span>`).join(''):'<span class=\"tag\" style=\"font-size:10px;background:#E8F6EE;color:#15803D\">OK</span>'}</td>\n    </tr>`;\n  }).join('');\n  const errN=w.objects.filter((o,idx)=>validateBulkRow(o,idx,w.objects,existing).some(i=>i.level==='error')).length;\n  const okIncluded=[...w.included].filter(idx=>!validateBulkRow(w.objects[idx],idx,w.objects,existing).some(i=>i.level==='error')).length;\n  return `\n    <div style=\"display:flex;gap:14px;margin-bottom:10px;font-size:12.5px\">\n      <span><strong style=\"color:var(--g)\">${okIncluded}</strong> 件を登録予定</span>\n      ${errN?`<span style=\"color:var(--r)\">${errN} 件はエラーのため対象外</span>`:''}\n    </div>\n    <div class=\"tbl-wrap\" style=\"max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:10px\">\n      <table class=\"tbl\"><thead><tr>\n        <th style=\"width:32px\"><input type=\"checkbox\" data-bulk-inc-all checked></th>\n        <th style=\"font-size:11px\">氏名</th><th style=\"font-size:11px\">電話</th><th style=\"font-size:11px\">メール</th><th style=\"font-size:11px\">エリア</th><th style=\"font-size:11px\">チェック</th>\n      </tr></thead><tbody>${rows}</tbody></table>\n    </div>\n    <div class=\"modal-actions\">\n      <button class=\"btn btn-ghost\" data-act=\"bulk-back-mapping\">列の確認に戻る</button>\n      <button class=\"btn btn-primary\" data-act=\"bulk-submit-final\" ${okIncluded?'':'disabled'}>${okIncluded}件を登録する</button>\n    </div>\n  `;\n}\n\n/* ── Step 4: 完了 ── */\nfunction bulkStep4(){\n  const w=BULK_WZ;\n  return `\n    <div style=\"text-align:center;padding:20px 10px\">\n      <div style=\"width:52px;height:52px;border-radius:50%;background:#E8F6EE;display:flex;align-items:center;justify-content:center;margin:0 auto 14px\">\n        <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#15803D\" stroke-width=\"2.5\"><polyline points=\"20 6 9 17 4 12\"/></svg>\n      </div>\n      <div style=\"font-weight:700;font-size:16px;margin-bottom:6px\">${w.resultCount}名を登録しました</div>\n      <div class=\"cell-sub\">送客一覧から確認できます</div>\n    </div>\n    <div class=\"modal-actions\"><button class=\"btn btn-primary\" data-act=\"closemodal\">閉じる</button></div>\n  `;\n}\n\n/* ── イベント配線 ── */\nfunction bulkWireEvents(){\n  const w=BULK_WZ; if(!w) return;\n  const drop=document.getElementById('bulkDrop');\n  const input=document.getElementById('bulkFileInput');\n  if(drop && input){\n    drop.addEventListener('click', ()=>input.click());\n    input.addEventListener('change', e=>{ if(e.target.files[0]) bulkHandleFile(e.target.files[0]); });\n    drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.style.borderColor='var(--accent)'; drop.style.background='var(--accent-soft)'; });\n    drop.addEventListener('dragleave', ()=>{ drop.style.borderColor='var(--line)'; drop.style.background='var(--gray-bg)'; });\n    drop.addEventListener('drop', e=>{ e.preventDefault(); drop.style.borderColor='var(--line)'; drop.style.background='var(--gray-bg)';\n      if(e.dataTransfer.files[0]) bulkHandleFile(e.dataTransfer.files[0]); });\n  }\n  document.querySelectorAll('[data-bulk-map]').forEach(el=>{\n    el.addEventListener('change', e=>{\n      const idx=+e.target.dataset.idx, val=e.target.value;\n      if(val) w.mapping[idx]=val; else delete w.mapping[idx];\n      renderBulkWizard();\n    });\n  });\n  document.querySelectorAll('[data-bulk-inc]').forEach(el=>{\n    el.addEventListener('change', e=>{\n      const idx=+e.target.dataset.idx;\n      if(e.target.checked) w.included.add(idx); else w.included.delete(idx);\n    });\n  });\n  const incAll=document.querySelector('[data-bulk-inc-all]');\n  if(incAll) incAll.addEventListener('change', e=>{\n    document.querySelectorAll('[data-bulk-inc]:not(:disabled)').forEach(el=>{ el.checked=e.target.checked; el.dispatchEvent(new Event('change')); });\n  });\n}\n\nasync function bulkHandleFile(file){\n  const err=document.getElementById('bulkErr');\n  try{\n    const {headers, rows} = await parseSpreadsheetFile(file);\n    if(!rows.length){ if(err) err.textContent='データが見つかりませんでした。1行目に見出し、2行目以降にデータを入れてください。'; return; }\n    BULK_WZ.file=file; BULK_WZ.headers=headers; BULK_WZ.rawRows=rows;\n    BULK_WZ.mapping=autoMapColumns(headers);\n    BULK_WZ.step=2;\n    renderBulkWizard();\n  }catch(e){ if(err) err.textContent=(e&&e.message)||'ファイルを読み込めませんでした。CSVまたはExcel形式でお試しください。'; }\n}\n\nfunction bulkGoBack(){ BULK_WZ.step=1; renderBulkWizard(); }\nfunction bulkGoBackToMapping(){ BULK_WZ.step=2; renderBulkWizard(); }\n\nfunction bulkToPreview(){\n  const w=BULK_WZ;\n  const defProjEl=document.getElementById('bulkDefProj');\n  if(defProjEl) w.defaultProj=defProjEl.value;\n  w.objects = rowsToObjects(w.rawRows, w.mapping);\n  w.included = new Set(w.objects.map((_,i)=>i));\n  w.step=3;\n  renderBulkWizard();\n}\n\nfunction bulkSubmitFinal(){\n  const w=BULK_WZ;\n  const isK=S.role==='kanoa';\n  const existing=DB.referrals;\n  let n=0;\n  w.objects.forEach((o,idx)=>{\n    if(!w.included.has(idx)) return;\n    const issues=validateBulkRow(o, idx, w.objects, existing);\n    if(issues.some(i=>i.level==='error')) return;\n    const ag = isK ? (DB.agencies[0]?DB.agencies[0].id:'AG-01') : S.agencyId;\n    let pj = w.defaultProj;\n    if(o.project){\n      const m=w.projList.find(p=>(p.name||'').includes(o.project) || o.project.includes((p.name||'').replace(' パートナー送客','')));\n      if(m) pj=m.id;\n    }\n    const r=mk(pj, ag, o.name.trim(), o.kana||'', o.phone||'', o.email||'', o.address||'', o.area||'', 'entry','—', todayISO());\n    r.src=o.src||'';\n    if(!isK) r.seenK=false;\n    DB.referrals.unshift(r);\n    if(typeof logRef==='function') logRef(r.id,'送客登録','CSV/Excel一括登録');\n    n++;\n  });\n  DB.activity.unshift({ts:nowTS(),actor:isK?'KANOA':S.agencyId,action:'CSV/Excel一括登録',detail:`${n}名を送客登録`});\n  save(); updateNavCounts();\n  BULK_WZ.step=4; BULK_WZ.resultCount=n;\n  renderBulkWizard();\n  render();\n}\n\n\n/* ════════════════════ 次のアクション判定（自動注入） ════════════════════ */\n/* ════════════════════════════════════════════════════════════\n   候補者の「次にやるべきこと」を判定する共通ロジック\n   要望4（SPIリマインド強化）・要望5（一覧の網羅性）の中核。\n   優先度の高い順に、今やるべき最重要アクションを1つ返す。\n   ════════════════════════════════════════════════════════════ */\n\n/* 返り値: {level:'urgent'|'warn'|'info'|'done', text, who:'kanoa'|'agency'|'both'} または null */\nfunction nextAction(r){\n  if(!r) return null;\n  const st=r.status;\n\n  // 見送り・辞退は対応不要\n  if(st==='rejected') return {level:'done', text:'見送り', who:'both'};\n  if(st==='declined') return {level:'done', text:'辞退', who:'both'};\n\n  // 退職・返金フェーズ（入社後）は返金ボールを最優先\n  if(st==='joined' && r.resigned && isRakutenProject(r.pj) && typeof refundBall==='function'){\n    const b=refundBall(r);\n    if(b && b.side){\n      return {level:'warn', text:b.act, who:b.side};\n    }\n    if(b && !b.side) return {level:'done', text:b.act, who:'both'};\n  }\n\n  // 選考中：SPI・コンプラの未対応は「最速で」対応すべき最重要事項\n  if(typeof needsChecks==='function' && needsChecks(r)){\n    const spi=r.spi||'none', comp=r.compliance||'none';\n    const pend=[];\n    if(spi!=='done') pend.push('SPI');\n    if(comp!=='done') pend.push('コンプラ');\n    if(pend.length){\n      // 選考会が決まっている（interview以降）のに未受検は特に緊急\n      const idx=STATUS_ORDER.indexOf(st);\n      const urgent = idx>=STATUS_ORDER.indexOf('interview');\n      return {\n        level: urgent ? 'urgent' : 'warn',\n        text: `${pend.join('・')}の受検案内`+(urgent?'（選考会前・最速で）':''),\n        who:'both'\n      };\n    }\n  }\n\n  // 書類不足で次段階に進めない\n  if(typeof missingDocsForStage==='function'){\n    const order=['screening','interview','offer','joined'];\n    const ci=order.indexOf(st);\n    const nextStage = ci>=0 ? order[ci+1] : (st==='entry'?'screening':null);\n    if(nextStage){\n      const miss=missingDocsForStage(r, nextStage==='screening'?'interview':nextStage);\n      if(miss && miss.length){\n        return {level:'warn', text:`${miss.join('・')}のアップロード`, who:'agency'};\n      }\n    }\n  }\n\n  // 通常の次ステップ案内\n  const map={\n    entry:      {level:'info', text:'書類選考へ', who:'kanoa'},\n    screening:  {level:'info', text:'選考会の調整', who:'kanoa'},\n    interview:  {level:'info', text:'選考会の結果待ち', who:'kanoa'},\n    offer:      {level:'info', text:'入社手続き', who:'both'},\n    joined:     {level:'done', text:'入社済み', who:'both'},\n  };\n  return map[st] || null;\n}\n\n/* 一覧セル用のコンパクトなバッジHTML */\nfunction nextActionCell(r){\n  const a=nextAction(r);\n  if(!a) return '<span class=\"cell-sub\">—</span>';\n  const styles={\n    urgent:'background:#FDEEF1;color:#BE123C;font-weight:700',\n    warn:  'background:#FDF2E2;color:#B45309;font-weight:600',\n    info:  'background:var(--gray-bg);color:var(--soft)',\n    done:  'background:#E8F6EE;color:#15803D;font-weight:600',\n  };\n  const icon = a.level==='urgent' ? '🔥 ' : '';\n  return `<span class=\"tag\" style=\"font-size:10.5px;${styles[a.level]||styles.info}\">${icon}${esc(a.text)}</span>`;\n}\n\n/* 緊急対応が必要な候補者だけを抽出（トップの警告バナー用） */\nfunction urgentBannerHtml(){\n  const list=urgentReferrals();\n  if(!list.length) return '';\n  // 候補者名を個別にクリック可能にし、押すと本人の詳細を開く\n  const chips=list.slice(0,6).map(r=>\n    `<button type=\"button\" data-act=\"open-ref\" data-id=\"${r.id}\" style=\"border:none;background:#fff;color:#BE123C;font-weight:600;font-size:12px;padding:3px 10px;border-radius:999px;cursor:pointer;border:1px solid #F5B5C4\">${esc(r.name)}</button>`\n  ).join('');\n  const more=list.length>6?`<span style=\"font-size:11.5px;color:#9F1239;align-self:center\">他${list.length-6}名</span>`:'';\n  return `<div style=\"padding:13px 16px;margin-bottom:16px;border-radius:12px;background:#FDEEF1;border:1px solid #F8C8D4\">\n    <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\">\n      <span style=\"font-size:19px;line-height:1\">🔥</span>\n      <div style=\"font-weight:700;color:#BE123C;font-size:13.5px\">至急対応が必要な候補者が ${list.length}名 います</div>\n    </div>\n    <div style=\"font-size:11.5px;color:#9F1239;margin-bottom:9px\">SPI・コンプラの受検案内は選考落ちに直結します。名前をタップすると詳細を開けます。</div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:7px\">${chips}${more}</div>\n  </div>`;\n}\nfunction urgentReferrals(){\n  return DB.referrals.filter(r=>{ const a=nextAction(r); return a && a.level==='urgent'; });\n}\n\n\n/* ════════════════════ 受信箱（一時保存）自動注入 ════════════════════ */\n/* ════════════════════════════════════════════════════════════\n   受信箱（一時保存）— Googleフォーム/CSVからの応募を取捨選択\n   パートナーが「選考会に進める（送客する）」か「見送る」を選ぶ。\n   承認したものだけが DB.referrals へ移動＝正式な送客になる。\n   ════════════════════════════════════════════════════════════ */\n\n/* 自社（パートナー）の受信箱アイテム。KANOAは全件見える。 */\nfunction myIntake(){\n  if(S.role==='kanoa') return DB.intake||[];\n  return (DB.intake||[]).filter(x=>x.ag===S.agencyId);\n}\n\n/* 受信箱の件数（ナビバッジ用） */\nfunction intakeCount(){ return myIntake().length; }\n\n/* 1件を正式送客する（intake → referrals、選考会=entryとして登録） */\nfunction approveIntake(id, pjId){\n  const idx=(DB.intake||[]).findIndex(x=>x.id===id);\n  if(idx<0) return;\n  const it=DB.intake[idx];\n  const pj = pjId || it.pj;\n  if(!pj){ toast('登録先の案件を選んでください'); return; }\n  // 自社内の重複チェック（承認前）：同じ名前＋電話が既に自社にいたら登録しない\n  const _dup=findOwnDuplicate(it.ag, it.name, it.phone||'');\n  if(_dup){\n    toast(`${it.name} さんは既に送客済みです。二重登録はできません。`);\n    return;\n  }\n  const r=mk(pj, it.ag, it.name, it.kana||'', it.phone||'', it.email||'', it.address||'', it.area||'', 'entry','—', todayISO());\n  r.src=it.company||it.src||'';   // 紹介元＝入力された会社名\n  r.docs=Array.isArray(it.docs)?it.docs.slice():[];  // フォームの添付書類を引き継ぐ\n  if(S.role==='agency') r.seenK=false;  // KANOA未確認マーク（NEWバッジ）\n  DB.referrals.unshift(r);\n  DB.intake.splice(idx,1);\n  if(typeof logRef==='function') logRef(r.id,'送客登録','パートナー連携から選考会へ');\n  // パートナー承認時はKANOAへ自動通知（要望2a）\n  if(S.role==='agency'){\n    const p=project(pj);\n    auto
