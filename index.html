   入力欄・日本語変換・カーソルは壊さない（ヘッダーはフォーカスを持たない静的表示のため差し替え可）。 */
function refreshChatBodyOnly(){
  const ag=curThreadAg(); if(ag==null) return;
  const viewer=meRole();
  const curRef=S.threadRef||null;
  // ① スレッド上部の状況ヘッダー（候補者のステータス・パイプライン）を差し替える。
  //    KANOAが「連絡」からステータスを変えたとき、相手側にも即時反映させる要。
  const ctx=document.querySelector('#content .conv .chat > .cmd, #content .conv .chat > .thread-ctx');
  if(ctx){
    let ctxHtml; try{ ctxHtml=threadCtxHeader(ag, viewer, curRef); }catch(e){ ctxHtml=null; }
    if(ctxHtml!=null){
      const tmp=document.createElement('div'); tmp.innerHTML=ctxHtml;
      const next=tmp.firstElementChild;
      if(next && next.outerHTML!==ctx.outerHTML) ctx.replaceWith(next);
    }
  }
  // ② メッセージ本文
  const realBody=document.querySelector('#content .chat-body'); if(!realBody) return;
  let html; try{ html=chatBodyHTML(ag, curRef, viewer); }catch(e){ return; }
  if(html==null || html===realBody.innerHTML) return;
  const atBottom=(realBody.scrollHeight-realBody.scrollTop-realBody.clientHeight)<40;
  const prev=realBody.scrollTop;
  realBody.innerHTML=html;
  realBody.scrollTop=atBottom?realBody.scrollHeight:prev;
}

/* ════════════════════ 自動更新・リアルタイム（本番のみ） ════════════════════ */
let _pollT=null, _msgT=null, _rtDebounce=null;
let _pollSkips=0;   // Realtime正常でポーリングを見送った連続回数（デバッグ・保険用）
function startAutoRefresh(){
  if(DEMO_MODE) return;
  stopAutoRefresh();
  // ── 保険ポーリング ──
  // Realtimeで実際に変更を受信できている（realtimeHealthy=true）間だけ「読み直し」を止める。
  // それ以外（anonセッションでRLSの通知が届かない・Realtime未有効化・接続断など）は
  // 取りこぼし＝自動反映されない状態になるため、必ずポーリングで最新化する。
  _pollT=setInterval(()=>{
    if(SUPA.realtimeHealthy && SUPA.realtimeHealthy()){ _pollSkips++; return; }  // 受信実績あり＝pushで即時反映されている → 読み直し不要
    _pollSkips=0;
    applyRefresh();
  }, 3000);
  _msgT=setInterval(pollMessages, 1000);
  startUpdateWatch();   // 古い画面を開いたままにさせない
  startRealtime();
  if(!_visWired){
    _visWired=true;
    // タブが再びアクティブになった瞬間、即座に再接続＆最新化する（ブラウザのバックグラウンド間引き対策）
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState==='visible' && !DEMO_MODE && S.role){
        SUPA.forceReconnectRealtime && SUPA.forceReconnectRealtime();
        applyRefresh(); pollMessages();
      }
    });
    // 回線が復帰した瞬間も同様に即時再同期（Wi-Fi切替・機内モード解除など対策）
    window.addEventListener('online', ()=>{
      if(!DEMO_MODE && S.role){ SUPA.forceReconnectRealtime && SUPA.forceReconnectRealtime(); applyRefresh(); pollMessages(); }
    });
  }
}
let _visWired=false;
function stopAutoRefresh(){ if(_pollT){ clearInterval(_pollT); _pollT=null; } if(_msgT){ clearInterval(_msgT); _msgT=null; } stopRealtime(); }
function startRealtime(){
  if(DEMO_MODE) return;
  SUPA.subscribeRealtime((tb)=>{ if(tb==='messages'){ pollMessages(); } clearTimeout(_rtDebounce); _rtDebounce=setTimeout(applyRefresh, 250); }); // 変更を即反映
}
function stopRealtime(){ try{ SUPA.unsubscribeRealtime(); }catch(e){} clearTimeout(_rtDebounce); }

let _msgBusy=false;
/* 連絡だけを高速にポーリングして即・通知＆反映（軽量・1クエリ） */
async function pollMessages(){
  if(DEMO_MODE || !S.role || _msgBusy) return;
  if(SUPA.isBusy && SUPA.isBusy()) return;
  _msgBusy=true;
  const seq0 = SUPA.mutSeq ? SUPA.mutSeq() : 0;
  try{
    const freshMsgs=await SUPA.loadMessages();
    if(!freshMsgs) return;
    if(SUPA.isBusy && SUPA.isBusy()) return;   // 通信中にローカル変更が入った → 今回の取得は捨てる
    if(SUPA.mutSeq && SUPA.mutSeq()!==seq0) return;
    // ★取得した内容を「サーバーと同じ」として記録してから反映する。
    //   これが無いと、取得したばかりの行まで未送信のローカル変更に見えてしまい、
    //   相手が付けた既読を古い値で上書きしてしまう（既読が未読に戻る）。
    if(SUPA.noteFetched) SUPA.noteFetched('messages', freshMsgs);
    // 現DBのmessagesだけを差し替えたスナップショットを作り、共通のcommitFreshを通す。
    // これにより applyRefresh と同じ再描画ルール・競合防止が効く。
    const snapshot={...DB, messages:freshMsgs};
    commitFresh(snapshot);
  }catch(e){}
  finally{ _msgBusy=false; }
}
function dataSig(d){
  if(!d) return '';
  // 全テーブルの全フィールドをJSON化して指紋を作る。
  // フィールドやテーブルを将来追加しても、自動的に変更検知の対象になる（漏れゼロ）。
  // 同期対象の全テーブルを列挙。新テーブルを足したらここに1語追加するだけ。
  const TABLES=['referrals','projects','assignments','agencies','messages','tasks','members','documents','invoices','reflog','logins','intake','notices'];
  const parts=[];
  for(const t of TABLES){
    const arr=d[t]||[];
    // JSON.stringify で各行の全フィールドを反映。順序差の影響を避けるため件数も付与。
    try{ parts.push(t+':'+arr.length+':'+JSON.stringify(arr)); }
    catch(e){ parts.push(t+':'+arr.length); }
  }
  return parts.join('##');
}
function countMyIncoming(db){ // 相手から来た未読の件数（自分宛て）
  const viewer=S.role==='kanoa'?'kanoa':'agency', other=viewer==='kanoa'?'agency':'kanoa';
  let n=0; for(const m of (db.messages||[])){ if(m.deleted) continue; if(m.from===other && !m.read){ if(viewer==='kanoa'||m.ag===S.agencyId) n++; } } return n;
}
function myIncomingTaskIds(db){ // 自分に依頼された未完タスクのID集合
  const me=meId(); const s=new Set();
  for(const t of (db.tasks||[])){ if((t.owner||'kanoa')===me && (t.from||t.owner)!==me && !t.done) s.add(t.id); } return s;
}
function myDoneAssignedIds(db){ // 自分が依頼し、完了済みになったタスクのID集合
  const me=meId(); const s=new Set();
  for(const t of (db.tasks||[])){ if((t.from||t.owner)===me && (t.owner||'kanoa')!==me && t.done) s.add(t.id); } return s;
}
function diffNew(setNew, setOld){ let n=0; setNew.forEach(id=>{ if(!setOld.has(id)) n++; }); return n; }
function flashNav(view){
  const el=document.querySelector(`[data-navcount="${view}"]`); if(el) el.classList.add('alert');
  const item=document.querySelector(`.nav-item[data-view="${view}"]`); if(item){ item.classList.remove('nav-bump'); void item.offsetWidth; item.classList.add('nav-bump'); }
}
function notifyNewMessages(n){ toast(`新しい連絡が ${n}件 届きました`); flashNav('messages'); }
function notifyNewTasks(n){ toast(`新しいタスク依頼が ${n}件 あります`); flashNav('tasks'); }
function notifyTaskDone(n){ toast(`依頼したタスクが ${n}件 完了しました`); flashNav('tasks'); }
let _refreshing=false;
/* ── 取得した最新データを DB へ反映し、必要なら再描画する共通処理 ──
   全体更新（applyRefresh）と連絡だけの更新（pollMessages）が、
   まったく同じ再描画ルールを通ることで、DB書き換えの競合と取りこぼしを無くす。 */
let _committing=false;
/* ── まだサーバーへ送れていないローカル行を守る ──────────────────
   自動更新（1秒ごとのpollMessages／3秒ごとのapplyRefresh）は通信に数百ms かかる。
   その通信中に送信すると、返ってきた「送信前のサーバー内容」で DB を丸ごと
   置き換えてしまい、まだアップロードされていない行が消えていた。
   （isBusy() の判定は通信を始める前にしか行われず、待っている間の変更を守れない）
   一括送信のように一度に大量の行を作るときほど当たりやすく、
   「送信できたと出るのにスレッドに出てこない」の原因になっていた。
   ・サーバーに無い ＋ 未送信 → 残す（送信直後の行を守る）
   ・サーバーに無い ＋ 送信済み → 消す（他の端末で削除された行）              */
const _MERGE_TABLES=['messages','referrals','tasks','members','invoices','reflog','intake','projects','agencies','notices'];
function mergeUnsent(fresh){
  if(DEMO_MODE || !fresh) return fresh;
  for(const t of _MERGE_TABLES){
    // 書けない役割のテーブルは守らない。送れない行を手元に残しても消えないゴミになるだけで、
    // サーバーが正のはず（例：パートナーにとっての「お知らせ」）
    if(SUPA.canWrite && !SUPA.canWrite(t)) continue;
    const cur=DB[t]; if(!Array.isArray(cur) || !cur.length) continue;
    const arr=Array.isArray(fresh[t])?fresh[t]:[];
    // まだサーバーへ送れていないローカル行（新規・変更の両方）。
    // ★今回の取得に含まれていた行は「取得した時点」の判定を使う。
    //   取得時に _sent を更新しているため、ここで isPending を呼び直すと
    //   「相手の変更で古くなっただけの行」まで未送信に見え、手元の古い値で
    //   サーバーを上書きしてしまう（相手が付けた既読が未読に戻る原因）。
    const pend=new Map();
    for(const r of cur){
      if(!r || r.id==null) continue;
      if(SUPA.wasFetched && SUPA.wasFetched(t, r.id)){
        if(SUPA.pendingAtFetch && SUPA.pendingAtFetch(t, r.id)) pend.set(r.id, r);
      } else if(SUPA.isPending && SUPA.isPending(t, r)){
        pend.set(r.id, r);   // サーバーに無い行（送信直後の新規など）
      }
    }
    if(!pend.size) continue;
    // サーバー側にも在る行は、ローカルの未送信版で置き換える（並び順はサーバーのまま保つ）
    let swapped=0;
    const merged=arr.map(r=>{
      if(r && r.id!=null && pend.has(r.id)){ const local=pend.get(r.id); pend.delete(r.id); swapped++; return local; }
      return r;
    });
    // サーバーに無い行（新規）は末尾に足す
    const added=[...pend.values()];
    if(swapped || added.length){
      fresh[t]=merged.concat(added);
      console.warn(`[sync] ${t}: 未送信の変更${swapped}件・新規${added.length}件を保持しました`);
    }
  }
  return fresh;
}
function commitFresh(fresh, opts){
  opts=opts||{};
  if(_committing) return false;   // 再入防止（無限ループ・スタックオーバーフロー対策）
  fresh=mergeUnsent(fresh);       // 未送信のローカル行を取りこぼさない
  // 変化検知（全フィールドJSON比較）。差分ゼロなら一切さわらない
  if(dataSig(fresh)===dataSig(DB)) return false;
  _committing=true;
  try{ return _commitFreshInner(fresh, opts); } finally { _committing=false; }
}
function _commitFreshInner(fresh, opts){
  opts=opts||{};
  // 通知計算（DB置換の前に差分を取る）
  const newMsgs=countMyIncoming(fresh)-countMyIncoming(DB);
  const newTasks=diffNew(myIncomingTaskIds(fresh), myIncomingTaskIds(DB));
  const doneTasks=diffNew(myDoneAssignedIds(fresh), myDoneAssignedIds(DB));
  // 連絡入力欄の下書き・カーソルを保全
  const ta=document.getElementById('msgInput');
  const draft=ta?ta.value:null, caret=ta?ta.selectionStart:null, focused=document.activeElement===ta;
  // DBを丸ごと置き換え（messages含む全テーブル。部分置換をやめて競合を根絶）
  DB=fresh; invalidateUnread();
  // 再描画してよいか：モーダル/ドロワー中・フォーム入力中（連絡欄は除く）は保留
  const busy = document.querySelector('.modal.on, .drawer.on, .overlay.on');
  const aeEl=document.activeElement;
  const typing = aeEl && /^(INPUT|TEXTAREA|SELECT)$/.test(aeEl.tagName);
  if(!busy && !typing){
    silentRerender();  // 見えない静かな更新（スクロール・フォーカス保持、アニメなし）
    if(draft!=null){ const mi=document.getElementById('msgInput'); if(mi && document.activeElement!==mi){ mi.value=draft; if(focused){ mi.focus({preventScroll:true}); try{ mi.setSelectionRange(caret,caret); }catch(e){} } } }
  } else if(!busy && S.view==='messages' && aeEl && aeEl.id==='msgInput'){
    refreshChatBodyOnly();  // 入力中でもメッセージ部分だけ更新（入力欄・変換・カーソルは保持）
  } else {
    _pendingRerender=true;  // 閉じた瞬間に反映
  }
  updateNavCounts();
  if(newMsgs>0) notifyNewMessages(newMsgs);
  if(newTasks>0) notifyNewTasks(newTasks);
  if(doneTasks>0) notifyTaskDone(doneTasks);
  return true;
}
async function applyRefresh(){
  if(DEMO_MODE || !S.role || _refreshing) return;
  if(SUPA.isBusy && SUPA.isBusy()) return;   // ローカル変更の同期待ち中は待つ（送信中データの上書き防止）
  _refreshing=true;
  const seq0 = SUPA.mutSeq ? SUPA.mutSeq() : 0;
  try{
    const fresh=await SUPA.loadAll();
    // 取得中にローカル変更が入っていたら、この結果は既に古い可能性があるので捨てる。
    // 次の巡回で取り直せばよい（捨てても取りこぼしにはならない）。
    if(SUPA.isBusy && SUPA.isBusy()) return;
    if(SUPA.mutSeq && SUPA.mutSeq()!==seq0) return;
    if(fresh) commitFresh(fresh);
  }catch(e){}
  finally{ _refreshing=false; }
}
let _pendingRerender=false;
/* モーダル/ドロワーを閉じた直後に、バックグラウンドで溜まっていた更新を画面へ反映 */
function flushPendingRerender(){
  if(!_pendingRerender) return;
  _pendingRerender=false;
  try{ silentRerender(); updateNavCounts(); }catch(e){}
}

function funnel(refs){

  const c = {}; STATUS_ORDER.forEach(s=>c[s]=0); refs.forEach(r=>{ if(c[r.status]!=null) c[r.status]++; });

    const pct = Math.round(c[s]/active*100);
    return `<div style="margin-bottom:11px">

  }).join('');
}

function sessionISO(r){ const s=(r.session||'').trim(); if(!s||s==='—') return '';

  return ''; }

function refFiltered(){
  let rows = DB.referrals.slice();
  if(rFilter.status) rows=rows.filter(r=>r.status===rFilter.status);
  if(rFilter.pj) rows=rows.filter(r=>r.pj===rFilter.pj);
  if(rFilter.ag) rows=rows.filter(r=>r.ag===rFilter.ag);
  if(rFilter.q){ const q=rFilter.q.toLowerCase(); rows=rows.filter(r=>[r.name,r.kana,r.phone,r.email,r.area].some(v=>(v||'').toLowerCase().includes(q))); }
  // 資料
  if(rFilter.docMode!=='all'){ rows=rows.filter(r=>{ const s=docStat(r);
    if(rFilter.docMode==='missing') return r.status!=='rejected' && (!s.rireki||!s.shoku);
    if(rFilter.docMode==='norireki') return !s.rireki;
    if(rFilter.docMode==='noshoku') return !s.shoku;
    if(rFilter.docMode==='both') return s.rireki&&s.shoku;
    return true; }); }
  // 選考会日
  if(rFilter.sessTbd) rows=rows.filter(r=>!sessionISO(r));
  if(rFilter.sessFrom) rows=rows.filter(r=>{ const d=sessionISO(r); return d && d>=rFilter.sessFrom; });
  if(rFilter.sessTo) rows=rows.filter(r=>{ const d=sessionISO(r); return d && d<=rFilter.sessTo; });
  // 入社月
  if(rFilter.joinMode==='joined') rows=rows.filter(r=>!!r.joined);
  if(rFilter.joinMode==='notjoined') rows=rows.filter(r=>!r.joined);
  if(rFilter.joinFrom) rows=rows.filter(r=>r.joined && r.joined.slice(0,7)>=rFilter.joinFrom);
  if(rFilter.joinTo) rows=rows.filter(r=>r.joined && r.joined.slice(0,7)<=rFilter.joinTo);
  // 送客日
  if(rFilter.crFrom) rows=rows.filter(r=>(r.created||'').slice(0,10)>=rFilter.crFrom);
  if(rFilter.crTo) rows=rows.filter(r=>(r.created||'').slice(0,10)<=rFilter.crTo);
  // エリア
  if(rFilter.area){ const a=rFilter.area.toLowerCase(); rows=rows.filter(r=>(r.area||'').toLowerCase().includes(a)); }
  // 支払ステータス
  if(rFilter.pay){ rows=rows.filter(r=>{ const k=payStatusOf(r); return rFilter.pay==='none' ? !k : k===rFilter.pay; }); }
  if(rSort.k){ rows.sort((a,b)=>{ let x,y; if(rSort.k==='status'){x=STATUS_ORDER.indexOf(a.status);y=STATUS_ORDER.indexOf(b.status);} else if(rSort.k==='ag'){x=(agency(a.ag)||{}).name||a.ag||'';y=(agency(b.ag)||{}).name||b.ag||'';} else {x=a[rSort.k]||'';y=b[rSort.k]||'';} return x<y?-1*rSort.d:x>y?rSort.d:0; }); }
  return rows;
}

// パートナーの「要対応」項目を集約（書類未提出・未読・日程未確定）
function agencyTodos(agId){
  const todos=[];
  const refs=DB.referrals.filter(r=>r.ag===agId);
  // 1) 選考会に必要な書類が未提出（entry/screening）
  refs.forEach(r=>{
    if(['entry','screening'].includes(r.status)){
      const miss=missingDocsForStage(r,'interview');
      if(miss.length) todos.push({type:'doc', label:`${r.name}：${miss.join('・')}が未提出`, sub:`${shortPjName(r.pj)}・選考会に進むのに必要`, act:`data-act="open-ref" data-id="${r.id}"`, cta:'資料を提出'});
    }
    // 内定後の必要書類（源泉徴収票・給与明細など）
    if(r.status==='offer'){
      const miss=missingDocsForStage(r,'offer');
      if(miss.length) todos.push({type:'doc', label:`${r.name}：内定後の${miss.join('・')}を提出`, sub:`${shortPjName(r.pj)}・オファー提示に必要`, act:`data-act="open-ref" data-id="${r.id}"`, cta:'資料を提出'});
    }
  });
  // 2) KANOAからの未読
  const genUn=subUnread(agId, null, 'agency');
  if(genUn) todos.push({type:'msg', label:`全体連絡：KANOAから${genUn}件の未読`, sub:'お知らせ・一般連絡', act:`data-act="open-general-thread"`, cta:'開く'});
  subThreadKeys(agId).forEach(rid=>{
    const r=DB.referrals.find(x=>x.id===rid); if(!r) return;
    const un=subUnread(agId, rid, 'agency');
    if(un) todos.push({type:'msg', label:`${r.name}：KANOAから${un}件の未読`, sub:shortPjName(r.pj), act:`data-act="open-cand-thread" data-ag="${agId}" data-ref="${rid}"`, cta:'返信'});
  });
  // 3) 選考会の日程が未確定
  refs.forEach(r=>{
    if(r.status==='interview' && (!r.session||r.session==='—'))
      todos.push({type:'sched', label:`${r.name}：選考会の日程が未確定`, sub:shortPjName(r.pj), act:`data-act="open-cand-thread" data-ag="${agId}" data-ref="${r.id}"`, cta:'相談'});
  });
  return todos;
}

function shortPjName(pj){ const p=project(pj); return p?p.name.replace(' パートナー送客','').replace(' 送客',''):pj; }
function agencyInProject(ag, pj){

function lastAgMsg(ag, pj){
  let ms=DB.messages.filter(m=>m.ag===ag && !m.deleted);
  if(pj){ ms=ms.filter(m=>{ if(!m.refId) return false; const r=DB.referrals.find(x=>x.id===m.refId); return r && r.pj===pj; }); }
  ms.sort(msgCmp);

}
function unreadAgPj(ag, pj){
  return DB.messages.filter(m=>{
    if(m.ag!==ag||m.from!=='agency'||m.read) return false;
    if(pj){ if(!m.refId) return false; const r=DB.referrals.find(x=>x.id===m.refId); return r&&r.pj===pj; }
    return true;
  }).length;
}

function renderMsgList(){
  const wrap=document.getElementById('msgListWrap'); if(!wrap) return;
  const q=(msgFilter.q||'').trim(); const ql=q.toLowerCase(); const pj=msgFilter.pj;
  const activeAgs=DB.agencies.filter(a=>a.status!=='pending');
  if(q){
    // 候補者・パートナーを横断検索
    const cands=DB.referrals.filter(r=>{
      if(pj && r.pj!==pj) return false;
      const a=agency(r.ag); if(!a||a.status==='pending') return false;
      return (r.name||'').toLowerCase().includes(ql)||(r.kana||'').toLowerCase().includes(ql)||(r.email||'').toLowerCase().includes(ql);
    }).sort((a,b)=> a.name<b.name?-1:1).slice(0,50);
    const ags=activeAgs.filter(a=>agencyInProject(a.id,pj) && (a.name.toLowerCase().includes(ql)||(a.contact||'').toLowerCase().includes(ql)));
    let h='';
    if(cands.length) h+=`<div class="msg-sec">候補者 ${cands.length}</div><div class="panel">${cands.map(msgCandRow).join('')}</div>`;
    if(ags.length)   h+=`<div class="msg-sec">パートナー ${ags.length}</div><div class="panel">${ags.map(a=>msgAgRow(a,pj)).join('')}</div>`;
    wrap.innerHTML = (cands.length||ags.length)? h : emptyState('該当する候補者・パートナーがありません','検索条件を変えてみてください');
    return;
  }
  let ags=activeAgs.filter(a=>{ try{ return agencyInProject(a.id,pj); }catch(e){ return !pj; } });
  if(threadFilter==='unread') ags=ags.filter(a=>{ try{ return (pj?unreadAgPj(a.id,pj):unreadKanoaBy(a.id))>0; }catch(e){ return false; } });
  const list=ags.map(a=>{ let un=0,last=null; try{ un=(pj?unreadAgPj(a.id,pj):unreadKanoaBy(a.id))||0; }catch(e){} try{ last=lastAgMsg(a.id,pj); }catch(e){} return {a, un, last}; })
    .sort((x,y)=>(y.un-x.un)||((x.last&&x.last.ts?x.last.ts:'')<(y.last&&y.last.ts?y.last.ts:'')?1:-1));
  // 各行の描画は個別に防御（1社のデータ不整合で一覧全体が消えるのを防ぐ）
  const rowsHtml = list.map(({a})=>{ try{ return msgAgRow(a,pj); }catch(e){ return `<div class="thread-item" data-act="open-thread" data-ag="${esc(a.id)}"><div class="thread-av" style="background:#94a3b8">${esc((a.name||'?').slice(0,1))}</div><div class="thread-main"><div class="thread-name">${esc(a.name||a.id)}</div></div></div>`; } }).join('');
  wrap.innerHTML = list.length
    ? `<div class="panel">${rowsHtml}</div>`
    : emptyState(pj?'この案件のやり取りはまだありません':(threadFilter==='unread'?'未読はありません':'パートナーがありません'), pj?'別の案件を選ぶか、候補者を検索してください':'すべて確認済みです');
}

/* 送客スレッドのサブナビを描画 */
/* ── 送客スレッド一覧の幅（利用者がドラッグで調整でき、端末に保存される）── */
const RAIL_W_KEY='kanoa_rail_w', RAIL_W_MIN=180, RAIL_W_MAX=460, RAIL_W_DEFAULT=260;
function railWidth(){
  let v=NaN; try{ v=parseInt(localStorage.getItem(RAIL_W_KEY)||'',10); }catch(e){}
  if(!isFinite(v)) v=RAIL_W_DEFAULT;
  return Math.min(RAIL_W_MAX, Math.max(RAIL_W_MIN, v));
}
function setRailWidth(px, persist){
  const v=Math.min(RAIL_W_MAX, Math.max(RAIL_W_MIN, Math.round(px)));
  const conv=document.querySelector('.conv');
  if(conv) conv.style.setProperty('--rail-w', v+'px');
  if(persist!==false){ try{ localStorage.setItem(RAIL_W_KEY, String(v)); }catch(e){} }
  return v;
}
let _railDrag=null;
document.addEventListener('pointerdown', e=>{
  const h=e.target && e.target.closest && e.target.closest('.rail-resizer'); if(!h) return;
  const rail=h.closest('.cand-rail'); if(!rail) return;
  e.preventDefault();
  _railDrag={ x:e.clientX, w:rail.getBoundingClientRect().width };
  h.classList.add('on');
  document.body.style.userSelect='none'; document.body.style.cursor='col-resize';
  try{ h.setPointerCapture(e.pointerId); }catch(err){}
});
document.addEventListener('pointermove', e=>{
  if(!_railDrag) return;
  setRailWidth(_railDrag.w + (e.clientX - _railDrag.x));
});
function _endRailDrag(){
  if(!_railDrag) return;
  _railDrag=null;
  document.querySelectorAll('.rail-resizer.on').forEach(x=>x.classList.remove('on'));
  document.body.style.userSelect=''; document.body.style.cursor='';
}
document.addEventListener('pointerup', _endRailDrag);
document.addEventListener('pointercancel', _endRailDrag);
/* つまみをダブルクリックで既定の幅に戻す */
document.addEventListener('dblclick', e=>{
  const h=e.target && e.target.closest && e.target.closest('.rail-resizer'); if(!h) return;
  setRailWidth(RAIL_W_DEFAULT); toast('一覧の幅を既定に戻しました');
});

function subThreadNav(ag, viewer, curRef){
  let refIds=subThreadKeys(ag);
  // 案件フィルタが有効なら、その案件の候補者だけに絞る（KANOAのみ）
  const pjF = (viewer==='kanoa') ? msgFilter.pj : '';
  if(pjF) refIds=refIds.filter(rid=>{ const r=DB.referrals.find(x=>x.id===rid); return r && r.pj===pjF; });
  // 今開いている候補者は（メッセージ未送信でも）必ず表示
  if(curRef && !refIds.includes(curRef)){ const r=DB.referrals.find(x=>x.id===curRef); if(r) refIds=[curRef, ...refIds]; }
  // 送客スレッドを最新メッセージ順に
  const items=refIds.map(rid=>{
    const r=DB.referrals.find(x=>x.id===rid);
    const ms=subThread(ag, rid);
    const last=ms[ms.length-1];
    return { rid, r, last, un:subUnread(ag, rid, viewer), t:last?last.ts:'' };
  }).filter(x=>x.r).sort((a,b)=> (b.un-a.un) || (a.t<b.t?1:-1));
  const genUn=subUnread(ag, null, viewer);

  // 縦の候補者レール

    <div class="cand-rail-head"><span>送客スレッド <b>${items.length}</b></span>
      <button class="cand-add" data-act="new-subthread" data-ag="${ag}" title="候補者を追加"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>

  // 各スレッドの「未読に戻す」ボタン（既読で、相手からの連絡があるときだけ出す）

    : '';
  /* 名前の下に出す1行は、そのスレッドの最新メッセージの冒頭。
     last は subThread を時刻順に並べた最後＝最新（items 生成時に取得済み）。
     まだやり取りが無いときだけ fallback の文言を出す。
     案件名とステータスは title 属性（ツールチップ）に退避している。 */
  const subLine = (last, fallback) => {
    if(!last) return esc(fallback);
    const body = last.deleted ? '送信を取り消しました' : (last.text||'').replace(/\s+/g,' ');
    const mine = last.from===viewer ? '自社: ' : '';
    return esc(mine + body.slice(0, 40));
  };
  // 全体連絡
  const genLast=(function(){ const ms=subThread(ag, null); return ms[ms.length-1]||null; })();
  const genBtn=unreadBtn(null,'全体連絡');
  html+=`<div class="cand-slot">
    <button class="cand-item ${genActive?'on':''} ${genBtn?'has-unread':''}" data-act="open-subthread" data-ag="${ag}" data-ref="">
      <span class="ci-dot" style="background:var(--ink)"></span>

      ${genUn?`<span class="ci-un">${genUn}</span>`:''}
    </button>${genBtn}
  </div>`;
  // 送客スレッド（候補者ごと・縦並び）
  items.forEach(({rid,r,un,last})=>{
    const on=(curRef||null)===rid;
    const stColor=STATUS[r.status]?`var(--${STATUS[r.status].cls==='joined'?'g':STATUS[r.status].cls==='rejected'?'r':STATUS[r.status].cls==='offer'?'v':STATUS[r.status].cls==='interview'?'a':STATUS[r.status].cls==='screening'?'b':'gray'})`:'var(--gray)';
    const ds=docStat(r);
    const needDocs = (r.status==='entry'||r.status==='screening') && !(ds.rireki&&ds.shoku);
    const uBtn=unreadBtn(rid, r.name);
    html+=`<div class="cand-slot">
      <button class="cand-item ${on?'on':''} ${uBtn?'has-unread':''}" data-act="open-subthread" data-ag="${ag}" data-ref="${rid}">
        <span class="ci-dot" style="background:${stColor}"></span>
        <span class="ci-main"><span class="ci-name">${esc(r.name)}${un?`<span style="display:inline-block;margin-left:6px;padding:0px 6px;border-radius:999px;background:var(--r);color:#fff;font-size:9px;font-weight:700;vertical-align:1px">New</span>`:''}</span><span class="ci-sub" title="${esc(shortPjName(r.pj))} · ${esc(statusDef(r.status).label)}">${subLine(last, 'メッセージはまだありません')}</span></span>
        ${needDocs?`<span class="ci-flag" title="書類が未提出"></span>`:''}
        ${un?`<span class="ci-un">${un}</span>`:''}
      </button>${uBtn}

  html+=`</div><div class="rail-resizer" title="ドラッグで幅を調整（ダブルクリックで既定に戻す）"></div></aside>`;
  return html;
}
/* コンテキストヘッダー（誰の/どの案件か常時表示） */
// 候補者の「次にやるべきこと」をステータス＋書類状況から提案
function nextActionHint(r, viewer){
  const K = viewer==='kanoa';
  const hasSession = r.session && r.session!=='—';
  const missIv = missingDocsForStage(r,'interview');     // 選考会に必要な未提出書類
  const missOf = missingDocsForStage(r,'offer');         // 内定後に必要な未提出書類
  const optOf  = missingOptionalForStage(r,'offer');
  switch(r.status){
    case 'entry':
      if(missIv.length) return { b:'選考会に必要な書類を依頼', s:`${missIv.join('・')}が未提出（選考会に進めません）`, act:K?{label:'依頼を送る',a:'request-docs',ref:r.id,ag:r.ag}:{label:'資料を出す',a:'open-ref',id:r.id} };
      return { b:'書類選考へ進める', s:'必要書類が揃いました', act:K?{label:'書類選考に',a:'set-ref-status',ref:r.id,s:'screening'}:null };
    case 'screening':
      if(missIv.length) return { b:'選考会に必要な書類を依頼', s:`${missIv.join('・')}が未提出（揃わないと選考会に進めません）`, act:K?{label:'依頼を送る',a:'request-docs',ref:r.id,ag:r.ag}:{label:'資料を出す',a:'open-ref',id:r.id} };
      return { b:'選考会へ — 日程を調整', s:'書類が揃いました。選考会へ進めます', act:K?{label:'日程調整',a:'schedule-msg',ref:r.id,ag:r.ag}:null };
    case 'interview':
      if(hasSession) return { b:`選考会 ${esc(r.session)}`, s:'前日にリマインドを', act:K?{label:'リマインド',a:'remind-msg',ref:r.id,ag:r.ag}:null };
      return { b:'選考会へ — 日程調整', s:'日程が未設定', act:K?{label:'日程調整',a:'schedule-msg',ref:r.id,ag:r.ag}:null };
    case 'offer':
      if(missOf.length) return { b:'内定後の必要書類を回収', s:`至急 ${missOf.join('・')} が必要${optOf.length?`（賞与があれば${optOf.join('・')}も）`:''}`, act:K?{label:'依頼を送る',a:'request-docs',ref:r.id,ag:r.ag}:{label:'資料を出す',a:'open-ref',id:r.id} };
      return { b:'内定 — 入社日を確定', s:'必要書類は回収済み。条件のすり合わせを', act:K?{label:'入社で確定',a:'set-ref-status',ref:r.id,s:'joined'}:null };
    case 'joined':
      return { b:`入社済み ${joinedYM(r)}`, s:'入社後フォロー', act:null };
    case 'resigned':
      return { b:'早期退職', s:'返金規定の確認と手続きを', act:null };
    case 'rejected':
      return { b:'見送り', s:'このスレッドはクローズ', act:null };
    case 'declined':
      return { b:'辞退', s:'このスレッドはクローズ', act:null };
  }
  return null;
}

function stageMark(r, i){
  // 各段階の状態を判定：'pass'(○=通過) / 'fail'(✕=未通過) / 'blank'(空白=未到達)
  const stages = PIPELINE_STAGES;
  // 早期退職は「入社まで通過したあとの退職」なので、入社まで全て通過扱いにする
  if(r.status==='resigned') return 'pass';
  // 見送り・辞退はどちらも「その段階で終わった」。failAt が終わった段階
  if(r.status==='rejected' || r.status==='declined'){
    const failIdx = stages.indexOf(r.failAt||'');
    if(failIdx<0) return i===0 ? 'pass' : 'blank';   // 段階が未記録の古いデータ：送客済までは確実
    if(i<failIdx) return 'pass';            // 終わった段階より前は通過
    if(i===failIdx) return 'fail';          // そこで終わった段階
    return 'blank';                         // それ以降は未到達
  }
  const curIdx = stages.indexOf(r.status);  // declined等は-1
  return (curIdx>=0 && i<=curIdx) ? 'pass' : 'blank';
}

function pipelineStepper(r, viewer){
  const stages = PIPELINE_STAGES;
  const editable = viewer==='kanoa';        // 管理者(KANOA)のみ選択可・パートナーは表示のみ
  // 現在地（到達済みの最終段階）。早期退職は入社まで到達済みとして扱う
  const curIdx = (r.status==='rejected'||r.status==='declined') ? stages.indexOf(r.failAt||'')
               : (r.status==='resigned' ? stages.indexOf('joined') : stages.indexOf(r.status));
  let h = `<div class="cmd-pipe ${editable?'editable':''}">`;
  stages.forEach((s,i)=>{
    const mark = stageMark(r, i);           // 'pass' / 'fail' / 'blank'
    const cur = i===curIdx;
    if(i>0) h += `<span class="pipe-line ${mark!=='blank'?'done':''}"></span>`;
    const tap = editable ? `data-act="set-ref-milestone" data-ref="${r.id}" data-s="${s}"` : '';
    const cls = mark==='pass'?'passed':(mark==='fail'?'failed':'blank');
    const sym = mark==='pass'?'○':(mark==='fail'?'✕':'');
    // ✕の段階では、見送りか辞退かが分かるようにする（記号は同じ✕でも意味が違うため）
    const failWhy = (mark==='fail') ? `${STATUS[s].label}：${statusDef(r.status).label}` : '';
    const ttl = failWhy || (editable ? 'クリックで ○（選考中）→ ✕（未通過）→ 空白（未到達）を切替' : STATUS[s].label);
    h += `<div class="pipe-step ${cls} ${cur?'cur':''}" ${tap} title="${ttl}">
      <span class="pmark">${sym}</span>
      <span>${STATUS[s].label}</span>
    </div>`;
  });
  h += `</div>`;
  return h;
}

function threadCtxHeader(ag, viewer, curRef){
  if((curRef||null)===null){
    const a=agency(ag);
    return `<div class="thread-ctx general">
      <div class="thread-ctx-av">${esc((viewer==='kanoa'?(a?a.name:'?'):'K').slice(0,1))}</div>

        <div class="thread-ctx-name">全体連絡 <span class="tag" style="font-size:10px">案件・候補者に紐づかない連絡</span></div>
        <div class="thread-ctx-meta">${viewer==='kanoa'?esc(a?a.name:ag):'KANOA 事務局'}・お知らせや一般的なやり取り</div>
      </div>
    </div>`;
  }
  const r=DB.referrals.find(x=>x.id===curRef); if(!r) return '';
  const p=project(r.pj);
  const pjName = esc((p?p.name:r.pj).replace(' パートナー送客',''));
  const ds = docStat(r);
  const K = viewer==='kanoa';
  const hint = nextActionHint(r, viewer);
  const hasSession = r.session && r.session!=='—';

  // 書類チップ（提出済=緑/未=黄＋タップで依頼orアップロード）
  const docChip = (label, ok, opt) => {
    if(ok) return `<span class="fact-chip ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>${label}</span>`;
    const act = K ? `data-act="request-docs" data-ref="${r.id}" data-ag="${ag}"` : `data-act="open-ref" data-id="${r.id}"`;
    return `<span class="fact-chip ${opt?'':'warn'}" ${act} title="${K?'提出を依頼':'アップロード'}">${label} <span class="fc-k">${opt?'任意':'未'}</span></span>`;
  };
  // 現在のステージで必要な書類チップを出し分け
  let docChips='';
  if(r.status==='offer'||hasJoined(r)){
    const req=stageReq(r.pj,'offer');
    if(req){
      (req.required||[]).forEach(k=>{ docChips+=docChip(k, ds.has(k)); });
      (req.optional||[]).forEach(k=>{ docChips+=docChip(k, ds.has(k), true); });
    } else { docChips+=docChip('履歴書', ds.rireki)+docChip('職務経歴書', ds.shoku); }
  } else {
    const req=stageReq(r.pj,'interview')||{required:['履歴書','職務経歴書']};
    (req.required||[]).forEach(k=>{ docChips+=docChip(k, ds.has(k)); });
  }

  return `<div class="cmd">
    <div class="cmd-top">
      <div class="cmd-av">${esc((r.name||'？').slice(0,1))}</div>
      <div class="cmd-id">
        <div class="cmd-name">${esc(r.name)} ${statusBadge(r.status)}</div>
        <div class="cmd-link">
          <span class="ag">${esc(agency(ag)?agency(ag).name:ag)}</span>
          <span class="arr">→</span>
          <span class="pj" data-act="${K?'open-project':'open-project-agency'}" data-id="${r.pj}" title="案件を見る">${pjName}</span>
        </div>
      </div>
      <div class="cmd-actions">
        <button class="thread-ctx-btn" data-act="open-ref" data-id="${r.id}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>候補者カード</button>
      </div>
    </div>
    ${pipelineStepper(r, viewer)}
    <div class="cmd-facts">
      ${docChips}
      ${r.joined?`<span class="fact-chip ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 11l3 3L22 4"/></svg>入社 ${joinedYM(r)}</span>`:''}
    </div>
    ${hint?`<div class="next-hint">
      <span class="nh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg></span>
      <span class="nh-text"><b>${hint.b}</b> <span>· ${hint.s}</span></span>
      ${hint.act?`<button class="nh-act" data-act="${hint.act.a}" ${hint.act.ref?`data-ref="${hint.act.ref}"`:''} ${hint.act.ag?`data-ag="${hint.act.ag}"`:''} ${hint.act.id?`data-id="${hint.act.id}"`:''} ${hint.act.s?`data-s="${hint.act.s}"`:''}>${hint.act.label}</button>`:''}
    </div>`:''}
  </div>`;
}
function chatBodyHTML(ag, curRef, viewer){
  const ms=subThread(ag, curRef);
  const lastOutRead = (()=>{ for(let i=ms.length-1;i>=0;i--){ if(ms[i].from===viewer && !ms[i].deleted) return ms[i].read?ms[i].id:null; } return null; })();
  let body='', lastDay='';
  if(!ms.length){
    const r=curRef?DB.referrals.find(x=>x.id===curRef):null;
    body=`<div class="chat-empty">${r?`「${esc(r.name)}」についてのスレッドです。`:''}<br>まだメッセージはありません。下の入力欄から送信できます。</div>`;
  }
  else { body=ms.map(m=>{
    const day=msgDay(m); let d=''; if(day!==lastDay){ lastDay=day; d=`<div class="msg-day">${day.replace(/-/g,'/')}</div>`; }
    const out=(m.from===viewer);
    if(m.deleted){ return `${d}<div class="msg-wrap ${out?'out':'in'}"><div class="msg ${out?'msg-out':'msg-in'}"><span class="msg-deleted">送信を取り消しました</span></div></div>`; }
    let quote='';
    if(m.replyTo){ const o=ms.find(x=>x.id===m.replyTo)||DB.messages.find(x=>x.id===m.replyTo); if(o){ quote=`<div class="msg-quote" data-act="scrollto" data-id="${o.id}"><span class="q-from">${esc(msgSenderName(o,viewer))}</span>${esc((o.deleted?'（取り消されたメッセージ）':o.text).slice(0,60))}</div>`; } }
    // reactions
    const reacts=m.reactions&&Object.keys(m.reactions).length?`<div class="msg-reacts">${Object.entries(m.reactions).map(([e,arr])=>{ const mine=arr.includes(meId())?'mine':''; const isText=/[ぁ-んァ-ヶー一-龥A-Za-z]/.test(e); if(isText){ return `<button class="react-pill text-react ${mine}" data-act="react-toggle" data-id="${m.id}" data-e="${esc(e)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>${esc(e)}${arr.length>1?`<span class="rc">${arr.length}</span>`:''}</button>`; } return `<button class="react-pill ${mine}" data-act="react-toggle" data-id="${m.id}" data-e="${e}">${e}<span class="rc">${arr.length}</span></button>`; }).join('')}</div>`:'';
    const menuBtn=`<button class="msg-task" data-act="msg-menu" data-id="${m.id}" title="メニュー"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>`;
    const receipt=(out && m.id===lastOutRead)?`<div class="msg-receipt">既読</div>`:'';
    const edited=m.edited?`<span class="msg-edited">編集済み</span>`:'';
    let inner;
    if(m.stamp==='emoji'){ inner=`<div class="msg is-emoji" data-mid="${m.id}">${esc(m.text)}<div class="msg-time">${esc(msgHM(m))}</div></div>`; }
    else if(m.stamp){ inner=`<div class="msg is-stamp ${out?'msg-out':'msg-in'}" data-mid="${m.id}"><span class="stamp-pill">${esc(m.text)}</span><div class="msg-time" style="text-align:${out?'right':'left'}">${esc(msgHM(m))}</div></div>`; }
    else { inner=`<div class="msg ${out?'msg-out':'msg-in'}" data-mid="${m.id}">${quote}${renderMsgText(m.text, ag)}${edited}<div class="msg-time">${esc(msgHM(m))}</div></div>`; }
    return `${d}<div class="msg-wrap ${out?'out':'in'}" id="mw-${m.id}">${menuBtn}<div style="display:flex;flex-direction:column;${out?'align-items:flex-end':'align-items:flex-start'};min-width:0">${inner}${reacts}</div></div>${receipt}`;
  }).join(''); }
  return body;
}

/* パスワードハッシュ (SHA-256 via Web Crypto) */
async function hashPw(plain){
  try{
    const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('kanoa_salt_2026::'+plain));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return plain; }
}
async function verifyPw(plain, stored){
  if(!stored) return false;
  // hashed形式（64hex）かどうか
  if(/^[0-9a-f]{64}$/.test(stored)){
    const h=await hashPw(plain); return h===stored;
  }
  return plain===stored; // デモ平文フォールバック
}
/* ブルートフォース制限 */
const _loginFails={}; // agId -> {count, lockUntil}
function checkLoginLock(agId){
  const f=_loginFails[agId]; if(!f) return false;
  if(f.lockUntil && Date.now()<f.lockUntil) return true;
  if(f.lockUntil && Date.now()>=f.lockUntil) { delete _loginFails[agId]; return false; }
  return false;
}
function recordLoginFail(agId){
  if(!_loginFails[agId]) _loginFails[agId]={count:0};
  _loginFails[agId].count++;
  if(_loginFails[agId].count>=5) _loginFails[agId].lockUntil=Date.now()+5*60*1000; // 5分ロック
}
function clearLoginFails(agId){ delete _loginFails[agId]; }

let bulkSel=new Set();
let bulkFilter={q:'',pj:'',status:''};
function bulkCandidates(){
  let rs=DB.referrals.filter(r=>r.status!=='rejected');

  return rs;
}
function bulkFiltered(){
  const q=(bulkFilter.q||'').trim().toLowerCase();
  return bulkCandidates().filter(r=>{
    if(bulkFilter.pj && r.pj!==bulkFilter.pj) return false;
    if(bulkFilter.status && r.status!==bulkFilter.status) return false;
    if(q){ const hay=`${r.name||''} ${r.kana||''} ${agency(r.ag)?agency(r.ag).name:''}`.toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}

async function supaTest(){

  if(el) el.textContent='接続中…';
  try{
    if(!window.supabase){ await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
    const c=window.supabase.createClient(url,key);

function saveRefEdit(id){
  const r=DB.referrals.find(x=>x.id===id); if(!r) return;
  // 保存できる権限があるか（KANOA=全項目 / 一次パートナー=自社の候補者の個人情報のみ）
  if(S.role==='agency' && r.ag!==S.agencyId){ toast('この方は編集できません'); return; }
  if(S.role!=='kanoa' && S.role!=='agency'){ toast('この方は編集できません'); return; }
  const _em=val('dr_email'); if(_em && !isEmail(_em)){ toast('メールアドレスの形式をご確認ください'); const _el=document.getElementById('dr_email'); if(_el) _el.focus(); return; }
  r.name=val('dr_name'); r.kana=val('dr_kana'); r.phone=val('dr_phone'); r.email=_em;
  r.address=val('dr_address'); r.area=val('dr_area');
  // 以下はKANOA編集フォームにのみ存在する欄。無い場合（一次パートナーの個人情報編集）は触らない。
  const srcEl=document.getElementById('dr_src'); if(srcEl) r.src=srcEl.value.trim();
  const stEl=document.getElementById('dr_status');
  if(stEl){
    const newStatus=stEl.value;
    const block=advanceGuard(r, newStatus);
    if(block && newStatus!==r.status){ toast(block); return; }
    setRefStatus(r, newStatus);   // 連絡の〇×とずれないよう failAt も一緒に整える
    const sessEl=document.getElementById('dr_session'); if(sessEl) r.session=sessEl.value.trim()||'—';
    // 入社日：入力欄で選んだ日付（YYYY-MM-DD）を常に優先。空にすれば「未定」へ戻せる。
    const jdEl=document.getElementById('dr_joined');
    if(jdEl){ r.joined=jdEl.value||''; if(hasJoined(r) && !r.joined) r.joined=todayISO(); }
    const pjEl=document.getElementById('dr_pj'); if(pjEl) r.pj=pjEl.value;
    const agEl=document.getElementById('dr_ag'); if(agEl) r.ag=agEl.value;
    const note=document.getElementById('dr_note'); if(note) r.note=note.value.trim();
    const anote=document.getElementById('dr_adminnote'); if(anote) r.adminNote=anote.value.trim();
    const payEl=document.getElementById('dr_pay'); if(payEl) r.payStatus=payEl.value||'';
  }
  save(); updateNavCounts();
  if(S.view==='referrals'){ renderRefChips(); renderRefTable(); }
  else if(S.view==='projectDetail') viewProjectDetail();
  else render();
  toast('変更を保存しました');
  openRefDrawer(id);
}

/* ════════════════════ 資料から自動入力（ブラウザ内解析） ════════════════════ */
async function loadPdfJs(){
  if(window.pdfjsLib) return window.pdfjsLib;
  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; }catch(e){}
  return window.pdfjsLib;
}
async function extractPdfText(file){
  const lib=await loadPdfJs(); const buf=await file.arrayBuffer();
  const pdf=await lib.getDocument({data:buf}).promise; let text='';
  for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i); const c=await pg.getTextContent(); text+=c.items.map(it=>it.str).join(' ')+'\n'; }
  return text;
}
function parseResumeFields(t){
  // ── 履歴書テキストからの項目抽出（大幅強化版 v2）──
  const clean=(t||'').replace(/\u3000/g,' ').replace(/\r/g,'');
  const out={};
  const grabAll=(res)=>{ for(const re of res){ const m=clean.match(re); if(m&&m[1]&&m[1].trim()) return m[1].trim().replace(/\s{2,}/g,' '); } return ''; };

  // ── メール（個人アドレス優先、システム系を除外）──
  const emails=clean.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g);
  if(emails&&emails.length){
    out.email = emails.find(e=>!/(example|sample|test|noreply|no-reply|info@|support@|admin@)/i.test(e)) || emails[0];
  }

  // ── 電話（携帯優先→固定。ラベル近傍を最優先）──
  const near=(label)=>{ const m=clean.match(new RegExp(label+'[\\s:：]*((?:0\\d[\\d\\-\\s()]{8,13}))')); return m?m[1]:''; };
  let phone = near('(?:携帯|携帯電話|ケータイ|Mobile|TEL|電話|℡|Tel|電話番号|連絡先)') || '';
  if(!phone){
    const mobs=clean.match(/0[789]0[-\s]?\d{4}[-\s]?\d{4}/g);       // 携帯
    const fixed=clean.match(/0\d{1,3}[-\s(]?\d{1,4}[-\s)]?\d{4}/g); // 固定
    phone = (mobs&&mobs[0]) || (fixed&&fixed[0]) || '';
  }
  if(phone) out.phone=phone.replace(/[\s()]/g,'-').replace(/[-]+/g,'-').replace(/^-|-$/g,'');

  // ── フリガナ（カタカナ/ひらがな/半角カナ。姓名分かち書き優先）──
  out.kana=grabAll([
    /(?:ふりがな|フリガナ|フリカナ|ﾌﾘｶﾞﾅ|カナ|かな|ヨミ|よみ|読み仮名)[\s:：]*([ぁ-んァ-ヶー\u30fcｦ-ﾟ]{2,10}[\s　]+[ぁ-んァ-ヶー\u30fcｦ-ﾟ]{2,10})/,
    /(?:ふりがな|フリガナ|フリカナ|ﾌﾘｶﾞﾅ|カナ|かな|ヨミ|よみ)[\s:：]*([ぁ-んァ-ヶー\u30fcｦ-ﾟ]{2,30})/,
  ]);

  // ── 氏名（ラベル付き優先、姓名の分かち書き優先。数字・記号を含む誤爆を防ぐ）──
  out.name=grabAll([
    /(?:氏\s*名|名\s*前|お名前|氏名\(漢字\)|Name)[\s:：]*([一-龥々ヶ]{1,10}[\s　]+[一-龥々ヶ]{1,10})/,
    /(?:氏\s*名|名\s*前|お名前)[\s:：]*([一-龥々ヶ]{2,10})(?=[\s　\n]|$)/,
  ]);
  // ラベル無し履歴書：フリガナの直後や、生年月日の手前にある漢字姓名を氏名候補に
  if(!out.name && out.kana){
    const m=clean.match(/([一-龥々]{1,4}[\s　]+[一-龥々]{1,4})[\s　]*(?:\n|生年|昭和|平成|令和|西暦|19\d{2}|20\d{2}|男|女)/);
    if(m) out.name=m[1].trim().replace(/\s{2,}/g,' ');
  }

  // ── 生年月日（複数フォーマット対応、和暦も）──
  const bd=grabAll([
    /(?:生年月日|生年|誕生日|Birth)[\s:：]*((?:昭和|平成|令和|西暦)?\s*\d{1,4}[年\/\-\.]\s*\d{1,2}[月\/\-\.]\s*\d{1,2}日?)/,
    /((?:19|20)\d{2}[年\/\-\.]\s*\d{1,2}[月\/\-\.]\s*\d{1,2}日?)(?=[\s　]*(?:生|\(|（|満|歳|\n))/,
  ]);
  if(bd) out.birth=bd.replace(/\s+/g,'');

  // ── 年齢（「満XX歳」「(XX歳)」など）──
  const ageM=clean.match(/(?:満\s*)?(\d{1,2})\s*歳/) || clean.match(/[\(（]\s*(\d{1,2})\s*[\)）]/);
  if(ageM && +ageM[1]>=16 && +ageM[1]<=80) out.age=ageM[1];

  // ── 性別（ラベル・単独・氏名行末の男女に対応）──
  const gm=clean.match(/(?:性別)[\s:：]*(男性|女性|男|女)/)
        || clean.match(/(?:^|[\s　])(男性|女性)(?:[\s　]|$)/m)
        || clean.match(/[一-龥々ぁ-んァ-ヶー][\s　]+(男|女)(?:[\s　]|$)/m);
  if(gm){ const g=gm[1]; out.gender = (g==='男'||g==='男性')?'男性':'女性'; }

  // ── 住所（郵便番号の後 or ラベル）──
  out.address=grabAll([
    /(?:現\s*住\s*所|住\s*所|現住所|Address)[\s:：]*(?:〒?\s*\d{3}-?\d{4}\s*)?([一-龥ぁ-んァ-ヶーa-zA-Z0-9\-\s]{4,60})/,
    /〒?\s*\d{3}-?\d{4}\s*([一-龥ぁ-んァ-ヶーa-zA-Z0-9\-\s]{4,60})/,
  ]);
  if(out.address) out.address=out.address.replace(/\s{2,}/g,' ').trim();

  // ── 郵便番号（単独でも拾う）──
  const zip=clean.match(/〒?\s*(\d{3}-?\d{4})/);
  if(zip) out.zip=zip[1].includes('-')?zip[1]:zip[1].slice(0,3)+'-'+zip[1].slice(3);

  // ── 希望エリア（ラベル優先→住所の都道府県）──
  const areaLabel=grabAll([/(?:希望勤務地|希望エリア|勤務地希望|希望地域|希望勤務地域|勤務希望地)[\s:：]*([^\n]{2,20})/]);
  if(areaLabel){ out.area=areaLabel.replace(/[、,].*$/,'').trim(); }
  else {
    const pref=(out.address||clean).match(/(北海道|東京都|京都府|大阪府|[一-龥]{2,3}県)/);
    if(pref) out.area=pref[1];
  }

  return out;
}
async function autofillFromDoc(file){
  if(!file) return; toast('資料を読み取り中…');
  try{
    const ext=fileExt(file.name);
    const set=(id,v)=>{ if(v){ const el=document.getElementById(id); if(el&&!el.value) el.value=v; } };
    if(ext==='xlsx'||ext==='xls'||ext==='csv'||ext==='tsv'){
      // 表形式ファイル：1行目を見出し扱いで自動マッピングし、最初のデータ行を反映
      const {headers, rows} = await parseSpreadsheetFile(file);
      if(!rows.length){ toast('データが見つかりませんでした'); return; }
      const mapping=autoMapColumns(headers);
      const objs=rowsToObjects([rows[0]], mapping);
      const f=objs[0]||{};
      set('mName',f.name); set('mKana',f.kana); set('mPhone',f.phone); set('mEmail',f.email); set('mAddress',f.address); set('mArea',normalizeArea(f.area)); set('mSrc',f.src);
      const got=Object.values(f).filter(Boolean).length;
      toast(got?`${got}項目を読み取りました。内容をご確認ください${rows.length>1?`（複数行検出：一括登録が便利です）`:''}`:'読み取れる項目が見つかりませんでした。手入力をお願いします');
      return;
    }
    let text='';
    if(ext==='pdf'||file.type==='application/pdf'){ text=await extractPdfText(file); }
    else if(/^(txt|md|json)$/.test(ext)||/^text\//.test(file.type)){ text=await file.text(); }
    else { toast('対応形式：PDF・CSV・Excel・テキスト'); return; }
    const f=parseResumeFields(text);
    set('mName',f.name); set('mKana',f.kana); set('mPhone',f.phone); set('mEmail',f.email); set('mAddress',f.address); set('mArea',normalizeArea(f.area));
    const got=['name','kana','phone','email','address','area'].filter(k=>f[k]).length;
    toast(got?`資料から${got}項目を読み取りました。内容をご確認ください`:'読み取れる項目が見つかりませんでした。手入力をお願いします');
  }catch(e){ toast('読み取りに失敗しました。手入力をお願いします'); }
}

/* 招待情報をSupabaseへ即時保存し、読み返して確認（本番のみ） */
async function persistInvite(a){
  if(DEMO_MODE) return {ok:true};
  try{
    const sb=await SUPA.ensureClient();
    const up=await sb.from('agencies').upsert({ id:a.id, name:a.name, contact:a.contact||null, email:a.email||null, status:a.status, source:a.source||null, joined:a.joined||null, code:a.code||null, pw_hash:a.pwHash||null, invite_token:a.inviteToken, invite_issued_at:a.inviteIssuedAt, invite_used_at:a.inviteUsedAt });
    if(up && up.error) return {ok:false, reason:(up.error.message||'DBエラー')};
    const chk=await sb.from('agencies').select('invite_token').eq('id',a.id).maybeSingle();
    if(!chk || !chk.data || chk.data.invite_token!==a.inviteToken) return {ok:false, reason:'invite_token が保存されていません（招待用SQLが未実行の可能性）'};
    return {ok:true};
  }catch(e){ return {ok:false, reason:String((e&&e.message)||e)}; }
}

async function issueAndShowInvite(){
  const name=val('agName'), email=val('agEmail');
  if(!name){ toast('会社名を入力してください'); return; }
  if(!email||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('有効なメールアドレスを入力してください'); return; }
  const dup=DB.agencies.find(a=>(a.email||'').toLowerCase()===email.toLowerCase());
  if(dup){
    if(confirm(`${dup.name}（${email}）は既に登録されています。\nこのパートナー宛の招待リンクを再発行しますか？`)){
      const url2=issueInviteLink(dup.id);
      const r2=await persistInvite(dup);
      if(!r2.ok){ showInviteIssueError(r2.reason); return; }
      showInviteResult(dup, url2);
      if(S.view==='agencies') viewAgencies();
    }
    return;
  }
  const a={id:uid('AG'),name,contact:val('agContact'),email,status:'pending',source:'invited',joined:todayISO()};
  DB.agencies.push(a);
  const url=issueInviteLink(a.id);
  const res=await persistInvite(a);
  if(!res.ok){ showInviteIssueError(res.reason); return; }
  DB.activity.unshift({ts:nowTS(),actor:'KANOA',action:'パートナー招待',detail:`${name}（${email}）に招待リンクを発行`});
  save(); updateNavCounts();
  showInviteResult(a, url);
  if(S.view==='agencies') viewAgencies();
}

/* 招待システムの接続診断（Supabase接続・招待カラム・書き込みを実地テスト） */
async function diagnoseInviteSystem(){
  if(DEMO_MODE){
    showModal(`<div class="modal-title">接続診断</div>
      <div class="modal-sub">デモモードで動作中です。データはこの端末内（localStorage）に保存され、招待リンクもこの端末で完結します。本番の診断は本番URLで実行してください。</div>
      <div class="modal-actions"><button class="btn btn-primary" data-act="closemodal">閉じる</button></div>`);
    return;
  }
  showModal(`<div class="modal-title">接続診断</div><div class="modal-sub">確認しています…しばらくお待ちください。</div>`);
  const lines=[];
  const add=(ok,label,hint)=>lines.push(`<div class="info-row"><span style="width:22px;flex:none">${ok?'✅':'❌'}</span><div style="flex:1"><div class="cell-strong">${label}</div>${hint?`<div class="cell-sub">${hint}</div>`:''}</div></div>`);
  try{
    const sb=await SUPA.ensureClient();
    add(true,'Supabase接続','');
    try{ const r=await sb.from('agencies').select('id').limit(1); add(!r.error,'agencies 読み取り', r.error?String(r.error.message||''):''); }catch(e){ add(false,'agencies 読み取り',String((e&&e.message)||e)); }
    try{ const r=await sb.from('agencies').select('invite_token').limit(1); add(!r.error,'招待カラム（invite_token）', r.error?'add_all_new_columns.sql の agencies 部分が未実行です':''); }catch(e){ add(false,'招待カラム（invite_token）','add_all_new_columns.sql の agencies 部分が未実行です'); }
    try{
      const t='diag_'+Date.now();
      const up=await sb.from('agencies').upsert({id:'AG-DIAG-TEST',name:'診断用（自動削除）',status:'pending',invite_token:t});
      if(up && up.error){ add(false,'書き込みテスト',String(up.error.message||'')); }
      else{
        const chk=await sb.from('agencies').select('invite_token').eq('id','AG-DIAG-TEST').maybeSingle();
        const okw=!!(chk && chk.data && chk.data.invite_token===t);
        add(okw,'書き込み＋読み返し', okw?'':'invite_token が保存できていません（SQL未実行の可能性）');
      }
      try{ await sb.from('agencies').delete().eq('id','AG-DIAG-TEST'); }catch(e){}
    }catch(e){ add(false,'書き込みテスト',String((e&&e.message)||e)); }
  }catch(e){ add(false,'Supabase接続',String((e&&e.message)||e)); }
  showModal(`<div class="modal-title">接続診断の結果</div>
    <div class="info-card" style="margin:12px 0">${lines.join('')}</div>
    <div style="font-size:12px;color:var(--soft);line-height:1.7">❌がある場合は、その項目のヒントに従って対処してください。すべて✅なら、発行→リンク→パスワード設定まで問題なく動きます。</div>

function downloadCSV(filename, header, rows){
  const q=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const csv='\uFEFF'+[header.map(q).join(','), ...rows.map(r=>r.map(q).join(','))].join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  toast('CSVを書き出しました（Googleスプレッドシートで開けます）');
}

    case 'notice-ag': { if(_noticeDraft){ const id=t.dataset.ag; if(_noticeDraft.agIds.has(id)) _noticeDraft.agIds.delete(id); else _noticeDraft.agIds.add(id); renderNoticeModal(true); } break; }
    case 'notice-ag-all': { if(_noticeDraft){ _noticeDraft.agIds=new Set(DB.agencies.filter(a=>a.status==='active').map(a=>a.id)); renderNoticeModal(true); } break; }

    case 'bc-toggle': { const id=t.dataset.ag; if(!bcSelected) bcSelected=new Set(); if(bcSelected.has(id)) bcSelected.delete(id); else bcSelected.add(id); const ta=document.getElementById('bcInput'); if(ta) bcDraft=ta.value; renderBroadcastModal(); break; }

    case 'bulk-sel-all': { const rows=bulkFiltered(); const allSel=rows.length>0&&rows.every(r=>bulkSel.has(r.id)); if(allSel) rows.forEach(r=>bulkSel.delete(r.id)); else rows.forEach(r=>bulkSel.add(r.id)); renderBulkList(); break; }
    case 'bulk-tmpl': { const ta=document.getElementById('bulkText'); if(ta){ const tpl=BULK_TEMPLATES[+t.dataset.i]; ta.value = ta.value && ta.value.trim() ? ta.value.replace(/\s*$/,'')+'\n\n'+tpl.text : tpl.text; ta.focus(); } break; }
    case 'bulk-send': sendBulk(); break;
    case 'contact-agency': S.threadAg=t.dataset.ag; S.threadRef=t.dataset.ref||null; S.threadPrefill=null; closeOverlay(); go('messages'); break;

    case 'open-cand-thread': S.threadAg=t.dataset.ag; S.threadRef=t.dataset.ref; S.threadPrefill=null; S.replyTo=null; S.editMsg=null; S.picker=false; S.draft=null; go('messages'); break;

    case 'mark-unread': { const _in=meRole()==='kanoa'?'agency':'kanoa';

      if(!ms.length){ toast('未読に戻せる相手からの連絡がありません'); break; }
      ms[ms.length-1].read=false; invalidateUnread(); save(); updateNavCounts(); viewMessages(); break; }
    /* 送客スレッド（求職者）単位で未読に戻す。data-ref が空なら全体連絡 */

      ms[ms.length-1].read=false; invalidateUnread();

    case 'mention-pick': { const ta=document.getElementById('msgInput'); let v=ta?ta.value:''; const idx=Math.max(v.lastIndexOf('@'), v.lastIndexOf('＠')); if(idx>=0) v=v.slice(0,idx); if(v && !v.endsWith(' ') && !v.endsWith('\n')) v+=' '; v=v+'@'+t.dataset.name+' '; if(ta) ta.value=v; S.picker=false; rerenderChat(); break; }
    case 'clear-ctx': S.threadRef=null; renderConversation(curThreadAg(), meRole()); break;
    case 'open-subthread': {
      S.threadRef = t.dataset.ref || null;
      S.replyTo=null; S.editMsg=null; S.picker=false; S.draft=null;
      renderConversation(curThreadAg(), meRole());
      break;
    }
    case 'new-subthread': modalNewSubthread(t.dataset.ag); break;
    case 'new-ref-for-ag': {
      S._newRefFromMsg = true;        // 登録後にそのままスレッドを開くフラグ
      S.threadAg = t.dataset.ag;
      closeModal();
      modalNewReferral(t.dataset.pj || (DB.projects[0]&&DB.projects[0].id), t.dataset.ag);
      break;

    case 'pick-subthread-ref': {
      S.threadRef = t.dataset.ref;
      closeModal();

    case 'task-from-msg': { const m=DB.messages.find(x=>x.id===t.dataset.id); if(m){ addTask(m.text, m.ag, m.refId); updateNavCounts(); toast('マイタスクに追加しました'); } closeMsgMenu(); break; }

    case 'edit-set': S.editMsg=t.dataset.id; S.replyTo=null; closeMsgMenu(); renderConversation(curThreadAg(),meRole()); break;
    case 'edit-cancel': S.editMsg=null; renderConversation(curThreadAg(),meRole()); break;
    case 'del-msg': if(confirm('このメッセージの送信を取り消しますか？')){ const idx=DB.messages.findIndex(x=>x.id===t.dataset.id); if(idx>=0){ const mm=DB.messages[idx]; DB.messages.splice(idx,1); if(!DEMO_MODE) SUPA.delRow('messages','id',mm.id); } save(); invalidateUnread(); updateNavCounts(); closeMsgMenu(); rerenderChat(); } break;
    case 'pin-msg': { const m=DB.messages.find(x=>x.id===t.dataset.id); if(m){ m.pinned=!m.pinned; save(); toast(m.pinned?'ピン留めしました':'ピンを外しました'); } closeMsgMenu(); rerenderChat(); break; }
    case 'picker-toggle': if(S.picker && S.pickerTab!=='mention'){ S.picker=false; } else { S.picker=true; S.pickerTab='stamp'; } rerenderChat(); break;
    case 'picker-tab': S.pickerTab=t.dataset.t; rerenderChat(); break;
    case 'stamp-send': pushMsg(curThreadAg(), meRole(), t.dataset.t, {stamp:true, refId:S.threadRef||null, replyTo:S.replyTo||null}); S.picker=false; S.replyTo=null; renderConversation(curThreadAg(),meRole()); break;
    case 'emoji-send': pushMsg(curThreadAg(), meRole(), t.dataset.e, {stamp:'emoji', refId:S.threadRef||null, replyTo:S.replyTo||null}); S.picker=false; S.replyTo=null; renderConversation(curThreadAg(),meRole()); break;

    /* tasks */
    case 'task-toggle': {
      const tk=DB.tasks.find(x=>x.id===t.dataset.id);
      if(tk){
        const wasDone=tk.done; tk.done=!tk.done;

        if(tk.done && !wasDone && tk.from && tk.from!==tk.owner){
          const completer=tk.owner;                       // 完了したのは担当者
          const fromRole = completer==='kanoa' ? 'kanoa' : 'agency';
          const ag = tk.ag || (tk.owner!=='kanoa'?tk.owner:(tk.from!=='kanoa'?tk.from:null));
          if(ag){
            pushMsg(ag, fromRole, `【タスク完了】「${tk.text}」が完了しました。`, {refId:tk.refId||null});
            DB.activity.unshift({ts:nowTS(), actor:(completer==='kanoa'?'KANOA':(agency(ag)?agency(ag).name:ag)), action:'タスク完了', detail:tk.text});
            toast(`${partyLabel(tk.from)}に完了を通知しました`);
          }

        save(); updateNavCounts(); viewTasks();
      }
      break;
    }
    case 'task-del': { const did=t.dataset.id; DB.tasks=DB.tasks.filter(x=>x.id!==did); if(!DEMO_MODE) SUPA.delRow('tasks','id',did); save(); updateNavCounts(); viewTasks(); break; }
    case 'task-add-prompt': { const txt=prompt('タスクの内容'); if(txt&&txt.trim()){ addTask(txt.trim(),null,null); updateNavCounts(); viewTasks(); } break; }
    case 'task-assign-prompt': modalAssignTask(t.dataset.to||null, t.dataset.ref||null); break;
    case 'task-assign-save': saveAssignTask(); break;
    case 'task-req-from-msg': { const m=DB.messages.find(x=>x.id===t.dataset.id); if(m){ closeMsgMenu(); const isK=S.role==='kanoa'; modalAssignTask(isK?(S.threadAg||m.ag):null, m.refId||null); const ta=document.getElementById('atText'); if(ta) ta.value=m.text; } break; }
    case 'pj-sort': pjSort=t.dataset.s; viewAgencyProjects(); break;
    case 'member-add': modalAddMember(t.dataset.org); break;
    case 'member-save': { const org=t.dataset.org; const name=val('mbName'); const em=val('mbEmail'); if(!name){ toast('氏名を入力してください'); break; } addMember(org, name, em, val('mbTitle')); closeModal(); toast(em?`招待メールを送信しました → ${em}`:'メンバーを追加しました'); if(S.view==='members') viewMembers(); if(S._agDrawer) openAgencyDrawer(S._agDrawer); break; }
    case 'member-del': if(confirm('このメンバーを削除しますか？')){ const did=t.dataset.id; DB.members=DB.members.filter(m=>m.id!==did); if(!DEMO_MODE) SUPA.delRow('members','id',did); save(); if(S.view==='members') viewMembers(); if(S._agDrawer) openAgencyDrawer(S._agDrawer); } break;

    /* misc */
    case 'copy': navigator.clipboard.writeText(t.dataset.v).then(()=>{ const o=t.textContent; t.textContent='✓'; setTimeout(()=>t.textContent=o,1200); }); break;
    case 'closeoverlay': closeOverlay(); setTimeout(flushPendingRerender,50); break;
    case 'closemodal': S._newRefFromMsg=false; closeModal(); setTimeout(flushPendingRerender,50); break;
  }
});

/* change (inline edits, toggles, overrides) */
document.addEventListener('change', e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const act=t.dataset.act;
  if(act==='edit-ref'){
    const r=DB.referrals.find(x=>x.id===t.dataset.id); if(!r) return;
    const f=t.dataset.f; let v=t.value; if(f==='session'&&!v)v='—';
    if(f==='status'){
      const block=advanceGuard(r, v);
      if(block){ toast(block); renderRefTable(); return; }
    }
    const _prev = f==='status' ? r.status : null;
    if(f==='joinedMonth'){ r.joined = v?`${v}-01`:''; }
    else { r[f]=v; }
    if(f==='status' && _prev!==v && typeof logRef==='function'){
      const back = STATUS_ORDER.indexOf(v) < STATUS_ORDER.indexOf(_prev);
      logRef(r.id, `ステータス変更：${statusDef(_prev).label} → ${statusDef(v).label}${back?'（差し戻し）':''}`, '');
    }
    if(f==='status'){ t.className='icell stsel st-'+statusDef(v).cls;
      if(hasJoined(r)&&!r.joined) r.joined=todayISO();
      renderRefChips(); }
    save(); flash(t);
    if(f==='status'||f==='joinedMonth') renderRefTable();
  }
  if(act==='toggle-assign'){
    const {pj,ag}=t.dataset; let x=assignment(pj,ag);
    if(!x){ x={pj,ag,published:false,refOv:null,sucOv:null}; DB.assignments.push(x); }
    x.published=t.checked; save(); updateNavCounts();
    renderAssignPanel(pj);
    toast(t.checked?'公開しました':'非公開にしました');
  }
  if(act==='set-override'){
    const {pj,ag,kind}=t.dataset; let x=assignment(pj,ag);
    if(!x){ x={pj,ag,published:false,refOv:null,sucOv:null}; DB.assignments.push(x); }
    const v=t.value===''?null:Number(t.value);
    if(kind==='ref') x.refOv=v; else x.sucOv=v;
    save(); flash(t);
  }
});

/* live referral search */
document.addEventListener('input', e=>{
  if(e.target.id==='rSearch'){ rFilter.q=e.target.value; renderRefTable(); }
  if(e.target.id==='msgSearch'){ msgFilter.q=e.target.value; renderMsgList();
    // 検索クリアボタンの出し入れ（フォーカスは維持）
    const wrap=e.target.closest('.msg-search-wrap');
    if(wrap){ let clr=wrap.querySelector('.msg-search-clear');
      if(e.target.value && !clr){ clr=document.createElement('button'); clr.className='msg-search-clear'; clr.setAttribute('data-act','msg-search-clear'); clr.textContent='×'; wrap.appendChild(clr); }
      else if(!e.target.value && clr){ clr.remove(); } }
  }
  if(e.target.id==='subSearch'){
    const q=(e.target.value||'').trim().toLowerCase();
    document.querySelectorAll('#subPickList .sub-pick-row').forEach(row=>{
      const hay=(row.getAttribute('data-search')||'').toLowerCase();
      row.style.display = (!q || hay.includes(q)) ? '' : 'none';
    });
  }
  if(e.target.id==='bulkSearch'){ bulkFilter.q=e.target.value; renderBulkList(); }
  if(e.target.id==='assignSearch'){ assignQ=e.target.value; applyAssignFilter(); }
  if(e.target.id==='fArea'){ rFilter.area=e.target.value; renderRefTable(); }
  if(e.target.id==='msgInput'){
    e.target.style.height='auto'; e.target.style.height=Math.min(e.target.scrollHeight,120)+'px';
    const v=e.target.value;
    if((v.endsWith('@')||v.endsWith('＠')) && !S.picker){ openMentionPicker(); }
  }
});

/* 請求モジュール専用ヘルパ（既存のローカル関数 row/id に依存しない） */
function invMakeId(){ return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():('INV-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)); }
function invRow(l,v){ return `<div class="info-row"><span class="info-label">${l}</span><span class="info-val">${v}</span></div>`; }
/* ════════════════════════════════════════════════════════════
   請求管理モジュール（KANOA Portal v13）
   ─────────────────────────────────────────────────────────────
   ・パートナーが入社確定者(status=joined)から請求書を発行
   ・個別／まとめて発行
   ・ライフサイクル: draft → submitted → accepted/rejected → paid
   ・差し戻し(rejected)は理由つき・修正して再提出
   ・二重請求ガード・状態履歴・PDFダウンロード
   ════════════════════════════════════════════════════════════ */

/* ── ステータス定義 ── */
const INV_STATUS = {
  draft:     { label:'下書き',   color:'var(--muted)',  bg:'var(--surface)' },
  submitted: { label:'提出済',   color:'#B45309',       bg:'#FDF2E2' },
  accepted:  { label:'受理',     color:'#1D4ED8',       bg:'#EFF4FF' },
  rejected:  { label:'差し戻し', color:'#BE123C',       bg:'#FDEEF1' },
  paid:      { label:'支払済',   color:'#15803D',       bg:'#E8F6EE' },
};
const INV_ORDER = ['draft','submitted','accepted','rejected','paid'];

function invStatusBadge(st){
  const s=INV_STATUS[st]||INV_STATUS.draft;
  return `<span class="tag" style="background:${s.bg};color:${s.color};font-weight:600">${s.label}</span>`;
}

/* ── DB初期化（invoices配列を保証） ── */
function ensureInvoices(){ if(!DB.invoices) DB.invoices=[]; return DB.invoices; }

/* ── 採番: KANOA-INV-YYYYMM-連番 ── */
function nextInvoiceNo(){
  ensureInvoices();
  const ym=todayISO().slice(0,7).replace('-','');
  const seq=DB.invoices.filter(v=>(v.no||'').includes(`-${ym}-`)).length+1;
  return `KANOA-INV-${ym}-${String(seq).padStart(3,'0')}`;
}

/* ── ある候補者が既に有効な請求に含まれているか（二重請求ガード） ── */
function refInvoiced(refId){
  ensureInvoices();
  // rejected を除く請求（draft/submitted/accepted/paid）に含まれていれば請求済み扱い
  return DB.invoices.some(v=> v.status!=='rejected' && (v.items||[]).some(it=>it.refId===refId));
}

/* ── 請求対象になり得る入社確定者（未請求のみ） ── */
function billableRefs(agId){
  return DB.referrals
    .filter(r=> r.ag===agId && hasJoined(r) && refEarning(r)>0 && !refInvoiced(r.id));
}

/* ── 状態履歴を1件追加 ── */
function pushInvHistory(inv, action, note){
  inv.history=inv.history||[];
  inv.history.push({ at:nowTS(), by:meRole(), byId:(S.role==='kanoa'?'KANOA':S.agencyId), action, note:note||'' });
}

/* ── 請求書を作成（候補者ID配列から） ── */
function createInvoice(agId, refIds){
  ensureInvoices();
  const ids=refIds.filter(rid=>!refInvoiced(rid)); // 念のため二重ガード
  if(!ids.length){ toast('請求できる入社者がありません（すでに請求済みの可能性）'); return null; }
  const items=ids.map(rid=>{
    const r=DB.referrals.find(x=>x.id===rid);
    return { refId:rid, name:r.name, pj:r.pj, pjName:(project(r.pj)?project(r.pj).name:r.pj),
             joined:r.joined||'', amount:refEarning(r) };
  });
  // ★退職者の未請求返金を、この請求書にマイナス明細として自動で差し引く
  const refundTargets=refundableRefs(agId);
  refundTargets.forEach(r=>{
    const amt=refundAmount(r);
    if(amt>0){
      items.push({ refId:r.id, name:r.name, pj:r.pj, pjName:(project(r.pj)?project(r.pj).name:r.pj),
        joined:r.joined||'', resignedOn:r.resignedOn||'', rateLabel:refundRateLabel(r),
        isRefund:true, amount:-amt });
    }
  });
  const subtotal=items.reduce((s,it)=>s+it.amount,0);
  const inv={
    id:invMakeId(), no:nextInvoiceNo(), agId, status:'draft',
    items, subtotal, tax:0, total:subtotal,   // 税は0（必要なら後で）
    issuedOn:todayISO(), submittedOn:null, decidedOn:null, paidOn:null,
    rejectReason:'', history:[]
  };
  pushInvHistory(inv,'created',`${items.length}名で作成`);
  items.forEach(it=>{ if(!it.isRefund) logRef(it.refId,'請求書を発行',`${inv.no} · ${yen(it.amount)}`); });
  DB.invoices.push(inv);
  save();
  return inv;
}

/* ── 状態遷移（ガード付き） ── */
function invoiceAction(invId, action, note){
  const inv=DB.invoices.find(v=>v.id===invId); if(!inv) return;
  const role=meRole();
  // 権限・遷移バリデーション
  const can = {
    submit:  role==='agency' && (inv.status==='draft' || inv.status==='rejected'),
    accept:  role==='kanoa'  && inv.status==='submitted',
    reject:  role==='kanoa'  && inv.status==='submitted',
    pay:     role==='kanoa'  && inv.status==='accepted',
    cancel:  role==='agency' && inv.status==='draft',  // 下書きの取消(削除)
    reopen:  role==='kanoa'  && inv.status==='accepted', // 受理を取り消して差し戻しに戻す（誤操作対策）
  };
  if(!can[action]){ toast('この操作は実行できません（権限または状態が不正）'); return; }

  switch(action){
    case 'submit':
      inv.status='submitted'; inv.submittedOn=todayISO(); inv.rejectReason='';
      pushInvHistory(inv,'submitted'); toast('請求書を提出しました');
      break;
    case 'accept':
      inv.status='accepted'; inv.decidedOn=todayISO();
      pushInvHistory(inv,'accepted'); toast('請求書を受理しました');
      break;
    case 'reject':
      if(!note || !note.trim()){ toast('差し戻し理由を入力してください'); return; }
      inv.status='rejected'; inv.decidedOn=todayISO(); inv.rejectReason=note.trim();
      pushInvHistory(inv,'rejected',note.trim()); toast('差し戻しました');
      break;
    case 'pay':
      inv.status='paid'; inv.paidOn=todayISO();
      pushInvHistory(inv,'paid'); toast('支払済みにしました');
      break;
    case 'reopen':
      inv.status='submitted'; inv.decidedOn=null;
      pushInvHistory(inv,'reopened','受理を取消'); toast('受理を取り消しました');
      break;
    case 'cancel':
      DB.invoices=DB.invoices.filter(v=>v.id!==invId);
      save(); toast('下書きを削除しました');
      if(S.view==='invoices') render(); return;
  }
  save();
  if(S.view==='invoices') render();
  if(document.querySelector('.drawer.on')) openInvoiceDetail(invId);
}

/* ── 集計（KPI用） ── */
function invSummary(list){
  const sum={ count:list.length, total:0, paid:0, pending:0, rejected:0 };
  list.forEach(v=>{
    sum.total+=v.total;
    if(v.status==='paid') sum.paid+=v.total;
    else if(v.status==='rejected') sum.rejected+=v.total;
    else sum.pending+=v.total;
  });
  return sum;
}

function invQuickActions(v){
  // ★ここで onclick="event.stopPropagation()" を付けてはいけない。
  //   クリック処理は document 上の委譲リスナーが担っているため、伝播を止めると
  //   ボタン自体が何も動かなくなる（行の inv-open は closest() が内側の
  //   data-act を優先して拾うので、止めなくても誤爆しない）。
  const role=meRole();
  if(role==='agency'){
    if(v.status==='draft')    return `<button class="btn btn-primary btn-sm" data-act="inv-act" data-id="${v.id}" data-do="submit">提出</button>`;
    if(v.status==='rejected') return `<button class="btn btn-primary btn-sm" data-act="inv-act" data-id="${v.id}" data-do="submit">再提出</button>`;

    if(v.status==='accepted')  return `<button class="btn btn-primary btn-sm" data-act="inv-act" data-id="${v.id}" data-do="pay">支払済に</button>`;
  }
  return '';
}

/* ════════════════════ 退職・返金（自動注入） ════════════════════ */
/* ════════════════════════════════════════════════════════════
   退職・返金（クローバック）管理モジュール
   ─────────────────────────────────────────────────────────────
   楽天案件(rewardModel='rakuten')の入社者が退職した場合、
   在籍期間に応じた返金規定を自動適用し、返金請求(マイナス請求)を発行。

   返金規定（楽天）:
     入社1ヶ月以内退職        → 80%返金
     1ヶ月超〜3ヶ月以内退職    → 50%返金
     3ヶ月超〜6ヶ月以内退職    → 10%返金
     6ヶ月超退職             → 返金なし(0%)
     経歴詐称が発覚          → 退職時期に関わらず100%返金
   ════════════════════════════════════════════════════════════ */

/* 楽天案件かどうか */
function isRakutenProject(pj){ const p=project(pj); return !!(p && p.rewardModel==='rakuten'); }

/* 在籍月数を計算（入社日→退職日。満たない端数も考慮し、日数ベースで月換算） */
function tenureMonths(joinedISO, resignedISO){
  if(!joinedISO || !resignedISO) return null;
  const j=new Date(joinedISO), q=new Date(resignedISO);
  if(isNaN(j)||isNaN(q)||q<j) return null;
  // 月数 = 年差*12 + 月差、ただし日が足りなければ-1
  let months=(q.getFullYear()-j.getFullYear())*12 + (q.getMonth()-j.getMonth());
  if(q.getDate()<j.getDate()) months-=1;
  return months; // 0 = 1ヶ月未満
}

/* 返金率を返す（0〜1）。楽天以外は0。経歴詐称は1。 */
function refundRate(r){
  if(!isRakutenProject(r.pj)) return 0;
  if(r.resignFraud) return 1;               // 経歴詐称 → 全額
  const m=tenureMonths(r.joined, r.resignedOn);
  if(m===null) return 0;
  if(m < 1)  return 0.8;   // 1ヶ月以内
  if(m < 3)  return 0.5;   // 1〜3ヶ月
  if(m < 6)  return 0.1;   // 3〜6ヶ月
  return 0;                // 6ヶ月超
}

/* 返金額（円）= 既に支払われた成果報酬 × 返金率 */
function refundAmount(r){
  const base=refEarning(r);  // この候補者の成果報酬
  return Math.round(base * refundRate(r));
}

/* 返金率の表示ラベル */
function refundRateLabel(r){
  if(!isRakutenProject(r.pj)) return '対象外';
  if(r.resignFraud) return '経歴詐称・全額(100%)';
  const m=tenureMonths(r.joined, r.resignedOn);
  if(m===null) return '—';
  if(m<1) return '1ヶ月以内・80%';
  if(m<3) return '1〜3ヶ月・50%';
  if(m<6) return '3〜6ヶ月・10%';
  return '6ヶ月超・返金なし';
}

/* この候補者が既に返金請求済みか */
function refundInvoiced(refId){
  ensureInvoices();
  return DB.invoices.some(v=> v.kind==='refund' && v.status!=='rejected'
    && (v.items||[]).some(it=>it.refId===refId));
}

/* 退職を記録（退職日・経歴詐称フラグ） */
function markResigned(refId, resignedOn, fraud){
  const r=DB.referrals.find(x=>x.id===refId); if(!r) return;
  r.resignedOn=resignedOn||todayISO();
  r.resignFraud=!!fraud;
  r.resigned=true;
  // 在籍6ヶ月未満（＝返金規定の対象）の退職は、選考ステータスも「早期退職」に揃える。
  // 二度手間（退職の記録とステータス変更の二重入力）を防ぐため。
  const _m=tenureMonths(r.joined, r.resignedOn);
  if(r.status==='joined' && (fraud || (_m!==null && _m<6))) setRefStatus(r,'resigned');
  logRef(r.id,'退職を記録',`退職日 ${r.resignedOn}${fraud?'・経歴詐称':''}`);
  save();
  if(['referrals','myrefs','refunds','posthire'].includes(S.view)) render();
  if(document.querySelector('.drawer.on')) { try{ openRefDrawer(refId); }catch(e){} }
  toast('退職を記録しました');
}

/* 退職の取消 */
function unmarkResigned(refId){
  const r=DB.referrals.find(x=>x.id===refId); if(!r) return;
  if(refundInvoiced(refId)){ toast('返金請求が発行済みのため取消できません。先に返金請求を削除してください'); return; }
  r.resigned=false; r.resignedOn=null; r.resignFraud=false; r.resignConfirmed=false;
  if(r.status==='resigned') setRefStatus(r,'joined');   // ステータスも入社に戻す
  logRef(r.id,'退職記録を取消','');
  save();
  if(['referrals','myrefs','refunds','posthire'].includes(S.view)) render();
  if(document.querySelector('.drawer.on')) { try{ openRefDrawer(refId); }catch(e){} }
  toast('退職記録を取り消しました');
}

/* 退職した入社者で、返金が発生し未請求の人 */
function refundableRefs(agId){
  return DB.referrals.filter(r=>
    r.ag===agId && hasJoined(r) && r.resigned
    && refundAmount(r)>0 && !refundInvoiced(r.id));
}

/* 返金請求（マイナス請求）を作成 */
function createRefundInvoice(agId, refIds){
  ensureInvoices();
  const ids=refIds.filter(rid=>!refundInvoiced(rid));
  if(!ids.length){ toast('返金請求できる退職者がありません'); return null; }
  const items=ids.map(rid=>{
    const r=DB.referrals.find(x=>x.id===rid);
    const amt=refundAmount(r);
    return { refId:rid, name:r.name, pj:r.pj, pjName:(project(r.pj)?project(r.pj).name:r.pj),
             joined:r.joined||'', resignedOn:r.resignedOn||'', rateLabel:refundRateLabel(r),
             amount:-amt };  // マイナス額
  });
  const subtotal=items.reduce((s,it)=>s+it.amount,0); // 負の合計
  const inv={
    id:invMakeId(), no:nextRefundNo(), agId, status:'draft', kind:'refund',
    items, subtotal, tax:0, total:subtotal,
    issuedOn:todayISO(), submittedOn:null, decidedOn:null, paidOn:null,
    rejectReason:'', history:[]
  };
  pushInvHistory(inv,'created',`返金 ${items.length}名`);
  items.forEach(it=> logRef(it.refId,'返金を請求',`${inv.no} · ${yen(-it.amount)}`));
  DB.invoices.push(inv);
  save();
  return inv;
}

/* 返金請求の採番: KANOA-REF-YYYYMM-001 */
function nextRefundNo(){
  ensureInvoices();
  const ym=todayISO().slice(0,7).replace('-','');
  const seq=DB.invoices.filter(v=>v.kind==='refund' && (v.no||'').includes(`-${ym}-`)).length+1;
  return `KANOA-REF-${ym}-${String(seq).padStart(3,'0')}`;
}

/* ════════════════════ 退職ステータス＋強化ロジック（自動注入） ════════════════════ */
/* ════════════════════════════════════════════════════════════
   退職ステータス管理（4段階）＋返金期限アラート（強化版）
   ─────────────────────────────────────────────────────────────
   ①退職報告あり reported → ②退職確認済 confirmed
     → ③返金請求中 billing → ④返金完了 settled
   返金不要(0円)の場合は confirmed で完了扱い。
   ════════════════════════════════════════════════════════════ */

const RESIGN_STATUS = {
  reported:  { label:'退職報告あり', color:'#B45309', bg:'#FDF2E2', step:1 },
  confirmed: { label:'退職確認済',   color:'#1D4ED8', bg:'#EFF4FF', step:2 },
  billing:   { label:'返金請求中',   color:'#7C3AED', bg:'#F3EEFF', step:3 },
  settled:   { label:'返金完了',     color:'#15803D', bg:'#E8F6EE', step:4 },
};
function resignBadge(st){ const x=RESIGN_STATUS[st]||RESIGN_STATUS.reported;
  return `<span class="tag" style="background:${x.bg};color:${x.color};font-weight:600">${x.label}</span>`; }

/* 退職者の現在ステータスを算出（保存値＋請求状態から動的に） */
function resignStatus(r){
  if(!isResignedRef(r)) return null;
  // 返金不要なら確認済みで完了
  if(refundAmount(r)<=0) return r.resignConfirmed ? 'confirmed' : 'reported';
  // 返金ありの場合、請求の進み具合で判定
  const inv=DB.invoices.find(v=>v.kind==='refund' && (v.items||[]).some(it=>it.refId===r.id));
  if(inv){
    if(inv.status==='paid') return 'settled';
    return 'billing';
  }
  return r.resignConfirmed ? 'confirmed' : 'reported';
}


/* ── 返金フローの「今どちらのボールか」──────────────────── */
function refundBall(r){
  if(!isResignedRef(r) || !isRakutenProject(r.pj)) return null;
  const rs=resignStatus(r);
  if(rs==='settled') return {side:null, act:'返金が完了しました', prep:''};
  if(rs==='reported') return {side:'kanoa', act:'退職を確認する', prep:'パートナー側の準備：退職日の根拠（本人連絡・書面など）を共有'};
  if(rs==='confirmed'){
    if(refundAmount(r)<=0) return {side:null, act:'返金対象外（在籍6ヶ月超など）', prep:''};
    return {side:'agency', act:'返金請求を発行する', prep:'金額は自動計算済み。退職・返金画面から1クリックで発行'};
  }
  const inv=DB.invoices.find(v=>v.kind==='refund' && (v.items||[]).some(it=>it.refId===r.id));
  if(inv){
    if(inv.status==='draft')     return {side:'agency', act:'返金請求を提出する', prep:''};
    if(inv.status==='submitted') return {side:'kanoa',  act:'請求内容を確認して受理する', prep:'内容確認 → 受理 or 差戻し'};
    if(inv.status==='accepted')  return {side:'kanoa',  act:'支払処理をして「支払済み」にする', prep:'振込または次回請求との相殺を実施'};
    if(inv.status==='rejected')  return {side:'agency', act:'差戻し理由を確認して再提出する', prep:''};
  }
  return {side:'agency', act:'返金請求を発行する', prep:''};
}
function refundBallHtml(r, compact){
  const b=refundBall(r); if(!b) return '';
  if(!b.side) return `<span class="tag" style="background:#E8F6EE;color:#15803D;font-weight:600">✓ ${esc(b.act)}</span>`;

/* ── 返金期限アラート ───────────────────────────────
   返金率が変わる節目（1/3/6ヶ月）まであと何日かを計算。
   在籍中の楽天入社者向けに「もうすぐ返金率が下がる/返金義務が消える」を警告。 */
function daysUntil(dateISO){
  const t=new Date(dateISO); if(isNaN(t)) return null;
  return Math.ceil((t - new Date(todayISO())) / 86400000);
}
function addMonths(dateISO, m){
  const d=new Date(dateISO); if(isNaN(d)) return null;
  d.setMonth(d.getMonth()+m);
  return TZ_toLocalDay(d);
}
/* 在籍中の楽天入社者について、次の節目とその残日数を返す */
function refundMilestone(r){
  if(!isRakutenProject(r.pj) || !r.joined || isResignedRef(r)) return null;
  const m=tenureMonths(r.joined, todayISO());
  let nextMonth, nextLabel, nextRate;
  if(m<1){ nextMonth=1; nextLabel='返金80%→50%'; nextRate='50%'; }
  else if(m<3){ nextMonth=3; nextLabel='返金50%→10%'; nextRate='10%'; }
  else if(m<6){ nextMonth=6; nextLabel='返金10%→なし'; nextRate='返金なし'; }
  else return { done:true };  // 6ヶ月超 = 返金義務消滅済み
  const boundary=addMonths(r.joined, nextMonth);
  const days=daysUntil(boundary);
  return { nextMonth, nextLabel, nextRate, boundary, days };
}

/* 期限が近い在籍者（30日以内に節目）を返す */
function refundAlerts(agId){
  return DB.referrals
    .filter(r=> hasJoined(r) && !isResignedRef(r) && isRakutenProject(r.pj) && (!agId || r.ag===agId))
    .map(r=>({ r, ms:refundMilestone(r) }))
    .filter(x=> x.ms && !x.ms.done && x.ms.days!=null && x.ms.days<=30 && x.ms.days>=0)
    .sort((a,b)=> a.ms.days - b.ms.days);
}

/* 「今やるべきこと」: 役割別の未処理アクション一覧 */
function resignTodos(){
  const isK=S.role==='kanoa'; const agId=isK?null:S.agencyId;
  const todos=[];
  // 退職報告あり・未確認
  DB.referrals.filter(r=> isResignedRef(r) && resignStatus(r)==='reported' && isRakutenProject(r.pj) && (isK||r.ag===agId))
    .forEach(r=> todos.push({ kind:'confirm', r, label:`${r.name} の退職を確認`, sub:'退職報告あり → 確認待ち' }));
  if(!isK){
    // パートナー: 返金請求できる
    refundableRefs(agId).forEach(r=> todos.push({ kind:'bill', r, label:`${r.name} の返金を請求`, sub:`${refundRateLabel(r)} · -${yen(refundAmount(r))}` }));
  } else {
    // KANOA: 返金請求の受理待ち
    DB.invoices.filter(v=> v.kind==='refund' && v.status==='submitted')
      .forEach(v=> todos.push({ kind:'accept', inv:v, label:`返金請求 ${v.no} を確認`, sub:`${esc(agency(v.agId)?agency(v.agId).name:v.agId)} · ${yen(-v.total)}` }));
  }
  return todos;
}

/* ════════════════════════════════════════════════════════════
   入社後トラッキング強化モジュール
   ① 候補者別アクティビティ履歴（誰がいつ何をしたか・監査ログ）
   ② 候補者詳細のステップバー（今どの段階か視覚化）
   ③ 入社後一元ビュー（入社者のその後を追う）
   ════════════════════════════════════════════════════════════ */

/* 候補者別の履歴を1件追加（refId付き） */
function logRef(refId, action, detail){
  if(!DB.reflog) DB.reflog=[];
  DB.reflog.unshift({
    id:(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('L'+Date.now()+Math.random()),
    refId, ts:nowTS(),
    by:(S.role==='kanoa'?'KANOA':(agency(S.agencyId)?agency(S.agencyId).name:S.agencyId)),
    byRole:S.role,
    action, detail:detail||''
  });
}
function refLogs(refId){ return (DB.reflog||[]).filter(l=>l.refId===refId); }

/* ステップバー: 送客→入社→(退職→返金完了) の進捗を視覚化 */
function stepBar(r){
  // 基本ステップ（送客〜入社）
  const base=[
    {k:'entry',label:'送客'},
    {k:'screening',label:'書類'},
    {k:'interview',label:'選考会'},
    {k:'offer',label:'内定'},
    {k:'joined',label:'入社'},
  ];
  // 送客〜入社の到達状況は、連絡の〇×（stageMark）と同じ判定を使う。
  // ここを別計算にすると「カードでは何も進んでいないのに連絡では✕が付く」というズレが出る。
  // base の並びは PIPELINE_STAGES と同じ。
  const marks = base.map((s,i)=>stageMark(r,i));
  const failIdx = marks.indexOf('fail');          // 見送り・辞退で終わった段階

  // 退職している楽天案件は、入社の先に返金ステップを追加
  let steps=base.slice();
  let curIdx = failIdx>=0 ? failIdx : marks.lastIndexOf('pass');

  if(hasJoined(r) && isResignedRef(r) && isRakutenProject(r.pj)){
    const rs=resignStatus(r);
    const rmap={reported:0,confirmed:1,billing:2,settled:3};
    steps=steps.concat([
      {k:'r_reported',label:'退職報告'},
      {k:'r_confirmed',label:'退職確認'},
      {k:'r_billing',label:'返金請求'},
      {k:'r_settled',label:'返金完了'},
    ]);
    curIdx = 4 + (rmap[rs]!=null?rmap[rs]:0);
  }

  return `<div class="stepbar" style="display:flex;align-items:flex-start;gap:0;margin:4px 0 8px;overflow-x:auto">
    ${steps.map((st,idx)=>{
      const isFail = (failIdx>=0 && idx===failIdx);   // ここで終わった段階
      const done = idx<curIdx;
      const cur = idx===curIdx;
      const isRefundStep = st.k.startsWith('r_');
      const color = isFail ? 'var(--r)'
        : cur ? (isRefundStep?'var(--r)':'var(--accent)')
        : done ? (isRefundStep?'var(--r)':'var(--g)')
        : 'var(--line)';
      const textColor = (cur||done) ? 'var(--ink)' : 'var(--muted)';
      const ttl = isFail ? `${st.label}：${statusDef(r.status).label}` : st.label;
      return `<div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:52px;position:relative" title="${esc(ttl)}">
        ${idx>0?`<div style="position:absolute;left:-50%;top:9px;width:100%;height:2px;background:${done||cur?color:'var(--line)'}"></div>`:''}
        <div style="width:18px;height:18px;border-radius:50%;background:${(done||cur)?color:'var(--surface)'};border:2px solid ${color};z-index:1;display:flex;align-items:center;justify-content:center">
          ${isFail?'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2"><path d="M18 6L6 18M6 6l12 12"/></svg>'
            :done?'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>':''}
        </div>
        <div style="font-size:10px;margin-top:5px;color:${textColor};font-weight:${cur?'600':'400'};text-align:center;white-space:nowrap">${st.label}</div>
      </div>`;
    }).join('')}
  </div>`;
}

/* 候補者履歴のHTML（詳細ドロワー用） */
function refHistoryHtml(refId){
  const logs=refLogs(refId);
  if(!logs.length) return '<div class="info-row"><span class="cell-sub">履歴はまだありません</span></div>';
  return logs.map(l=>`<div class="info-row">
