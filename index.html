<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KANOA — パートナーポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --bg:#f7f7f8; --surface:#ffffff; --surface-2:#fbfbfc;
  --ink:#17171b; --ink-soft:#3d3d44; --muted:#8a8d95; --faint:#aeb1b8;
  --line:#ededf0; --line-2:#e2e2e7;
  --accent:#4f46e5; --accent-soft:#eef0fe; --accent-ink:#3b34c4;
  --g:#15803d; --g-bg:#e8f6ee; --b:#2563eb; --b-bg:#eaf1ff;
  --a:#b45309; --a-bg:#fdf2e2; --v:#7c3aed; --v-bg:#f4effe;
  --r:#be123c; --r-bg:#fdeef1; --gray:#6b7280; --gray-bg:#f1f2f4;
  --display:'Inter',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  --r-sm:8px; --r-md:11px; --r-lg:15px;
  --sh:0 1px 2px rgba(20,20,30,.04),0 1px 3px rgba(20,20,30,.06);
  --sh-lg:0 10px 40px -12px rgba(20,20,40,.18);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit}
.mono{font-family:var(--mono)}
::selection{background:var(--accent-soft)}

/* eyebrow / labels */
.eyebrow{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ─────────── LOGIN (Midnight Network) ─────────── */
.login-wrap{position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(130% 100% at 50% 0%,#ffffff,#f4f7fa);isolation:isolate}
#loginCanvas{display:none}
.login-veil{display:none}
/* top / bottom chrome */
.login-top{position:fixed;z-index:6;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:26px 38px}
.login-bottom{position:fixed;z-index:6;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:22px 38px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#a8b2bf}
.login-locale{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#8a96a5;display:flex;align-items:center;gap:9px}
.login-locale::before{content:"";width:6px;height:6px;border-radius:50%;background:#1f3f63}
/* stage + card */
.login-stage{position:relative;z-index:5;width:100%;display:grid;place-items:center;padding:48px 24px}
.login-card{position:relative;z-index:2;width:100%;max-width:404px;padding:0}
.login-head{margin-bottom:30px;text-align:center}
.login-kicker{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:#9aa6b4;margin-bottom:22px}
.login-wordmark{font-family:'Hiragino Mincho ProN','Yu Mincho',YuMincho,'Noto Serif JP',serif;font-weight:600;font-size:42px;letter-spacing:.05em;color:#1f3f63;line-height:1;margin-bottom:14px}
.login-title{display:none}
.login-sub{color:#8593a4;font-size:13px;letter-spacing:.04em}
/* brand lockup (top bar) */
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:29px;height:29px;border-radius:9px;background:#1f3f63;display:grid;place-items:center;color:#fff;flex-shrink:0}
.brand-mark svg{width:14px;height:14px;fill:currentColor;stroke:none}
.brand-name{font-size:13px;font-weight:700;letter-spacing:.24em;color:#1f3f63}
.brand-divider{width:1px;height:13px;background:rgba(31,63,99,.2);margin:0 2px}
.brand-sub{font-family:var(--mono);font-size:10px;font-weight:500;color:#9aa6b4;letter-spacing:.14em;text-transform:uppercase}
/* tabs */
.login-tabs{display:flex;justify-content:center;gap:30px;margin:24px 0 26px}
.login-tab{position:relative;padding:0 0 11px;border:none;background:none;font-size:12.5px;font-weight:600;letter-spacing:.03em;color:#a3aebc;transition:color .2s}
.login-tab::after{content:"";position:absolute;left:50%;right:50%;bottom:0;height:1.5px;background:#1f3f63;transition:left .26s var(--ease),right .26s var(--ease)}
.login-tab:hover{color:#5d6f84}
.login-tab.on{color:#1f3f63}
.login-tab.on::after{left:0;right:0}
.login-body{padding:0}
/* inputs */
.ix{position:relative;margin-bottom:11px}
.ix>svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#aab6c4;pointer-events:none;transition:color .15s}
.ix input{width:100%;height:53px;padding:0 18px 0 46px;border:1px solid #e4e8ee;border-radius:12px;background:#fff;color:#1f3f63;font-size:14.5px;letter-spacing:.02em;outline:none;transition:border-color .18s,box-shadow .18s}
.ix input::placeholder{color:#aeb9c6}
.ix input:focus{border-color:#1f3f63;box-shadow:0 0 0 3px rgba(31,63,99,.09)}
.ix:focus-within>svg{color:#1f3f63}
.ix-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:none;background:none;display:grid;place-items:center;color:#aab6c4;border-radius:9px}
.ix-eye:hover{color:#1f3f63}
.ix-eye svg{width:20px;height:20px}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 2px 22px}
.lcheck{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#75839a;cursor:pointer}
.lcheck input{width:15px;height:15px;accent-color:#1f3f63}
.lforgot{border:none;background:none;font-size:12.5px;color:#5d7790;text-decoration:none;cursor:pointer}
.lforgot:hover{color:#1f3f63;text-decoration:underline;text-underline-offset:2px}
.loginbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border:none;border-radius:12px;background:#1f3f63;color:#fff;font-size:14.5px;font-weight:600;letter-spacing:.14em;position:relative;overflow:hidden;transition:background .2s,transform .18s var(--ease)}
.loginbtn:hover{background:#16304d;transform:translateY(-1px)}
.loginbtn>span{position:relative}
.loginbtn svg{position:absolute;right:22px;width:19px;height:19px;transition:transform .22s var(--ease)}
.loginbtn:hover svg{transform:translateX(4px)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* メールアドレス形式チェック */
input.email-invalid{border-color:var(--r)!important;box-shadow:0 0 0 3px var(--r-bg)!important}
.email-hint{color:var(--r);font-size:11px;font-weight:600;margin-top:5px;display:flex;align-items:flex-start;gap:4px;line-height:1.4}
.email-hint svg{width:13px;height:13px;flex-shrink:0;margin-top:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border:1px solid transparent;border-radius:var(--r-sm);font-size:13px;font-weight:600;transition:all .15s var(--ease);white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-ink);transform:translateY(-1px)}
.btn-block{width:100%}
.btn-ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--muted)}
.btn-sm{padding:7px 12px;font-size:12px}
.btn-danger{background:var(--surface);border-color:#f3cdd6;color:var(--r)}
.btn-danger:hover{background:var(--r);color:#fff;border-color:var(--r)}
.login-quick{margin-top:24px;padding-top:20px;border-top:1px solid #ebeef2}
.login-quick-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#a3aebc;text-align:center;margin-bottom:12px}
.quick-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.quick-chip{padding:7px 13px;border:1px solid #e4e8ee;border-radius:999px;background:#fff;font-size:11.5px;font-weight:600;color:#5d7790;transition:all .16s var(--ease)}
.quick-chip:hover{border-color:#1f3f63;color:#1f3f63;transform:translateY(-1px)}
.login-err{font-size:12.5px;color:#c0395a;margin:-2px 2px 12px;min-height:16px;text-align:center}
@media(max-width:560px){
  .login-wordmark{font-size:36px}
  .login-top,.login-bottom{padding-left:22px;padding-right:22px}
  .login-bottom span:last-child{display:none}
}

/* ─────────── APP SHELL ─────────── */
.app{display:none;min-height:100vh}
.app.on{display:grid;grid-template-columns:236px 1fr}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px}
.side-brand{display:flex;align-items:center;gap:9px;padding:6px 8px 18px}
.side-brand .brand-mark{width:28px;height:28px}
.side-brand-name{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.03em}
.side-role{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:5px;margin-left:auto}
.nav{display:flex;flex-direction:column;gap:1px;margin-top:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:none;background:none;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--ink-soft);transition:all .13s;text-align:left}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-item.on svg{opacity:1}
.nav-count{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--muted);background:var(--gray-bg);padding:1px 7px;border-radius:999px}
.nav-item.on .nav-count{background:var(--surface);color:var(--accent)}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.side-user{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:var(--r-sm)}
.side-avatar{width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.side-user-info{min-width:0;flex:1}
.side-user-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user-sub{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-logout{border:none;background:none;color:var(--muted);padding:5px;border-radius:6px;display:grid;place-items:center}
.side-logout:hover{background:var(--gray-bg);color:var(--r)}
.side-logout svg{width:15px;height:15px}

/* main */
.main{min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0}
.topbar h1{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.03em}
.topbar-sub{color:var(--muted);font-size:12.5px;margin-top:1px}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{flex:1;overflow-y:auto;padding:24px 26px 60px}
.content-narrow{max-width:1080px}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;box-shadow:var(--sh)}
.kpi-label{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.kpi-dot{width:7px;height:7px;border-radius:50%}
.kpi-val{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:-.03em;line-height:1}
.kpi-val .yen{font-size:15px;font-weight:700;color:var(--muted);margin-right:2px}
.kpi-val .unit{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi-delta{font-size:11px;font-family:var(--mono);font-weight:600;margin-top:7px;color:var(--muted)}

/* section */
.sect{margin-bottom:28px}
.sect-head{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.sect-title{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.02em}
.sect-head .btn{margin-left:auto}

/* cards / panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh);overflow:hidden}
.panel-pad{padding:18px 20px}

/* table */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl thead th{text-align:left;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0;z-index:1}
.tbl tbody td{padding:6px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num{font-family:var(--mono);font-weight:600;text-align:right}
.cell-strong{font-weight:600}
.cell-sub{font-size:11.5px;color:var(--muted)}

/* inline editable cell controls */
.icell{width:100%;min-width:80px;padding:6px 8px;font-size:13px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--ink);outline:none;transition:all .14s}
.icell:hover{background:var(--gray-bg)}
.icell:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
select.icell{cursor:pointer}
.icell-name{font-weight:600;min-width:100px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.4;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.bd-entry{color:var(--gray);background:var(--gray-bg)}
.bd-screening{color:var(--b);background:var(--b-bg)}
.bd-interview{color:var(--a);background:var(--a-bg)}
.bd-offer{color:var(--v);background:var(--v-bg)}
.bd-joined{color:var(--g);background:var(--g-bg)}
.bd-resigned{color:#B45309;background:#FDF2E2}
.bd-rejected{color:var(--r);background:var(--r-bg)}
.bd-declined{color:var(--muted);background:var(--gray-bg)}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:600;background:var(--gray-bg);color:var(--ink-soft);white-space:nowrap}
/* 表の中のタグは1文字ずつ折り返さず、長い案件名は「…」で省略する（行が異常に高くなるのを防ぐ） */
.tbl td .tag{display:inline-block;max-width:190px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.tag-open{background:var(--g-bg);color:var(--g)}
.tag-closed{background:var(--gray-bg);color:var(--muted)}
.tag-draft{background:var(--a-bg);color:var(--a)}
.tag-active{background:var(--g-bg);color:var(--g)}
.tag-pending{background:var(--a-bg);color:var(--a)}
.tag-suspended{background:var(--r-bg);color:var(--r)}
.tag-accent{background:var(--accent-soft);color:var(--accent-ink)}

/* status select coloring */
select.icell.stsel{font-weight:600;border:1px solid var(--line-2);background:var(--surface)}
.stsel.st-entry{color:var(--gray)} .stsel.st-screening{color:var(--b)} .stsel.st-interview{color:var(--a)}
.stsel.st-offer{color:var(--v)} .stsel.st-joined{color:var(--g)} .stsel.st-rejected{color:var(--r)}
.stsel.st-declined{color:var(--muted)} .stsel.st-resigned{color:#B45309}

/* toolbar / filters */
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface)}
.search svg{width:15px;height:15px;color:var(--muted);flex-shrink:0}
.search input{flex:1;border:none;outline:none;background:none;font-size:13px}
.fsel{padding:8px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-soft);outline:none;cursor:pointer}
.fsel:focus{border-color:var(--accent)}

/* chips */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);font-size:12px;font-weight:600;color:var(--ink-soft);transition:all .14s}
.chip b{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on b{color:rgba(255,255,255,.7)}

.meta-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.meta-count{font-family:var(--display);font-weight:800;font-size:15px}
.meta-hint{font-size:11px;color:var(--faint)}

/* empty */
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.empty-icon{width:40px;height:40px;margin:0 auto 12px;border-radius:11px;background:var(--gray-bg);display:grid;place-items:center;color:var(--faint)}
.empty-title{font-weight:600;color:var(--ink-soft);margin-bottom:3px}
.empty-sub{font-size:12.5px}

/* project cards grid */
.pj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pj-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;box-shadow:var(--sh);transition:all .16s var(--ease);cursor:pointer;display:flex;flex-direction:column;gap:12px}
.pj-card:hover{border-color:var(--line-2);box-shadow:var(--sh-lg);transform:translateY(-2px)}
.pj-unread{display:inline-flex;align-items:center;gap:4px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;animation:pjPulse 2s ease-in-out infinite}
@keyframes pjPulse{0%,100%{box-shadow:0 0 0 0 rgba(79,70,229,.0)}50%{box-shadow:0 0 0 4px rgba(79,70,229,.14)}}
.pj-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pj-logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;color:#fff;flex-shrink:0}
.pj-name{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.02em;line-height:1.3}
.pj-client{font-size:11.5px;color:var(--muted);margin-top:2px}
.pj-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft)}
.pj-row svg{width:14px;height:14px;color:var(--muted);flex-shrink:0}
.pj-stats{display:flex;gap:16px;padding-top:12px;border-top:1px solid var(--line);margin-top:auto}
.pj-stat-v{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.02em}
.pj-stat-l{font-size:10.5px;color:var(--muted);font-weight:500}

/* detail layout */
.detail-grid{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
@media(max-width:920px){.detail-grid{grid-template-columns:1fr}}
.dt-block{margin-bottom:22px}
.dt-block-title{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.dt-block-title::after{content:"";flex:1;height:1px;background:var(--line)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:9px 16px;font-size:13px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{color:var(--ink);font-weight:500}
.req-list{list-style:none;display:flex;flex-direction:column;gap:7px}
.req-list li{display:flex;gap:9px;font-size:13px;line-height:1.5}
.req-list li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:8px;flex-shrink:0}
.flow-steps{display:flex;flex-direction:column;gap:0}
.flow-step{display:flex;gap:13px;padding-bottom:18px;position:relative}
.flow-step:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:1.5px;background:var(--line-2)}
.flow-num{width:27px;height:27px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12px;flex-shrink:0;z-index:1}
.flow-body strong{display:block;font-size:13px;font-weight:600;margin-bottom:1px}
.flow-body span{font-size:12px;color:var(--muted)}

/* reward callout */
.reward-card{background:linear-gradient(160deg,var(--ink),#2a2a33);color:#fff;border-radius:var(--r-md);padding:20px;margin-bottom:16px}
.reward-card .eyebrow{color:rgba(255,255,255,.55)}
.reward-amt{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.03em;margin:6px 0 2px}
.reward-amt .yen{font-size:17px;color:rgba(255,255,255,.6);margin-right:2px}
.reward-amt .unit{font-size:13px;font-weight:600;color:rgba(255,255,255,.55);margin-left:4px}
.reward-split{display:flex;gap:18px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.reward-split-v{font-family:var(--display);font-weight:700;font-size:16px}
.reward-split-l{font-size:10.5px;color:rgba(255,255,255,.55)}

/* assignment matrix */
/* 公開設定（案件×パートナー）カード */
.assign-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.assign-count{font-size:13px;font-weight:600;color:var(--ink)}
.assign-count b{color:var(--accent);font-family:var(--display);font-size:15px;margin:0 1px}
.assign-search-wrap{position:relative;flex:1;min-width:150px}
.assign-search{width:100%;padding:8px 10px 8px 31px;border:1px solid var(--line-2);border-radius:8px;font-size:12.5px;outline:none;background:var(--surface)}
.assign-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.assign-search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--faint);pointer-events:none}
.assign-card{display:flex;align-items:center;gap:12px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;background:var(--surface);transition:border-color .14s,background .14s;flex-wrap:wrap}
.assign-card.pub{border-color:#c7d2fe;background:var(--accent-soft)}
.ac-av{width:30px;height:30px;border-radius:8px;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
.ac-main{flex:1;min-width:120px}
.ac-name{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-code{font-size:11px;color:var(--muted);font-family:var(--mono)}
.ac-pill{font-size:10.5px;font-weight:700;padding:3px 11px;border-radius:999px;flex-shrink:0}
.ac-pill.off{background:var(--gray-bg);color:var(--muted)}
.ac-pill.on{background:var(--g-bg);color:var(--g)}
.assign-ov{display:flex;gap:8px;align-items:flex-end;margin-left:auto;flex-shrink:0}
.ov-field{display:flex;flex-direction:column;gap:2px}
.ov-field label{font-size:9px;color:var(--muted);font-family:var(--mono);padding-left:2px}
.ov-field input{width:94px;padding:5px 8px;font-size:12px;font-family:var(--mono);border:1px solid var(--line-2);border-radius:7px;outline:none;text-align:right;background:var(--surface)}
.ov-field input:focus{border-color:var(--accent)}
/* toggle */
.toggle{position:relative;width:38px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-track{position:absolute;inset:0;background:var(--line-2);border-radius:999px;transition:background .18s}
.toggle-track::before{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .18s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked + .toggle-track{background:var(--accent)}
.toggle input:checked + .toggle-track::before{transform:translateX(16px)}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(17,17,22,.4);backdrop-filter:blur(4px);z-index:80;opacity:0;pointer-events:none;transition:opacity .26s}
.overlay.on{opacity:1;pointer-events:auto}
/* 候補者カード等のドロワー幅。画面のおよそ30%。
   下限400px＝2カラムのフォーム(.dr-form)が潰れない幅、上限680px＝広いモニタで伸びすぎない。
   560px以下は下のメディアクエリで全画面に上書きされる。 */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(100%,clamp(400px,30vw,680px));background:var(--surface);z-index:81;transform:translateX(100%);transition:transform .32s var(--ease);box-shadow:-24px 0 60px -28px rgba(0,0,0,.35);display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;gap:13px;padding:20px 22px;border-bottom:1px solid var(--line)}
.drawer-avatar{width:44px;height:44px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;flex-shrink:0}
.drawer-head-name{flex:1;min-width:0}
.drawer-title{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.02em}
.drawer-sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.drawer-close{width:30px;height:30px;border:none;background:var(--gray-bg);border-radius:8px;color:var(--muted);display:grid;place-items:center;font-size:17px}
.drawer-close:hover{background:var(--line-2);color:var(--ink)}
.drawer-body{flex:1;overflow-y:auto;padding:20px 22px 36px}
.info-card{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:18px}
.info-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.info-row:last-child{border-bottom:none}
.info-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;width:84px;flex-shrink:0}
.info-val{flex:1;min-width:0;font-size:13px;word-break:break-word}
.info-val a{color:var(--accent);text-decoration:none;font-weight:600}
.info-val a:hover{text-decoration:underline}
.copy-btn{flex-shrink:0;padding:4px 10px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;font-size:10.5px;font-weight:600;color:var(--muted)}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
/* drawer edit form */
.dr-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.chip-joined{display:inline-flex;align-items:center;gap:5px;background:var(--g-bg);color:var(--g);padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700}
.dr-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.dr-form .full{grid-column:1/-1}
.dr-form .field{margin-bottom:0}
.dr-readout{display:flex;gap:18px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:16px}
.dr-readout .l{font-size:10.5px;color:var(--muted);font-weight:600}
.dr-readout .v{font-family:var(--display);font-weight:700;font-size:14px;margin-top:2px}
/* segmented control */
.seg{display:flex;gap:2px;padding:4px;background:var(--gray-bg);border-radius:10px;margin-bottom:16px}
.seg-btn{flex:1;padding:8px;border:none;background:none;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);transition:all .15s}
.seg-btn.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}

/* modal */
.modal{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:20px}
.modal.on{display:grid}
.modal-card{position:relative;z-index:5;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-lg);padding:24px}
.modal-title{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;margin-bottom:4px}
.modal-sub{color:var(--muted);font-size:12.5px;margin-bottom:18px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.modal-grid .full{grid-column:1/-1}
.modal-actions{display:flex;gap:9px;margin-top:20px}
.modal-actions .btn{flex:1}
/* 縦に長いモーダル（一括送信・一斉連絡）。
   以前はカード全体を overflow:auto にしていたため、中の一覧の上でホイールを回すと
   一覧だけが延々と動き、下にある「送信内容」と「送信」ボタンに到達できなかった。
   → 中身だけをスクロールさせ、入力欄と操作ボタンは常に見える位置に固定する。 */
.modal-card.modal-tall{display:flex;flex-direction:column;overflow:hidden}
.modal-card.modal-tall > .modal-scroll{flex:1;min-height:0;overflow-y:auto;margin:0 -4px;padding:0 4px}
.modal-card.modal-tall > .modal-foot{flex-shrink:0;padding-top:12px;border-top:1px solid var(--line);margin-top:12px}
.modal-card.modal-tall > .modal-foot .modal-actions{margin-top:12px}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r-sm);font-size:13px;font-weight:500;box-shadow:var(--sh-lg);z-index:120;opacity:0;pointer-events:none;transition:all .26s var(--ease);display:flex;align-items:center;gap:9px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;color:#6ee7a0}

/* summary table accents */
.sum-bar{height:6px;border-radius:3px;background:var(--accent-soft);overflow:hidden;min-width:60px}
.sum-bar span{display:block;height:100%;background:var(--accent);border-radius:3px}

/* view transition */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.content.anim{animation:fadeUp .28s var(--ease)}
.pj-card,.kpi{animation:fadeUp .32s var(--ease) backwards}
.pj-grid .pj-card:nth-child(2){animation-delay:.03s}
.pj-grid .pj-card:nth-child(3){animation-delay:.06s}
.pj-grid .pj-card:nth-child(4){animation-delay:.09s}

/* 送客条件 callout */
.cond-card{background:var(--accent-soft);border:1px solid #dcdcfb;border-radius:var(--r-md);padding:14px 16px;margin-bottom:16px}
.cond-card .eyebrow{color:var(--accent-ink);margin-bottom:6px}
.cond-card p{font-size:13px;line-height:1.6;color:#2e2b73;font-weight:500}

/* assign matrix header */
.assign-head{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.assign-head .eyebrow{flex:1}
.assign-cols{display:flex;gap:8px;align-items:center}
.assign-cols .col-l{width:110px;text-align:right;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.bulk-link{border:none;background:none;color:var(--accent);font-size:11px;font-weight:600;cursor:pointer;padding:2px 4px}
.bulk-link:hover{text-decoration:underline}

/* alert badge on nav */
.nav-count.alert{background:var(--r);color:#fff;animation:pulse 2s infinite}
.nav-item.nav-bump{animation:navBump .55s var(--ease)}
@keyframes navBump{0%{transform:translateX(0)}20%{transform:translateX(3px)}40%{transform:translateX(-2px)}60%{transform:translateX(2px)}100%{transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* confirmed vs pipeline pills */
.earn-split{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.earn-pill{flex:1;min-width:150px;border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;background:var(--surface)}
.earn-pill.confirmed{border-color:#bfe6cd;background:linear-gradient(160deg,#f3fbf6,#fff)}
.earn-pill .el{font-size:11.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px;margin-bottom:7px}
.earn-pill .ev{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.earn-pill .ev .yen{font-size:13px;color:var(--muted)}

/* scrollbar */
.content::-webkit-scrollbar,.drawer-body::-webkit-scrollbar,.modal-card::-webkit-scrollbar{width:9px}
.content::-webkit-scrollbar-thumb,.drawer-body::-webkit-scrollbar-thumb,.modal-card::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px;border:2px solid var(--surface)}
.content::-webkit-scrollbar-thumb:hover{background:var(--faint)}

@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* chat */
.thread-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .14s}
.thread-item:hover{background:var(--surface-2)}
.thread-item:last-child{border-bottom:none}
.thread-av{width:40px;height:40px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0}
.thread-main{flex:1;min-width:0}
.thread-name{font-weight:600;font-size:13.5px}
.thread-last{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.thread-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.thread-time{font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.unread-dot{min-width:19px;height:19px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
/* 連絡：検索・案件フィルタ */
.msg-search-wrap{position:relative;margin-bottom:12px}
.msg-search{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line-2);border-radius:10px;font-size:13px;outline:none;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.msg-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.msg-search-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint);pointer-events:none}
.msg-search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:var(--gray-bg);color:var(--muted);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;display:grid;place-items:center}
.msg-search-clear:hover{background:var(--line-2);color:var(--ink)}
.msg-sec{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 4px 8px}
.msg-sec:first-child{margin-top:2px}
.thread-pj-tag{font-size:9.5px;font-weight:600;font-family:var(--mono);color:var(--accent-ink);background:var(--accent-soft);padding:1px 6px;border-radius:5px;margin-right:5px}
.chat{display:flex;flex-direction:column;height:100%;min-height:0}
/* 会話：左に縦の候補者レール＋右にチャット */
/* 送客スレッド一覧の幅は --rail-w で可変。利用者がドラッグで変えた値は端末に保存する */
.conv{display:grid;grid-template-columns:var(--rail-w,260px) minmax(0,1fr);height:calc(100dvh - 88px);min-height:340px}
.cand-rail{position:relative;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surface-2);min-height:0}
/* 幅を変えるつまみ。境界に重ねて置く（列を増やすとレイアウトが崩れるため） */
.rail-resizer{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:6;background:transparent;border:none;padding:0}
.rail-resizer::before{content:"";position:absolute;top:0;left:3px;width:1px;height:100%;background:var(--accent);opacity:0;transition:opacity .12s}
.rail-resizer:hover::before,.rail-resizer.on::before{opacity:1}
.cand-rail-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 9px;font-size:11px;font-weight:700;color:var(--muted);font-family:var(--mono);letter-spacing:.04em;flex-shrink:0;border-bottom:1px solid var(--line)}
.cand-rail-head b{color:var(--ink);font-family:var(--display)}
.cand-add{width:24px;height:24px;border:1px solid var(--line-2);background:var(--surface);border-radius:7px;display:grid;place-items:center;color:var(--ink-soft);cursor:pointer}
.cand-add:hover{border-color:var(--accent);color:var(--accent)}
.cand-rail-list{flex:1;overflow-y:auto;padding:6px}
.cand-slot{position:relative;margin-bottom:1px}
.cand-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 9px;border:none;background:none;border-radius:9px;cursor:pointer;text-align:left;transition:background .12s;margin-bottom:0}
.cand-item.has-unread{padding-right:52px}
/* スレッドごとの「未読に戻す」。ボタンの入れ子を避けるため、行に重ねて置く */
.ci-unread{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px;cursor:pointer;opacity:0;transition:opacity .12s,color .12s,border-color .12s}
.cand-slot:hover .ci-unread{opacity:1}
.ci-unread:hover{border-color:var(--accent);color:var(--accent)}
@media (hover:none){ .ci-unread{opacity:1} }
.cand-item:hover{background:var(--surface)}
.cand-item.on{background:var(--accent-soft)}
.cand-item .ci-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cand-item .ci-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cand-item .ci-name{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand-item.on .ci-name{color:var(--accent-ink)}
.cand-item .ci-sub{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand-item .ci-flag{width:6px;height:6px;border-radius:50%;background:var(--a);flex-shrink:0}
.cand-item .ci-un{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;font-family:var(--mono);flex-shrink:0}
@media(max-width:720px){
  .conv{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .cand-rail{border-right:none;border-bottom:1px solid var(--line);max-height:168px}
  .rail-resizer{display:none}   /* 縦積みになるので幅調整は無効 */
}
/* 要対応パネル（パートナートップ） */
.todo-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);margin-bottom:18px;overflow:hidden}
.todo-head{display:flex;align-items:center;gap:8px;padding:13px 16px;font-weight:700;font-size:14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--a-bg),var(--surface))}
.todo-head svg{width:17px;height:17px;color:var(--a)}
.todo-count{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:var(--a);padding:1px 9px;border-radius:999px}
.todo-item{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line)}
.todo-item:last-child{border-bottom:none}
.todo-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.todo-ic svg{width:15px;height:15px}
.todo-ic.doc{background:var(--a-bg);color:var(--a)}
.todo-ic.msg{background:var(--accent-soft);color:var(--accent)}
.todo-ic.sched{background:var(--v-bg);color:var(--v)}
.todo-main{flex:1;min-width:0}
.todo-label{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo-sub{font-size:11px;color:var(--muted);margin-top:1px}
.todo-cta{flex-shrink:0;padding:6px 13px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.todo-cta:hover{background:var(--accent-ink)}
.todo-clear{display:flex;align-items:center;gap:9px;padding:14px 16px;margin-bottom:18px;background:var(--g-bg);border:1px solid transparent;border-radius:var(--r-lg);color:var(--g);font-size:13px;font-weight:600}
.todo-clear svg{width:18px;height:18px;flex-shrink:0}
/* 送客テーブルの連絡ボタン */
.ref-chat-btn{position:relative;width:30px;height:30px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;display:inline-grid;place-items:center;color:var(--muted);cursor:pointer;transition:all .14s}
.ref-chat-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.ref-chat-un{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--accent);color:#fff;font-size:9.5px;font-weight:700;font-family:var(--mono);display:grid;place-items:center;border:1.5px solid var(--surface)}
/* タスク依頼バッジ */
.task-tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:6px;margin-right:5px;vertical-align:1px;font-family:var(--mono);letter-spacing:.02em}
.task-tag-req{background:var(--a-bg);color:var(--a)}
.task-tag-to{background:var(--accent-soft);color:var(--accent-ink)}
/* 案件詳細：キャリアパス / FAQ / リンク */
.career-path{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cp-step{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink)}
.cp-arrow{color:var(--faint);font-size:12px}
.faq-list{display:flex;flex-direction:column;gap:6px}
.faq-item{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.faq-item summary{padding:11px 14px;font-size:13px;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;color:var(--ink)}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary::before{content:'Q';font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);width:18px;height:18px;border-radius:5px;display:grid;place-items:center;flex-shrink:0}
.faq-item[open] summary{border-bottom:1px solid var(--line)}
.faq-a{padding:11px 14px 13px 40px;font-size:12.5px;line-height:1.7;color:var(--ink-soft)}
.link-list{display:flex;flex-direction:column;gap:4px}
.link-row{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;font-size:12.5px;color:var(--accent-ink);text-decoration:none;border:1px solid transparent;transition:all .14s}
.link-row:hover{background:var(--accent-soft);border-color:var(--line)}
.link-row svg{color:var(--accent);flex-shrink:0}
/* 候補者へ一括送信 */
.bulk-list-head{display:flex;align-items:center;justify-content:space-between;margin:2px 0 6px}
.bulk-list{max-height:30vh;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:12px}
.bulk-row{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:8px;cursor:pointer;transition:background .12s}
.bulk-row:hover{background:var(--surface-2)}
.bulk-row.on{background:var(--accent-soft)}
.bulk-row input{width:16px;height:16px;flex-shrink:0;accent-color:var(--accent)}
.bulk-av{width:28px;height:28px;border-radius:8px;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
.bulk-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.bulk-name{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bulk-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bulk-tmpls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.tmpl-chip{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:all .14s}
.tmpl-chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chat-head{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.chat-back{width:30px;height:30px;border:none;background:var(--gray-bg);border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.chat-back:hover{background:var(--line-2);color:var(--ink)}
.chat-body{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.msg{max-width:92%;padding:9px 13px;border-radius:15px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg-time{font-size:10px;font-family:var(--mono);margin-top:4px;opacity:.7}
.msg-in{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg-out{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.msg-day{align-self:center;font-size:10.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:3px 12px;border-radius:999px;margin:6px 0}
.composer{display:flex;gap:9px;align-items:flex-end;padding:11px 14px;border-top:1px solid var(--line);flex-shrink:0}
.composer textarea{flex:1;resize:none;max-height:120px;min-height:40px;padding:9px 13px;border:1px solid var(--line-2);border-radius:12px;outline:none;font-size:13px;line-height:1.4;font-family:inherit}
.composer textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer .btn{flex-shrink:0;border-radius:11px;height:40px}
.chat-empty{flex:1;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:20px}
/* read receipt + msg wrap + task-from-msg */
.msg-wrap{display:flex;align-items:flex-start;gap:6px}
.msg-wrap.out{flex-direction:row-reverse;align-self:flex-end;max-width:94%}
.msg-wrap.in{align-self:flex-start;max-width:94%}
.msg-wrap .msg{max-width:none}
.msg-task{flex-shrink:0;width:24px;height:24px;border:1px solid var(--line-2);background:var(--surface);border-radius:7px;color:var(--muted);display:grid;place-items:center;opacity:.5;transition:opacity .14s,border-color .14s,color .14s;margin-top:4px}
.msg-wrap:hover .msg-task,.msg-task:active{opacity:1}
.msg-task:hover{opacity:1;border-color:var(--accent);color:var(--accent)}
/* quoted reply inside bubble */
.msg-quote{border-left:3px solid rgba(127,127,140,.5);padding:3px 8px;margin-bottom:5px;font-size:11.5px;opacity:.85;cursor:pointer;border-radius:3px}
.msg-quote .q-from{font-weight:700;font-size:10.5px;display:block;margin-bottom:1px}
.msg-out .msg-quote{border-left-color:rgba(255,255,255,.6)}
/* reactions */
.msg-reacts{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.msg-wrap.out .msg-reacts{justify-content:flex-end}
.react-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;font-size:12px;font-weight:600;color:var(--ink-soft);line-height:1.4}
.react-pill.mine{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.react-pill:hover{border-color:var(--accent)}
.react-pill .rc{font-size:10.5px;font-family:var(--mono)}
.react-pill.text-react{gap:4px;padding:2px 9px 2px 7px;font-weight:600;background:var(--surface-2);border-color:var(--line)}
.react-pill.text-react svg{width:11px;height:11px;opacity:.6}
.react-pill.text-react.mine{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.react-pill.text-react.mine svg{opacity:.9}
/* stamp / big emoji bubble */
.msg.is-stamp{background:transparent!important;border:none!important;padding:4px 0!important}
.msg.is-stamp .stamp-pill{display:inline-block;padding:9px 16px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:14px}
.msg-out .msg.is-stamp .stamp-pill,.msg-wrap.out .msg.is-stamp .stamp-pill{background:var(--accent);color:#fff}
.msg.is-emoji{background:transparent!important;border:none!important;font-size:40px;padding:0!important;line-height:1.1}
.msg.is-emoji .msg-time{font-size:10px}
.msg-edited{font-size:10px;opacity:.6;margin-left:5px}
.msg-deleted{font-style:italic;opacity:.6;font-size:12.5px}
/* per-message action menu */
.msg-menu{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--sh-lg);padding:7px;min-width:236px;max-width:280px}
.msg-menu .react-row{display:flex;gap:3px;padding:3px;border-bottom:1px solid var(--line);margin-bottom:5px;flex-wrap:wrap}
.msg-menu .react-row button{width:32px;height:32px;border:none;background:none;border-radius:8px;font-size:18px;cursor:pointer}
.msg-menu .react-row button:hover{background:var(--gray-bg)}
.msg-menu .react-row.text{flex-wrap:wrap;gap:5px;border-bottom:1px solid var(--line);padding-bottom:7px}
.msg-menu .react-row.text button.txt-stamp{width:auto;height:auto;padding:4px 9px;font-size:11.5px;font-weight:600;color:var(--ink-soft);border:1px solid var(--line-2);border-radius:999px;white-space:nowrap}
.msg-menu .react-row.text button.txt-stamp:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.msg-menu .mi{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border:none;background:none;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-soft);text-align:left}
.msg-menu .mi:hover{background:var(--surface-2)}
.msg-menu .mi svg{width:15px;height:15px;opacity:.7}
.msg-menu .mi.danger{color:var(--r)}
/* reply preview above composer */
.reply-bar{display:flex;align-items:center;gap:10px;margin:0 14px;padding:8px 12px;background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-size:12px}
.reply-bar .rb-main{flex:1;min-width:0}
.reply-bar .rb-from{font-weight:700;font-size:10.5px;color:var(--accent-ink)}
.reply-bar .rb-text{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-bar button{border:none;background:none;color:var(--muted);font-size:17px;cursor:pointer;line-height:1}
/* picker panel */
.picker{margin:0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--sh)}
.picker-tabs{display:flex;gap:2px;padding:5px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.picker-tab{flex:1;padding:7px;border:none;background:none;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted)}
.picker-tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.picker-body{padding:10px;max-height:170px;overflow-y:auto}
.stamp-grid{display:flex;flex-wrap:wrap;gap:6px}
.stamp-grid .st{padding:7px 12px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.stamp-grid .st:hover{border-color:var(--accent);color:var(--accent)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.emoji-grid button{aspect-ratio:1;border:none;background:none;border-radius:8px;font-size:20px;cursor:pointer}
.emoji-grid button:hover{background:var(--gray-bg)}
/* pinned bar */
.pin-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fffbeb;border-bottom:1px solid #fde8b0;font-size:12px;cursor:pointer}
.pin-bar svg{width:13px;height:13px;color:var(--a);flex-shrink:0}
.pin-bar .pb-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-soft)}
.composer-tools{display:flex;align-items:center;gap:7px;padding:9px 14px 0}
.tool-btn{width:32px;height:32px;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.tool-btn:hover,.tool-btn.on{border-color:var(--accent);color:var(--accent)}
.msg-task:hover{border-color:var(--accent);color:var(--accent)}
.msg-receipt{align-self:flex-end;font-size:10px;color:var(--muted);margin:-2px 4px 4px 0;font-weight:600}
/* template bar */
.tmpl-bar{display:flex;gap:7px;overflow-x:auto;padding:9px 14px 0;flex-shrink:0}
.tmpl-bar::-webkit-scrollbar{height:0}
.tmpl-chip{flex-shrink:0;padding:5px 11px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;font-size:11.5px;font-weight:600;color:var(--ink-soft)}
.tmpl-chip:hover{border-color:var(--accent);color:var(--accent)}
/* candidate context chip */
.ctx-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 14px 0;padding:7px 12px;background:var(--accent-soft);color:var(--accent-ink);border-radius:9px;font-size:12px;font-weight:600}
.ctx-chip button{border:none;background:none;color:var(--accent-ink);font-size:16px;cursor:pointer;line-height:1}
/* ── 送客スレッド：サブナビ（チャット内の案件/候補者切替） ── */
.subthread-bar{display:flex;gap:7px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-shrink:0}
.subthread-bar::-webkit-scrollbar{height:0}
.st-chip{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;font-size:12px;font-weight:600;color:var(--ink-soft);transition:all .14s;white-space:nowrap;cursor:pointer;max-width:220px}
.st-chip:hover{border-color:var(--accent)}
.st-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.st-chip .st-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.st-chip .st-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-chip .st-sub{font-size:10px;font-weight:600;opacity:.6;font-family:var(--mono)}
.st-chip.on .st-sub{opacity:.8}
.st-chip .st-un{margin-left:2px;min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;font-family:var(--mono)}
.st-chip.on .st-un{background:#fff;color:var(--ink)}
/* ── 送客スレッドのコンテキストヘッダー（誰の/どの案件か常時表示） ── */
.thread-ctx{display:flex;align-items:center;gap:11px;padding:11px 16px;background:linear-gradient(180deg,var(--accent-soft),#fff);border-bottom:1px solid var(--line);flex-shrink:0}
.thread-ctx-av{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0}
.thread-ctx-main{flex:1;min-width:0}
.thread-ctx-name{font-weight:700;font-size:14px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.thread-ctx-meta{font-size:11.5px;color:var(--muted);margin-top:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.thread-ctx-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}
.thread-ctx-actions{display:flex;gap:6px;flex-shrink:0}
.thread-ctx-btn{padding:6px 11px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;font-size:11.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.thread-ctx-btn:hover{border-color:var(--accent);color:var(--accent)}
.thread-ctx.general{background:var(--surface-2)}
.thread-ctx.general .thread-ctx-av{background:var(--ink)}

/* ── 候補者コマンドパネル（候補者×案件の紐付け・管理を一望） ── */
.cmd{border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--accent-soft) 0%,#fff 62%);flex-shrink:0;padding:12px 16px 13px}
.cmd-top{display:flex;align-items:flex-start;gap:11px}
.cmd-av{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0}
.cmd-id{flex:1;min-width:0}
.cmd-name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.cmd-link{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
.cmd-link .arr{color:var(--accent);font-weight:700}
.cmd-link .pj{font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px;cursor:pointer}
.cmd-link .pj:hover{border-color:var(--accent);color:var(--accent)}
.cmd-link .ag{color:var(--muted)}
.cmd-actions{display:flex;gap:6px;flex-shrink:0}
.cmd-actions .thread-ctx-btn svg{vertical-align:-2px;margin-right:3px}
/* pipeline stepper */
.cmd-pipe{display:flex;align-items:center;gap:0;margin-top:11px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:3px;overflow:hidden}
.pipe-step{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;border-radius:7px;font-size:10.5px;font-weight:600;color:var(--faint);cursor:default;transition:all .14s;text-align:center}
.cmd-pipe.editable .pipe-step{cursor:pointer}
.cmd-pipe.editable .pipe-step:hover{background:var(--accent-soft);color:var(--accent-ink)}
.pipe-step .pmark{width:16px;height:16px;display:grid;place-items:center;font-size:14px;line-height:1;font-weight:700;color:var(--faint);transition:all .14s}
.pipe-step.passed{color:var(--ink-soft)}
.pipe-step.passed .pmark{color:var(--accent)}
.pipe-step.passed.cur{color:var(--accent-ink)}
.pipe-step.failed{color:var(--r)}
.pipe-step.failed .pmark{color:var(--r)}
.pipe-step.cur .pmark{font-size:16px}
.pipe-line{width:8px;height:2px;background:var(--line-2);flex-shrink:0}
.pipe-line.done{background:var(--accent)}
/* facts row */
.cmd-facts{display:flex;align-items:center;gap:7px;margin-top:10px;flex-wrap:wrap}
.fact-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;font-size:11.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .14s}
.fact-chip:hover{border-color:var(--accent);color:var(--accent)}
.fact-chip svg{width:13px;height:13px;opacity:.8}
.fact-chip.ok{background:var(--g-bg);border-color:transparent;color:var(--g);cursor:default}
.fact-chip.ok:hover{border-color:transparent;color:var(--g)}
.fact-chip.warn{background:var(--a-bg);border-color:transparent;color:var(--a)}
.fact-chip.warn:hover{border-color:var(--a);color:var(--a)}
.fact-chip .fc-k{font-weight:700;font-family:var(--mono);font-size:10px;opacity:.7}
/* next-action smart hint */
.next-hint{display:flex;align-items:center;gap:9px;margin-top:11px;padding:8px 11px;background:var(--ink);color:#fff;border-radius:9px;font-size:12px;font-weight:600}
.next-hint .nh-ic{width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex-shrink:0}
.next-hint .nh-ic svg{width:12px;height:12px;stroke:#fff;stroke-width:2.4}
.next-hint .nh-text{flex:1;min-width:0;line-height:1.35}
.next-hint .nh-text b{color:#fff}
.next-hint .nh-text span{color:rgba(255,255,255,.62);font-weight:500}
.next-hint .nh-act{flex-shrink:0;padding:5px 11px;border:none;background:#fff;color:var(--ink);border-radius:7px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.next-hint .nh-act:hover{background:var(--accent);color:#fff}
/* subthread chip: doc-missing flag */
.st-chip .st-flag{width:6px;height:6px;border-radius:50%;background:var(--a);flex-shrink:0;margin-left:1px}
.st-chip.on .st-flag{background:#ffd27a}
/* task check */
.task-check{flex-shrink:0;width:22px;height:22px;border:2px solid var(--line-2);border-radius:7px;background:var(--surface);display:grid;place-items:center;color:#fff;transition:all .14s}
.task-check.on{background:var(--g);border-color:var(--g)}
.task-check:hover{border-color:var(--accent)}
/* selection data card */
.seldata{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.seldata-cell{text-align:center;padding:12px 6px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.seldata-v{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.seldata-l{font-size:10.5px;color:var(--muted);font-weight:500;margin-top:2px}

.doc-slots{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}

/* ══════════ モバイル最適化（スマホ実機 560px以下）━━ No25対応 ══════════ */
@media(max-width:560px){
  /* 全体レイアウト：サイドバーは引き出し式（920pxの設定を継承）、メインを全幅に */

  .content-narrow{max-width:100%}
  .topbar{padding:11px 13px;gap:10px}
  .topbar h1,.topbar .page-title{font-size:16px}
  .topbar .page-sub{display:none}

  /* KPIカードは2列→内容が多ければ1列 */
  .kpi-grid{grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
  .kpi{padding:12px 13px}
  .kpi .kpi-val{font-size:20px}

  /* テーブルは横スクロールできるように（潰さない） */
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tbl{min-width:560px}
  .tbl th,.tbl td{padding:9px 10px;font-size:12.5px}

  /* ── メッセージ／チャット画面（実クラス対応版） ── */
  /* .conv は720pxで既に1カラム化済み。560pxではさらに高さと余白を最適化 */
  .conv{height:calc(100dvh - 100px);min-height:300px}
  .cand-rail{max-height:120px}                            /* 上部の候補者レールを圧縮 */
  .chat-head{padding:10px 12px;gap:8px}
  .chat-body{padding:14px 10px;gap:7px}
  .composer{padding:9px 10px;gap:7px}
  .composer textarea{font-size:16px;min-height:38px}      /* iOSズーム防止に16px */
  .msg-in,.msg-out{max-width:85%;font-size:13.5px}
  .pin-bar{padding:7px 10px;font-size:11.5px}
  .msg-search-wrap{margin-bottom:10px}

  /* モーダルを画面いっぱいに近づけて操作しやすく */
  .modal{width:calc(100vw - 24px) !important;max-width:calc(100vw - 24px) !important;max-height:88vh;overflow-y:auto}
  .modal-grid{grid-template-columns:1fr !important}
  .modal-actions{flex-wrap:wrap}
  .modal-actions .btn{flex:1;min-width:120px}

  /* ドロワー（候補者詳細など）を全幅に */
  .drawer{width:100vw !important;max-width:100vw !important}

  /* ボタンのタップ領域を確保 */
  .btn{min-height:38px}
  .btn-sm{min-height:32px}

  /* セグメント・タブは横スクロール可 */
  .seg{overflow-x:auto}

  /* 収支グラフなどSVGははみ出さない */
  svg{max-width:100%;height:auto}
}

  function pendingAtFetch(table, key){ const e=_lastFetch[table]; return !!(e && e.pending.has(String(key))); }
  async function syncNow(){
    if(!sb) return;
    clearTimeout(syncT); syncT=null;   // ★重要: タイマーIDを解放。これが残ると isBusy() が永久true になり更新が止まる
    _syncing=true;
    // 各テーブルを独立してupsert。1つ失敗しても他テーブルの同期は継続する。
    // DBに無い列（新機能の列をまだSQLで足していない等）は自動で外して再送する。
    // ※これをしないと、そのテーブルの保存が丸ごと静かに失敗し続ける。
    const one=async (table, rows)=>{
      if(!canWrite(table)) return;                // 書ける役割でなければ送らない（下の canWrite 参照）
      const changed=_changedRows(table, rows);
      if(!changed.length) return;                 // 変更なし → 何も送らない（他端末の更新を壊さない）
      const oc=_ONCONFLICT[table];
      for(let attempt=0; attempt<8; attempt++){
        try{
          // kept  = DBに無い列だけ外したもの（＝記録の基準）
          // payload = さらに「この役割が編集できない列」を外したもの（＝実際に送る内容）
          const kept=_stripMissingCols(table, changed);
          const payload=_stripKanoaCols(table, kept);
          const { error }=await (oc ? sb.from(table).upsert(payload, {onConflict:oc}) : sb.from(table).upsert(payload));
          // ★記録するのは kept。
          //   ・DBに無い列は kept からも外れている → 未送信のまま残り、手元の値が守られる
          //   ・役割で外した列は kept に残す → もともと自分が変えていない列なので、
          //     未送信扱いにすると永久に再送し続けてしまう
          //   外す列が無ければ kept===changed===payload で従来と同じ動きになる。
          if(!error){ markSynced(table, kept); return; }
          const col=_unknownColumn(error);
          if(col && !_isMissingCol(table,col)){ _rememberMissingCol(table, col, (changed[0]||{})[col]); continue; }
          console.warn('[sync]',table,error.message);
          try{ if(typeof notifySyncFailure==='function') notifySyncFailure(table, error.message); }catch(e2){}
          return;
        }
        catch(e){ console.warn('[sync]',table,e&&e.message);
          try{ if(typeof notifySyncFailure==='function') notifySyncFailure(table, e&&e.message); }catch(e2){}
          return; }
      }
    };
    try{
      await one('agencies', DB.agencies.map(toAgency));
      await one('projects', DB.projects.map(toProject));
      await one('assignments', DB.assignments.map(toAssign));
      await one('referrals', DB.referrals.map(toRef));
      await one('messages', DB.messages.map(toMsg));
      await one('members', DB.members.map(toMember));
      await one('tasks', DB.tasks.map(toTask));
      if(DB.invoices&&DB.invoices.length) await one('invoices', DB.invoices.map(toInvoice));
      if(DB.reflog&&DB.reflog.length) await one('reflog', DB.reflog.map(toReflog));
      if(DB.intake&&DB.intake.length) await one('intake', DB.intake.map(toIntake));
      if(DB.notices&&DB.notices.length) await one('notices', DB.notices.map(toNotice));
    } finally { _syncing=false; }
  }
  /* 送客を1件DBへ登録し、結果を返す。DBのユニーク制約（電話番号の重複）を確実に検知するため、
     一括upsert(syncNow)に任せず、その場で書き込んで成否を確認する。
     戻り値: null=成功 / {duplicate:true}=電話番号の重複 / {message}=その他のエラー */
  async function insertReferral(r){
    if(!sb) return null;   // デモ等
    const row=toRef(r);
    for(let attempt=0; attempt<8; attempt++){
      try{
        const _payload=_stripMissingCols('referrals',[row]);
        const { error } = await sb.from('referrals').insert(_payload[0]);
        if(!error){ markSynced('referrals', _payload); return null; }   // 実際に送った内容を記録する
        const msg=(error.message||'')+' '+(error.details||'');
        // 23505 = unique_violation（電話番号の一意制約）
        if(error.code==='23505' || /duplicate key|uniq_referrals_phone/i.test(msg)) return {duplicate:true};
        // DBに無い列は外して再試行（新項目の列を未追加でも登録自体は通す）
        const col=_unknownColumn(error);
        if(col && !_isMissingCol('referrals',col)){ _rememberMissingCol('referrals', col, row[col]); continue; }
        return {message: error.message||'保存に失敗しました'};
      }catch(e){ return {message:(e&&e.message)||'保存に失敗しました'}; }
    }

  /* リアルタイム購読（postgres_changes）。RLSにより自分が見える行の変更のみ届く */
  let _rtCh=null;
  let _rtLastEventAt=0;   // 最後にRealtimeイベントを実際に受信した時刻（healthyの実測判定に使う）
  let _rtProven=false;    // 一度でも実データのRealtimeイベントを受信できたか（anon誤判定の防止）
  async function setRealtimeAuth(token){
    try{
      let tk=token;
      if(!tk){ const {data}=await sb.auth.getSession(); tk=data&&data.session&&data.session.access_token; }

  let _rtStatus='closed', _rtOnChange=null, _rtWatchdog=null;
  function subscribeRealtime(onChange){
    if(!sb) return;
    _rtOnChange=onChange;
    if(_rtCh) return;  // 既存チャンネルがあれば維持（再接続はwatchdog経由でteardown後に呼ばれる）
    try{
      setRealtimeAuth();
      _rtCh = sb.channel('kanoa-realtime-'+Date.now());
      ['messages','referrals','tasks','assignments','projects','agencies','members','documents','login_logs','invoices','reflog'].forEach(tb=>{
        _rtCh.on('postgres_changes', {event:'*', schema:'public', table:tb}, payload=>{ _rtLastEventAt=Date.now(); _rtProven=true; try{ onChange && onChange(tb, payload); }catch(e){} });
      });
      _rtCh.subscribe(status=>{
        const prev=_rtStatus;
        _rtStatus=status;
        // 接続が確立した瞬間に1回だけ最新化する。
        // 接続処理中（購読が張られるまでの数百ms）に他ユーザーが行った変更を取りこぼさないため。
        if(status==='SUBSCRIBED' && prev!=='SUBSCRIBED' && _rtOnChange){
          try{ _rtOnChange('__connected__', null); }catch(e){}
        }
        // 接続が切れた/エラーになったら、古いチャンネルを破棄して次のwatchdogサイクルで再接続する
        if(status==='CHANNEL_ERROR' || status==='TIMED_OUT' || status==='CLOSED'){
          try{ sb.removeChannel(_rtCh); }catch(e){}
          _rtCh=null;
        }
      });
      if(!_rtWatchdog){
        // 30秒ごとに接続状態を点検し、切れていれば自動で繋ぎ直す（スリープ復帰・回線切替対策）
        _rtWatchdog=setInterval(()=>{
          if(DEMO_MODE) return;
          if(!_rtCh || _rtStatus==='CHANNEL_ERROR' || _rtStatus==='TIMED_OUT' || _rtStatus==='CLOSED'){
            if(_rtCh){ try{ sb.removeChannel(_rtCh); }catch(e){} _rtCh=null; }
            subscribeRealtime(_rtOnChange);
          }
        }, 30000);
      }
    }catch(e){ console.warn('realtime subscribe failed', e); _rtCh=null; }
  }
  function forceReconnectRealtime(){
    if(_rtCh){ try{ sb.removeChannel(_rtCh); }catch(e){} _rtCh=null; }
    if(_rtOnChange) subscribeRealtime(_rtOnChange);
  }
  function unsubscribeRealtime(){ try{ if(_rtCh){ sb.removeChannel(_rtCh); _rtCh=null; } if(_rtWatchdog){ clearInterval(_rtWatchdog); _rtWatchdog=null; } _rtStatus='closed'; }catch(e){} }
  /* Realtimeが「実際に変更を届けられている」かを返す。ポーリング停止の判定に使う。

       変更通知が1件も流れてこない。その状態を「正常」と誤判定すると保険ポーリングまで
       止まって完全に沈黙する。そこで「直近に実際のイベントを受信した実績」を必須にする。
     _rtProven: 一度でも実データ受信に成功したか。未実証の間はポーリングを止めない。 */
  function realtimeHealthy(){
    if(!_rtCh || _rtStatus!=='SUBSCRIBED') return false;
    if(!_rtProven) return false;                       // まだ一度も受信実績がない → 信用しない
    return (Date.now()-_rtLastEventAt) < 120000;       // 直近2分に受信があれば健全とみなす
  }
  function realtimeProven(){ return _rtProven; }

  catch(e){ if(typeof toast==='function') toast(`${label}の保存に失敗しました／理由：${String(msg||'不明').slice(0,160)}`); }

    window.syncFailures.push({ at:new Date().toISOString(), table, reason:String(msg||'') });
    if(window.syncFailures.length>30) window.syncFailures.shift();
  }catch(e){}
}

/* ── 希望エリア：都道府県（選択制）──────────────────────────────
   報酬計算(baseSalaryFor)は「東京」「大阪」等を includes で判定するため、
   「東京都」「大阪府」と保存しても正しく一致する（表記ゆれが消え精度が上がる）。 */
const PREFECTURES = [
  '全国勤務',
  '北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県',
  '茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県',
  '新潟県','富山県','石川県','福井県','山梨県','長野県',
  '岐阜県','静岡県','愛知県','三重県',
  '滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県',
  '鳥取県','島根県','岡山県','広島県','山口県',
  '徳島県','香川県','愛媛県','高知県',
  '福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県',
  '海外'
];
/* 選択肢HTML。既存データが一覧に無い表記でも失われないよう、その値を先頭に残す */
function areaOptions(sel){
  const v=(sel||'').trim();
  const known=PREFECTURES.includes(v);
  const extra=(v && !known) ? `<option value="${esc(v)}" selected>${esc(v)}（現在の値）</option>` : '';
  return `<option value="">選択してください</option>${extra}` +
    PREFECTURES.map(p=>`<option value="${esc(p)}"${p===v?' selected':''}>${esc(p)}</option>`).join('');
}
/* 自由入力の地名を都道府県名に寄せる（履歴書の自動読取・CSV取込用）
   例) 「東京」→「東京都」 / 「東京都渋谷区…」→「東京都」 / 「首都圏」→ '' (該当なし) */
function normalizeArea(s){
  const v=String(s||'').trim();
  if(!v) return '';
  if(PREFECTURES.includes(v)) return v;            // 既に正しい表記
  if(/全国/.test(v)) return '全国勤務';
  if(/海外|外国|オーバーシー/i.test(v)) return '海外';
  // 「東京都渋谷区」のように前方一致するもの
  const hit=PREFECTURES.find(p=>p!=='海外' && v.startsWith(p));
  if(hit) return hit;
  // 「東京」「大阪」など“都府県”を省いた表記
  const short=PREFECTURES.find(p=>{
    if(p==='海外'||p==='北海道') return false;
    const base=p.replace(/[都府県]$/,'');
    return v===base || v.startsWith(base);
  });
  if(short) return short;
  if(v.includes('北海道')) return '北海道';
  return '';   // 「首都圏」など特定できないものは空（未選択）にする
}
const STATUS = {
  entry:      {label:'送客済',   cls:'entry'},
  screening:  {label:'書類選考', cls:'screening'},
  interview:  {label:'選考会',   cls:'interview'},
  offer:      {label:'内定',     cls:'offer'},
  joined:     {label:'入社',     cls:'joined'},
  resigned:   {label:'早期退職', cls:'resigned'},
  rejected:   {label:'見送り',   cls:'rejected'},
  declined:   {label:'辞退',     cls:'declined'},
};
const STATUS_ORDER = ['entry','screening','interview','offer','joined','resigned','rejected','declined'];
/* 選考パイプラインの5段階（早期退職・見送り・辞退は「段階」ではないので含めない） */
const PIPELINE_STAGES = ['entry','screening','interview','offer','joined'];
/* 「入社した人か」＝入社 or 早期退職。早期退職者も一度は入社しているので、
   入社者数・成果報酬・請求・返金などの集計では入社扱いにする。 */
function hasJoined(r){ return !!r && (r.status==='joined' || r.status==='resigned'); }
/* 「退職しているか」＝退職記録あり or ステータスが早期退職。在籍中の判定に使う。 */
function isResignedRef(r){ return !!r && (!!r.resigned || r.status==='resigned'); }
/* 不明なステータスでも落ちないようにするフォールバック */
function statusDef(s){ return STATUS[s] || {label:String(s||'—'), cls:'entry'}; }

/* ── 送客のステータスを変える唯一の入口 ────────────────────────────
   候補者カードのステータス欄と、連絡の〇×（pipelineStepper）は同じ `status` を見ている。
   ただし〇×は「どの段階で終わったか」を `failAt` から描くため、
   status だけ変えて failAt を放置すると表示がずれる：
     ・カードで「見送り」にすると 〇× が全部空白になる（failAt が未設定のため）
     ・以前の ✕ が残り、実際とは違う段階に ✕ が付いたままになる
   ステータスを変える場所は必ずこの関数を通し、両方を同時に整える。
   failStage を渡すと、その段階で終わったものとして上書きする（〇×の✕クリック用）。 */
function setRefStatus(r, s, failStage){
  if(!r || !s) return;
  const prev = r.status;
  r.status = s;
  if(s==='rejected' || s==='declined'){
    if(failStage && PIPELINE_STAGES.indexOf(failStage)>=0){ r.failAt = failStage; }
    else if(PIPELINE_STAGES.indexOf(r.failAt||'')<0){
      // 終わった段階＝直前にいた段階。パイプライン外から来たときは送客済とみなす
      r.failAt = PIPELINE_STAGES.indexOf(prev)>=0 ? prev : 'entry';
    }
  } else {
    r.failAt = null;
  }
  if(s==='joined' && !r.joined) r.joined = todayISO();
}

/* ════════════════════ 支払ステータス（送客1件ごと） ════════════════════
   選考ステータスとは別軸で、紹介料の入出金がどこまで進んだかを持つ。
   未設定（''）のときは請求・返金の状態から自動判定する（payStatusOf）。 */
const PAY_STATUS = {
  pending:  { label:'支払待ち',       color:'#B45309', bg:'#FDF2E2' },
  paid:     { label:'紹介料支払済み', color:'#15803D', bg:'#E8F6EE' },
  refunded: { label:'返金済み',       color:'#BE123C', bg:'#FDEEF1' },
};
const PAY_ORDER = ['pending','paid','refunded'];
/* 手入力があればそれを、無ければ請求書の状態から自動判定する */
function payStatusOf(r){
  if(!r) return '';
  if(r.payStatus && PAY_STATUS[r.payStatus]) return r.payStatus;
  const invs = (DB.invoices||[]).filter(v=>(v.items||[]).some(it=>it.refId===r.id));
  if(invs.some(v=>v.kind==='refund' && v.status==='paid')) return 'refunded';
  if(invs.some(v=>v.kind!=='refund' && v.status==='paid')) return 'paid';
  if(hasJoined(r) && refEarning(r)>0) return 'pending';
  return '';
}
function payStatusBadge(r, style){
  const k=payStatusOf(r); const x=PAY_STATUS[k]; if(!x) return '';
  return `<span class="tag" style="background:${x.bg};color:${x.color};font-weight:600;${style||''}">${x.label}</span>`;
}

/* lookups */
const agency = id => DB.agencies.find(a=>a.id===id);
function agCode(a){ const ag = typeof a==='string'?agency(a):a; return (ag&&ag.code)||(ag&&ag.id)||a; }
const project = id => DB.projects.find(p=>p.id===id);
const assignment = (pj,ag) => DB.assignments.find(x=>x.pj===pj && x.ag===ag);
function effReward(pj,ag){
  // 案件が見つからない（削除済み・未同期）場合でも落ちないよう0を返す
  const p=project(pj);
  if(!p) return { ref:0, suc:0 };
  return { ref:+p.referralReward||0, suc:+p.successReward||0 };
}
/* 楽天：基本給はエリアで変わる。基本給×14×30%＝KANOA受領、その85%＝各社報酬 */
function baseSalaryFor(r){
  const p=project(r.pj); const cfg=p&&p.baseSalaryByArea; if(!cfg) return 0;
  let area=(r.area||r.address||'')+'';
  if(area.includes('全国')) area='東京都';   // 全国勤務は東京都と同じ基本給を適用
  for(const a of (cfg.areas||[])){ if((a.match||[]).some(m=>area.includes(m))) return a.salary; }
  return cfg.default||0;
}
function kanoaRevenueFor(r){ const base=baseSalaryFor(r); return base?Math.round(base*14*0.30):0; }   // KANOA受領額
function successRewardFor(r){
  const p=project(r.pj);
  if(p && p.rewardModel==='rakuten'){ const kr=kanoaRevenueFor(r); return kr?Math.round(kr*0.85):0; } // 各社報酬＝KANOA受領×85%
  return effReward(r.pj,r.ag).suc;
}
function rewardBreakdown(r, forAgency){
  const p=project(r.pj); if(!(p&&p.rewardModel==='rakuten')) return '';
  const base=baseSalaryFor(r); const kr=kanoaRevenueFor(r); const fee=successRewardFor(r);
  const areaTxt=(r.area||r.address||'').trim();
  return `<div class="reward-calc">
    <div class="rc-title">成果報酬の自動計算（楽天・エリア準拠）</div>
    <div class="rc-row"><span>エリア基本給${areaTxt?`（${esc(areaTxt)}）`:''}</span><b>${base?yen(base):'エリア未設定'}</b></div>
    ${forAgency?'':`<div class="rc-row"><span>KANOA受領（基本給×14×30%）</span><b>${yen(kr)}</b></div>`}
    <div class="rc-row hl"><span>${forAgency?'御社の成果報酬':'各社へ振込（×85%）'}</span><b>${yen(fee)}</b></div>
    <div class="rc-note">希望エリアの基本給で自動計算（入社確定で確定）。</div>
  </div>`;
}
/* referrals visible to an agency = published projects */
function agencyProjects(agId){
  return DB.projects.filter(p=>{
    const a=assignment(p.id,agId); return a && a.published;
  });
}
function projectReferrals(pj){ return DB.referrals.filter(r=>r.pj===pj); }
function agencyReferrals(ag){ return DB.referrals.filter(r=>r.ag===ag); }

/* earnings: per (referral) -> referral reward always; success reward when joined */
function refEarning(r){
  const e = effReward(r.pj, r.ag);
  let total = 0;
  const p = project(r.pj);
  if(!p) return 0;
  if(r.status!=='rejected'){
    if(p.rewardType==='referral' || p.rewardType==='both') total += e.ref;
  }
  if(hasJoined(r)){   // 早期退職者も一度は入社しているので成功報酬は発生している
    if(p.rewardType==='success' || p.rewardType==='both') total += successRewardFor(r);
  }
  return total;
}
function splitEarn(refs){
  let confirmed=0, pipeline=0;
  refs.forEach(r=>{
    const p=project(r.pj), e=effReward(r.pj,r.ag);
    if(!p || r.status==='rejected') return;
    if(p.rewardType==='referral'||p.rewardType==='both') confirmed+=e.ref;
    if(p.rewardType==='success'||p.rewardType==='both'){
      const suc=successRewardFor(r);
      if(hasJoined(r)) confirmed+=suc; else pipeline+=suc;
    }
  });
  return {confirmed, pipeline};
}

function resolveAgency(input){
  const v=(input||'').trim(); if(!v) return null;
  const norm=s=>String(s).replace(/株式会社|合同会社|\s/g,'').toLowerCase();
  return DB.agencies.find(a=>(a.email||'').toLowerCase()===v.toLowerCase())
      || agency(v.toUpperCase())
      || DB.agencies.find(a=>a.name===v)
      || DB.agencies.find(a=>norm(a.name)===norm(v));
}
function recordLogin(agId, ok, via){
  if(!DB.logins) DB.logins=[];
  const entry={id:uid('L'),ag:agId,at:nowTS(),ok:!!ok,via:via||'パスワード'};
  DB.logins.unshift(entry);
  // Supabase本番時はlogin_logsテーブルへinsert
  if(!DEMO_MODE && typeof SUPA!=='undefined'){
    try{ SUPA.insertLoginLog(agId, ok, via||'パスワード'); }catch(e){}
  }
  save();
}
function lastLogin(agId){ return (DB.logins||[]).filter(l=>l.ag===agId && l.ok).sort((a,b)=>a.at<b.at?1:-1)[0]; }
function doLoginAgency(id, opts){
  const a = typeof id==='object'?id:(agency(id)||resolveAgency(id));
  const err=m=>{ const el=document.getElementById('liErr'); if(el) el.textContent=m; };
  if(!a){ err('パートナーIDまたは会社名が見つかりません'); return; }
  if(a.status==='pending'){ err('この申請はまだ承認待ちです'); return; }
  if(a.status==='suspended'){ err('このアカウントは停止されています'); return; }
  if(checkLoginLock(a.id)){ err('ログイン試行が多すぎます。5分後に再試行してください'); recordLogin(a.id,false,'ロック中'); return; }
  if(opts && opts.checkPw && a.pw && (document.getElementById('liPw').value!==a.pw)){
    recordLoginFail(a.id);
    const f=_loginFails[a.id]; const remain=f?Math.max(0,5-f.count):0;
    recordLogin(a.id,false,opts.via||'パスワード');
    err('パスワードが違います'+(remain>0?`（残り${remain}回失敗でロック）`:' — アカウントがロックされました')); return;
  }
  clearLoginFails(a.id);
  recordLogin(a.id, true, (opts&&opts.via)||'パスワード');
  S = {role:'agency', agencyId:a.id, view:(a.special==='recore'?'recore':'home')};
  enterApp();
}

/* ユーザーに見えない静かな再描画：スクロール位置・チャット位置・フォーカスを保ったまま内容だけ差し替える。
   リアルタイム更新（commitFresh）から呼ぶことで、画面のブレ・チラつきを防ぐ。 */
let _rerendering=false;
let _ghostActive=false;   // ghost描画中は本物の#contentが一時的にid退避される。この間の直接再描画を防ぐ
function silentRerender(){
  if(_rerendering) return;   // 再入防止：描画中の再描画要求は無視（無限ループ・スタックオーバーフロー対策）
  _rerendering=true;
  try{ _silentRerenderInner(); }
  catch(e){ console.warn('[silentRerender]', e && e.message); }
  finally { _rerendering=false; }
}
function _silentRerenderInner(){
  const real = document.getElementById('content');
  if(!real) return;

  // 状態を保全
  const cScroll = real.scrollTop;
  const chatBody = real.querySelector('.chat-body');
  const chatScroll = chatBody ? chatBody.scrollTop : null;
  const railEl = real.querySelector('.cand-rail-list');
  const railScroll = railEl ? railEl.scrollTop : null;
  const chatAtBottom = chatBody ? (chatBody.scrollHeight - chatBody.scrollTop - chatBody.clientHeight < 40) : false;
  const ae = document.activeElement;
  const focusId = ae && ae.id ? ae.id : null;
  const selStart = (ae && 'selectionStart' in ae) ? ae.selectionStart : null;
  const selEnd = (ae && 'selectionEnd' in ae) ? ae.selectionEnd : null;

  // ── オフスクリーンで描画して、HTMLが変わったときだけ本物に反映する ──
  // 各ビューは document.getElementById('content') に書き込むので、
  // 一時的に本物のcontentを退避し、同じidを持つ影武者に差し替えて描画を捕捉する。
  const parent = real.parentNode;
  const ghost = document.createElement('div');
  ghost.id = 'content';
  ghost.className = 'content';
  // 画面に出さない（レイアウトにも影響させない）
  ghost.style.cssText = 'position:absolute;left:-99999px;top:0;width:'+real.clientWidth+'px;visibility:hidden';
  real.id = '__content_real';           // 本物のidを一時的に外す
  // ghostは必ず本物より「前」に挿入する。ビューが2段階描画（骨組み→getElementByIdで内側を描画）のとき、
  // getElementByIdは文書順で先の要素を返すため、後ろに置くと内側の描画が本物側に流れ、
  // ghostに残った空の骨組みで本物を上書きしてしまう（送客一覧がドロワーを閉じた瞬間に消えるバグの原因）。
  parent.insertBefore(ghost, real);
  _ghostActive=true;
  let nextHTML=null;
  try{
    (VIEW_MAP[S.view]||VIEW_MAP.overview)();   // ghost(#content)に描画される
    nextHTML = ghost.innerHTML;
  } catch(e){
    // 描画に失敗しても、本物の中身は絶対に壊さない（ホワイトアウトの根絶）
    console.warn('[silentRerender:view]', e && e.message);
    nextHTML = null;
  } finally {
    if(ghost.parentNode) ghost.parentNode.removeChild(ghost);
    real.id = 'content';                 // 本物のidを必ず戻す
    _ghostActive=false;
  }

  // 描画に失敗した、または中身が同じなら実DOMを一切触らない → 揺れ・チラつき・白画面ゼロ
  if(nextHTML===null || nextHTML === real.innerHTML) return;

  // 変わったときだけ反映
  real.className = 'content';
  real.style.padding='';
  real.innerHTML = nextHTML;
  real.scrollTop = cScroll;
  const newChat = real.querySelector('.chat-body');
  if(newChat && chatScroll!=null){ newChat.scrollTop = chatAtBottom ? newChat.scrollHeight : chatScroll; }
  const newRail = real.querySelector('.cand-rail-list');
  if(newRail && railScroll!=null) newRail.scrollTop = railScroll;
  if(focusId){ const el=document.getElementById(focusId); if(el){ try{ el.focus({preventScroll:true}); if(selStart!=null && 'setSelectionRange' in el) el.setSelectionRange(selStart, selEnd); }catch(e){} } }
}

/* 入力中（msgInput にフォーカス）でも、メッセージ表示部(.chat-body)と
