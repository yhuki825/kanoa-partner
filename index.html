sessionStorage.getItem('kanoa_last_view');\n    if(lv && navFor(S.role) && navFor(S.role).some(n=>n.v===lv)) S.view=lv;\n  }catch(e){}\n  document.getElementById('loginWrap').style.display='none';\n  document.getElementById('app').classList.add('on');\n  const isK = S.role==='kanoa';\n  document.getElementById('sideRole').textContent = isK?'ADMIN':'AGENCY';\n  const nav = document.getElementById('nav');\n  nav.innerHTML = navFor(S.role).map(n=>`<button class=\"nav-item\" data-act=\"nav\" data-view=\"${n.v}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${n.icon}</svg>${n.label}<span class=\"nav-count\" data-navcount=\"${n.v}\"></span></button>`).join('');\n  if(isK){\n    document.getElementById('userAvatar').textContent='K';\n    document.getElementById('userName').textContent='KANOA 管理者';\n    document.getElementById('userSub').textContent='全案件・全パートナー';\n  } else {\n    const a=agency(S.agencyId);\n    document.getElementById('userAvatar').textContent=(a.name||'A').slice(0,1);\n    document.getElementById('userName').textContent=a.name;\n    document.getElementById('userSub').textContent=agCode(a)+(a.contact?' · '+a.contact:'');\n  }\n  go(S.view);\n  const sd=document.getElementById('sideDev'); if(sd) sd.style.display=(DEMO_MODE && S.role==='kanoa')?'':'none';\n  const sw=document.getElementById('switchAcct'); if(sw) sw.style.display=(S.role==='kanoa')?'':'none';\n  startAutoRefresh();\n}\nfunction go(view){\n  S.view = view;\n  try{ sessionStorage.setItem('kanoa_last_view', view); }catch(e){}\n  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('on', n.dataset.view===view));\n  closeSide();\n  render();\n  updateNavCounts();\n}\nfunction updateNavCounts(){\n  const set=(v,n,alert)=>{ const el=document.querySelector(`[data-navcount=\"${v}\"]`); if(el){ el.textContent=n||''; el.classList.toggle('alert', !!alert && !!n); } };\n  ensureInvoices();\n  if(S.role==='kanoa'){\n    set('projects', DB.projects.length);\n    const pend=DB.agencies.filter(a=>a.status==='pending').length;\n    set('agencies', pend||'', true);\n    { const unseen=DB.referrals.filter(x=>x.seenK===false).length;\n      set('referrals', unseen||DB.referrals.length, unseen>0); }\n    set('messages', unreadKanoa()||'', true);\n    set('intake', intakeCount()||'', intakeCount()>0);\n    set('tasks', openTaskCount()||'', true);\n    // 請求: 提出済(受理/差戻し待ち)の件数を要対応バッジに\n    const invPend=DB.invoices.filter(v=>v.status==='submitted').length;\n    set('invoices', invPend||'', true);\n    // 退職・返金: 「今やるべきこと」の件数（KANOA）\n    set('refunds', resignTodos().length||'', true);\n  } else {\n    set('pjlist', agencyProjects(S.agencyId).length);\n    set('myrefs', agencyReferrals(S.agencyId).length);\n    set('intake', intakeCount()||'', intakeCount()>0);\n    set('messages', unreadAgency(S.agencyId)||'', true);\n    set('tasks', openTaskCount()||'', true);\n    // 請求: 差し戻された請求(再提出が必要)の件数\n    const myRej=DB.invoices.filter(v=>v.agId===S.agencyId && v.status==='rejected').length;\n    set('invoices', myRej||'', true);\n    // 退職・返金: 「今やるべきこと」の件数（パートナー）\n    set('refunds', resignTodos().length||'', true);\n  }\n}\n\n/* ════════════════════ RENDER ROUTER ════════════════════ */\nconst VIEW_MAP = {\n  overview:()=>viewOverview(), projects:()=>viewProjects(), agencies:()=>viewAgencies(),\n  referrals:()=>viewReferrals(), earnings:()=>viewEarnings(),\n  pjlist:()=>viewAgencyProjects(), myrefs:()=>viewMyRefs(), myearn:()=>viewMyEarn(),\n  projectDetail:()=>viewProjectDetail(), pjDetailAgency:()=>viewAgencyProjectDetail(),\n  messages:()=>viewMessages(), tasks:()=>viewTasks(), members:()=>viewMembers(),\n  accounts:()=>viewAccounts(), loginlogs:()=>viewLoginLogs(),\n  invoices:()=>viewInvoices(),\n  refunds:()=>viewRefunds(),\n  posthire:()=>viewPostHire(),\n  finance:()=>viewFinance(),\n  intake:()=>viewIntake(),\n  recore:()=>viewRecore(),\n  subpartners:()=>viewSubPartners(),\n  subhome:()=>viewSubHome(),\n  kanoarecore:()=>viewKanoaRecore(),\n};\nfunction render(){\n  const c = document.getElementById('content');\n  c.className = 'content';\n  c.style.padding='';\n  (VIEW_MAP[S.view]||VIEW_MAP.overview)();\n  c.classList.remove('anim'); void c.offsetWidth; c.classList.add('anim');\n}\n/* ユーザーに見えない静かな再描画：スクロール位置・チャット位置・フォーカスを保ったまま内容だけ差し替える。\n   リアルタイム更新（commitFresh）から呼ぶことで、画面のブレ・チラつきを防ぐ。 */\nlet _rerendering=false;\nfunction silentRerender(){\n  if(_rerendering) return;   // 再入防止：描画中の再描画要求は無視（無限ループ・スタックオーバーフロー対策）\n  _rerendering=true;\n  try{ _silentRerenderInner(); } finally { _rerendering=false; }\n}\nfunction _silentRerenderInner(){\n  const real = document.getElementById('content');\n  if(!real) return;\n\n  // 状態を保全\n  const cScroll = real.scrollTop;\n  const chatBody = real.querySelector('.chat-body');\n  const chatScroll = chatBody ? chatBody.scrollTop : null;\n  const chatAtBottom = chatBody ? (chatBody.scrollHeight - chatBody.scrollTop - chatBody.clientHeight < 40) : false;\n  const ae = document.activeElement;\n  const focusId = ae && ae.id ? ae.id : null;\n  const selStart = (ae && 'selectionStart' in ae) ? ae.selectionStart : null;\n  const selEnd = (ae && 'selectionEnd' in ae) ? ae.selectionEnd : null;\n\n  // ── オフスクリーンで描画して、HTMLが変わったときだけ本物に反映する ──\n  // 各ビューは document.getElementById('content') に書き込むので、\n  // 一時的に本物のcontentを退避し、同じidを持つ影武者に差し替えて描画を捕捉する。\n  const parent = real.parentNode;\n  const ghost = document.createElement('div');\n  ghost.id = 'content';\n  ghost.className = 'content';\n  // 画面に出さない（レイアウトにも影響させない）\n  ghost.style.cssText = 'position:absolute;left:-99999px;top:0;width:'+real.clientWidth+'px;visibility:hidden';\n  real.id = '__content_real';           // 本物のidを一時的に外す\n  parent.appendChild(ghost);\n  let nextHTML='';\n  try{\n    (VIEW_MAP[S.view]||VIEW_MAP.overview)();   // ghost(#content)に描画される\n    nextHTML = ghost.innerHTML;\n  } finally {\n    parent.removeChild(ghost);\n    real.id = 'content';                 // 本物のidを戻す\n  }\n\n  // 中身が同じなら実DOMを一切触らない → 揺れ・チラつきゼロ\n  if(nextHTML === real.innerHTML) return;\n\n  // 変わったときだけ反映\n  real.className = 'content';\n  real.style.padding='';\n  real.innerHTML = nextHTML;\n  real.scrollTop = cScroll;\n  const newChat = real.querySelector('.chat-body');\n  if(newChat && chatScroll!=null){ newChat.scrollTop = chatAtBottom ? newChat.scrollHeight : chatScroll; }\n  if(focusId){ const el=document.getElementById(focusId); if(el){ try{ el.focus({preventScroll:true}); if(selStart!=null && 'setSelectionRange' in el) el.setSelectionRange(selStart, selEnd); }catch(e){} } }\n}\n\n/* ════════════════════ 自動更新・リアルタイム（本番のみ） ════════════════════ */\nlet _pollT=null, _msgT=null, _rtDebounce=null;\nfunction startAutoRefresh(){\n  if(DEMO_MODE) return;\n  stopAutoRefresh();\n  _pollT=setInterval(applyRefresh, 5000);\n  _msgT=setInterval(pollMessages, 1000);\n  startRealtime();\n  if(!_visWired){\n    _visWired=true;\n    // タブが再びアクティブになった瞬間、即座に再接続＆最新化する（ブラウザのバックグラウンド間引き対策）\n    document.addEventListener('visibilitychange', ()=>{\n      if(document.visibilityState==='visible' && !DEMO_MODE && S.role){\n        SUPA.forceReconnectRealtime && SUPA.forceReconnectRealtime();\n        applyRefresh(); pollMessages();\n      }\n    });\n    // 回線が復帰した瞬間も同様に即時再同期（Wi-Fi切替・機内モード解除など対策）\n    window.addEventListener('online', ()=>{\n      if(!DEMO_MODE && S.role){ SUPA.forceReconnectRealtime && SUPA.forceReconnectRealtime(); applyRefresh(); pollMessages(); }\n    });\n  }\n}\nlet _visWired=false;\nfunction stopAutoRefresh(){ if(_pollT){ clearInterval(_pollT); _pollT=null; } if(_msgT){ clearInterval(_msgT); _msgT=null; } stopRealtime(); }\nfunction startRealtime(){\n  if(DEMO_MODE) return;\n  SUPA.subscribeRealtime((tb)=>{ if(tb==='messages'){ pollMessages(); } clearTimeout(_rtDebounce); _rtDebounce=setTimeout(applyRefresh, 250); }); // 変更を即反映\n}\nfunction stopRealtime(){ try{ SUPA.unsubscribeRealtime(); }catch(e){} clearTimeout(_rtDebounce); }\n\nlet _msgBusy=false;\n/* 連絡だけを高速にポーリングして即・通知＆反映（軽量・1クエリ） */\nasync function pollMessages(){\n  if(DEMO_MODE || !S.role || _msgBusy) return;\n  if(SUPA.isBusy && SUPA.isBusy()) return;\n  _msgBusy=true;\n  try{\n    const freshMsgs=await SUPA.loadMessages();\n    if(!freshMsgs) return;\n    // 現DBのmessagesだけを差し替えたスナップショットを作り、共通のcommitFreshを通す。\n    // これにより applyRefresh と同じ再描画ルール・競合防止が効く。\n    const snapshot={...DB, messages:freshMsgs};\n    commitFresh(snapshot);\n  }catch(e){}\n  finally{ _msgBusy=false; }\n}\nfunction dataSig(d){\n  if(!d) return '';\n  // 全テーブルの全フィールドをJSON化して指紋を作る。\n  // フィールドやテーブルを将来追加しても、自動的に変更検知の対象になる（漏れゼロ）。\n  // 同期対象の全テーブルを列挙。新テーブルを足したらここに1語追加するだけ。\n  const TABLES=['referrals','projects','assignments','agencies','messages','tasks','members','documents','invoices','reflog','logins','intake'];\n  const parts=[];\n  for(const t of TABLES){\n    const arr=d[t]||[];\n    // JSON.stringify で各行の全フィールドを反映。順序差の影響を避けるため件数も付与。\n    try{ parts.push(t+':'+arr.length+':'+JSON.stringify(arr)); }\n    catch(e){ parts.push(t+':'+arr.length); }\n  }\n  return parts.join('##');\n}\nfunction countMyIncoming(db){ // 相手から来た未読の件数（自分宛て）\n  const viewer=S.role==='kanoa'?'kanoa':'agency', other=viewer==='kanoa'?'agency':'kanoa';\n  let n=0; for(const m of (db.messages||[])){ if(m.deleted) continue; if(m.from===other && !m.read){ if(viewer==='kanoa'||m.ag===S.agencyId) n++; } } return n;\n}\nfunction myIncomingTaskIds(db){ // 自分に依頼された未完タスクのID集合\n  const me=meId(); const s=new Set();\n  for(const t of (db.tasks||[])){ if((t.owner||'kanoa')===me && (t.from||t.owner)!==me && !t.done) s.add(t.id); } return s;\n}\nfunction myDoneAssignedIds(db){ // 自分が依頼し、完了済みになったタスクのID集合\n  const me=meId(); const s=new Set();\n  for(const t of (db.tasks||[])){ if((t.from||t.owner)===me && (t.owner||'kanoa')!==me && t.done) s.add(t.id); } return s;\n}\nfunction diffNew(setNew, setOld){ let n=0; setNew.forEach(id=>{ if(!setOld.has(id)) n++; }); return n; }\nfunction flashNav(view){\n  const el=document.querySelector(`[data-navcount=\"${view}\"]`); if(el) el.classList.add('alert');\n  const item=document.querySelector(`.nav-item[data-view=\"${view}\"]`); if(item){ item.classList.remove('nav-bump'); void item.offsetWidth; item.classList.add('nav-bump'); }\n}\nfunction notifyNewMessages(n){ toast(`新しい連絡が ${n}件 届きました`); flashNav('messages'); }\nfunction notifyNewTasks(n){ toast(`新しいタスク依頼が ${n}件 あります`); flashNav('tasks'); }\nfunction notifyTaskDone(n){ toast(`依頼したタスクが ${n}件 完了しました`); flashNav('tasks'); }\nlet _refreshing=false;\n/* ── 取得した最新データを DB へ反映し、必要なら再描画する共通処理 ──\n   全体更新（applyRefresh）と連絡だけの更新（pollMessages）が、\n   まったく同じ再描画ルールを通ることで、DB書き換えの競合と取りこぼしを無くす。 */\nlet _committing=false;\nfunction commitFresh(fresh, opts){\n  opts=opts||{};\n  if(_committing) return false;   // 再入防止（無限ループ・スタックオーバーフロー対策）\n  // 変化検知（全フィールドJSON比較）。差分ゼロなら一切さわらない\n  if(dataSig(fresh)===dataSig(DB)) return false;\n  _committing=true;\n  try{ return _commitFreshInner(fresh, opts); } finally { _committing=false; }\n}\nfunction _commitFreshInner(fresh, opts){\n  opts=opts||{};\n  // 通知計算（DB置換の前に差分を取る）\n  const newMsgs=countMyIncoming(fresh)-countMyIncoming(DB);\n  const newTasks=diffNew(myIncomingTaskIds(fresh), myIncomingTaskIds(DB));\n  const doneTasks=diffNew(myDoneAssignedIds(fresh), myDoneAssignedIds(DB));\n  // 連絡入力欄の下書き・カーソルを保全\n  const ta=document.getElementById('msgInput');\n  const draft=ta?ta.value:null, caret=ta?ta.selectionStart:null, focused=document.activeElement===ta;\n  // DBを丸ごと置き換え（messages含む全テーブル。部分置換をやめて競合を根絶）\n  DB=fresh; invalidateUnread();\n  // 再描画してよいか：モーダル/ドロワー中・フォーム入力中（連絡欄は除く）は保留\n  const busy = document.querySelector('.modal.on, .drawer.on, .overlay.on');\n  const aeEl=document.activeElement;\n  const typing = aeEl && /^(INPUT|TEXTAREA|SELECT)$/.test(aeEl.tagName) && aeEl.id!=='msgInput';\n  if(!busy && !typing){\n    silentRerender();  // 見えない静かな更新（スクロール・フォーカス保持、アニメなし）\n    if(draft!=null){ const mi=document.getElementById('msgInput'); if(mi && document.activeElement!==mi){ mi.value=draft; if(focused){ mi.focus({preventScroll:true}); try{ mi.setSelectionRange(caret,caret); }catch(e){} } } }\n  } else {\n    _pendingRerender=true;  // 閉じた瞬間に反映\n  }\n  updateNavCounts();\n  if(newMsgs>0) notifyNewMessages(newMsgs);\n  if(newTasks>0) notifyNewTasks(newTasks);\n  if(doneTasks>0) notifyTaskDone(doneTasks);\n  return true;\n}\nasync function applyRefresh(){\n  if(DEMO_MODE || !S.role || _refreshing) return;\n  if(SUPA.isBusy && SUPA.isBusy()) return;   // ローカル変更の同期待ち中は待つ（送信中データの上書き防止）\n  _refreshing=true;\n  try{\n    const fresh=await SUPA.loadAll();\n    if(fresh) commitFresh(fresh);\n  }catch(e){}\n  finally{ _refreshing=false; }\n}\nlet _pendingRerender=false;\n/* モーダル/ドロワーを閉じた直後に、バックグラウンドで溜まっていた更新を画面へ反映 */\nfunction flushPendingRerender(){\n  if(!_pendingRerender) return;\n  _pendingRerender=false;\n  try{ silentRerender(); updateNavCounts(); }catch(e){}\n}\nfunction setHeader(title, sub, actions){\n  document.getElementById('pageTitle').textContent = title;\n  document.getElementById('pageSub').textContent = sub||'';\n  document.getElementById('pageActions').innerHTML = actions||'';\n}\n\n/* ───── shared bits ───── */\nfunction statusBadge(s){ const st=STATUS[s]; return `<span class=\"badge bd-${st.cls}\">${st.label}</span>`; }\nfunction statusSelect(s, attrs){\n  return `<select class=\"icell stsel st-${STATUS[s].cls}\" ${attrs}>`+\n    STATUS_ORDER.map(k=>`<option value=\"${k}\" ${k===s?'selected':''}>${STATUS[k].label}</option>`).join('')+`</select>`;\n}\nfunction kpi(label,val,dotColor,delta){\n  return `<div class=\"kpi\"><div class=\"kpi-label\">${dotColor?`<span class=\"kpi-dot\" style=\"background:${dotColor}\"></span>`:''}${label}</div>\n    <div class=\"kpi-val\">${val}</div>${delta?`<div class=\"kpi-delta\">${delta}</div>`:''}</div>`;\n}\nfunction funnel(refs){\n  const c = {}; STATUS_ORDER.forEach(s=>c[s]=0); refs.forEach(r=>c[r.status]++);\n  const active = refs.filter(r=>r.status!=='rejected').length || 1;\n  return STATUS_ORDER.filter(s=>s!=='rejected').map(s=>{\n    const pct = Math.round(c[s]/active*100);\n    return `<div style=\"margin-bottom:11px\">\n      <div style=\"display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px\">\n        <span style=\"font-weight:600\">${STATUS[s].label}</span>\n        <span class=\"mono\" style=\"color:var(--muted)\">${c[s]}</span></div>\n      <div class=\"sum-bar\"><span style=\"width:${pct}%;background:var(--${STATUS[s].cls==='joined'?'g':STATUS[s].cls==='entry'?'gray':STATUS[s].cls==='screening'?'b':STATUS[s].cls==='interview'?'a':'v'})\"></span></div>\n    </div>`;\n  }).join('');\n}\n\n/* ════════════════════ KANOA: OVERVIEW ════════════════════ */\nfunction viewOverview(){\n  setHeader('概要', 'KANOA 案件配信の全体サマリー');\n  const refs = DB.referrals;\n  const sent = refs.filter(r=>r.status!=='rejected').length;\n  const joined = refs.filter(r=>r.status==='joined').length;\n  const earn = refs.reduce((s,r)=>s+refEarning(r),0);\n  const pending = DB.agencies.filter(a=>a.status==='pending').length;\n  const newEntries = refs.filter(r=>r.status==='entry').length;\n  const upcoming = refs.filter(r=>r.session && r.session!=='—' && !['joined','rejected'].includes(r.status)).length;\n  const unread = unreadKanoa();\n  const openTasksN = openTaskCount();\n  const todo = newEntries+unread+openTasksN;\n  const c = document.getElementById('content');\n  const todoItem=(icon,label,n,act,view,extra)=> n?`<div class=\"info-row\" style=\"cursor:pointer\" data-act=\"${act}\" ${view?`data-view=\"${view}\"`:''} ${extra||''}>\n      <div style=\"width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0\">${icon}</div>\n      <div class=\"info-val\">${label}</div><span class=\"unread-dot\" style=\"background:var(--ink)\">${n}</span></div>`:'';\n  c.innerHTML = `\n    <div class=\"content-narrow\">\n    <div class=\"kpi-grid\">\n      ${kpi('公開中の案件', DB.projects.filter(p=>p.status==='open').length+'<span class=\"unit\">件</span>', 'var(--g)')}\n      ${kpi('提携パートナー', DB.agencies.filter(a=>a.status==='active').length+'<span class=\"unit\">社</span>', 'var(--accent)')}\n      ${kpi('総送客数', sent+'<span class=\"unit\">名</span>', 'var(--b)')}\n      ${kpi('成約（入社）', joined+'<span class=\"unit\">名</span>', 'var(--g)')}\n      ${kpi('成果報酬 発生額', '<span class=\"yen\">¥</span>'+earn.toLocaleString('ja-JP'), 'var(--ink)')}\n    </div>\n    ${todo?`<div class=\"sect\"><div class=\"sect-head\"><div class=\"sect-title\">要対応</div><span class=\"tag tag-pending\">${todo}件</span></div>\n      <div class=\"panel\">\n        ${todoItem('<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z\"/><path d=\"M14 2v6h6\"/></svg>',`<strong style=\"font-weight:600\">書類選考待ち</strong>の新規送客が ${newEntries} 名`,newEntries,'nav','referrals')}\n        ${todoItem('<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z\"/></svg>',`パートナーからの<strong style=\"font-weight:600\">未読メッセージ</strong>が ${unread} 件`,unread,'nav','messages')}\n        ${todoItem('<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M9 11l3 3L22 4\"/><path d=\"M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11\"/></svg>',`<strong style=\"font-weight:600\">未完了タスク</strong>が ${openTasksN} 件`,openTasksN,'nav','tasks')}\n      </div></div>`:''}\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px\" id=\"ovGrid\">\n      <div class=\"sect\">\n        <div class=\"sect-head\"><div class=\"sect-title\">送客パイプライン</div></div>\n        <div class=\"panel panel-pad\">${funnel(refs)}</div>\n      </div>\n      <div class=\"sect\">\n        <div class=\"sect-head\"><div class=\"sect-title\">最近の動き</div></div>\n        <div class=\"panel\">\n          ${DB.activity.slice(0,8).map(a=>`<div class=\"info-row\"><div class=\"info-val\"><strong style=\"font-weight:600\">${esc(a.action)}</strong> · ${esc(a.detail)}<div class=\"cell-sub mono\" style=\"margin-top:2px\">${esc(a.ts)} — ${esc(a.actor)}</div></div></div>`).join('')}\n        </div>\n      </div>\n    </div>\n    <div class=\"sect\" style=\"margin-top:8px\">\n      <div class=\"sect-head\"><div class=\"sect-title\">パートナー別サマリー</div>\n        <button class=\"btn btn-ghost btn-sm\" data-act=\"nav\" data-view=\"earnings\">成果を詳しく見る →</button></div>\n      <div class=\"panel tbl-wrap\">${agencySummaryTable()}</div>\n    </div>\n    </div>`;\n  if(window.innerWidth<760){ const g=document.getElementById('ovGrid'); if(g) g.style.gridTemplateColumns='1fr'; }\n}\nfunction agencySummaryTable(){\n  const rows = DB.agencies.filter(a=>a.status==='active').map(a=>{\n    const rs = agencyReferrals(a.id);\n    const sent = rs.filter(r=>r.status!=='rejected').length;\n    const joined = rs.filter(r=>r.status==='joined').length;\n    const earn = rs.reduce((s,r)=>s+refEarning(r),0);\n    return {a, sent, joined, earn};\n  }).sort((x,y)=>y.earn-x.earn);\n  const max = Math.max(1,...rows.map(r=>r.earn));\n  return `<table class=\"tbl\"><thead><tr><th>パートナー</th><th class=\"num\">送客</th><th class=\"num\">入社</th><th class=\"num\">成果報酬</th><th style=\"width:120px\">構成</th></tr></thead><tbody>\n    ${rows.map(r=>`<tr><td class=\"cell-strong\">${esc(r.a.name)}</td>\n      <td class=\"num\">${r.sent}</td><td class=\"num\" style=\"color:var(--g)\">${r.joined}</td>\n      <td class=\"num\">${yen(r.earn)}</td>\n      <td><div class=\"sum-bar\"><span style=\"width:${Math.round(r.earn/max*100)}%\"></span></div></td></tr>`).join('')}\n  </tbody></table>`;\n}\n\n/* ════════════════════ KANOA: PROJECTS ════════════════════ */\nfunction viewProjects(){\n  setHeader('案件', '保有する案件と公開先を管理',\n    `<button class=\"btn btn-primary btn-sm\" data-act=\"new-project\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/></svg>案件を追加</button>`);\n  const c = document.getElementById('content');\n  if(!DB.projects.length){ c.innerHTML = emptyState('案件がありません','「案件を追加」から最初の案件を登録'); return; }\n  c.innerHTML = `<div class=\"pj-grid\">${DB.projects.map(p=>{\n    const refs = projectReferrals(p.id);\n    const pubCount = DB.assignments.filter(a=>a.pj===p.id && a.published).length;\n    const unr = projUnreadCands(p.id);\n    return `<div class=\"pj-card\" data-act=\"open-project\" data-id=\"${p.id}\">\n      <div class=\"pj-card-top\">\n        <div style=\"display:flex;gap:12px;min-width:0\">\n          <div class=\"pj-logo\" style=\"background:${p.color||'var(--accent)'}\">${esc(p.logo||p.name.slice(0,1))}</div>\n          <div style=\"min-width:0\"><div class=\"pj-name\">${esc(p.name)}</div><div class=\"pj-client\">${esc(p.client)}</div></div>\n        </div>\n        <div style=\"display:flex;align-items:center;gap:7px;flex-shrink:0\">\n          ${unr?`<span class=\"pj-unread\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z\"/></svg>新着 ${unr}名</span>`:''}\n          <span class=\"tag tag-${p.status}\">${p.status==='open'?'公開中':p.status==='closed'?'終了':'下書き'}</span>\n        </div>\n      </div>\n      <div class=\"pj-row\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/></svg>${esc(p.position)}</div>\n      <div class=\"pj-row\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/></svg>${esc(p.location)}</div>\n      <div class=\"pj-stats\">\n        <div><div class=\"pj-stat-v\">${pubCount}</div><div class=\"pj-stat-l\">公開先 パートナー</div></div>\n        <div><div class=\"pj-stat-v\">${refs.filter(r=>r.status!=='rejected').length}</div><div class=\"pj-stat-l\">送客数</div></div>\n        <div><div class=\"pj-stat-v\" style=\"color:var(--g)\">${refs.filter(r=>r.status==='joined').length}</div><div class=\"pj-stat-l\">入社</div></div>\n      </div>\n    </div>`;\n  }).join('')}</div>`;\n}\n\nfunction viewProjectDetail(){\n  const p = project(S.detailId); if(!p){ go('projects'); return; }\n  assignQ='';\n  setHeader(p.name, p.client,\n    `<button class=\"btn btn-ghost btn-sm\" data-act=\"nav\" data-view=\"projects\">← 案件一覧</button>\n     <button class=\"btn btn-ghost btn-sm\" data-act=\"edit-project\" data-id=\"${p.id}\">編集</button>`);\n  const refs = projectReferrals(p.id);\n  const c = document.getElementById('content');\n  c.innerHTML = `<div class=\"content-narrow\"><div class=\"detail-grid\">\n    <div>\n      <div class=\"dt-block\"><div class=\"dt-block-title\">案件概要</div><p style=\"font-size:13.5px;line-height:1.7;color:var(--ink-soft)\">${esc(p.summary)}</p></div>\n      ${p.conditions?`<div class=\"cond-card\"><div class=\"eyebrow\">送客条件</div><p>${esc(p.conditions)}</p></div>`:''}\n      <div class=\"dt-block\"><div class=\"dt-block-title\">募集要項</div>\n        <dl class=\"kv\">\n          <dt>ポジション</dt><dd>${esc(p.position)}</dd>\n          <dt>雇用形態</dt><dd>${esc(p.employment)}</dd>\n          <dt>給与</dt><dd>${esc(p.salary)}</dd>\n          <dt>勤務地</dt><dd>${esc(p.location)}</dd>\n        </dl></div>\n      <div class=\"dt-block\"><div class=\"dt-block-title\">選考データ</div>${selDataCard(refs)}</div>\n      ${agentInfoBlock(p)}\n      <div class=\"dt-block\"><div class=\"dt-block-title\">求める人物像</div>\n        <ul class=\"req-list\">${(p.requirements||[]).map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>\n      <div class=\"dt-block\"><div class=\"dt-block-title\">選考フロー</div>\n        <div class=\"flow-steps\">${(p.flow||[]).map((f,i)=>`<div class=\"flow-step\"><div class=\"flow-num\">${i+1}</div><div class=\"flow-body\"><strong>${esc(f.t)}</strong><span>${esc(f.s)}</span></div></div>`).join('')}</div></div>\n      ${projectRichSections(p)}\n    </div>\n    <div>\n      <div class=\"reward-card\">\n        <div class=\"eyebrow\">パートナーへの成果報酬</div>\n        ${p.rewardType==='success'\n          ? `<div class=\"reward-amt\"><span class=\"yen\">¥</span>${(p.successReward).toLocaleString('ja-JP')}<span class=\"unit\">/ 入社</span></div>`\n          : p.rewardType==='referral'\n          ? `<div class=\"reward-amt\"><span class=\"yen\">¥</span>${(p.referralReward).toLocaleString('ja-JP')}<span class=\"unit\">/ 送客</span></div>`\n          : `<div class=\"reward-amt\"><span class=\"yen\">¥</span>${(p.referralReward).toLocaleString('ja-JP')}<span class=\"unit\">/ 送客</span></div>\n             <div class=\"reward-split\"><div><div class=\"reward-split-v\">${yen(p.successReward)}</div><div class=\"reward-split-l\">入社時 成功報酬</div></div></div>`}\n      </div>\n      <div class=\"sect\">\n        <div class=\"sect-head\"><div class=\"sect-title\" style=\"font-size:13px\">公開先パートナー</div></div>\n        <div class=\"panel\" id=\"assignPanel\">${assignMatrix(p.id)}</div>\n      </div>\n    </div>\n  </div>\n  <div class=\"sect\" style=\"margin-top:10px\">\n    <div class=\"sect-head\"><div class=\"sect-title\">この案件の送客（${refs.length}）</div>\n      <button class=\"btn btn-ghost btn-sm\" data-act=\"nav\" data-view=\"referrals\">全送客管理へ →</button></div>\n    <div class=\"panel tbl-wrap\">${referralTable(refs, {showAgency:true})}</div>\n  </div>\n  </div>`;\n}\nlet assignQ='';\nfunction assignMatrix(pj){\n  const p=project(pj);\n  const showSuc = p.rewardType==='success' || p.rewardType==='both';\n  const showRef = p.rewardType==='referral' || p.rewardType==='both';\n  const ags=DB.agencies;\n  const pubN=ags.filter(a=>{ const x=assignment(pj,a.id); return x&&x.published; }).length;\n  const allPub = ags.length>0 && pubN===ags.length;\n  const toolbar=`<div class=\"assign-toolbar\">\n    <div class=\"assign-count\">公開中 <b>${pubN}</b>/ ${ags.length}社</div>\n    <button class=\"btn btn-ghost btn-sm\" data-act=\"bulk-publish\" data-pj=\"${pj}\" data-on=\"${allPub?'0':'1'}\">${allPub?'すべて非公開':'すべて公開'}</button>\n    <div class=\"assign-search-wrap\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"M21 21l-4.35-4.35\"/></svg>\n      <input id=\"assignSearch\" class=\"assign-search\" value=\"${esc(assignQ)}\" placeholder=\"パートナーを検索\" autocomplete=\"off\"></div>\n  </div>`;\n  const cards = ags.map(a=>{\n    const x = assignment(pj,a.id) || {pj, ag:a.id, published:false};\n    const pub=!!x.published;\n    return `<div class=\"assign-card ${pub?'pub':''}\" data-search=\"${esc(a.name+' '+agCode(a))}\">\n      <label class=\"toggle\"><input type=\"checkbox\" data-act=\"toggle-assign\" data-pj=\"${pj}\" data-ag=\"${a.id}\" ${pub?'checked':''}><span class=\"toggle-track\"></span></label>\n      <div class=\"ac-av\" style=\"background:${agColor(a.id)}\">${esc(a.name.slice(0,1))}</div>\n      <div class=\"ac-main\"><div class=\"ac-name\">${esc(a.name)}</div><div class=\"ac-code\">${agCode(a)}</div></div>\n      <span class=\"ac-pill ${pub?'on':'off'}\">${pub?'公開中':'非公開'}</span>\n    </div>`;\n  }).join('');\n  return toolbar+`<div id=\"assignList\">${cards}</div>`;\n}\nfunction applyAssignFilter(){\n  const q=(assignQ||'').trim().toLowerCase();\n  document.querySelectorAll('#assignList .assign-card').forEach(c=>{\n    const hay=(c.getAttribute('data-search')||'').toLowerCase();\n    c.style.display = (!q || hay.includes(q)) ? '' : 'none';\n  });\n}\nfunction renderAssignPanel(pj){ const el=document.getElementById('assignPanel'); if(el){ el.innerHTML=assignMatrix(pj); applyAssignFilter(); } }\n\n/* ════════════════════ KANOA: AGENCIES ════════════════════ */\nfunction viewAgencies(){\n  const pending = DB.agencies.filter(a=>a.status==='pending');\n  setHeader('パートナー', `提携 ${DB.agencies.filter(a=>a.status==='active').length}社`,\n    `<button class=\"btn btn-ghost btn-sm\" data-act=\"accounts\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"/><path d=\"M7 11V7a5 5 0 0110 0v4\"/></svg>ログイン管理</button>\n     <button class=\"btn btn-ghost btn-sm\" data-act=\"export-agencies\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3\"/></svg>CSV出力</button>\n     <button class=\"btn btn-primary btn-sm\" data-act=\"new-agency\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/></svg>パートナーを発行</button>`);\n  const c = document.getElementById('content');\n  let html = '<div class=\"content-narrow\">';\n  // ── アカウント発行の進捗（全パートナーの招待・ログイン状況を一望） ──\n  html += `<div class=\"sect\"><div class=\"sect-head\"><div class=\"sect-title\">アカウント発行の進捗</div>\n    <button class=\"btn btn-ghost btn-sm\" data-act=\"invite-diagnose\">接続診断</button></div>\n    <div class=\"panel tbl-wrap\"><table class=\"tbl\"><thead><tr><th>パートナー</th><th>発行状態</th><th>パスワード</th><th>最終ログイン</th><th style=\"width:220px\"></th></tr></thead><tbody>\n    ${DB.agencies.length?DB.agencies.map(a=>{\n      const last=(DB.logins||[]).find(l=>l.ag===a.id && l.ok!==false);\n      const stt=inviteState(a);\n      return `<tr>\n        <td><button data-act=\"open-agency\" data-id=\"${a.id}\" style=\"border:none;background:none;cursor:pointer;text-align:left;padding:0\"><span class=\"cell-strong\" style=\"color:var(--ink)\">${esc(a.name)}</span></button><div class=\"cell-sub\">${esc(a.email||'')}</div></td>\n        <td>${agInviteBadge(a)}</td>\n        <td>${a.pwHash?'<span style=\"color:var(--g);font-weight:600\">設定済み</span>':'<span class=\"cell-sub\">未設定</span>'}</td>\n        <td>${last?`<span class=\"cell-sub\">${esc(last.at)}</span>`:'<span class=\"cell-sub\">—</span>'}</td>\n        <td style=\"text-align:right;white-space:nowrap\">\n          ${stt==='valid'?`<button class=\"btn btn-ghost btn-sm\" data-act=\"copy-invite\" data-ag=\"${a.id}\" style=\"margin-right:6px\">リンクをコピー</button>`:''}\n          <button class=\"btn btn-ghost btn-sm\" data-act=\"issue-invite\" data-ag=\"${a.id}\">${a.inviteToken?(a.pwHash?'再設定リンク':'再発行'):'リンク発行'}</button>\n        </td></tr>`;\n    }).join(''):`<tr><td colspan=\"5\"><span class=\"cell-sub\">パートナーがまだいません。右上の「パートナーを発行」から始めてください。</span></td></tr>`}\n    </tbody></table></div></div>`;\n  const active = DB.agencies.filter(a=>a.status!=='pending');\n  html += `<div class=\"sect\"><div class=\"sect-head\"><div class=\"sect-title\">提携パートナー</div></div>\n    <div class=\"panel tbl-wrap\"><table class=\"tbl\"><thead><tr><th>パートナー</th><th>ID</th><th>担当 / 連絡先</th><th class=\"num\">送客</th><th class=\"num\">入社</th><th class=\"num\">成果報酬</th><th>状態</th><th></th></tr></thead><tbody>\n    ${active.map(a=>{\n      const rs=agencyReferrals(a.id); const sent=rs.filter(r=>r.status!=='rejected').length; const joined=rs.filter(r=>r.status==='joined').length; const earn=rs.reduce((s,r)=>s+refEarning(r),0);\n      return `<tr>\n        <td><button data-act=\"open-agency\" data-id=\"${a.id}\" style=\"display:flex;align-items:center;gap:9px;border:none;background:none;cursor:pointer;text-align:left;padding:0\">${agAvatar(a,30)}<span class=\"cell-strong\" style=\"color:var(--ink)\">${esc(a.name)}</span></button></td>\n        <td class=\"mono cell-sub\">${agCode(a)}</td>\n        <td>${a.contact?esc(a.contact):'<span class=\"cell-sub\">—</span>'}<div class=\"cell-sub\">${esc(a.email||'')}</div></td>\n        <td class=\"num\">${sent}</td><td class=\"num\" style=\"color:var(--g)\">${joined}</td><td class=\"num\">${yen(earn)}</td>\n        <td><span class=\"tag tag-${a.status}\">${a.status==='active'?'提携中':'停止中'}</span><div style=\"margin-top:4px\">${agInviteBadge(a)}</div></td>\n        <td style=\"text-align:right;white-space:nowrap\"><button class=\"btn btn-ghost btn-sm\" data-act=\"open-thread\" data-ag=\"${a.id}\" style=\"margin-right:6px\">連絡${unreadKanoaBy(a.id)?` <span class=\"unread-dot\" style=\"display:inline-grid;min-width:16px;height:16px\">${unreadKanoaBy(a.id)}</span>`:''}</button><button class=\"btn btn-ghost btn-sm\" data-act=\"${a.status==='active'?'suspend-agency':'reactivate-agency'}\" data-id=\"${a.id}\">${a.status==='active'?'停止':'再開'}</button></td>\n      </tr>`;\n    }).join('')}\n  </tbody></table></div></div></div>`;\n  c.innerHTML = html;\n}\n\n/* ════════════════════ KANOA: REFERRALS (cross) ════════════════════ */\nlet rFilter={status:'',pj:'',ag:'',q:'',docMode:'all',sessTbd:false,sessFrom:'',sessTo:'',joinFrom:'',joinTo:'',joinMode:'all',crFrom:'',crTo:'',area:''}, rSort={k:'',d:1};\nlet rFilterOpen=false; let rSel=new Set();\nfunction sessionISO(r){ const s=(r.session||'').trim(); if(!s||s==='—') return '';\n  let m=s.match(/(\\d{4})-(\\d{1,2})-(\\d{1,2})/); if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;\n  m=s.match(/(\\d{1,2})[\\/月](\\d{1,2})/); if(m){ const y=new Date().getFullYear(); return `${y}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`; }\n  return ''; }\nfunction rFilterActive(){ return rFilter.docMode!=='all'||rFilter.sessTbd||rFilter.sessFrom||rFilter.sessTo||rFilter.joinFrom||rFilter.joinTo||rFilter.joinMode!=='all'||rFilter.crFrom||rFilter.crTo||rFilter.area; }\nfunction clearRFilter(){ rFilter.docMode='all';rFilter.sessTbd=false;rFilter.sessFrom='';rFilter.sessTo='';rFilter.joinFrom='';rFilter.joinTo='';rFilter.joinMode='all';rFilter.crFrom='';rFilter.crTo='';rFilter.area=''; }\nfunction anyRFilter(){ return !!(rFilter.status||rFilter.pj||rFilter.ag||rFilter.q) || rFilterActive(); }\nfunction clearAllRFilter(){ rFilter.status='';rFilter.pj='';rFilter.ag='';rFilter.q=''; clearRFilter(); }\nfunction viewReferrals(){\n  setHeader('送客管理', '全パートナー・全案件の送客を一元管理',\n    `<button class=\"btn btn-ghost btn-sm\" data-act=\"export-refs\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3\"/></svg>CSV出力</button>`);\n  const c = document.getElementById('content');\n  c.innerHTML = `\n    ${urgentBannerHtml()}\n    <div class=\"toolbar\">\n      <div class=\"search\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"M21 21l-4.35-4.35\"/></svg>\n        <input id=\"rSearch\" placeholder=\"氏名・連絡先・エリアで検索\" value=\"${esc(rFilter.q)}\"></div>\n      <select class=\"fsel\" id=\"rPj\"><option value=\"\">全案件</option>${DB.projects.map(p=>`<option value=\"${p.id}\" ${rFilter.pj===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>\n      <select class=\"fsel\" id=\"rAg\"><option value=\"\">全パートナー</option>${DB.agencies.map(a=>`<option value=\"${a.id}\" ${rFilter.ag===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>\n      <button class=\"btn ${rFilterActive()||rFilterOpen?'btn-primary':'btn-ghost'} btn-sm\" data-act=\"rfilter-toggle\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 3H2l8 9.46V19l4 2v-8.54L22 3z\"/></svg>詳細フィルタ${rFilterActive()?' ●':''}</button>\n    </div>\n    <div id=\"rFilterPanel\">${rFilterOpen?refFilterPanel():''}</div>\n    <div class=\"chips\" id=\"rChips\"></div>\n    <div id=\"rBulk\"></div>\n    <div class=\"meta-row\"><span class=\"meta-count\" id=\"rCount\"></span><span id=\"rReset\"></span><span class=\"meta-hint\">チェックで複数選択→一括変更 · セル直接編集で保存 · 👁で個人情報</span></div>\n    <div class=\"panel tbl-wrap\" id=\"rTableWrap\"></div>`;\n  renderRefChips(); renderRefTable();\n}\nfunction refFilterPanel(){\n  const opt=(v,cur,label)=>`<option value=\"${v}\" ${cur===v?'selected':''}>${label}</option>`;\n  return `<div class=\"filter-panel\">\n    <div class=\"fp-grid\">\n      <div class=\"fp-field\"><label>選考会日</label><div class=\"fp-range\"><input type=\"date\" id=\"fSessFrom\" value=\"${esc(rFilter.sessFrom)}\"><span>〜</span><input type=\"date\" id=\"fSessTo\" value=\"${esc(rFilter.sessTo)}\"></div>\n        <label class=\"fp-check\"><input type=\"checkbox\" id=\"fSessTbd\" ${rFilter.sessTbd?'checked':''}> 未定のみ</label></div>\n      <div class=\"fp-field\"><label>入社月</label><div class=\"fp-range\"><input type=\"month\" id=\"fJoinFrom\" value=\"${esc(rFilter.joinFrom)}\"><span>〜</span><input type=\"month\" id=\"fJoinTo\" value=\"${esc(rFilter.joinTo)}\"></div>\n        <select class=\"fsel\" id=\"fJoinMode\">${opt('all',rFilter.joinMode,'入社状況：すべて')}${opt('joined',rFilter.joinMode,'入社済みのみ')}${opt('notjoined',rFilter.joinMode,'未入社のみ')}</select></div>\n      <div class=\"fp-field\"><label>送客日</label><div class=\"fp-range\"><input type=\"date\" id=\"fCrFrom\" value=\"${esc(rFilter.crFrom)}\"><span>〜</span><input type=\"date\" id=\"fCrTo\" value=\"${esc(rFilter.crTo)}\"></div></div>\n      <div class=\"fp-field\"><label>希望エリア</label><input id=\"fArea\" placeholder=\"例：東京 / 大阪\" value=\"${esc(rFilter.area)}\"></div>\n      <div class=\"fp-field\"><label>資料</label><select class=\"fsel\" id=\"fDoc\">${opt('all',rFilter.docMode,'すべて')}${opt('missing',rFilter.docMode,'未提出（履歴書か職務経歴書なし）')}${opt('norireki',rFilter.docMode,'履歴書なし')}${opt('noshoku',rFilter.docMode,'職務経歴書なし')}${opt('both',rFilter.docMode,'両方あり')}</select></div>\n    </div>\n    <div class=\"fp-foot\"><span class=\"cell-sub\" id=\"fpCount\"></span><button class=\"btn btn-ghost btn-sm\" data-act=\"rfilter-clear\">詳細条件をクリア</button></div>\n  </div>`;\n}\nfunction refFiltered(){\n  let rows = DB.referrals.slice();\n  if(rFilter.status) rows=rows.filter(r=>r.status===rFilter.status);\n  if(rFilter.pj) rows=rows.filter(r=>r.pj===rFilter.pj);\n  if(rFilter.ag) rows=rows.filter(r=>r.ag===rFilter.ag);\n  if(rFilter.q){ const q=rFilter.q.toLowerCase(); rows=rows.filter(r=>[r.name,r.kana,r.phone,r.email,r.area].some(v=>(v||'').toLowerCase().includes(q))); }\n  // 資料\n  if(rFilter.docMode!=='all'){ rows=rows.filter(r=>{ const s=docStat(r);\n    if(rFilter.docMode==='missing') return r.status!=='rejected' && (!s.rireki||!s.shoku);\n    if(rFilter.docMode==='norireki') return !s.rireki;\n    if(rFilter.docMode==='noshoku') return !s.shoku;\n    if(rFilter.docMode==='both') return s.rireki&&s.shoku;\n    return true; }); }\n  // 選考会日\n  if(rFilter.sessTbd) rows=rows.filter(r=>!sessionISO(r));\n  if(rFilter.sessFrom) rows=rows.filter(r=>{ const d=sessionISO(r); return d && d>=rFilter.sessFrom; });\n  if(rFilter.sessTo) rows=rows.filter(r=>{ const d=sessionISO(r); return d && d<=rFilter.sessTo; });\n  // 入社月\n  if(rFilter.joinMode==='joined') rows=rows.filter(r=>!!r.joined);\n  if(rFilter.joinMode==='notjoined') rows=rows.filter(r=>!r.joined);\n  if(rFilter.joinFrom) rows=rows.filter(r=>r.joined && r.joined.slice(0,7)>=rFilter.joinFrom);\n  if(rFilter.joinTo) rows=rows.filter(r=>r.joined && r.joined.slice(0,7)<=rFilter.joinTo);\n  // 送客日\n  if(rFilter.crFrom) rows=rows.filter(r=>(r.created||'').slice(0,10)>=rFilter.crFrom);\n  if(rFilter.crTo) rows=rows.filter(r=>(r.created||'').slice(0,10)<=rFilter.crTo);\n  // エリア\n  if(rFilter.area){ const a=rFilter.area.toLowerCase(); rows=rows.filter(r=>(r.area||'').toLowerCase().includes(a)); }\n  if(rSort.k){ rows.sort((a,b)=>{ let x,y; if(rSort.k==='status'){x=STATUS_ORDER.indexOf(a.status);y=STATUS_ORDER.indexOf(b.status);} else if(rSort.k==='ag'){x=agency(a.ag).name;y=agency(b.ag).name;} else {x=a[rSort.k]||'';y=b[rSort.k]||'';} return x<y?-1*rSort.d:x>y?rSort.d:0; }); }\n  return rows;\n}\nfunction renderRefChips(){\n  const wrap=document.getElementById('rChips'); if(!wrap) return;\n  const all=DB.referrals; const cnt={}; STATUS_ORDER.forEach(s=>cnt[s]=0); all.forEach(r=>cnt[r.status]++);\n  const missingN=all.filter(r=>r.status!=='rejected' && (()=>{const s=docStat(r);return !s.rireki||!s.shoku;})()).length;\n  wrap.innerHTML = `<button class=\"chip ${rFilter.status===''?'on':''}\" data-act=\"rchip\" data-s=\"\">すべて <b>${all.length}</b></button>`+\n    STATUS_ORDER.map(s=>`<button class=\"chip ${rFilter.status===s?'on':''}\" data-act=\"rchip\" data-s=\"${s}\">${STATUS[s].label} <b>${cnt[s]}</b></button>`).join('')+\n    `<button class=\"chip ${rFilter.docMode==='missing'?'on':''}\" data-act=\"rchip-missing\" style=\"margin-left:6px\">📄 資料未提出 <b>${missingN}</b></button>`;\n}\nfunction renderRefBulk(){\n  const bar=document.getElementById('rBulk'); if(!bar) return;\n  if(!rSel.size){ bar.innerHTML=''; return; }\n  bar.innerHTML=`<div class=\"bulk-bar\">\n    <span class=\"bulk-n\"><b>${rSel.size}</b> 件を選択中</span>\n    <span class=\"bulk-sep\"></span>\n    <span class=\"cell-sub\">ステータスを</span>\n    <select class=\"fsel\" id=\"bulkStatus\">${STATUS_ORDER.map(s=>`<option value=\"${s}\">${STATUS[s].label}</option>`).join('')}</select>\n    <button class=\"btn btn-primary btn-sm\" data-act=\"bulk-status-apply\">に一括変更</button>\n    <button class=\"btn btn-ghost btn-sm\" data-act=\"bulk-open-sel\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"vertical-align:-2px;margin-right:3px\"><path d=\"M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z\"/></svg>選択へ一括送信</button>\n    <button class=\"btn btn-ghost btn-sm\" data-act=\"bulk-export\">選択をCSV</button>\n    <button class=\"btn btn-ghost btn-sm\" data-act=\"rsel-clear\">選択解除</button>\n  </div>`;\n}\nfunction renderRefTable(){\n  const rows=refFiltered();\n  const cEl=document.getElementById('rCount'); if(cEl) cEl.textContent=`${rows.length} 名${rSel.size?` · ${rSel.size}件選択`:''}`;\n  const rr=document.getElementById('rReset'); if(rr) rr.innerHTML = anyRFilter()?`<button class=\"btn btn-ghost btn-sm\" data-act=\"rfilter-reset-all\" style=\"padding:4px 10px;font-size:11.5px\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"/></svg>抽出を解除</button>`:'';\n  const fp=document.getElementById('fpCount'); if(fp) fp.textContent=`該当 ${rows.length} 名`;\n  document.getElementById('rTableWrap').innerHTML = referralTable(rows, {showAgency:true, editable:true, select:true});\n  renderRefBulk();\n}\nfunction referralTable(rows, opt={}){\n  if(!rows.length) return emptyState('送客がありません','条件を変えるか、パートナーからの送客を待ちましょう');\n  const ed = opt.editable, sel = opt.select;\n  const allSel = sel && rows.length>0 && rows.every(r=>rSel.has(r.id));\n  return `<table class=\"tbl\"><thead><tr>\n    ${sel?`<th style=\"width:34px\"><input type=\"checkbox\" class=\"rsel-cb\" data-act=\"rsel-all\" ${allSel?'checked':''}></th>`:''}\n    <th style=\"width:30px\"></th>\n    <th data-act=\"rsort\" data-k=\"name\" style=\"cursor:pointer\">氏名</th>\n    ${opt.showAgency?'<th data-act=\"rsort\" data-k=\"ag\" style=\"cursor:pointer\">パートナー</th>':''}\n    <th data-act=\"rsort\" data-k=\"pj\" style=\"cursor:pointer\">案件</th>\n    <th data-act=\"rsort\" data-k=\"status\" style=\"cursor:pointer\">ステータス</th>\n    <th>選考会</th><th data-act=\"rsort\" data-k=\"created\" style=\"cursor:pointer\">送客日</th><th data-act=\"rsort\" data-k=\"joined\" style=\"cursor:pointer\">入社月</th><th>資料</th><th class=\"num\">報酬</th><th>次のアクション</th><th style=\"width:46px;text-align:center\">連絡</th>\n  </tr></thead><tbody>\n  ${rows.map(r=>{\n    const p=project(r.pj), a=agency(r.ag), earn=refEarning(r);\n    return `<tr class=\"${sel&&rSel.has(r.id)?'row-sel':''}\">\n      ${sel?`<td><input type=\"checkbox\" class=\"rsel-cb\" data-act=\"rsel\" data-id=\"${r.id}\" ${rSel.has(r.id)?'checked':''}></td>`:''}\n      <td><button class=\"copy-btn\" style=\"padding:5px 7px\" data-act=\"open-ref\" data-id=\"${r.id}\" title=\"個人情報\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg></button></td>\n      <td class=\"cell-strong\">${(S.role==='kanoa'&&r.seenK===false)?`<span class=\"tag\" style=\"background:var(--r);color:#fff;font-size:9px;font-weight:700;padding:1px 6px;margin-right:5px;vertical-align:1px\">NEW</span>`:''}${ed?`<input class=\"icell icell-name\" value=\"${esc(r.name)}\" data-act=\"edit-ref\" data-id=\"${r.id}\" data-f=\"name\">`:esc(r.name)}${crossDupBadge(r)}<div class=\"cell-sub\" style=\"padding-left:${ed?'8px':'0'}\">${esc(r.area||'')}</div></td>\n      ${opt.showAgency?`<td>${esc(a?a.name:r.ag)}</td>`:''}\n      <td><span class=\"tag\" style=\"font-size:10.5px\">${esc(p?p.name.replace(' パートナー送客',''):r.pj)}</span></td>\n      <td>${ed?statusSelect(r.status,`data-act=\"edit-ref\" data-id=\"${r.id}\" data-f=\"status\"`):statusBadge(r.status)}</td>\n      <td>${ed?`<input class=\"icell\" style=\"font-family:var(--mono);font-size:12px;max-width:80px\" value=\"${r.session==='—'?'':esc(r.session)}\" placeholder=\"7/18\" data-act=\"edit-ref\" data-id=\"${r.id}\" data-f=\"session\">`:`<span class=\"mono cell-sub\">${esc(r.session)}</span>`}</td>\n      <td><span class=\"mono cell-sub\">${esc((r.created||'').slice(5)||'—')}</span></td>\n      <td>${ed\n        ?`<input type=\"month\" class=\"icell\" style=\"font-family:var(--mono);font-size:12px;max-width:120px\" value=\"${r.joined?esc(r.joined.slice(0,7)):''}\" data-act=\"edit-ref\" data-id=\"${r.id}\" data-f=\"joinedMonth\">`\n        :(r.joined?`<span class=\"tag\" style=\"background:var(--g-bg);color:var(--g);font-size:11px\">${joinedM(r)}</span>`:'<span class=\"cell-sub\">—</span>')}</td>\n      <td><button data-act=\"open-ref\" data-id=\"${r.id}\" style=\"border:none;background:none;cursor:pointer;padding:0;white-space:nowrap\">${docFlags(r)}</button></td>\n      <td class=\"num\">${earn?yen(earn):'<span class=\"cell-sub\">—</span>'}</td>\n      <td>${nextActionCell(r)}</td>\n      <td style=\"text-align:center\">${(()=>{ const viewer=S.role==='kanoa'?'kanoa':'agency'; const un=subUnread(r.ag, r.id, viewer); return `<button class=\"ref-chat-btn\" data-act=\"open-cand-thread\" data-ag=\"${r.ag}\" data-ref=\"${r.id}\" title=\"${esc(r.name)}さんの連絡を開く\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z\"/></svg>${un?`<span class=\"ref-chat-un\">${un}</span>`:''}</button>`; })()}</td>\n    </tr>`;\n  }).join('')}\n  </tbody></table>`;\n}\n\n/* ════════════════════ KANOA: EARNINGS ════════════════════ */\nfunction viewEarnings(){\n  setHeader('成果・報酬', '案件×パートナーの成約と成果報酬',\n    `<button class=\"btn btn-ghost btn-sm\" data-act=\"export-earn\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3\"/></svg>CSV出力</button>`);\n  const totalEarn = DB.referrals.reduce((s,r)=>s+refEarning(r),0);\n  const joined = DB.referrals.filter(r=>r.status==='joined').length;\n  const sent = DB.referrals.filter(r=>r.status!=='rejected').length;\n  const sp = splitEarn(DB.referrals);\n  const c=document.getElementById('content');\n  c.innerHTML = `<div class=\"content-narrow\">\n    <div class=\"earn-split\">\n      <div class=\"earn-pill confirmed\"><div class=\"el\"><span class=\"kpi-dot\" style=\"background:var(--g)\"></span>確定報酬（送客実績＋入社）</div><div class=\"ev\"><span class=\"yen\">¥</span>${sp.confirmed.toLocaleString('ja-JP')}</div></div>\n      <div class=\"earn-pill\"><div class=\"el\"><span class=\"kpi-dot\" style=\"background:var(--a)\"></span>見込み報酬（選考中が入社した場合）</div><div class=\"ev\"><span class=\"yen\">¥</span>${sp.pipeline.toLocaleString('ja-JP')}</div></div>\n      <div class=\"earn-pill\"><div class=\"el\"><span class=\"kpi-dot\" style=\"background:var(--ink)\"></span>最大ポテンシャル</div><div class=\"ev\"><span class=\"yen\">¥</span>${(sp.confirmed+sp.pipeline).toLocaleString('ja-JP')}</div></div>\n    </div>\n    <div class=\"kpi-grid\">\n      ${kpi('成果報酬 発生額','<span class=\"yen\">¥</span>'+totalEarn.toLocaleString('ja-JP'),'var(--ink)')}\n      ${kpi('送客（有効）',sent+'<span class=\"unit\">名</span>','var(--b)')}\n      ${kpi('入社（成約）',joined+'<span class=\"unit\">名</span>','var(--g)')}\n      ${kpi('成約率', (sent?Math.round(joined/sent*100):0)+'<span class=\"unit\">%</span>','var(--accent)')}\n    </div>\n    <div class=\"sect\">\n      <div class=\"sect-head\"><div class=\"sect-title\">パートナー × 案件 成果テーブル</div></div>\n      <div class=\"panel tbl-wrap\"><table class=\"tbl\"><thead><tr>\n        <th>パートナー</th><th>案件</th><th class=\"num\">送客</th><th class=\"num\">書類〜内定</th><th class=\"num\">入社</th>\n        <th class=\"num\">送客報酬</th><th class=\"num\">成功報酬</th><th class=\"num\">合計</th></tr></thead><tbody>\n        ${earnRows()}\n      </tbody></table></div>\n    </div></div>`;\n}\nfunction earnRows(){\n  const out=[];\n  DB.agencies.filter(a=>a.status==='active').forEach(a=>{\n    DB.projects.forEach(p=>{\n      const rs=DB.referrals.filter(r=>r.ag===a.id && r.pj===p.id);\n      if(!rs.length) return;\n      const sent=rs.filter(r=>r.status!=='rejected').length;\n      const mid=rs.filter(r=>['screening','interview','offer'].includes(r.status)).length;\n      const joined=rs.filter(r=>r.status==='joined').length;\n      const e=effReward(p.id,a.id);\n      const refRew=(p.rewardType==='referral'||p.rewardType==='both')?sent*e.ref:0;\n      const sucRew=(p.rewardType==='success'||p.rewardType==='both')?joined*e.suc:0;\n      out.push(`<tr><td class=\"cell-strong\">${esc(a.name)}</td><td><span class=\"tag\" style=\"font-size:10.5px\">${esc(p.name.replace(' パートナー送客',''))}</span></td>\n        <td class=\"num\">${sent}</td><td class=\"num\">${mid}</td><td class=\"num\" style=\"color:var(--g)\">${joined}</td>\n        <td class=\"num\">${yen(refRew)}</td><td class=\"num\">${yen(sucRew)}</td><td class=\"num cell-strong\">${yen(refRew+sucRew)}</td></tr>`);\n    });\n  });\n  return out.length?out.join(''):`<tr><td colspan=\"8\">${emptyState('成果データがありません','送客が入ると集計されます')}</td></tr>`;\n}\n\n/* ════════════════════ AGENCY VIEWS ════════════════════ */\n// パートナーの「要対応」項目を集約（書類未提出・未読・日程未確定）\nfunction agencyTodos(agId){\n  const todos=[];\n  const refs=DB.referrals.filter(r=>r.ag===agId);\n  // 1) 選考会に必要な書類が未提出（entry/screening）\n  refs.forEach(r=>{\n    if(['entry','screening'].includes(r.status)){\n      const miss=missingDocsForStage(r,'interview');\n      if(miss.length) todos.push({type:'doc', label:`${r.name}：${miss.join('・')}が未提出`, sub:`${shortPjName(r.pj)}・選考会に進むのに必要`, act:`data-act=\"open-ref\" data-id=\"${r.id}\"`, cta:'資料を提出'});\n    }\n    // 内定後の必要書類（源泉徴収票・給与明細など）\n    if(r.status==='offer'){\n      const miss=missingDocsForStage(r,'offer');\n      if(miss.length) todos.push({type:'doc', label:`${r.name}：内定後の${miss.join('・')}を提出`, sub:`${shortPjName(r.pj)}・オファー提示に必要`, act:`data-act=\"open-ref\" data-id=\"${r.id}\"`, cta:'資料を提出'});\n    }\n  });\n  // 2) KANOAからの未読\n  const genUn=subUnread(agId, null, 'agency');\n  if(genUn) todos.push({type:'msg', label:`全体連絡：KANOAから${genUn}件の未読`, sub:'お知らせ・一般連絡', act:`data-act=\"open-general-thread\"`, cta:'開く'});\n  subThreadKeys(agId).forEach(rid=>{\n    const r=DB.referrals.find(x=>x.id===rid); if(!r) return;\n    const un=subUnread(agId, rid, 'agency');\n    if(un) todos.push({type:'msg', label:`${r.name}：KANOAから${un}件の未読`, sub:shortPjName(r.pj), act:`data-act=\"open-cand-thread\" data-ag=\"${agId}\" data-ref=\"${rid}\"`, cta:'返信'});\n  });\n  // 3) 選考会の日程が未確定\n  refs.forEach(r=>{\n    if(r.status==='interview' && (!r.session||r.session==='—'))\n      todos.push({type:'sched', label:`${r.name}：選考会の日程が未確定`, sub:shortPjName(r.pj), act:`data-act=\"open-cand-thread\" data-ag=\"${agId}\" data-ref=\"${r.id}\"`, cta:'相談'});\n  });\n  return todos;\n}\nfunction todoIcon(type){\n  if(type==='doc') return '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z\"/><path d=\"M14 2v6h6\"/></svg>';\n  if(type==='sched') return '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M16 2v4M8 2v4M3 10h18\"/></svg>';\n  return '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z\"/></svg>';\n}\nfunction agencyTodoPanel(){\n  const todos=agencyTodos(S.agencyId);\n  if(!todos.length){\n    return `<div class=\"todo-clear\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 11.08V12a10 10 0 11-5.93-9.14\"/><path d=\"M22 4L12 14.01l-3-3\"/></svg>要対応の項目はありません。順調です。</div>`;\n  }\n  return `<div class=\"todo-panel\">\n    <div class=\"todo-head\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>要対応 <span class=\"todo-count\">${todos.length}</span></div>\n    ${todos.slice(0,8).map(t=>`<div class=\"todo-item\">\n      <span class=\"todo-ic ${t.type}\">${todoIcon(t.type)}</span>\n      <div class=\"todo-main\"><div class=\"todo-label\">${esc(t.label)}</div><div class=\"todo-sub\">${esc(t.sub)}</div></div>\n      <button class=\"todo-cta\" ${t.act}>${t.cta}</button>\n    </div>`).join('')}\n    ${todos.length>8?`<div class=\"todo-item\"><span class=\"todo-ic msg\" style=\"background:var(--gray-bg);color:var(--muted)\">＋</span><div class=\"todo-main\"><div class=\"todo-label\">ほか ${todos.length-8} 件</div></div></div>`:''}\n  </div>`;\n}\nfunction viewAgencyProjects(){\n  setHeader('案件一覧', '貴社に公開されている案件');\n  let pjs = agencyProjects(S.agencyId);\n  const c=document.getElementById('content');\n  const todoPanel=agencyTodoPanel();\n  if(!pjs.length){ c.innerHTML=`<div class=\"content-narrow\">${todoPanel}${emptyState('公開中の案件はありません','KANOAから案件が公開されると表示されます')}</div>`; return; }\n  const sortFns={\n    reward:(a,b)=>(effReward(b.id,S.agencyId).suc+effReward(b.id,S.agencyId).ref)-(effReward(a.id,S.agencyId).suc+effReward(a.id,S.agencyId).ref),\n    rate:(a,b)=>selData(projectReferrals(b.id)).docRate-selData(projectReferrals(a.id)).docRate,\n    new:(a,b)=>(b.created_at||'')<(a.created_at||'')?-1:1,\n  };\n  pjs=pjs.slice().sort(sortFns[pjSort]||sortFns.reward);\n  c.innerHTML = `\n    ${todoPanel}\n    <div class=\"chips\" style=\"margin-bottom:16px\">\n      <span class=\"meta-hint\" style=\"align-self:center;margin-right:4px\">並び替え</span>\n      <button class=\"chip ${pjSort==='reward'?'on':''}\" data-act=\"pj-sort\" data-s=\"reward\">報酬が高い順</button>\n      <button class=\"chip ${pjSort==='rate'?'on':''}\" data-act=\"pj-sort\" data-s=\"rate\">書類通過率が高い順</button>\n      <button class=\"chip ${pjSort==='new'?'on':''}\" data-act=\"pj-sort\" data-s=\"new\">新着順</button>\n    </div>\n    <div class=\"pj-grid\">${pjs.map(p=>{\n    const e=effReward(p.id,S.agencyId);\n    const mine=DB.referrals.filter(r=>r.pj===p.id && r.ag===S.agencyId);\n    const sd=selData(projectReferrals(p.id));\n    return `<div class=\"pj-card\" data-act=\"open-project-agency\" data-id=\"${p.id}\">\n      <div class=\"pj-card-top\"><div style=\"display:flex;gap:12px;min-width:0\">\n        <div class=\"pj-logo\" style=\"background:${p.color||'var(--accent)'}\">${esc(p.logo||p.name.slice(0,1))}</div>\n        <div style=\"min-width:0\"><div class=\"pj-name\">${esc(p.name)}</div><div class=\"pj-client\">${esc(p.client)}</div></div></div>\n        <div style=\"display:flex;align-items:center;gap:7px;flex-shrink:0\">\n          ${projUnreadCands(p.id)?`<span class=\"pj-unread\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z\"/></svg>新着 ${projUnreadCands(p.id)}名</span>`:''}\n          <span class=\"tag tag-open\">公開中</span></div></div>\n      <div class=\"pj-row\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/></svg>${esc(p.position)}</div>\n      <div class=\"pj-row\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"12\" y1=\"1\" x2=\"12\" y2=\"23\"/><path d=\"M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6\"/></svg>\n        ${p.rewardType==='success'\n          ? `<strong>${yen(e.suc)}</strong>/入社（成功報酬）`\n          : `<strong>${yen(e.ref)}</strong>/送客${p.rewardType==='both'?` ＋ ${yen(e.suc)}/入社`:''}`}</div>\n      <div class=\"pj-stats\"><div><div class=\"pj-stat-v\">${sd.docRate}%</div><div class=\"pj-stat-l\">書類通過率</div></div>\n        <div><div class=\"pj-stat-v\">${mine.filter(r=>r.status!=='rejected').length}</div><div class=\"pj-stat-l\">自社の送客</div></div>\n        <div><div class=\"pj-stat-v\" style=\"color:var(--g)\">${mine.filter(r=>r.status==='joined').length}</div><div class=\"pj-stat-l\">入社</div></div></div>\n    </div>`;\n  }).join('')}</div>`;\n}\nfunction viewAgencyProjectDetail(){\n  const p=project(S.detailId); if(!p){ go('pjlist'); return; }\n  const e=effReward(p.id,S.agencyId);\n  setHeader(p.name, p.client,\n    `<button class=\"btn btn-ghost btn-sm\" data-act=\"nav\" data-view=\"pjlist\">← 案件一覧</button>\n     <button class=\"btn btn-primary btn-sm\" data-act=\"new-referral\" data-id=\"${p.id}\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/></svg>候補者を送客</button>`);\n  const mine=DB.referrals.filter(r=>r.pj===p.id && r.ag===S.agencyId);\n  const c=document.getElementById('content');\n  c.innerHTML=`<div class=\"content-narrow\"><div class=\"detail-grid\">\n    <div>\n      <div class=\"dt-block\"><div class=\"dt-block-title\">案件概要</div><p style=\"font-size:13.5px;line-height:1.7;color:var(--ink-soft)\">${esc(p.summary)}</p></div>\n      ${p.conditions?`<div class=\"cond-card\"><div class=\"eyebrow\">送客条件 — 送客前に必ずご確認ください</div><p>${esc(p.conditions)}</p></div>`:''}\n      <div class=\"dt-block\"><div class=\"dt-block-title\">募集要項</div><dl class=\"kv\">\n        <dt>ポジション</dt><dd>${esc(p.position)}</dd><dt>雇用形態</dt><dd>${esc(p.employment)}</dd>\n        <dt>給与</dt><dd>${esc(p.salary)}</dd><dt>勤務地</dt><dd>${esc(p.location)}</dd></dl></div>\n      <div class=\"dt-block\"><div class=\"dt-block-title\">選考データ（全体）</div>${selDataCard(projectReferrals(p.id))}</div>\n      ${agentInfoBlock(p)}\n      <div class=\"dt-block\"><div class=\"dt-block-title\">求める人物像</div><ul class=\"req-list\">${(p.requirements||[]).map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>\n      <div class=\"dt-block\"><div class=\"dt-block-title\">選考フロー</div><div class=\"flow-steps\">${(p.flow||[]).map((f,i)=>`<div class=\"flow-step\"><div class=\"flow-num\">${i+1}</div><div class=\"flow-body\"><strong>${esc(f.t)}</strong><span>${esc(f.s)}</span></div></div>`).join('')}</div></div>\n      ${projectRichSections(p)}\n    </div>\n    <div>\n      <div class=\"reward-card\"><div class=\"eyebrow\">貴社の成果報酬</div>\n        ${p.rewardType==='success'\n          ? `<div class=\"reward-amt\"><span class=\"yen\">¥</span>${e.suc.toLocaleString('ja-JP')}<span class=\"unit\">/ 入社</span></div>`\n          : `<div class=\"reward-amt\"><span class=\"yen\">¥</span>${e.ref.toLocaleString('ja-JP')}<span class=\"unit\">/ 送客</span></div>\n             ${p.rewardType==='both'?`<div class=\"reward-split\"><div><div class=\"reward-split-v\">${yen(e.suc)}</div><div class=\"reward-split-l\">入社時 成功報酬</div></div></div>`:''}`}\n        ${p.rewardFormula?`<div class=\"cell-sub\" style=\"margin-top:10px;line-height:1.5;border-top:1px solid var(--line);padding-top:9px\">${esc(p.rewardFormula)}</div>`:''}\n      </div>\n      <button class=\"btn btn-primary btn-block\" data-act=\"new-referral\" data-id=\"${p.id}\">この案件に送客する</button>\n    </div>\n  </div>\n  <div class=\"sect\" style=\"margin-top:10px\"><div class=\"sect-head\"><div class=\"sect-title\">この案件への自社の送客（${mine.length}）</div></div>\n    <div class=\"panel tbl-wrap\">${referralTable(mine,{showAgency:false})}</div></div>\n  </div>`;\n}\nfunction viewMyRefs(){\n  setHeader('自社の送客', '送客した候補者の進捗',\n    `<button class=\"btn btn-ghost btn-sm\" data-act=\"bulk-import-wizard\" style=\"margin-right:8px\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"/><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/></svg>一括登録</button><button class=\"btn btn-primary btn-sm\" data-act=\"bulk-open\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M19 8v6M22 11h-6\"/></svg>候補者へ一括送信</button>`);\n  const rows=agencyReferrals(S.agencyId);\n  const c=document.getElementById('content');\n  c.innerHTML=`${urgentBannerHtml()}<div class=\"meta-row\"><span class=\"meta-count\">${rows.filter(r=>r.status!=='rejected').length} 名 送客中</span></div>\n    <div class=\"panel tbl-wrap\">${referralTable(rows,{showAgency:false})}</div>`;\n}\nfunction viewMyEarn(){\n  setHeader('成果・報酬', '貴社の成約と成果報酬の見込み');\n  const rows=agencyReferrals(S.agencyId);\n  const sent=rows.filter(r=>r.status!=='rejected').length;\n  const joined=rows.filter(r=>r.status==='joined').length;\n  const earn=rows.reduce((s,r)=>s+refEarning(r),0);\n  const sp=splitEarn(rows);\n  // ── 月次の成果報酬グラフ（KANOA収支と同じ見やすいデザインを採用）──\n  const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-(5-i));return d.toISOString().slice(0,7);});\n  const joinedRows=rows.filter(r=>r.status==='joined');\n  const earnM=months.map(m=>joinedRows.filter(r=>(r.joined||'').slice(0,7)===m).reduce((s,r)=>s+(refEarning(r)||0),0));\n  const cntM=months.map(m=>joinedRows.filter(r=>(r.joined||'').slice(0,7)===m).length);\n  const maxE=Math.max(1,...earnM);\n  const earnChart=`<svg viewBox=\"0 0 560 205\" style=\"width:100%;height:auto\" role=\"img\">\n    <text x=\"30\" y=\"14\" font-size=\"10\" fill=\"var(--accent)\">■ 成果報酬（入社月ベース）</text>\n    ${months.map((m,i)=>{\n      const x=44+i*80; const h=Math.round(earnM[i]/maxE*135);\n      return `<rect x=\"${x}\" y=\"${168-h}\" width=\"40\" height=\"${Math.max(h,1)}\" rx=\"5\" fill=\"var(--accent)\"><title>${m} ${yen(earnM[i])}（${cntM[i]}名）</title></rect>\n        <text x=\"${x+20}\" y=\"${162-h}\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--soft)\">${earnM[i]?('¥'+(earnM[i]/10000).toFixed(earnM[i]>=100000?0:1)+'万'):''}</text>\n        <text x=\"${x+20}\" y=\"186\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">${m.slice(5)}月</text>`;\n    }).join('')}\n  </svg>`;\n  const c=document.getElementById('content');\n  c.innerHTML=`<div class=\"content-narrow\">\n    <div class=\"earn-split\">\n      <div class=\"earn-pill confirmed\"><div class=\"el\"><span class=\"kpi-dot\" style=\"background:var(--g)\"></span>確定報酬</div><div class=\"ev\"><span class=\"yen\">¥</span>${sp.confirmed.toLocaleString('ja-JP')}</div></div>\n      <div class=\"earn-pill\"><div class=\"el\"><span class=\"kpi-dot\" style=\"background:var(--a)\"></span>見込み報酬</div><div class=\"ev\"><span class=\"yen\">¥</span>${sp.pipeline.toLocaleString('ja-JP')}</div></div>\n    </div>\n    <div class=\"kpi-grid\">\n      ${kpi('成果報酬（確定+見込み）','<span class=\"yen\">¥</span>'+earn.toLocaleString('ja-JP'),'var(--ink)')}\n      ${kpi('送客（有効）',sent+'<span class=\"unit\">名</span>','var(--b)')}\n      ${kpi('入社（成約）',joined+'<span class=\"unit\">名</span>','var(--g)')}\n      ${kpi('成約率',(sent?Math.round(joined/sent*100):0)+'<span class=\"unit\">%</span>','var(--accent)')}\n    </div>\n    <div class=\"sect\"><div class=\"sect-head\"><div class=\"sect-title\">成果報酬の月次推移（直近6ヶ月）</div></div>\n      <div class=\"panel\" style=\"padding:14px 16px 8px\">${earnChart}</div></div>\n    <div class=\"sect\"><div class=\"sect-head\"><div class=\"sect-title\">送客ごとの内訳</div></div>\n      <div class=\"panel tbl-wrap\"><table class=\"tbl\"><thead><tr><th>氏名</th><th>案件</th><th>ステータス</th><th class=\"num\">報酬</th></tr></thead><tbody>\n      ${rows.map(r=>`<tr><td class=\"cell-strong\">${esc(r.name)}</td><td><span class=\"tag\" style=\"font-size:10.5px\">${esc(project(r.pj).name.replace(' パートナー送客',''))}</span></td><td>${statusBadge(r.status)}</td><td class=\"num\">${refEarning(r)?yen(refEarning(r)):'<span class=\"cell-sub\">—</span>'}</td></tr>`).join('')}\n      </tbody></table></div></div></div>`;\n}\n\n/* ════════════════════ MESSAGES / CHAT ════════════════════ */\nlet threadFilter='all'; // all | unread\nlet pjSort='reward';\nlet msgFilter={ q:'', pj:'' }; // 連絡の検索語・案件フィルタ\n\nfunction shortPjName(pj){ const p=project(pj); return p?p.name.replace(' パートナー送客','').replace(' 送客',''):pj; }\nfunction agencyInProject(ag, pj){\n  if(!pj) return true;\n  if(DB.referrals.some(r=>r.ag===ag && r.pj===pj)) return true;\n  const a=assignment(pj,ag); return !!(a && a.published);\n}\nfunction lastAgMsg(ag, pj){\n  let ms=DB.messages.filter(m=>m.ag===ag && !m.deleted);\n  if(pj){ ms=ms.filter(m=>{ if(!m.refId) return false; const r=DB.referrals.find(x=>x.id===m.refId); return r && r.pj===pj; }); }\n  ms.sort((a,b)=>a.ts<b.ts?-1:1);\n  return ms[ms.length-1]||null;\n}\nfunction unreadAgPj(ag, pj){\n  return DB.messages.filter(m=>{\n    if(m.ag!==ag||m.from!=='agency'||m.read) return false;\n    if(pj){ if(!m.refId) return false; const r=DB.referrals.find(x=>x.id===m.refId); return r&&r.pj===pj; }\n    return true;\n  }).length;\n}\nfunction msgAgRow(a, pj){\n  const last=lastAgMsg(a.id,pj);\n  const un=pj?unreadAgPj(a.id,pj):unreadKanoaBy(a.id);\n  const lastRef=last&&last.refId?DB.referrals.find(r=>r.id===last.refId):null;\n  const ctxLabel=lastRef?`<span class=\"tag\" style=\"font-size:9.5px;margin-right:5px\">${esc(lastRef.name)}</span>`:(last&&!last.refId&&last.text?'<span class=\"tag\" style=\"font-size:9.5px;margin-right:5px;background:var(--gray-bg)\">全体</span>':'');\n  return `<div class=\"thread-item\" data-act=\"open-thread\" data-ag=\"${a.id}\">\n    <div class=\"thread-av\" style=\"background:${agColor(a.id)}\">${esc(a.name.slice(0,1))}</div>\n    <div class=\"thread-main\"><div class=\"thread-name\">${esc(a.name)}${un?'<span style=\"width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:7px\"></span>':''}</div>\n      <div class=\"thread-last\" style=\"${un?'color:var(--ink);font-weight:500':''}\">${ctxLabel}${last?(last.from==='kanoa'?'自社: ':'')+esc(last.text):(pj?'この案件のやり取りはまだありません':'メッセージはまだありません')}</div></div>\n    <div class=\"thread-meta\"><span class=\"thread-time\">${last?esc(last.ts.slice(5,16)):''}</span>${un?`<span class=\"unread-dot\">${un}</span>`:`<button class=\"copy-btn\" data-act=\"mark-unread\" data-ag=\"${a.id}\" style=\"padding:3px 7px\">未読に</button>`}</div>\n  </div>`;\n}\nfunction msgCandRow(r){\n  const a=agency(r.ag); const ms=subThread(r.ag, r.id); const last=ms[ms.length-1];\n  const un=subUnread(r.ag, r.id, 'kanoa');\n  return `<div class=\"thread-item\" data-act=\"open-cand-thread\" data-ag=\"${r.ag}\" data-ref=\"${r.id}\">\n    <div class=\"thread-av\" style=\"background:${agColor(r.ag)}\">${esc((r.name||'？').slice(0,1))}</div>\n    <div class=\"thread-main\"><div class=\"thread-name\">${esc(r.name)} ${statusBadge(r.status)}</div>\n      <div class=\"thread-last\"><span class=\"thread-pj-tag\">${esc(shortPjName(r.pj))}</span>${esc(a?a.name:r.ag)}${last?' · '+esc((last.text||'').slice(0,28)):''}</div></div>\n    <div class=\"thread-meta\">${un?`<span class=\"unread-dot\">${un}</span>`:`<span class=\"thread-time\">候補者</span>`}</div>\n  </div>`;\n}\nfunction renderMsgList(){\n  const wrap=document.getElementById('msgListWrap'); if(!wrap) return;\n  const q=(msgFilter.q||'').trim(); const ql=q.toLowerCase(); const pj=msgFilter.pj;\n  const activeAgs=DB.agencies.filter(a=>a.status!=='pending');\n  if(q){\n    // 候補者・パートナーを横断検索\n    const cands=DB.referrals.filter(r=>{\n      if(pj && r.pj!==pj) return false;\n      const a=agency(r.ag); if(!a||a.status==='pending') return false;\n      return (r.name||'').toLowerCase().includes(ql)||(r.kana||'').toLowerCase().includes(ql)||(r.email||'').toLowerCase().includes(ql);\n    }).sort((a,b)=> a.name<b.name?-1:1).slice(0,50);\n    const ags=activeAgs.filter(a=>agencyInProject(a.id,pj) && (a.name.toLowerCase().includes(ql)||(a.contact||'').toLowerCase().includes(ql)));\n    let h='';\n    if(cands.length) h+=`<div class=\"msg-sec\">候補者 ${cands.length}</div><div class=\"panel\">${cands.map(msgCandRow).join('')}</div>`;\n    if(ags.length)   h+=`<div class=\"msg-sec\">パートナー ${ags.length}</div><div class=\"panel\">${ags.map(a=>msgAgRow(a,pj)).join('')}</div>`;\n    wrap.innerHTML = (cands.length||ags.length)? h : emptyState('該当する候補者・パートナーがありません','検索条件を変えてみてください');\n    return;\n  }\n  let ags=activeAgs.filter(a=>{ try{ return agencyInProject(a.id,pj); }catch(e){ return !pj; } });\n  if(threadFilter==='unread') ags=ags.filter(a=>{ try{ return (pj?unreadAgPj(a.id,pj):unreadKanoaBy(a.id))>0; }catch(e){ return false; } });\n  const list=ags.map(a=>{ let un=0,last=null; try{ un=(pj?unreadAgPj(a.id,pj):unreadKanoaBy(a.id))||0; }catch(e){} try{ last=lastAgMsg(a.id,pj); }catch(e){} return {a, un, last}; })\n    .sort((x,y)=>(y.un-x.un)||((x.last&&x.last.ts?x.last.ts:'')<(y.last&&y.last.ts?y.last.ts:'')?1:-1));\n  // 各行の描画は個別に防御（1社のデータ不整合で一覧全体が消えるのを防ぐ）\n  const rowsHtml = list.map(({a})=>{ try{ return msgAgRow(a,pj); }catch(e){ return `<div class=\"thread-item\" data-act=\"open-thread\" data-ag=\"${esc(a.id)}\"><div class=\"thread-av\" style=\"background:#94a3b8\">${esc((a.name||'?').slice(0,1))}</div><div class=\"thread-main\"><div class=\"thread-name\">${esc(a.name||a.id)}</div></div></div>`; } }).join('');\n  wrap.innerHTML = list.length\n    ? `<div class=\"panel\">${rowsHtml}</div>`\n    : emptyState(pj?'この案件のやり取りはまだありません':(threadFilter==='unread'?'未読はありません':'パートナーがありません'), pj?'別の案件を選ぶか、候補者を検索してください':'すべて確認済みです');\n}\nfunction viewMessages(){\n  if(S.role==='kanoa'){\n    if(S.threadAg){ renderConversation(S.threadAg,'kanoa'); return; }\n    const totalUnread=unreadKanoa();\n    setHeader('連絡', 'パートナー・候補者とのやり取り',\n      `${totalUnread?`<button class=\"btn btn-ghost btn-sm\" data-act=\"jump-unread\">未読へ移動</button>`:''}\n       <button class=\"btn btn-ghost btn-sm\" data-act=\"mark-all-read\">すべて既読</button>\n       <button class=\"btn btn-ghost btn-sm\" data-act=\"bulk-open\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M19 8v6M22 11h-6\"/></svg>候補者へ一括送信</button>\n       <button class=\"btn btn-primary btn-sm\" data-act=\"broadcast\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l19-9-9 19-2-8-8-2z\"/></svg>一斉連絡</button>`);\n    const projects=DB.projects;\n    const unreadCount=DB.agencies.filter(a=>unreadKanoaBy(a.id)>0).length;\n    const c=document.getElementById('content');\n    c.innerHTML=`<div class=\"content-narrow\">\n      <div class=\"msg-search-wrap\">\n        <svg class=\"msg-search-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"M21 21l-4.35-4.35\"/></svg>\n        <input id=\"msgSearch\" class=\"msg-search\" value=\"${esc(msgFilter.q)}\" placeholder=\"候補者名・パートナー名で検索…\" autocomplete=\"off\">\n        ${msgFilter.q?`<button class=\"msg-search-clear\" data-act=\"msg-search-clear\">×</button>`:''}\n      </div>\n      ${projects.length>1?`<div class=\"chips\" style=\"margin-bottom:10px\">\n        <button class=\"chip ${!msgFilter.pj?'on':''}\" data-act=\"msg-pj\" data-pj=\"\">すべて案件</button>\n        ${projects.map(p=>{ const nm=shortPjName(p.id); const lbl=nm.length>9?nm.slice(0,9)+'…':nm; return `<button class=\"chip ${msgFilter.pj===p.id?'on':''}\" data-act=\"msg-pj\" data-pj=\"${p.id}\" title=\"${esc(nm)}\">${esc(lbl)} <b>${DB.referrals.filter(r=>r.pj===p.id).length}</b></button>`; }).join('')}\n      </div>`:''}\n      <div class=\"chips\" style=\"margin-bottom:14px\">\n        <button class=\"chip ${threadFilter==='all'?'on':''}\" data-act=\"thread-filter\" data-f=\"all\">すべて</button>\n        <button class=\"chip ${threadFilter==='unread'?'on':''}\" data-act=\"thread-filter\" data-f=\"unread\">未読 <b>${unreadCount}</b></button>\n      </div>\n      <div id=\"msgListWrap\"></div>\n    </div>`;\n    renderMsgList();\n  } else {\n    renderConversation(S.agencyId,'agency');\n  }\n}\nfunction msgSenderName(m, viewer){ if(m.from==='kanoa') return 'KANOA'; const a=agency(m.ag); return a?a.name:m.ag; }\n/* 候補者スレッドを開く（新規送客登録 / 既存の送客から選択） */\nfunction modalNewSubthread(ag){\n  const refs=agencyReferrals(ag).filter(r=>r.status!=='rejected');\n  const openRefs=subThreadKeys(ag); // 既にスレッドがある送客\n  const isK = S.role==='kanoa';\n  const defPj = (isK && msgFilter.pj) ? msgFilter.pj : ((DB.projects[0]&&DB.projects[0].id)||'');\n  const agName = esc(agency(ag)?agency(ag).name:ag);\n\n  // 新規登録（KANOAのみ）— 大きく目立つ主役ボタン\n  const newCTA = isK\n    ? `<button class=\"btn btn-primary btn-block\" data-act=\"new-ref-for-ag\" data-ag=\"${ag}\" data-pj=\"${defPj}\" style=\"justify-content:flex-start;gap:10px;padding:13px 14px;height:auto\">\n        <span style=\"width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:18px;line-height:1\">＋</span>\n        <span style=\"text-align:left;line-height:1.3\"><span style=\"font-weight:700;font-size:13.5px\">新しい候補者を送客登録</span><br><span style=\"font-weight:500;font-size:11px;opacity:.85\">${agName} の送客として登録 → そのままスレッドを開く</span></span>\n      </button>`\n    : '';\n\n  const listRows = refs.map(r=>{ const p=project(r.pj); const has=openRefs.includes(r.id);\n    const pjName=esc((p?p.name:r.pj).replace(' パートナー送客',''));\n    return `<button class=\"info-row sub-pick-row\" data-search=\"${esc((r.name||'')+' '+pjName)}\" style=\"width:100%;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer;text-align:left;background:var(--surface)\" data-act=\"pick-subthread-ref\" data-ref=\"${r.id}\">\n      <div class=\"thread-av\" style=\"width:34px;height:34px;font-size:13px;background:${agColor(ag)}\">${esc((r.name||'？').slice(0,1))}</div>\n      <div class=\"info-val\"><strong style=\"font-weight:600\">${esc(r.name)}</strong> ${statusBadge(r.status)}\n        <div class=\"cell-sub\">${pjName}${has?' · スレッドあり':''}</div></div>\n    </button>`;\n  }).join('');\n\n  const searchBox = refs.length>4\n    ? `<input id=\"subSearch\" placeholder=\"候補者名・案件で検索\" autocomplete=\"off\" style=\"width:100%;padding:9px 12px;border:1px solid var(--line-2);border-radius:8px;margin-bottom:10px;font-size:13px;outline:none\">`\n    : '';\n\n  showModal(`\n    <div class=\"modal-title\">候補者スレッドを開く</div>\n    <div class=\"modal-sub\">${agName} ${isK?'｜ 新しく登録するか、既存の送客から選べます':'｜ 連絡したい送客を選んでください'}</div>\n    ${newCTA?`<div style=\"margin:6px 0 4px\">${newCTA}</div>\n      <div style=\"display:flex;align-items:center;gap:10px;margin:14px 0 10px\"><div style=\"flex:1;height:1px;background:var(--line)\"></div><span class=\"cell-sub\" style=\"font-size:11px\">または既存の送客から開く</span><div style=\"flex:1;height:1px;background:var(--line)\"></div></div>`:''}\n    ${refs.length?`${searchBox}<div id=\"subPickList\" style=\"max-height:42vh;overflow-y:auto;margin:0 -4px;padding:0 4px\">${listRows}</div>`\n      : `<div class=\"cell-sub\" style=\"padding:6px 2px 4px\">${agName} の送客はまだありません。${isK?'上のボタンから登録できます。':'送客が登録されると、候補者ごとにスレッドを分けて連絡できます。'}</div>`}\n    <div class=\"modal-actions\"><button class=\"btn btn-ghost\" data-act=\"closemodal\">閉じる</button></div>`);\n  const ss=document.getElementById('subSearch'); if(ss) ss.focus();\n}\n/* 送客スレッドのサブナビを描画 */\nfunction subThreadNav(ag, viewer, curRef){\n  let refIds=subThreadKeys(ag);\n  // 案件フィルタが有効なら、その案件の候補者だけに絞る（KANOAのみ）\n  const pjF = (viewer==='kanoa') ? msgFilter.pj : '';\n  if(pjF) refIds=refIds.filter(rid=>{ const r=DB.referrals.find(x=>x.id===rid); return r && r.pj===pjF; });\n  // 今開いている候補者は（メッセージ未送信でも）必ず表示\n  if(curRef && !refIds.includes(curRef)){ const r=DB.referrals.find(x=>x.id===curRef); if(r) refIds=[curRef, ...refIds]; }\n  // 送客スレッドを最新メッセージ順に\n  const items=refIds.map(rid=>{\n    const r=DB.referrals.find(x=>x.id===rid);\n    const ms=subThread(ag, rid);\n    const last=ms[ms.length-1];\n    return { rid, r, last, un:subUnread(ag, rid, viewer), t:last?last.ts:'' };\n  }).filter(x=>x.r).sort((a,b)=> (b.un-a.un) || (a.t<b.t?1:-1));\n  const genUn=subUnread(ag, null, viewer);\n  const genActive=(curRef||null)===null;\n  // 縦の候補者レール\n  let html=`<aside class=\"cand-rail\">\n    <div class=\"cand-rail-head\"><span>送客スレッド <b>${items.length}</b></span>\n      <button class=\"cand-add\" data-act=\"new-subthread\" data-ag=\"${ag}\" title=\"候補者を追加\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/></svg></button>\n    </div>\n    <div class=\"cand-rail-list\">`;\n  // 全体連絡\n  html+=`<button class=\"cand-item ${genActive?'on':''}\" data-act=\"open-subthread\" data-ag=\"${ag}\" data-ref=\"\">\n    <span class=\"ci-dot\" style=\"background:var(--ink)\"></span>\n    <span class=\"ci-main\"><span class=\"ci-name\">全体連絡</span><span class=\"ci-sub\">案件に紐づかない連絡</span></span>\n    ${genUn?`<span class=\"ci-un\">${genUn}</span>`:''}\n  </button>`;\n  // 送客スレッド（候補者ごと・縦並び）\n  items.forEach(({rid,r,un})=>{\n    const on=(curRef||null)===rid;\n    const stColor=STATUS[r.status]?`var(--${STATUS[r.status].cls==='joined'?'g':STATUS[r.status].cls==='rejected'?'r':STATUS[r.status].cls==='offer'?'v':STATUS[r.status].cls==='interview'?'a':STATUS[r.status].cls==='screening'?'b':'gray'})`:'var(--gray)';\n    const ds=docStat(r);\n    const needDocs = (
