/* ════════════════════ カスケード削除（KANOAをマスターに） ════════════════════ */
/* 候補者を削除すると、紐付く書類・メッセージ・請求・履歴・退職情報も連動削除。
   KANOA側の操作を基準に、パートナー側の関連データも消える。 */
function cascadeDeleteReferral(refId){
  const r=DB.referrals.find(x=>x.id===refId);
  const name=r?r.name:'';
  // 1) 紐付く書類（documents）— Storage実体も含めて削除
  const docs=(DB.documents||[]).filter(d=>d.refId===refId || d.ref===refId || d.referral_id===refId);
  docs.forEach(d=>{ try{ if(!DEMO_MODE && d.id) SUPA.delRow('documents','id',d.id); }catch(e){} });
  if(DB.documents) DB.documents=DB.documents.filter(d=>!(d.refId===refId||d.ref===refId||d.referral_id===refId));

  // 2) 候補者に紐付くメッセージ（ref_id）
  const msgs=(DB.messages||[]).filter(m=>m.refId===refId||m.ref_id===refId);
  msgs.forEach(m=>{ try{ if(!DEMO_MODE && m.id) SUPA.delRow('messages','id',m.id); }catch(e){} });
  DB.messages=(DB.messages||[]).filter(m=>!(m.refId===refId||m.ref_id===refId));

  // 3) 候補者に紐付くタスク
  const tasks=(DB.tasks||[]).filter(t=>t.refId===refId||t.ref_id===refId);
  tasks.forEach(t=>{ try{ if(!DEMO_MODE && t.id) SUPA.delRow('tasks','id',t.id); }catch(e){} });
  DB.tasks=(DB.tasks||[]).filter(t=>!(t.refId===refId||t.ref_id===refId));

  // 4) この候補者を含む請求（通常・返金）— 明細から除去し、空になれば請求ごと削除
  ensureInvoices();
  const affected=[];
  DB.invoices.forEach(v=>{
    if((v.items||[]).some(it=>it.refId===refId)){
      v.items=v.items.filter(it=>it.refId!==refId);
      v.subtotal=(v.items||[]).reduce((sm,it)=>sm+it.amount,0);
      v.total=v.subtotal+(v.tax||0);
      affected.push(v);
    }
  });
  const emptied=DB.invoices.filter(v=>affected.includes(v) && (!v.items||!v.items.length));
  emptied.forEach(v=>{ try{ if(!DEMO_MODE && v.id) SUPA.delRow('invoices','id',v.id); }catch(e){} });
  DB.invoices=DB.invoices.filter(v=>!emptied.includes(v));

  // 5) 操作履歴（reflog）
  const logs=(DB.reflog||[]).filter(l=>l.refId===refId);
  logs.forEach(l=>{ try{ if(!DEMO_MODE && l.id) SUPA.delRow('reflog','id',l.id); }catch(e){} });
  DB.reflog=(DB.reflog||[]).filter(l=>l.refId!==refId);

  // 6) 候補者本体（referrals）— 退職・返金情報はreferral内なので同時に消える
  DB.referrals=DB.referrals.filter(x=>x.id!==refId);
  try{ if(!DEMO_MODE) SUPA.delRow('referrals','id',refId); }catch(e){}

  return { name, docs:docs.length, msgs:msgs.length, tasks:tasks.length, invoices:affected.length };
}

/* ════════════════════ パートナー招待リンク（自動注入） ════════════════════ */
/* ════════════════════════════════════════════════════════════
   パートナー招待リンク（URL発行 → 受諾 → パスワード設定）
   ─────────────────────────────────────────────────────────────
   ・KANOAがパートナーごとに招待URLを発行
   ・URL形式: <origin>/?invite=<agencyId>&token=<ランダム>
   ・7日で失効
   ・パートナーがURLを開く → 会社名確認 → 自分でパスワード設定 → 完了
   ════════════════════════════════════════════════════════════ */

const INVITE_TTL_DAYS = 7;

/* ランダムトークン生成 */
function genInviteToken(){
  const arr=new Uint8Array(18);
  (window.crypto||{}).getRandomValues ? crypto.getRandomValues(arr) : arr.forEach((_,i)=>arr[i]=Math.floor(Math.random()*256));
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* 招待リンクを発行（トークンと発行日時をパートナーに保存） */
function issueInviteLink(agId){
  const a=agency(agId); if(!a) return null;
  a.inviteToken=genInviteToken();
  a.inviteIssuedAt=new Date().toISOString();
  a.inviteUsedAt=null;
  save();
  return buildInviteUrl(a);
}

/* パートナーの現在の招待URLを組み立て（無ければnull） */
function buildInviteUrl(a){
  if(!a || !a.inviteToken) return null;
  const base=location.origin + location.pathname;
  return `${base}?invite=${encodeURIComponent(a.id)}&token=${encodeURIComponent(a.inviteToken)}`;
}

/* トークンの有効性を判定 */
function inviteState(a){
  if(!a || !a.inviteToken) return 'none';
  if(a.inviteUsedAt) return 'used';
  if(a.inviteIssuedAt){
    const ageDays=(Date.now() - new Date(a.inviteIssuedAt).getTime())/86400000;
    if(ageDays > INVITE_TTL_DAYS) return 'expired';
  }
  return 'valid';
}
function inviteExpiryLabel(a){
  if(!a.inviteIssuedAt) return '';
  const exp=new Date(new Date(a.inviteIssuedAt).getTime()+INVITE_TTL_DAYS*86400000);
  return TZ_toLocalDay(exp);
}

/* KANOA: パートナー詳細に出す招待リンクのUI */
function agInviteBadge(a){
  if(a.status==='suspended') return '<span class="tag" style="background:var(--gray-bg);color:var(--muted);font-weight:600">停止中</span>';
  const stt=inviteState(a);
  if(stt==='used' || a.pwHash) return '<span class="tag" style="background:#E8F6EE;color:#15803D;font-weight:600">設定完了</span>';
  if(stt==='valid'){ const d=Math.max(0, Math.ceil(INVITE_TTL_DAYS - (Date.now()-new Date(a.inviteIssuedAt).getTime())/86400000)); return `<span class="tag" style="background:#FDF2E2;color:#B45309;font-weight:600">招待中・あと${d}日</span>`; }
  if(stt==='expired') return '<span class="tag" style="background:#FDEEF1;color:#BE123C;font-weight:600">期限切れ</span>';
  return '<span class="tag" style="background:var(--gray-bg);color:var(--muted)">未招待</span>';
}
function inviteLinkPanel(a){
  const stt=inviteState(a);
  const url=buildInviteUrl(a);
  if(stt==='none'){
    return `<div style="margin-top:6px">
      <button class="btn btn-primary btn-sm" data-act="issue-invite" data-ag="${a.id}">招待リンクを発行</button>
    </div>`;
  }
  const badge = stt==='valid' ? `<span class="tag" style="background:#E8F6EE;color:#15803D;font-weight:600">有効 · ${inviteExpiryLabel(a)}まで</span>`
    : stt==='used' ? '<span class="tag" style="background:#EFF4FF;color:#1D4ED8;font-weight:600">設定完了</span>'
    : '<span class="tag" style="background:#FDEEF1;color:#BE123C;font-weight:600">期限切れ</span>';
  return `<div style="margin-top:6px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">${badge}</div>
    ${stt!=='used'?`<div style="display:flex;gap:6px;align-items:center">
      <input readonly value="${esc(url)}" onclick="this.select()" style="flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:11.5px;font-family:var(--mono);color:var(--soft)">
      <button class="btn btn-ghost btn-sm" data-act="copy-invite" data-ag="${a.id}">コピー</button>
    </div>
    <div style="margin-top:8px"><button class="btn btn-ghost btn-sm" data-act="issue-invite" data-ag="${a.id}">再発行</button></div>`
    : `<div class="cell-sub">このパートナーはパスワード設定済みです。ログインできなくなった場合は、再設定リンクを発行して送ってください（本人が新しいパスワードを設定します）。</div>
    <div style="margin-top:8px"><button class="btn btn-ghost btn-sm" data-act="issue-invite" data-ag="${a.id}">パスワード再設定リンクを発行</button></div>`}
  </div>`;
}

/* コピー処理 */
function copyInviteLink(agId){
  const a=agency(agId); const url=buildInviteUrl(a);
  if(!url){ toast('リンクがありません'); return; }
  try{
    navigator.clipboard.writeText(url).then(()=>toast('招待リンクをコピーしました'),()=>fallbackCopy(url));
  }catch(e){ fallbackCopy(url); }
}
function fallbackCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('招待リンクをコピーしました'); }catch(e){ toast('コピーできませんでした'); }
  document.body.removeChild(ta);
}

async function acceptInvite(agId){
  const a=agency(agId); if(!a) return;
  const p1=document.getElementById('invPw1').value||'';
  const p2=document.getElementById('invPw2').value||'';
  const err=m=>{ const e=document.getElementById('invErr'); if(e)e.textContent=m; };
  if(p1.length<8){ err('パスワードは8文字以上にしてください'); return; }
  if(!/[a-zA-Z]/.test(p1)||!/[0-9]/.test(p1)){ err('英字と数字を両方含めてください'); return; }
  if(p1!==p2){ err('パスワードが一致しません'); return; }
  try{
    const hash=await hashPwAsync(p1);
    a.pwHash=hash;
    a.status='active';
    a.inviteUsedAt=new Date().toISOString();
    if(!DEMO_MODE){
      try{
        const sb=await SUPA.ensureClient();
        await sb.from('agencies').update({pw_hash:hash,status:'active',invite_used_at:a.inviteUsedAt}).eq('id',a.id);
      }catch(e){}
    } else { save(); }
    toast('パスワードを設定しました。ログインします。');
    try{ history.replaceState(null,'',location.pathname); }catch(e){}
    if(!DEMO_MODE){ try{ DB=await SUPA.loadAll(); }catch(e){} }
    S.role='agency'; S.agencyId=a.id; S.view='pjlist';
    if(typeof enterApp==='function'){ enterApp(); } else { location.href=location.pathname; }
  }catch(e){ err('設定に失敗しました。もう一度お試しください。'); }
}

async function bulkRegSubmit(){
  syncBulkRowsFromDom();
  const isK=S.role==='kanoa';
  const valid = bulkRegRows.filter(r=>r.name && r.name.trim());
  if(!valid.length){ toast('氏名を入力した行がありません'); return; }
  let n=0; const skipped=[]; const badPhone=[];
  for(const row of valid){
    const ag = isK ? 'AG-01' : S.agencyId;  // KANOA一括時は既定。通常はパートナー
    const _e=phoneError(row.phone||'', true);
    if(_e){ badPhone.push(row.name.trim()); return; }   // 電話番号が未入力/不正 → 登録しない
    const _p=formatPhoneJP(row.phone||'');
    const _d=findPhoneDuplicate(_p);
    if(_d){ skipped.push(row.name.trim()); return; }    // 電話番号が既存と重複 → 登録しない
    const r=mk(row.pj, ag, row.name.trim(), row.kana||'', _p, row.email||'', '', row.area||'', 'entry','—', todayISO());
    r.src=row.src||'';
    if(!isK) r.seenK=false;
    DB.referrals.unshift(r);
    // DBに確定登録。重複ならこの1件だけスキップし、他の行は続行する
    if(!DEMO_MODE){
      const res=await SUPA.insertReferral(r);
      if(res){
        const i=DB.referrals.findIndex(x=>x.id===r.id); if(i>=0) DB.referrals.splice(i,1);
        skipped.push(row.name.trim());
        continue;
      }
    }
    if(typeof logRef==='function') logRef(r.id,'送客登録','一括登録');
    n++;
  }
  DB.activity.unshift({ts:nowTS(),actor:isK?'KANOA':S.agencyId,action:'一括送客登録',detail:`${n}名を送客登録`});
  save(); closeModal(); updateNavCounts();
  const _msgs=[];
  if(skipped.length)  _msgs.push(`${skipped.length}名は電話番号が既に登録済み（${skipped.slice(0,2).join('、')}${skipped.length>2?' ほか':''}）`);
  if(badPhone.length) _msgs.push(`${badPhone.length}名は電話番号が未入力/不正（${badPhone.slice(0,2).join('、')}${badPhone.length>2?' ほか':''}）`);
  toast(_msgs.length ? `${n}名を登録しました。${_msgs.join(' / ')}` : `${n}名を一括登録しました`);
  render();
}


/* ════════════════════ SPI・コンプラ受検管理（自動注入） ════════════════════ */
/* ════════════════════════════════════════════════════════════
   SPI・コンプライアンスチェック 受検管理
   楽天案件で、書類選考が終わり選考会が決まったタイミングで、
   本人がSPI／コンプライアンスチェックを受検済みかを管理する。
   ════════════════════════════════════════════════════════════ */

const CHECK_STATUS = {
  none:      { label:'未案内',   color:'#6B7280', bg:'#F3F4F6' },
  sent:      { label:'案内済み', color:'#B45309', bg:'#FDF2E2' },
  done:      { label:'受検済み', color:'#15803D', bg:'#E8F6EE' },
};
function checkBadge(v){ const x=CHECK_STATUS[v||'none']||CHECK_STATUS.none;
  return `<span class="tag" style="background:${x.bg};color:${x.color};font-weight:600">${x.label}</span>`; }

/* SPI/コンプラの管理対象か（楽天案件 & 書類選考以降 & 見送り/辞退でない） */
/* この案件でSPI・コンプラの受検管理を行うか。
   案件編集で明示的にON/OFFできる（checksEnabled）。
   未設定の案件は従来どおり「楽天案件のみ対象」として扱う（既存の動きを変えない）。
   ※以前は楽天案件かどうかだけで判定していたため、案件編集モーダルから作った案件では
     楽天フラグが付かず、受検欄がどの候補者にも出ない状態になっていた。 */
function projectChecksOn(pj){
  const p=project(pj); if(!p) return false;
  if(p.checksEnabled===true)  return true;
  if(p.checksEnabled===false) return false;
  return isRakutenProject(pj);
}
function needsChecks(r){
  if(!projectChecksOn(r.pj)) return false;
  const idx=STATUS_ORDER.indexOf(r.status);
  const scr=STATUS_ORDER.indexOf('screening');
  return idx>=scr && r.status!=='rejected' && r.status!=='declined';
}

/* 受検ステータスを進める（none→sent→done を循環的にセット） */
function setCheckStatus(refId, which, value){
  const r=DB.referrals.find(x=>x.id===refId); if(!r) return;
  const key = which==='spi' ? 'spi' : 'compliance';
  r[key]=value;
  const nm = which==='spi' ? 'SPI' : 'コンプライアンスチェック';
  if(typeof logRef==='function') logRef(r.id, `${nm}：${(CHECK_STATUS[value]||{}).label||value}`, '');
  save();
  if(document.querySelector('.drawer.on, .overlay.on')){ try{ openRefDrawer(refId); }catch(e){} }
  else render();
}

/* 候補者詳細に出す受検管理ブロック（KANOA・パートナー共通） */
function checksBlock(r){
  if(!needsChecks(r)) return '';
  const rowFor=(which,label)=>{
    const cur = which==='spi' ? (r.spi||'none') : (r.compliance||'none');
    const btn=(v,txt)=>`<button class="btn ${cur===v?'btn-primary':'btn-ghost'} btn-sm" data-act="set-check" data-ref="${r.id}" data-which="${which}" data-val="${v}" style="padding:4px 10px">${txt}</button>`;
    return `<div class="info-row" style="align-items:center">
      <span class="info-label">${label}</span>
      <span class="info-val" style="display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap">
        ${checkBadge(cur)}
        <span style="display:inline-flex;gap:4px;margin-left:4px">${btn('none','未案内')}${btn('sent','案内済み')}${btn('done','受検済み')}</span>
      </span></div>`;
  };
  return `<div class="dt-block-title" style="margin-top:16px">SPI・コンプライアンスチェック</div>
    <div class="cell-sub" style="margin:-2px 0 8px">楽天から案内される適性検査です。選考会前に受検状況を管理します。</div>
    <div class="info-card">
      ${rowFor('spi','SPI')}
      ${rowFor('compliance','コンプライアンスチェック')}
    </div>`;
}

/* ════════════════════ 一括登録：CSV/Excel（自動注入） ════════════════════ */
/* ════════════════════════════════════════════════════════════
   一括登録ウィザード（CSV / Excel）＋ 単体登録の全面ドラッグ&ドロップ対応
   ════════════════════════════════════════════════════════════ */

/* ── 列の自動マッピング ─────────────────────────────
   スプレッドシートのヘッダー文字列から、システムのフィールドを推定する。 */
const FIELD_ALIASES = {
  name:  ['氏名','名前','お名前','氏名（フルネーム）','フルネーム','name','fullname','full name'],
  kana:  ['フリガナ','ふりがな','カナ','かな','kana','furigana'],
  phone: ['電話','電話番号','携帯','携帯電話','tel','phone','telephone','mobile'],
  email: ['メール','メールアドレス','email','mail','e-mail'],
  area:  ['エリア','希望エリア','勤務地','勤務地希望','希望勤務地','area','location'],
  address:['住所','現住所','address'],
  src:   ['集客元','流入元','経路','媒体','集客経路','source','src','channel'],
  project:['案件','案件名','応募案件','希望案件','project','job','position'],
};
function normalizeHeader(h){
  return String(h||'').trim().toLowerCase().replace(/[\s　_\-（）()]/g,'');
}
function autoMapColumns(headers){
  const map={};  // headerIndex -> fieldKey
  const usedFields=new Set();
  headers.forEach((h,idx)=>{
    const nh=normalizeHeader(h);
    if(!nh) return;
    for(const [field,aliases] of Object.entries(FIELD_ALIASES)){
      if(usedFields.has(field)) continue;
      if(aliases.some(a=>normalizeHeader(a)===nh)){ map[idx]=field; usedFields.add(field); return; }
    }
    // 部分一致（第2優先）
    for(const [field,aliases] of Object.entries(FIELD_ALIASES)){
      if(usedFields.has(field)) continue;
      if(aliases.some(a=>{const na=normalizeHeader(a); return na.length>=2 && (nh.includes(na)||na.includes(nh));})){
        map[idx]=field; usedFields.add(field); return;
      }
    }
  });
  return map;  // {0:'name', 2:'phone', ...}
}

/* ── 電話番号の正規化（重複検出用） ── */
function normPhone(p){
  // 全角数字・全角ハイフンも半角化してから数字だけ残す（表記ゆれ対策）
  const z=String(p||'').replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  return z.replace(/[^0-9]/g,'');
}
/* 電話番号を日本の一般的なハイフン付き表記に自動整形する。
   例) 09012345678 → 090-1234-5678 / 0312345678 → 03-1234-5678 */
function formatPhoneJP(p){
  const d=normPhone(p);
  if(!d) return '';
  // 携帯・IP電話・フリーダイヤル（070/080/090/050/0120 等）: 3-4-4
  if(/^(070|080|090|050)\d{8}$/.test(d)) return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
  if(/^0120\d{6}$/.test(d))  return '0120-'+d.slice(4,7)+'-'+d.slice(7);
  if(/^0800\d{7}$/.test(d))  return '0800-'+d.slice(4,7)+'-'+d.slice(7);
  // 東京03・大阪06: 2-4-4
  if(/^0[36]\d{8}$/.test(d)) return d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6);
  // その他の固定電話(10桁): 3-3-4（市外局番の桁数は地域差があるため近似）
  if(/^0\d{9}$/.test(d))     return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
  return d;   // 想定外の桁数はそのまま数字で返す（検証側で弾く）
}
/* 電話番号の妥当性チェック。OKなら null、NGならエラーメッセージを返す */
function phoneError(p, required){
  const d=normPhone(p);
  if(!d) return required ? '電話番号を入力してください' : null;
  if(!/^0/.test(d))           return '電話番号は0から始まる番号を入力してください';
  if(d.length<10 || d.length>11) return '電話番号の桁数が正しくありません（10桁または11桁）';
  return null;
}
function normEmail(e){ return String(e||'').trim().toLowerCase(); }

/* ── 行データの検証 ──
   必須: 氏名のみ。メール形式・重複（既存データ＋アップロード内）を検出。 */
function validateBulkRow(row, idx, allRows, existingRefs){
  const issues=[];
  if(!row.name || !String(row.name).trim()) issues.push({level:'error', msg:'氏名が未入力です'});
  { const _pe=phoneError(row.phone||'', true); if(_pe) issues.push({level:'error', msg:_pe}); }
  if(row.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(row.email)) issues.push({level:'warn', msg:'メール形式が不正な可能性'});
  // 既存データとの重複
  if(row.email){
    const ne=normEmail(row.email);
    if(existingRefs.some(r=>normEmail(r.email)===ne && ne)) issues.push({level:'warn', msg:'既存の候補者と同じメールアドレス'});
  }
  if(row.phone){
    const np=normPhone(row.phone);
    // 電話番号の重複は二重登録なので登録対象外（全社横断・早い者勝ち）
    if(np && existingRefs.some(r=>r.status!=='rejected' && r.status!=='declined' && normPhone(r.phone)===np))
      issues.push({level:'error', msg:'この電話番号は既に送客済みです（二重登録不可）'});
  }
  // アップロードファイル内での重複（自分より前の行と同一）
  const dupInFile = allRows.slice(0,idx).some(r2=>
    (row.email && normEmail(r2.email)===normEmail(row.email)) ||
    (row.phone && normPhone(r2.phone).length>=10 && normPhone(r2.phone)===normPhone(row.phone)) ||
    (r2.name && row.name && r2.name.trim()===row.name.trim() && r2.kana && row.kana && r2.kana.trim()===row.kana.trim())
  );
  if(dupInFile) issues.push({level:'warn', msg:'ファイル内に同じ内容の行があります'});
  return issues;
}

/* ── ファイルの解析（CSV / Excel） ──
   外部ライブラリを動的読み込み（PapaParse / SheetJS）。 */
let _papaLoaded=false, _xlsxLoaded=false;
async function ensurePapa(){
  if(_papaLoaded && window.Papa) return;
  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  _papaLoaded=true;
}
async function ensureXlsxLib(){
  if(_xlsxLoaded && window.XLSX) return;
  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  _xlsxLoaded=true;
}

/* ファイルを読み、{headers:[], rows:[[...]]} 形式で返す */
async function parseSpreadsheetFile(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='csv' || ext==='tsv' || /^text\/(csv|plain)$/.test(file.type)){
    await ensurePapa();
    const text=await file.text();
    const result=window.Papa.parse(text.trim(), { skipEmptyLines:true, delimiter: ext==='tsv'?'\t':undefined });
    const all=result.data;
    if(!all.length) return {headers:[], rows:[]};
    return { headers:all[0], rows:all.slice(1) };
  }
  if(ext==='xlsx' || ext==='xls'){
    await ensureXlsxLib();
    const buf=await file.arrayBuffer();
    const wb=window.XLSX.read(buf, {type:'array'});
    const sheet=wb.Sheets[wb.SheetNames[0]];
    const all=window.XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', raw:false});
    const nonEmpty=all.filter(r=>r.some(c=>String(c||'').trim()!==''));
    if(!nonEmpty.length) return {headers:[], rows:[]};
    return { headers:nonEmpty[0], rows:nonEmpty.slice(1) };
  }
  throw new Error('対応していないファイル形式です（CSV / Excel のみ対応）');
}

/* rows(配列の配列) + mapping(列index→field) → オブジェクト配列 */
function rowsToObjects(rows, mapping){
  return rows.map(r=>{
    const o={name:'',kana:'',phone:'',email:'',area:'',address:'',src:'',project:''};
    Object.entries(mapping).forEach(([idx,field])=>{ if(o.hasOwnProperty(field)) o[field]=String(r[idx]??'').trim(); });
    return o;
  }).filter(o=>Object.values(o).some(v=>v));  // 完全空行は除去
}

/* CSVテンプレートを生成してダウンロード */
function downloadBulkTemplate(){

  const csv='\uFEFF'+[headers,sample].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');

/* ════════════════════ 次のアクション判定（自動注入） ════════════════════ */
/* ════════════════════════════════════════════════════════════
   候補者の「次にやるべきこと」を判定する共通ロジック
   要望4（SPIリマインド強化）・要望5（一覧の網羅性）の中核。
   優先度の高い順に、今やるべき最重要アクションを1つ返す。
   ════════════════════════════════════════════════════════════ */

/* 返り値: {level:'urgent'|'warn'|'info'|'done', text, who:'kanoa'|'agency'|'both'} または null */
function nextAction(r){
  if(!r) return null;
  const st=r.status;

  // 見送り・辞退は対応不要
  if(st==='rejected') return {level:'done', text:'見送り', who:'both'};
  if(st==='declined') return {level:'done', text:'辞退', who:'both'};

  // 退職・返金フェーズ（入社後）は返金ボールを最優先
  if(hasJoined(r) && isResignedRef(r) && isRakutenProject(r.pj) && typeof refundBall==='function'){
    const b=refundBall(r);
    if(b && b.side){
      return {level:'warn', text:b.act, who:b.side};
    }
    if(b && !b.side) return {level:'done', text:b.act, who:'both'};
  }

  // 選考中：SPI・コンプラの未対応は「最速で」対応すべき最重要事項
  // ※入社済み・早期退職の人は選考が終わっているので対象外（至急バナーの誤検知を防ぐ）
  if(typeof needsChecks==='function' && needsChecks(r) && !hasJoined(r)){
    const spi=r.spi||'none', comp=r.compliance||'none';
    const pend=[];
    if(spi!=='done') pend.push('SPI');
    if(comp!=='done') pend.push('コンプラ');
    if(pend.length){
      // 選考会が決まっている（interview以降）のに未受検は特に緊急
      const idx=STATUS_ORDER.indexOf(st);
      const urgent = idx>=STATUS_ORDER.indexOf('interview');
      return {
        level: urgent ? 'urgent' : 'warn',
        text: `${pend.join('・')}の受検案内`+(urgent?'（選考会前・最速で）':''),
        who:'both'
      };
    }
  }

  // 書類不足で次段階に進めない
  if(typeof missingDocsForStage==='function'){
    const order=['screening','interview','offer','joined'];
    const ci=hasJoined(r)?-1:order.indexOf(st);
    const nextStage = ci>=0 ? order[ci+1] : (st==='entry'?'screening':null);
    if(nextStage){
      const miss=missingDocsForStage(r, nextStage==='screening'?'interview':nextStage);
      if(miss && miss.length){
        return {level:'warn', text:`${miss.join('・')}のアップロード`, who:'agency'};
      }
    }
  }

  // 通常の次ステップ案内
  const map={
    entry:      {level:'info', text:'書類選考へ', who:'kanoa'},
    screening:  {level:'info', text:'選考会の調整', who:'kanoa'},
    interview:  {level:'info', text:'選考会の結果待ち', who:'kanoa'},
    offer:      {level:'info', text:'入社手続き', who:'both'},
    joined:     {level:'done', text:'入社済み', who:'both'},
    resigned:   {level:'warn', text:'早期退職 — 退職日と返金の確認', who:'both'},
  };
  return map[st] || null;
}

/* ════════════════════════════════════════════════════════════
   受信箱（一時保存）— Googleフォーム/CSVからの応募を取捨選択
   パートナーが「選考会に進める（送客する）」か「見送る」を選ぶ。

   ════════════════════════════════════════════════════════════ */

/* 自社（パートナー）の受信箱アイテム。KANOAは全件見える。 */
function myIntake(){
  if(S.role==='kanoa') return DB.intake||[];
  return (DB.intake||[]).filter(x=>x.ag===S.agencyId);
}

/* 受信箱の件数（ナビバッジ用） */
function intakeCount(){ return myIntake().filter(x=>(x.status||'pending')==='pending').length; }

/* 1件を正式送客する（intake → referrals、選考会=entryとして登録） */
async function approveIntake(id, pjId){
  const idx=(DB.intake||[]).findIndex(x=>x.id===id);
  if(idx<0) return;
  const it=DB.intake[idx];
  // 画面のプルダウンで選ばれた案件を使う（未選択なら促す。勝手に決めない）
  const pj = (pjId!==undefined && pjId!==null && pjId!=='') ? pjId : '';
  if(!pj){ toast('登録先の案件を選んでください'); return; }
  // 電話番号は必須（送客には本人特定が必要）。整形して引き継ぐ
  const _pErr=phoneError(it.phone||'', true);
  if(_pErr){ toast(`${it.name} さん: ${_pErr}（応募内容を確認してください）`); return; }
  const _pFmt=formatPhoneJP(it.phone||'');
  // 電話番号による重複チェック（全社横断・早い者勝ち）
  const _dup=findPhoneDuplicate(_pFmt);
  if(_dup){
    toast(dupMessage(_dup, it.name));
    return;
  }
  const r=mk(pj, it.ag, it.name, it.kana||'', _pFmt, it.email||'', it.address||'', it.area||'', 'entry','—', todayISO());
  r.src=it.company||it.src||'';   // 紹介元＝入力された会社名
  // フォームの添付書類を引き継ぐ。intake側の kind（rireki/shoku）は
  // 送客後に使う日本語ラベル（履歴書/職務経歴書）へ揃える。
  const KIND_JA=Object.assign({rireki:'履歴書', shoku:'職務経歴書'}, ...OFFER_DOC_SLOTS.map(d=>({[d.code]:d.kind})));
  // 進捗確認ページから提出された書類は最初から日本語ラベルで入っている。
  // コード表に無いからとファイル名推定へ落とすと、種別が「その他」に化けて分類が消える。
  r.docs=(Array.isArray(it.docs)?it.docs:[]).map(d=>({
    ...d, kind: KIND_JA[d.kind]
      || (DOC_KINDS.indexOf(d.kind)>=0 ? d.kind : (typeof inferKind==='function' ? inferKind(d.name) : 'その他'))
  }));
  if(S.role==='agency') r.seenK=false;  // KANOA未確認マーク（NEWバッジ）
  DB.referrals.unshift(r);
  // DBに確定登録（他社を含む電話番号の重複はここで確実に弾かれる）
  if(!(await commitReferral(r, it.name))){ return; }
  // ★書類は documents テーブルに登録しないと、再読み込み後に消えてしまう
  //   （ファイル本体はStorageに既にあるので、パスをそのまま登録する）
  if(!DEMO_MODE && r.docs.length){
    const _ad=await SUPA.attachDocs(r.id, r.docs);
    if(_ad && _ad.error){
      // 送客自体は登録済み。書類だけ引き継げなかったことを隠さない（黙ると再読み込みで消える）
      r.docs=[];
      toast(`書類の引き継ぎに失敗しました。候補者カードから添付し直してください／理由：${_ad.error}`);
    }
  }
  // 削除せず「送客済み」として履歴に残す
  it.status='approved'; it.refId=r.id; it.decidedAt=nowTS(); it.decidedAtISO=new Date().toISOString();
  if(typeof logRef==='function') logRef(r.id,'送客登録','パートナー連携から選考会へ');
  // パートナー承認時はKANOAへ自動通知（要望2a）
  if(S.role==='agency'){
    const p=project(pj);
    autoNotify(it.ag,'agency',`【新規送客】${it.name} さん（${p?p.name.replace(' パートナー送客',''):pj}）を送客しました。ご確認をお願いします。`, r.id);
  }
  save();
  toast(`「${it.name}」さんを選考会へ登録しました`);
  render(); updateNavCounts();
}

/* 1件を見送る（受信箱から削除） */
function rejectIntake(id){
  const it=(DB.intake||[]).find(x=>x.id===id);
  if(!it) return;
  const note=prompt(`「${it.name}」さんを見送ります。\n理由があれば入力してください（任意・後から確認できます）`,'');
  if(note===null) return;   // キャンセル
  it.status='rejected'; it.rejectNote=(note||'').trim();
  it.decidedAt=nowTS(); it.decidedAtISO=new Date().toISOString();
  save();
  toast(`「${it.name}」さんを見送りました（履歴に残ります）`);
  render(); updateNavCounts();
}
/* 見送りを取り消して未対応に戻す */
function unrejectIntake(id){
  const it=(DB.intake||[]).find(x=>x.id===id);
  if(!it) return;
  it.status='pending'; it.rejectNote=''; it.decidedAt=''; it.decidedAtISO=null;
  save(); toast(`「${it.name}」さんを未対応に戻しました`);
  render(); updateNavCounts();
}

async function ikHandleFile(file){
  const err=document.getElementById('ikErr');
  try{
    const {headers, rows}=await parseSpreadsheetFile(file);
    if(!rows.length){ if(err) err.textContent='データが見つかりませんでした。'; return; }
    const mapping=autoMapColumns(headers);
    const objs=rowsToObjects(rows, mapping);
    const n=addIntakeRows(objs, 'csv');
    closeModal();
    toast(`${n}件を受信箱に取り込みました。内容を確認して送客してください`);
    if(S.view==='intake') render(); else go('intake');
  }catch(e){ if(err) err.textContent=(e&&e.message)||'読み込みに失敗しました。'; }
}

/* ════════════════════ 二次パートナー向けフォーム（自動注入） ════════════════════ */
/* ════════════════════════════════════════════════════════════
   二次パートナー向け 応募フォーム（ログイン不要）
   フローの入口：
   1) 一次パートナーが「フォーム発行」→ ?form=<agencyId> のURLを配布
   2) 二次パートナー/求職者がURLを開いてフォーム入力
   3) 送信 → その一次パートナーの受信箱(intake)に入る
   4) 一次パートナーが受信箱で確認 →「選考へ進める」で正式送客
   ════════════════════════════════════════════════════════════ */

/* 起動時：?form= があればフォーム画面を出す（招待リンクより先に判定される） */
async function handleFormUrl(agId, pjParam, subToken){
  inviteScreen(`<div style="font-family:var(--display);font-weight:800;font-size:18px;margin-bottom:8px">読み込み中…</div>
    <div style="font-size:13px;color:var(--soft)">応募フォームを準備しています。</div>`);
  // パートナー名を取得（本番はSupabaseから直接。無ければIDのまま）
  let name=agId;
  // 公開された案件（URLの pj で指定された案件だけを表示。未指定なら案件選択なし）
  const pjIds = (pjParam||'').split(',').map(x=>x.trim()).filter(Boolean);
  let projList=[];
  try{
    if(!DEMO_MODE){
      const sb=await SUPA.ensureClient();
      const r=await sb.from('agencies').select('name').eq('id',agId).maybeSingle();
      if(r&&r.data&&r.data.name) name=r.data.name;
      if(pjIds.length){
        const pr=await sb.from('projects').select('id,name').in('id',pjIds);
        projList=(pr&&pr.data)||[];
      }
    } else {
      const a=(DB.agencies||[]).find(x=>x.id===agId); if(a) name=a.name;
      if(pjIds.length){ projList=(DB.projects||[]).filter(p=>pjIds.includes(p.id)).map(p=>({id:p.id,name:p.name})); }
    }
  }catch(e){}
  // ?sub= があれば、二次パートナーの会社名をサーバーから確定する（自由入力させない＝表記ゆれ防止）
  let fixedCompany=null;
  if(subToken && !DEMO_MODE){
    try{
      const info=await SUPA.formPartnerInfo(subToken);
      if(info && info.company){
        fixedCompany=info.company;
        if(info.agencyId) agId=info.agencyId;   // 念のためトークン側の所属を優先
      }
    }catch(e){}
    if(!fixedCompany){
      inviteScreen(`<div style="font-family:var(--display);font-weight:800;font-size:18px;margin-bottom:8px">リンクが無効です</div>
        <div style="font-size:13px;color:var(--soft)">このフォームのリンクは無効か、有効期限が切れています。<br>お手数ですが、ご担当者さまへご確認ください。</div>`);
      return;
    }
  }
  renderIntakeForm(agId, name, projList, fixedCompany);
}

/* 履歴書/職務経歴書それぞれの添付スロット */
function ikfDocSlot(kind, label){
  return `<div>
    <div style="font-size:11.5px;font-weight:600;color:var(--soft,#64748b);margin-bottom:4px">${esc(label)}</div>
    <div id="ikfDrop_${kind}" style="border:1.5px dashed var(--line,#e2e8f0);border-radius:10px;padding:13px;text-align:center;cursor:pointer;background:var(--gray-bg,#f8fafc)">

    </div>
    <div id="ikfName_${kind}" style="margin-top:6px"></div>
  </div>`;
}
function ikfSetFile(kind, f){
  const err=document.getElementById('ikfError');
  if(!f) return;
  if(f.size>10*1048576){ if(err) err.textContent=`${f.name} は10MBを超えています。`; return; }
  if(err) err.textContent='';
  window._ikfDocs[kind]=f;
  ikfRenderSlot(kind);
}
function ikfRenderSlot(kind){
  const box=document.getElementById('ikfName_'+kind); if(!box) return;
  const f=window._ikfDocs[kind];
  box.innerHTML = f ? `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;background:var(--surface,#fff);border:1px solid var(--line,#e2e8f0);border-radius:7px;font-size:12px">

    </div>` : '';
  const rm=box.querySelector('[data-ikf-rm]');
  if(rm) rm.addEventListener('click', ()=>{ window._ikfDocs[kind]=null; ikfRenderSlot(kind); });
}

async function submitIntakeForm(agId, partnerName){
  const err=document.getElementById('ikfError');
  const val=id=>{ const el=document.getElementById(id); return el?el.value.trim():''; };
  const company=val('ikfCompany');
  if(!company){ if(err) err.textContent='御社名は必須です。'; return; }   // 会社名を必須化
  // 紹介する案件（選択されているか）
  const _pjEl=document.getElementById('ikfProject');
  if(_pjEl && !_pjEl.value){ if(err) err.textContent='紹介する案件を選択してください。'; _pjEl.focus(); return; }
  const name=val('ikfName');
  if(!name){ if(err) err.textContent='お名前は必須です。'; return; }
  // フリガナ（必須）
  const kana=val('ikfKana');
  if(!kana){ if(err) err.textContent='フリガナは必須です。'; const _el=document.getElementById('ikfKana'); if(_el) _el.focus(); return; }
  // 電話番号は必須（本人特定・二重応募防止のため）
  const _pe=phoneError(val('ikfPhone'), true);
  if(_pe){ if(err) err.textContent=_pe+'。'; const _el=document.getElementById('ikfPhone'); if(_el) _el.focus(); return; }
  const phoneFmt=formatPhoneJP(val('ikfPhone'));
  // メールアドレス（必須）
  const email=val('ikfEmail');
  if(!email){ if(err) err.textContent='メールアドレスは必須です。'; const _el=document.getElementById('ikfEmail'); if(_el) _el.focus(); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ if(err) err.textContent='メールアドレスの形式をご確認ください。'; const _el=document.getElementById('ikfEmail'); if(_el) _el.focus(); return; }
  // 希望エリア（必須）
  const areaSel=val('ikfArea');
  if(!areaSel){ if(err) err.textContent='希望エリアを選択してください。'; const _el=document.getElementById('ikfArea'); if(_el) _el.focus(); return; }
  const btn=document.getElementById('ikfSubmit');
  if(btn){ btn.disabled=true; btn.textContent='送信中…'; }
  const ikId='IK-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  // 履歴書・職務経歴書をそれぞれの種別付きで集める（選択されたものだけ）
  const slots=[['rireki', (window._ikfDocs||{}).rireki], ['shoku', (window._ikfDocs||{}).shoku]]
    .concat(OFFER_DOC_SLOTS.map(d=>[d.code, (window._ikfDocs||{})[d.code]])).filter(s=>s[1]);
  const docs=[];
  try{
    if(slots.length){
      if(!DEMO_MODE){
        const sb=await SUPA.ensureClient();
        for(const [kind,f] of slots){
          const did=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('D'+Math.random().toString(36).slice(2,9));
          const ext=(/\.[A-Za-z0-9]+$/.exec(f.name)||[''])[0];
          const path=`intake/${ikId}/${did}${ext}`;
          const up=await sb.storage.from('candidate-docs').upload(path, f, {contentType:f.type||'application/octet-stream', upsert:false});
          if(up.error) throw new Error('DOC_UPLOAD: '+(up.error.message||up.error));
          docs.push({ id:did, name:f.name, size:f.size, type:f.type, kind, path, uploaded:nowTS() });
        }
      } else {
        for(const [kind,f] of slots){ docs.push({ id:'D'+Math.random().toString(36).slice(2,9), name:f.name, size:f.size, type:f.type, kind, path:'(demo)', uploaded:nowTS() }); }
      }
    }
    const selPj=val('ikfProject')||null;
    const rec={
      id:ikId, agency_id:agId, project_id:selPj, name,
      kana:val('ikfKana')||null, phone:phoneFmt||null, email:email||null,
      address:null, area:normalizeArea(val('ikfArea'))||null, source:company, company:company,
      note:val('ikfNote')||null, docs:docs, source_type:'form'   // ★jsonb列。文字列化して入れない
    };
    if(!DEMO_MODE){
      const sb=await SUPA.ensureClient();
      const { error }=await sb.from('intake').insert(rec);
      if(error) throw new Error('INTAKE_INSERT: '+(error.message||JSON.stringify(error)));
    } else {
      DB.intake=DB.intake||[];
      DB.intake.unshift({ id:ikId, ag:agId, pj:selPj||'', name, kana:rec.kana||'', phone:rec.phone||'', email:rec.email||'', address:'', area:rec.area||'', src:company, company, note:rec.note||'', docs, source_type:'form', created:nowTS() });
      try{ persist(DB); }catch(e){}
    }
    // 内定後の3枠も必ず空にする（消し忘れると次の紹介に前の人の書類が付く）
    window._ikfDocs=Object.assign({rireki:null, shoku:null}, ...OFFER_DOC_SLOTS.map(d=>({[d.code]:null})));
    intakeFormDone(partnerName);
  }catch(e){
    const msg=(e&&e.message)||String(e);
    // 重複（電話・メール等）はユーザー向けの言い回しに、それ以外は実際の原因を出して切り分け可能にする
    if(/duplicate|unique|already exists/i.test(msg)){
      if(err) err.textContent='この求職者は既にご紹介いただいているようです。内容をご確認ください。';
    } else if(/DOC_UPLOAD/.test(msg)){
      if(err) err.textContent='書類のアップロードに失敗しました。ファイル形式・サイズをご確認のうえ再度お試しください。（'+msg.replace('DOC_UPLOAD: ','')+'）';
    } else {
      if(err) err.textContent='送信に失敗しました：'+msg;
    }
    if(btn){ btn.disabled=false; btn.textContent='この内容で紹介する'; }
  }
}
/* 受信箱に出す添付の名前。種別が分かるものは種別名、それ以外はファイル名 */
function intakeDocLabel(d){
  if(!d) return '';
  const map=Object.assign({rireki:'履歴書', shoku:'職務経歴書'}, ...OFFER_DOC_SLOTS.map(x=>({[x.code]:x.kind})));
  return map[d.kind] || d.kind || d.name || '';
}
/* フォーム添付の種別推定（履歴書/職務経歴書） */
function inferFormDocKind(fname){
  const n=(fname||'').toLowerCase();
  if(/職務|経歴|shokumu|career|cv/.test(n)) return 'shoku';
  if(/履歴|rireki|resume/.test(n)) return 'rireki';
  return 'other';
}

async function doSubPartnerAdd(){
  const errEl=document.getElementById('spAddErr');
  const btn=document.getElementById('spAddBtn');
  const v=id=>((document.getElementById(id)||{}).value||'').trim();
  const name=v('spNewName');
  if(!name){ if(errEl) errEl.textContent='会社名を入力してください'; return; }
  if(v('spNewEmail') && !isEmail(v('spNewEmail'))){ if(errEl) errEl.textContent='メールアドレスの形式をご確認ください'; const _el=document.getElementById('spNewEmail'); if(_el) _el.focus(); return; }
  if(btn){ btn.disabled=true; btn.textContent='登録中…'; }
  const res=await SUPA.subpartnerRegister(name);
  if(res.error){ if(btn){ btn.disabled=false; btn.textContent='登録する'; } if(errEl) errEl.textContent='登録に失敗しました：'+res.error; return; }
  // 任意項目が入力されていれば、続けて登録情報を保存する
  const info={contact:v('spNewContact'), email:v('spNewEmail'), phone:v('spNewPhone'), note:v('spNewNote')};
  if(info.contact||info.email||info.phone||info.note){

  }
  if(btn){ btn.disabled=false; btn.textContent='登録する'; }
  await loadSubPartners(true);   // 一覧を作り直す
  closeModal();
  toast(res.existed ? `「${name}」は既に登録されています` : `「${name}」を登録しました`);
  render();
}

/* ───────── 登録済み二次パートナーのキャッシュ ─────────
   フォーム発行のプルダウンと、一覧画面の「登録情報（担当者・メモ）」表示に使う。 */
let _subPartnerCache=null;
let _subPartnerLoading=false;
/* ログアウト/アカウント切替時に、会社固有のクライアントキャッシュを全消去する。
   これを怠ると、同一ブラウザでA社→B社へ切り替えた際に前社のデータ（特に二次パートナー一覧）が
   残って表示され、「他社の情報が見える」不具合になる。 */
function resetSessionCaches(){
  _subPartnerCache=null;
  _subPartnerLoading=false;
  _openSubPartner=null;
  _formShareProjs=null;
  _tkEditDraft=null;
  _tkToken=''; _tkPw=''; _tkRows=[]; _tkTab='all'; _tkCompany='';
  // 本番はログイン後に loadAll() で取り直すので空にしてよい。
  // デモは端末内のデータが唯一の正なので、空にすると
  // ログアウト後に一覧が全部消え、その状態で保存すると localStorage まで空で上書きされる。
  // → デモでは保存済みデータを読み直す。
  try{
    DB = DEMO_MODE ? load()
       : {agencies:[],projects:[],assignments:[],referrals:[],messages:[],tasks:[],members:[],activity:[],invoices:[],reflog:[],intake:[],subaccounts:[],logins:[],notices:[]};
  }catch(e){}
}
async function loadSubPartners(force){
  if(force) _subPartnerCache=null;
  if(_subPartnerCache) return _subPartnerCache;
  if(DEMO_MODE) return (_subPartnerCache=[]);
  _subPartnerCache = await SUPA.subpartnerList();
  return _subPartnerCache;
}
/* 会社名から登録情報を引く（未取得なら null） */
function subPartnerInfo(company){
  const n=(company||'').trim();
  return (_subPartnerCache||[]).find(s=>(s.company||'').trim()===n) || null;
}
/* 画面描画は同期なので、未取得なら裏で1回だけ取得して再描画する */
function ensureSubPartners(){
  if(_subPartnerCache || DEMO_MODE || _subPartnerLoading) return;
  _subPartnerLoading=true;
  loadSubPartners()
    .then(()=>{ _subPartnerLoading=false; if(S.view==='subpartners') render(); })
    .catch(()=>{ _subPartnerLoading=false; });
}

/* 紹介先のプルダウンで選ばれたとき。
   未登録の相手（値が new: で始まる）は、選んだ時点でパートナーとして登録し、
   フォーム用トークンを受け取ってから選択状態にする。登録は何度呼んでも安全（既存なら existed）。 */
async function onFormShareSubChange(val){
  if(String(val).indexOf('new:')!==0){ _formShareSub=val; renderFormShareModal(); return; }
  const company=String(val).slice(4);
  const sel=document.getElementById('fshareSub');
  if(sel){ sel.disabled=true; }
  let res=null;
  try{ res=await SUPA.subpartnerRegister(company); }catch(e){ res={error:(e&&e.message)||'通信に失敗しました'}; }
  if(sel){ sel.disabled=false; }
  if(!res || res.error){
    _formShareSub='';
    renderFormShareModal();
    toast(`「${company}」の登録に失敗しました${res&&res.error?'：'+res.error:''}`);
    return;
  }
  await loadSubPartners(true);   // トークンを反映するため取り直す
  let info=subPartnerInfo(company);
  // 取り直しても現れない場合（一覧の反映が遅れる・デモ等）は、受け取ったトークンで手元に足しておく。
  // これをしないと、登録できたのに「（未登録）」のままで選択状態にならない。
  if(!info && res.formToken){
    _subPartnerCache=(_subPartnerCache||[]).concat([{company, formToken:res.formToken, token:res.token||'', contact:'', email:'', phone:'', note:''}]);
    info=subPartnerInfo(company);
  }
  _formShareSub = (info && info.formToken) || res.formToken || '';
  renderFormShareModal();
  if(!res.existed) toast(`「${company}」をパートナーとして登録しました`);
}

/* ── 入金タイミングの計算 ──
   売上（クライアント→KANOA/RECORE）入金日を起点に、
   ライセンスありのパートナー = 1ヶ月後、なし = 2ヶ月後に支払う。 */
function payoutDelayMonths(ag){
  const a = (typeof ag==='object') ? ag : agency(ag);
  return (a && a.license) ? 1 : 2;
}
// addMonths は既存の共通関数を使用（重複定義を削除）
/* 請求（invoice）の入金日を起点にした、パートナーへの支払予定日 */
function payoutDueDate(inv){
  if(!inv) return '';
  const base = inv.paidOn || inv.decidedOn || inv.issuedOn;   // 入金確定日を優先
  if(!base) return '';
  return addMonths(base, payoutDelayMonths(inv.agId));
}

/* ════════════════════ RECORE特別枠（自動注入） ════════════════════ */
/* ════════════════════════════════════════════════════════════
   株式会社RECORE 特別枠ダッシュボード
   ・全パートナーの金額を閲覧できる（通常パートナーは自社のみ）
   ・KANOAの売上を一度RECOREが受ける資金フローを可視化
   ・入金タイミング（ライセンス有=1ヶ月/無=2ヶ月）を表示
   ・各社の口座情報を表示
   RECORE判定：agency.special==='recore'
   ════════════════════════════════════════════════════════════ */

function isRecore(){ return S.role==='agency' && agency(S.agencyId) && agency(S.agencyId).special==='recore'; }

function viewRecore(){
  ensureInvoices();
  setHeader('RECORE 収支管理', 'クライアント→KANOA→RECORE→各社の資金フローを一元管理');
  const c=document.getElementById('content');

  const joined=DB.referrals.filter(hasJoined);
  const payoutOf=r=>refEarning(r)||0;
  const feeOf=r=>{ const p=project(r.pj); return (p&&+p.clientFee)?+p.clientFee:0; };
  const routeOf=r=>{ const a=agency(r.ag); return (a&&a.payRoute==='B')?'B':'A'; };

  // ── 全体金額 ──
  const recoreIn = joined.reduce((s,r)=>s+feeOf(r),0);        // KANOA→RECORE に入った総額（＝売上）
  const totalPay = joined.reduce((s,r)=>s+payoutOf(r),0);      // 各パートナーへの支払総額
  const toPartnerDirect = joined.filter(r=>routeOf(r)==='A').reduce((s,r)=>s+payoutOf(r),0);  // ルートA：RECORE→各社
  const backToKanoa     = joined.filter(r=>routeOf(r)==='B').reduce((s,r)=>s+payoutOf(r),0);  // ルートB：RECORE→KANOA→各社

  const payM=months.map(m=>joined.filter(r=>(r.joined||'').slice(0,7)===m).reduce((s,r)=>s+payoutOf(r),0));

        <span style="color:var(--g);font-weight:600">ルートA：</span>クライアント → KANOA → <strong style="color:var(--accent)">RECORE</strong> → 各パートナー（直接支払）<br>
        <span style="color:var(--b);font-weight:600">ルートB：</span>クライアント → KANOA → <strong style="color:var(--accent)">RECORE</strong> → <strong>KANOA</strong> → 各パートナー（一度KANOAに戻す）<br>
        <span style="font-size:11.5px;color:var(--soft)">支払時期：ライセンスありは入金の1ヶ月後、なしは2ヶ月後。</span>
      </div>
    </div>
    <div class="kpi-grid">
      ${kpi('RECOREに入った金額','<span class="yen">¥</span>'+recoreIn.toLocaleString('ja-JP'),'var(--g)')}
      ${kpi('RECORE→各社（ルートA）','<span class="yen">¥</span>'+toPartnerDirect.toLocaleString('ja-JP'),'var(--accent)')}
      ${kpi('RECORE→KANOAに戻す（ルートB）','<span class="yen">¥</span>'+backToKanoa.toLocaleString('ja-JP'),'var(--b)')}
      ${kpi('差益（留保）','<span class="yen">¥</span>'+recoreMargin.toLocaleString('ja-JP'), recoreMargin>=0?'var(--g)':'var(--r)')}
    </div>
    <div class="sect"><div class="sect-head"><div class="sect-title">月次推移（RECORE入金 vs 各社支払）</div></div>
      <div class="panel" style="padding:14px 16px 8px">${chart}</div></div>

    <div class="sect"><div class="sect-head"><div class="sect-title">KANOAに戻す金額（ルートB）</div></div>

/* ════════════════════════════════════════════════════════════
   二次パートナー管理（各パートナーが自分のパートナーを管理）
   ・二次パートナーがフォームから送客すると、その会社名で自動的にリスト化される
   ・二次パートナーごとに、送客人数・ステータス内訳・候補者一覧が見える
   ・チャット/金額はなし。シンプルにリストとステータスのみ
   データ源：referral.src / intake.company（＝入力された会社名）
   ════════════════════════════════════════════════════════════ */

/* 自社(ag)に紐づく二次パートナーを、会社名でグルーピングして返す */
function subPartnersOf(ag){
  const map = new Map();  // 会社名 -> { name, refs:[], pending:[], info }
  const norm = s => (s||'').trim();
  const blank = key => ({name:key, refs:[], pending:[], info:null});
  // 登録済みの二次パートナー（送客0でも一覧に出す＝編集できるようにするため）。
  // キャッシュは「今ログイン中の一次パートナー自身」のものだけ。KANOAの俯瞰ループ（allSubPartners）で
  // 各社を回すときに混入させないため、role が agency かつ自社IDのときに限定する。
  if(S.role==='agency' && ag===S.agencyId){
    (_subPartnerCache||[]).forEach(s=>{
      const key = norm(s.company);
      if(!key) return;
      map.set(key, {...blank(key), info:s});
    });
  }
  // 正式送客済み（referrals、src＝二次パートナー名）
  DB.referrals.filter(r=>r.ag===ag && norm(r.src)).forEach(r=>{
    const key = norm(r.src);
    if(!map.has(key)) map.set(key, blank(key));
    map.get(key).refs.push(r);
  });
  // 未承認（intake、company＝二次パートナー名）
  (DB.intake||[]).filter(x=>x.ag===ag && norm(x.company)).forEach(x=>{
    const key = norm(x.company);
    if(!map.has(key)) map.set(key, blank(key));
    map.get(key).pending.push(x);
  });
  // 配列化＋集計
  return Array.from(map.values()).map(sp=>{
    const joined = sp.refs.filter(hasJoined).length;
    const active = sp.refs.filter(r=>r.status!=='rejected'&&r.status!=='declined').length;
    // 書類不足の候補者数（選考中で、必要書類が揃っていない人）
    const needDocs = sp.refs.filter(r=>{
      if(r.status==='rejected'||r.status==='declined') return false;
      if(typeof missingDocsForStage!=='function') return false;
      const m=[...missingDocsForStage(r,'interview'), ...(r.status==='offer'?missingDocsForStage(r,'offer'):[])];
      return m.length>0;
    }).length;
    return {...sp, total:sp.refs.length, pending:sp.pending, pendingCount:sp.pending.length, joined, active, needDocs};
  }).sort((a,b)=> (b.needDocs-a.needDocs) || (b.total+b.pendingCount)-(a.total+a.pendingCount));
}

/* KANOA視点：全パートナーの下の二次パートナーを俯瞰 */
function allSubPartners(){
  const out=[];
  DB.agencies.filter(a=>a.special!=='recore').forEach(a=>{
    subPartnersOf(a.id).forEach(sp=>out.push({...sp, parent:a}));
  });
  return out;
}

async function doSubPartnerEditSave(oldCompany){
  const errEl=document.getElementById('spEdErr');
  const btn=document.getElementById('spEdBtn');
  const v=id=>((document.getElementById(id)||{}).value||'').trim();
  const oldName=(oldCompany||'').trim();
  const newName=v('spEdName');
  if(!newName){ if(errEl) errEl.textContent='会社名を入力してください'; return; }
  if(v('spEdEmail') && !isEmail(v('spEdEmail'))){ if(errEl) errEl.textContent='メールアドレスの形式をご確認ください'; const _el=document.getElementById('spEdEmail'); if(_el) _el.focus(); return; }

  if(newName!==oldName){
    const sp = subPartnersOf(S.agencyId).find(x=>x.name===oldName);
    const cnt = sp ? (sp.total||0)+(sp.pendingCount||0) : 0;
    if(!confirm(`会社名を「${oldName}」から「${newName}」に変更します。\n${cnt?`この会社の送客 ${cnt} 件も新しい社名に付け替えられます。\n`:''}よろしいですか？`)) return;
  }

  if(btn){ btn.disabled=true; btn.textContent='保存中…'; }
  const res=await SUPA.subpartnerUpdate(oldName, {
    company:newName, contact:v('spEdContact'), email:v('spEdEmail'), phone:v('spEdPhone'), note:v('spEdNote')
  });
  if(btn){ btn.disabled=false; btn.textContent='保存する'; }
  if(res.error){ if(errEl) errEl.textContent='保存に失敗しました：'+res.error; return; }

  // 画面上のデータも即座に付け替える（サーバー側は更新済みなので save() は呼ばない）
  if(res.renamed){
    const ag=S.agencyId;
    DB.referrals.forEach(r=>{ if(r.ag===ag && (r.src||'').trim()===oldName) r.src=newName; });
    (DB.intake||[]).forEach(x=>{ if(x.ag===ag && (x.company||'').trim()===oldName) x.company=newName; });
    (DB.subaccounts||[]).forEach(a=>{ if(a.ag===ag && (a.company||'').trim()===oldName) a.company=newName; });
    if(_openSubPartner===oldName) _openSubPartner=newName;
  }
  await loadSubPartners(true);   // 登録情報を取り直す
  closeModal();
  toast(res.renamed ? `「${newName}」に変更しました${res.moved?`（送客 ${res.moved} 件を付け替え）`:''}` : '保存しました');
  render();
}

   二次パートナー アカウント（一次パートナーが発行・二次がログイン）
   ・一次パートナーが二次パートナーにID/パスを発行
   ・二次パートナーはログインして「自分が紹介した人」だけ見られる
   ・見えるもの：リスト・ステータス・書類の不足/提出・書類アップロード
   ・見えないもの：売上/金額、他社の情報、チャット
   ロール：S.role==='sub'、S.parentAg（親一次パートナー）、S.subCompany（自社名）
   保存：DB.subaccounts = [{id, ag, company, email, pw, created}]
   ════════════════════════════════════════════════════════════ */

/* 二次パートナーのアカウントを取得（親ag×会社名） */
function subAccountFor(ag, company){
  return (DB.subaccounts||[]).find(x=>x.ag===ag && x.company===company);
}

  const existing = await SUPA.trackerGet(norm);
  const base=location.origin+location.pathname;

  if(existing && existing.token){
    const url=base+'?track='+existing.token;
    const pw = await SUPA.subpartnerPwGet(norm);   // 平文が保存されていれば表示できる
    showModal(`
      <div class="modal-title">${esc(norm)} さまの進捗確認リンク</div>

/* 既存リンクのパスワードだけ変更（URLは変わらない）。ハッシュと表示用の平文を同時に更新する */
async function doSetTrackerPw(company){
  const errEl=document.getElementById('tkIssueErr');
  const btn=document.getElementById('tkPwBtn');
  const pw=((document.getElementById('tkNewPw')||{}).value||'').trim();
  if(pw.length<4){ if(errEl) errEl.textContent='パスワードは4文字以上にしてください'; return; }
  if(btn){ btn.disabled=true; btn.textContent='変更中…'; }
  const res=await SUPA.subpartnerPwSet(company, pw);
  if(btn){ btn.disabled=false; btn.textContent='パスワードを変更'; }
  if(res.error){ if(errEl) errEl.textContent='変更に失敗しました：'+res.error; return; }
  if(errEl) errEl.textContent='';

  // 上部のパスワード表示も新しい値に差し替える
  const view=document.getElementById('tkPwView');
  if(view){
    view.dataset.pw=pw;
    view.textContent = view.dataset.shown==='1' ? pw : pwMask(pw);
    const cp=view.parentElement && view.parentElement.querySelector('[data-act="copy"]');
    if(cp) cp.dataset.v=pw;
  }
  const out=document.getElementById('tkIssueOut');
  if(out) out.innerHTML=`<div class="info-card" style="margin-top:8px">
    <div style="font-size:12px;font-weight:700;color:var(--g);margin-bottom:6px">パスワードを変更しました</div>
    <div class="info-row"><span class="info-label">新しいパスワード</span><span class="info-val mono">${esc(pw)}</span><button class="copy-btn" data-act="copy" data-v="${esc(pw)}">コピー</button></div>
    <div class="cell-sub" style="font-size:11px;margin-top:6px">お相手にお伝えください。URLは変わっていません。</div>
  </div>`;
}

async function doIssueTrackerLink(company){
  const errEl=document.getElementById('tkIssueErr');
  const btn=document.getElementById('tkIssueBtn');
  const pw=((document.getElementById('tkNewPw')||{}).value||'').trim();
  const days=parseInt((document.getElementById('tkDays')||{}).value||'90',10);
  if(pw.length<4){ if(errEl) errEl.textContent='パスワードは4文字以上にしてください'; return; }
  if(btn){ btn.disabled=true; btn.textContent='発行中…'; }
  const res=await SUPA.trackerIssue(company, pw, days);
  if(res.error){ if(btn){ btn.disabled=false; btn.textContent='リンクを発行'; } if(errEl) errEl.textContent='発行に失敗しました：'+res.error; return; }
  // 次回以降このモーダルでパスワードを表示できるよう、表示用のコピーも保存する

  if(btn){ btn.disabled=false; btn.textContent='リンクを発行'; }
  const base=location.origin+location.pathname;
  const url=base+'?track='+res.token;
  const out=document.getElementById('tkIssueOut');
  if(out) out.innerHTML=`
    <div class="info-card" style="margin-top:10px">
      <div style="font-size:12px;font-weight:700;color:var(--g);margin-bottom:8px">発行しました。以下をお相手にお伝えください。</div>
      <div class="info-row"><span class="info-label">進捗確認</span><span class="info-val mono" style="font-size:11px">${esc(url)}</span><button class="copy-btn" data-act="copy" data-v="${esc(url)}">コピー</button></div>
      <div class="info-row"><span class="info-label">パスワード</span><span class="info-val mono">${esc(pw)}</span><button class="copy-btn" data-act="copy" data-v="${esc(pw)}">コピー</button></div>
      <div style="margin-top:10px"><button class="btn btn-primary btn-sm" data-act="tracker-copy" data-url="${esc(url)}" data-pw="${esc(pw)}">まとめてコピー</button></div>

function issueSubAccount(company){
  const ag = S.agencyId;
  const norm = (company||'').trim();
  if(!norm){ toast('会社名がありません'); return; }
  let acc = subAccountFor(ag, norm);
  if(acc){ modalSubAccount(acc); return; }  // 既存があれば表示
  // メールは会社名ベースの仮ID（後で編集可）、パスワードは自動生成
  const pw = (typeof genPw==='function') ? genPw() : ('sub'+Math.random().toString(36).slice(2,8));
  acc = {
    id: 'SUB-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    ag, company:norm,
    email: '', pw,
    created: (typeof nowTS==='function'?nowTS():TZ_toLocal(new Date()))
  };
  DB.subaccounts = DB.subaccounts||[];
  DB.subaccounts.push(acc);
  if(typeof save==='function') save();
  modalSubAccount(acc);
}

/* 二次パートナーのログイン照合（ID/メール＋パスワード） */
function resolveSubAccount(loginId){
  const v=(loginId||'').trim().toLowerCase();
  if(!v) return null;
  return (DB.subaccounts||[]).find(x=>
    (x.email||'').toLowerCase()===v || (x.id||'').toLowerCase()===v
  );
}

/* 二次パートナー視点：自分が紹介した候補者だけ */
function subReferrals(){
  return DB.referrals.filter(r=>r.ag===S.parentAg && (r.src||'').trim()===S.subCompany);
}

/* ════════════════════ KANOA側RECORE残高（自動注入） ════════════════════ */
/* ════════════════════════════════════════════════════════════
   KANOA管理側：RECORE残高ビュー
   ・KANOAがRECOREにいくら入れているか
   ・RECORE→各社への支払（ルートA）
   ・RECORE→KANOAに戻ってくる金額と日付（ルートB）
   ════════════════════════════════════════════════════════════ */
function viewKanoaRecore(){
  ensureInvoices();
  setHeader('RECORE 残高・資金管理', 'RECOREに入れた金額と、各社への支払・KANOAへの戻りを把握');
  const c=document.getElementById('content');

  const joined=DB.referrals.filter(hasJoined);
  const payoutOf=r=>refEarning(r)||0;
  const feeOf=r=>{ const p=project(r.pj); return (p&&+p.clientFee)?+p.clientFee:0; };
  const routeOf=r=>{ const a=agency(r.ag); return (a&&a.payRoute==='B')?'B':'A'; };

  const putInRecore = joined.reduce((s,r)=>s+feeOf(r),0);           // KANOA→RECORE
  const paidToPartners = joined.reduce((s,r)=>s+payoutOf(r),0);      // RECORE→各社（総額）
  const routeA = joined.filter(r=>routeOf(r)==='A').reduce((s,r)=>s+payoutOf(r),0);  // 直接
  const routeB = joined.filter(r=>routeOf(r)==='B').reduce((s,r)=>s+payoutOf(r),0);  // KANOAに戻る
  const balance = putInRecore - paidToPartners;                     // RECORE内に残っている想定額

  // ── KANOAに戻ってくる明細（ルートB）──
  const backRows = DB.agencies.filter(a=>a.special!=='recore' && a.payRoute==='B').map(a=>{
    const js=joined.filter(r=>r.ag===a.id);
    const pay=js.reduce((s,r)=>s+payoutOf(r),0);
    const inv=DB.invoices.filter(v=>v.agId===a.id);
    const latestPaid=inv.filter(v=>v.paidOn).sort((x,y)=>x.paidOn<y.paidOn?1:-1)[0];
    const due=latestPaid?payoutDueDate(latestPaid):'';
    return {a, n:js.length, pay, due};
  }).filter(x=>x.n>0).sort((x,y)=>y.pay-x.pay);
  const backTotal = backRows.reduce((s,x)=>s+x.pay,0);

  // ── 月次：RECOREに入れた額 ──
  const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-(5-i));return d.toISOString().slice(0,7);});
  const inM=months.map(m=>joined.filter(r=>(r.joined||'').slice(0,7)===m).reduce((s,r)=>s+feeOf(r),0));
  const maxV=Math.max(1,...inM);
  const chart=`<svg viewBox="0 0 560 205" style="width:100%;height:auto" role="img">
    <text x="30" y="14" font-size="10" fill="var(--accent)">■ RECOREに入れた金額（月次）</text>
    ${months.map((m,i)=>{
      const x=44+i*80; const h=Math.round(inM[i]/maxV*135);
      return `<rect x="${x}" y="${168-h}" width="40" height="${Math.max(h,1)}" rx="5" fill="var(--accent)"><title>${m} ${yen(inM[i])}</title></rect>
        <text x="${x+20}" y="${162-h}" text-anchor="middle" font-size="9.5" fill="var(--soft)">${inM[i]?('¥'+(inM[i]/10000).toFixed(inM[i]>=100000?0:1)+'万'):''}</text>
        <text x="${x+20}" y="186" text-anchor="middle" font-size="10" fill="var(--muted)">${m.slice(5)}月</text>`;
    }).join('')}
  </svg>`;

  c.innerHTML=`<div class="content-narrow">
    <div class="panel" style="padding:12px 15px;margin-bottom:16px;background:var(--gray-bg)">
      <div style="font-size:12.5px;color:var(--ink);line-height:1.8">
        <strong style="font-weight:700">RECOREとの資金の流れ</strong><br>
        KANOAはクライアントから受け取った売上を、一度 <strong style="color:var(--accent)">RECORE</strong> に入れます。<br>
        <span style="color:var(--g);font-weight:600">ルートA：</span>RECOREが各パートナーに直接支払う<br>
        <span style="color:var(--b);font-weight:600">ルートB：</span>RECOREからKANOAに戻し、KANOAが各パートナーに支払う
      </div>
    </div>
    <div class="kpi-grid">
      ${kpi('RECOREに入れた金額','<span class="yen">¥</span>'+putInRecore.toLocaleString('ja-JP'),'var(--accent)')}
      ${kpi('RECORE→各社（ルートA）','<span class="yen">¥</span>'+routeA.toLocaleString('ja-JP'),'var(--g)')}
      ${kpi('KANOAに戻る（ルートB）','<span class="yen">¥</span>'+routeB.toLocaleString('ja-JP'),'var(--b)')}
      ${kpi('RECORE残高（想定）','<span class="yen">¥</span>'+balance.toLocaleString('ja-JP'), balance>=0?'var(--g)':'var(--r)')}
    </div>

/* ════════════════════ 送客の重複チェック（自動注入） ════════════════════ */
/* ════════════════════════════════════════════════════════════
   送客の重複チェック（名前完全一致 ＋ 電話番号一致で同一人物と判定）
   ・自社内の重複 → 登録ブロック（saveReferralで使用）
   ・他社との重複 → 管理ページで可視化、エントリーが早い方を優先
   ════════════════════════════════════════════════════════════ */

/* 氏名の正規化（前後空白・全角/半角スペースを吸収） */
function normName(s){ return String(s||'').replace(/[\s　]+/g,'').trim(); }

/* 同一人物か（名前完全一致 かつ 電話番号一致。どちらかが空なら不一致扱い） */
function isSamePerson(a, b){
  const n1=normName(a.name), n2=normName(b.name);
  const p1=normPhone(a.phone), p2=normPhone(b.phone);
  if(!n1 || !p1 || !n2 || !p2) return false;
  return n1===n2 && p1===p2;
}

/* 送客のエントリー日時（比較用の文字列。created + id で安定ソート） */
function refEntryKey(r){ return (r.created||'') + '#' + (r.id||''); }

/* ある送客と同一人物の送客を全件返す（自分自身を除く） */
function duplicatesOf(ref){
  return DB.referrals.filter(r=> r.id!==ref.id && r.status!=='rejected' && r.status!=='declined' && isSamePerson(r, ref));
}

/* 同一人物グループの中で最先着（優先）の送客を返す */
function primaryOf(ref){
  const group=[ref, ...duplicatesOf(ref)].filter(Boolean);
  group.sort((a,b)=> refEntryKey(a)<refEntryKey(b)?-1:1);
  return group[0];
}

/* この送客が最先着（優先）かどうか */
function isPrimaryRef(ref){
  const p=primaryOf(ref);
  return !!p && p.id===ref.id;
}

/* 他社との重複があるか（自社以外に同一人物がいる） */
function hasCrossAgencyDup(ref){
  return duplicatesOf(ref).some(r=> r.ag!==ref.ag);
}

/* 自社内に同一人物の送客が既にあるか（登録ブロック用） */
/* 送客をDBに確定登録する。DBのユニーク制約で弾かれたら、アプリ側からも取り消す。
   これにより「画面では登録できたのにDBに無い」不整合を防ぐ。
   戻り値: true=登録成功 / false=重複などで登録されなかった                      */
async function commitReferral(r, label){
  if(DEMO_MODE) return true;
  const res = await SUPA.insertReferral(r);
  if(!res) return true;                       // 成功
  // 失敗 → アプリ側のデータからも取り除く（画面と DB を一致させる）
  const i=(DB.referrals||[]).findIndex(x=>x.id===r.id);
  if(i>=0) DB.referrals.splice(i,1);
  if(DB.reflog) DB.reflog=DB.reflog.filter(l=>l.refId!==r.id);
  save(); render(); updateNavCounts();
  if(res.duplicate){
    toast(`${label||r.name} さんの電話番号（${r.phone}）は既に送客済みです。二重登録はできません。`);
  } else {
    toast(`登録に失敗しました：${res.message}`);
  }
  return false;
}
/* ── 電話番号による二重登録チェック（全社横断・早い者勝ち）──────────────
   電話番号は本人に固有で表記ゆれが無いため、氏名は判定に使わない
   （氏名を条件に加えると表記ゆれ「山田太郎/ヤマダタロウ」ですり抜けるため）。
   返り値: 既存の送客(referral) または null                                   */
function findPhoneDuplicate(phone){
  const p=normPhone(phone);
  if(!p) return null;   // 電話番号が空なら判定不能（チェックしない）
  return (DB.referrals||[]).find(r=>
    r.status!=='rejected' && r.status!=='declined' && normPhone(r.phone)===p
  ) || null;
}
/* 重複時にユーザーへ見せる文言。他社の個人情報は出さない（自社の場合のみ氏名を出す）*/
function dupMessage(dup, name){
  const own = (S.role==='kanoa') || (dup.ag===S.agencyId);
  if(own){
    const a=agency(dup.ag);
    const who = (S.role==='kanoa' && a) ? `${a.name}が` : '';
    return `この電話番号は既に登録済みです（${who}${dup.name} さん）。二重登録はできません。`;
  }
  return `この電話番号は既に他社が送客済みです。二重登録はできません。`;
}
function findOwnDuplicate(ag, name, phone){
  const target={name, phone};
  return DB.referrals.find(r=> r.ag===ag && r.status!=='rejected' && r.status!=='declined' && isSamePerson(r, target)) || null;
}

/* 候補者詳細ドロワーの他社重複セクション（KANOA管理画面のみ・先着/後着を並べて表示） */
function dupDetailSection(r){
  if(typeof S==='undefined' || S.role!=='kanoa') return '';
  const dups=duplicatesOf(r);
  if(!dups.length) return '';
  // 自分＋重複を先着順に並べる
  const group=[r, ...dups].sort((a,b)=> refEntryKey(a)<refEntryKey(b)?-1:1);
  const rows=group.map((g,idx)=>{
    const a=agency(g.ag);
    const isFirst=idx===0;
    const isSelf=g.id===r.id;
    const p=project(g.pj);
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;margin-bottom:5px;background:${isSelf?'var(--accent-soft)':'var(--gray-bg)'};border:1px solid ${isFirst?'#BBF7D0':'var(--line,#eef1f5)'}">
      <span style="font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:${isFirst?'#15803D':'#B45309'};color:#fff">${isFirst?'先着・優先':(idx+1)+'番目'}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:12.5px;font-weight:600">${esc(a?a.name:g.ag)}${isSelf?' <span style="font-size:10px;color:var(--soft)">（表示中）</span>':''}</div>
        <div style="font-size:11px;color:var(--soft)">${esc(p?p.name.replace(' パートナー送客',''):g.pj)} · 送客日 ${esc(g.created||'—')} · ${STATUS[g.status]?STATUS[g.status].label:g.status}</div>
      </div>
      ${!isSelf?`<button class="btn btn-ghost btn-sm" style="padding:3px 9px;font-size:11px" data-act="open-ref" data-id="${g.id}">開く</button>`:''}
    </div>`;
  }).join('');
  return `<div class="dt-block-title" style="color:#B45309">重複送客（${group.length}社）</div>
    <div style="padding:2px 0 4px">
      <div style="font-size:11.5px;color:var(--soft);margin-bottom:7px;line-height:1.6">同じ方（氏名・電話番号が一致）が複数社から送客されています。<strong style="color:#15803D">エントリーが早い方が優先</strong>されます。</div>
      ${rows}
    </div>`;
}

/* 送客一覧に出す他社重複バッジ（KANOA管理画面のみ・先着/後着を表示） */
function crossDupBadge(r){
  if(typeof S==='undefined' || S.role!=='kanoa') return '';
  if(!hasCrossAgencyDup(r)) return '';
  const primary=isPrimaryRef(r);
  if(primary){
    return `<span class="dup-badge dup-primary" data-act="open-ref" data-id="${r.id}" title="複数社から送客あり。この送客が最先着（優先）です。" style="display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:6px;background:#E8F6EE;color:#15803D;cursor:pointer"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>重複・先着</span>`;

/* ════════════════════ 管理者からのお知らせ（掲示板） ════════════════════
   ・KANOAが作成・編集し、「全パートナー」か「選んだパートナーだけ」に公開する
   ・パートナーは「ホーム」で読む（下書きは見えない）
   ・保存先: DB.notices = [{id,title,body,status,audience,agIds,pinned,publishedOn,created,updated}]
     status  : 'draft'（下書き・パートナーには見えない）/ 'published'（公開中）
     audience: 'all'（全パートナー）/ 'select'（agIds のパートナーだけ）
   ════════════════════════════════════════════════════════════ */
function ensureNotices(){ if(!DB.notices) DB.notices=[]; return DB.notices; }

/* このお知らせを、このパートナーが読めるか */
function noticeVisibleTo(n, agId){
  if(!n || n.status!=='published') return false;
  if(n.audience==='select') return (n.agIds||[]).includes(agId);
  return true;
}
/* パートナーが読めるお知らせ（ピン留め優先、次に公開日の新しい順） */
function agencyNotices(agId){
  ensureNotices();
  const key=n=>(n.publishedOn||n.created||'');
  return DB.notices.filter(n=>noticeVisibleTo(n, agId))
    .sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || (key(a)<key(b)?1:-1));
}
/* 公開先の説明文 */
function noticeAudienceLabel(n){
  if(n.audience!=='select') return '全パートナー';
  const ids=n.agIds||[];
  if(!ids.length) return '公開先なし';
  const names=ids.map(id=>(agency(id)||{}).name||id);
  return names.length<=2 ? names.join('・') : `${names[0]} ほか${names.length-1}社`;
}

/* ── 既読管理（端末内。DBに列を足さずに「新着」を出すため）── */
function _seenNoticeKey(){ return 'kanoa_seen_notices_'+(S.agencyId||'x'); }
function seenNoticeIds(){
  try{ const a=JSON.parse(localStorage.getItem(_seenNoticeKey())||'[]'); return new Set(Array.isArray(a)?a:[]); }
  catch(e){ return new Set(); }
}
function markNoticesSeen(){
  if(S.role!=='agency') return;
  try{
    const ids=agencyNotices(S.agencyId).map(n=>n.id);
    localStorage.setItem(_seenNoticeKey(), JSON.stringify(ids));
  }catch(e){}
}
function unreadNoticeCount(){
  if(S.role!=='agency') return 0;
  const seen=seenNoticeIds();
  return agencyNotices(S.agencyId).filter(n=>!seen.has(n.id)).length;
}

      </div>
    </div>`, 'modal-tall');

  const sc=document.querySelector('#modalCard .modal-scroll'); if(sc) sc.scrollTop=prevScroll;
}
function saveNotice(mode){
  const d=_noticeDraft; if(!d) return;
  const err=m=>{ const e=document.getElementById('ntErr'); if(e) e.textContent=m; };
  const title=(val('ntTitle')||'').trim();
  const body=((document.getElementById('ntBody')||{}).value||'').trim();
  const pinEl=document.getElementById('ntPin'); if(pinEl) d.pinned=pinEl.checked;
  if(!title){ err('タイトルを入力してください'); return; }
  if(mode==='publish' && d.audience==='select' && !d.agIds.size){ err('公開先の会社を1社以上選んでください'); return; }
  ensureNotices();
  let n = d.id ? DB.notices.find(x=>x.id===d.id) : null;
  const isNew=!n;
  if(!n){ n={id:uid('N'), created:nowTS()}; DB.notices.unshift(n); }
  n.title=title; n.body=body; n.pinned=!!d.pinned;
  n.audience=d.audience; n.agIds=[...d.agIds];
  n.updated=nowTS();
  if(mode==='publish'){ if(n.status!=='published') n.publishedOn=todayISO(); n.status='published'; }
  else { n.status='draft'; }
  DB.activity.unshift({ts:nowTS(),actor:'KANOA',action:isNew?'お知らせ作成':'お知らせ更新',detail:title});
  save(); _noticeDraft=null; closeModal(); updateNavCounts();
  if(S.view==='notices') viewNotices();
  toast(mode==='publish'?`お知らせを公開しました（${noticeAudienceLabel(n)}）`:'下書きを保存しました');
}
function setNoticeStatus(id, status){
  const n=(DB.notices||[]).find(x=>x.id===id); if(!n) return;
  if(status==='published'){
    if(n.audience==='select' && !(n.agIds||[]).length){ toast('公開先が選ばれていません。編集から会社を選んでください'); return; }
    if(!n.publishedOn) n.publishedOn=todayISO();
  }
  n.status=status; n.updated=nowTS();
  save(); updateNavCounts();
  if(S.view==='notices') viewNotices();
  toast(status==='published'?'公開しました':'非公開にしました');
}


/* ════════════════════ 二次パートナー向け 進捗確認ページ（?track=xxx） ════════════════════
   ログイン不要。リンク＋パスワードのみ。自分が紹介した方の進捗確認・情報の編集・書類の提出ができる。
   パスワードの照合と絞り込みはサーバー(RPC)側で行うため、パスワードなしでは情報が一切返らない。 */
function renderTrackerGate(token){
  hideBootSplash();
  const wrap=document.getElementById('loginWrap'); if(wrap) wrap.style.display='none';
  const app=document.getElementById('app');
  if(app){ app.style.display='block'; app.classList.remove('on'); }
  const host=app||document.body;
  host.innerHTML=`
  <div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(130% 100% at 50% 0%,#ffffff,#f4f7fa)">
    <div style="width:100%;max-width:420px">
      <div style="text-align:center;margin-bottom:20px">
        <div style="font-weight:800;font-size:20px;letter-spacing:.02em">KANOA</div>
        <div style="font-size:13px;color:var(--soft);margin-top:4px">ご紹介いただいた方の進捗確認</div>
      </div>
      <div class="panel" style="padding:22px">
        <div style="font-size:13px;color:var(--soft);margin-bottom:14px">担当者よりお伝えした<b>パスワード</b>を入力してください。</div>
        <input id="tkPw" type="password" placeholder="パスワード" autocomplete="off"
          style="width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;box-sizing:border-box">
        <div id="tkErr" style="color:var(--r);font-size:12px;margin-top:8px;min-height:16px"></div>
        <button id="tkBtn" class="btn btn-primary" style="width:100%;margin-top:6px" data-act="tracker-open" data-token="${esc(token)}">進捗を表示する</button>
      </div>
      <div style="text-align:center;font-size:11px;color:var(--soft);margin-top:14px">
        ご紹介いただいた方の情報が表示されます。取り扱いにはご注意ください。
      </div>
    </div>
  </div>`;
  const pw=document.getElementById('tkPw');
  if(pw) pw.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); openTracker(token); } });
}

let _tkToken='', _tkPw='';   // 進捗ページのセッション（この画面を開いている間だけ保持）
async function openTracker(token){
  const errEl=document.getElementById('tkErr');
  const btn=document.getElementById('tkBtn');
  const pw=(document.getElementById('tkPw')||{}).value||'';
  if(!pw){ if(errEl) errEl.textContent='パスワードを入力してください'; return; }
  if(btn){ btn.disabled=true; btn.textContent='確認中…'; }
  const res=await SUPA.trackerRows(token, pw);
  if(btn){ btn.disabled=false; btn.textContent='進捗を表示する'; }
  if(res.error){
    if(errEl) errEl.textContent =
      res.error==='BAD_PW'   ? 'パスワードが違います' :
      res.error==='BAD_LINK' ? 'このリンクは無効か、有効期限が切れています' :
      '表示できませんでした（' + res.error + '）';
    return;
  }
  _tkToken=token; _tkPw=pw;   // 「最新に更新」でパスワード再入力を求めないため保持
  // 会社名は進捗データに含まれないため、専用RPCで取得する
  let company='';
  try{ company = await SUPA.trackerInfo(token, pw) || ''; }catch(e){}
  renderTrackerList(res.rows||[], company);
}

let _tkRows=[]; let _tkTab='all'; let _tkCompany='';
/* 「最新に更新」：ページを再読込せず（＝パスワード再入力を求めず）データだけ取り直す */
async function refreshTracker(silent){
  if(!_tkToken || !_tkPw){ return; }
  const btn=document.querySelector('[data-act="tracker-reload"]');
  if(btn && !silent){ btn.disabled=true; btn.textContent='更新中…'; }
  const res=await SUPA.trackerRows(_tkToken, _tkPw);
  if(btn && !silent){ btn.disabled=false; btn.textContent='最新に更新'; }
  if(res.error){
    if(res.error==='BAD_PW' || res.error==='BAD_LINK'){ _tkToken=''; _tkPw=''; renderTrackerGate(new URLSearchParams(location.search).get('track')||''); return; }
    toast('更新できませんでした'); return;
  }
  renderTrackerList(res.rows||[], _tkCompany);
  if(!silent) toast('最新の情報に更新しました');
}

/* 状況ラベル。フォーム登録済み（未送客）は「確認中」として見せる */
const TK_LBL={entry:'送客済',screening:'書類選考',interview:'選考会',offer:'内定',joined:'入社',resigned:'早期退職',rejected:'見送り',declined:'辞退'};
function tkStatusLabel(r){
  if(r.kind==='intake') return (r.status==='rejected') ? '見送り' : '確認中';
  return TK_LBL[r.status] || r.status;
}
function tkStatusCls(r){
  if(r.kind==='intake') return (r.status==='rejected') ? 'rejected' : 'entry';
  return r.status;
}
function tkIsOut(r){
  return (r.kind==='intake') ? r.status==='rejected' : (r.status==='rejected'||r.status==='declined');
}
/* 履歴書・職務経歴書の提出状況。intake は 'rireki'/'shoku'、送客済みは日本語ラベル */
function tkDocStat(r){
  const kinds=(r.docs||[]).map(d=>(d.kind||'')+'|'+(d.name||''));
  const has=(code, ja, re)=> kinds.some(k=>{
    const [kd,nm]=k.split('|');
    return kd===code || kd===ja || re.test((nm||'').toLowerCase());
  });
  return {
    rireki: has('rireki','履歴書', /履歴|rireki|resume/),
    shoku:  has('shoku','職務経歴書', /職務|職歴|career|cv|shokumu/),
    // 内定承諾資料（種別は固定：1=源泉徴収票 / 2=給与明細 / 3=賞与明細）
    gensen: has('gensen','源泉徴収票', /源泉|徴収|gensen|withholding/),
    kyuyo:  has('kyuyo','給与明細', /給与|給料|payslip|salary|kyuyo/),
    shoyo:  has('shoyo','賞与明細', /賞与|ボーナス|bonus|shoyo/),
    n:(r.docs||[]).length
  };
}
function tkRow(id){ return (_tkRows||[]).find(r=>r.id===id); }

function renderTrackerList(rows, company){
  if(rows) _tkRows=rows;
  if(company!==undefined && company!==null && company!=='') _tkCompany=company;
  const all=_tkRows||[];

  const pick=k=>
    k==='all'    ? all :
    k==='intake' ? all.filter(r=>r.kind==='intake' && r.status!=='rejected') :
    k==='active' ? all.filter(r=>r.kind==='referral' && r.status!=='rejected' && r.status!=='declined' && r.status!=='joined' && r.status!=='resigned') :
    k==='joined' ? all.filter(r=>r.status==='joined'||r.status==='resigned') :
    k==='out'    ? all.filter(tkIsOut) :
    all.filter(r=>r.kind==='referral' && r.status===k);
  const cnt=k=>pick(k).length;
  const rowsF=pick(_tkTab);

  const tab=(k,label)=>`<button type="button" data-act="tracker-tab" data-tab="${k}" style="background:none;border:none;cursor:pointer;padding:8px 2px;margin-right:18px;font-size:13.5px;white-space:nowrap;color:${_tkTab===k?'var(--ink)':'var(--soft)'};font-weight:${_tkTab===k?'700':'500'};border-bottom:2px solid ${_tkTab===k?'var(--accent)':'transparent'}">${label} <span style="font-weight:400">${cnt(k)}</span></button>`;
  const tabs=`<div style="display:flex;align-items:center;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px">
    ${tab('all','すべて')}${tab('intake','確認中')}${tab('active','選考中')}${tab('offer','内定')}${tab('joined','入社')}${tab('out','見送り・辞退')}
  </div>`;

  const docCell=r=>{
    const s=tkDocStat(r);
    const chip=(ok,label)=>`<span class="tag" style="font-size:10px;margin-right:3px;background:${ok?'#E8F6EE':'var(--gray-bg)'};color:${ok?'#15803D':'var(--soft)'};font-weight:${ok?'600':'400'}">${ok?'✓':'—'} ${label}</span>`;
    return chip(s.rireki,'履歴書')+chip(s.shoku,'職務経歴書');
  };

  const body = rowsF.length ? rowsF.map(r=>`<tr>
      <td class="cell-strong">${esc(r.name)}${r.kana?`<div class="cell-sub" style="font-size:11px">${esc(r.kana)}</div>`:''}</td>
      <td><span class="tag" style="font-size:10px">${esc(r.projectName||'—')}</span></td>
      <td style="text-align:center"><span class="badge bd-${esc(tkStatusCls(r))}">${esc(tkStatusLabel(r))}</span></td>
      <td>${docCell(r)}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-ghost btn-sm" style="padding:3px 9px;font-size:11px" data-act="tk-edit" data-id="${esc(r.id)}">編集</button>
      </td>
    </tr>`).join('')
    : `<tr><td colspan="5" style="text-align:center;padding:28px"><span class="cell-sub">${all.length?'この状況の方はいません。':'まだご紹介いただいた方はいません。'}</span></td></tr>`;

  const intakeN=cnt('intake');
  const host=document.getElementById('app')||document.body;
  host.innerHTML=`
  <div style="min-height:100vh;background:var(--bg,#f6f8fa);padding:24px">
    <div style="max-width:960px;margin:0 auto">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
        <div>
          <div style="font-weight:800;font-size:20px">${esc(_tkCompany||'ご紹介いただいた方の一覧')}</div>
          <div style="font-size:12px;color:var(--soft);margin-top:3px">ご紹介いただいた方の進捗確認・情報の編集・書類の提出ができます</div>
        </div>
        <button class="btn btn-ghost btn-sm" data-act="tracker-reload">最新に更新</button>
      </div>
      <div class="kpi-grid" style="margin-bottom:16px">
        ${kpi('ご紹介', all.length+'<span class="unit">名</span>','var(--accent)')}
        ${kpi('確認中', intakeN+'<span class="unit">名</span>', intakeN?'var(--a)':'var(--muted)')}
        ${kpi('選考中', cnt('active')+'<span class="unit">名</span>','var(--b)')}
        ${kpi('入社', cnt('joined')+'<span class="unit">名</span>','var(--g)')}
      </div>
      ${intakeN?`<div class="panel" style="padding:11px 14px;margin-bottom:14px;background:#FDF2E2;border:1px solid #F5DEB8">
        <div style="font-size:12.5px;color:#B45309;font-weight:600;margin-bottom:2px">確認中の方が ${intakeN} 名います</div>
        <div style="font-size:11.5px;color:#92400E">フォームから登録いただいた方です。担当パートナーが内容を確認し、選考へ進めます。書類が未提出の方は「編集」から追加できます。</div>
      </div>`:''}
      ${tabs}
      <div class="panel tbl-wrap"><table class="tbl"><thead><tr>
        <th>お名前</th><th>案件</th><th style="text-align:center">状況</th><th>書類</th><th></th>
      </tr></thead><tbody>${body}</tbody></table></div>
      <div style="text-align:center;font-size:11px;color:var(--soft);margin-top:18px">
        内容についてのお問い合わせは、担当のパートナー企業さまへお願いいたします。
      </div>
    </div>
  </div>`;
}
