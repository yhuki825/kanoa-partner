  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

kground:var(--accent);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;font-family:var(--mono)}\n.st-chip.on .st-un{background:#fff;color:var(--ink)}\n/* ── 送客スレッドのコンテキストヘッダー（誰の/どの案件か常時表示） ── */\n.thread-ctx{display:flex;align-items:center;gap:11px;padding:11px 16px;background:linear-gradient(180deg,var(--accent-soft),#fff);border-bottom:1px solid var(--line);flex-shrink:0}\n.thread-ctx-av{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0}\n.thread-ctx-main{flex:1;min-width:0}\n.thread-ctx-name{font-weight:700;font-size:14px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}\n.thread-ctx-meta{font-size:11.5px;color:var(--muted);margin-top:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}\n.thread-ctx-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}\n.thread-ctx-actions{display:flex;gap:6px;flex-shrink:0}\n.thread-ctx-btn{padding:6px 11px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;font-size:11.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap}\n.thread-ctx-btn:hover{border-color:var(--accent);color:var(--accent)}\n.thread-ctx.general{background:var(--surface-2)}\n.thread-ctx.general .thread-ctx-av{background:var(--ink)}\n\n/* ── 候補者コマンドパネル（候補者×案件の紐付け・管理を一望） ── */\n.cmd{border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--accent-soft) 0%,#fff 62%);flex-shrink:0;padding:12px 16px 13px}\n.cmd-top{display:flex;align-items:flex-start;gap:11px}\n.cmd-av{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0}\n.cmd-id{flex:1;min-width:0}\n.cmd-name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.01em}\n.cmd-link{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap}\n.cmd-link .arr{color:var(--accent);font-weight:700}\n.cmd-link .pj{font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px;cursor:pointer}\n.cmd-link .pj:hover{border-color:var(--accent);color:var(--accent)}\n.cmd-link .ag{color:var(--muted)}\n.cmd-actions{display:flex;gap:6px;flex-shrink:0}\n.cmd-actions .thread-ctx-btn svg{vertical-align:-2px;margin-right:3px}\n/* pipeline stepper */\n.cmd-pipe{display:flex;align-items:center;gap:0;margin-top:11px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:3px;overflow:hidden}\n.pipe-step{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;border-radius:7px;font-size:10.5px;font-weight:600;color:var(--faint);cursor:default;transition:all .14s;text-align:center}\n.cmd-pipe.editable .pipe-step{cursor:pointer}\n.cmd-pipe.editable .pipe-step:hover{background:var(--accent-soft);color:var(--accent-ink)}\n.pipe-step .pdot{width:13px;height:13px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;transition:all .14s}\n.pipe-step.done{color:var(--ink-soft)}\n.pipe-step.done .pdot{background:var(--accent);border-color:var(--accent)}\n.pipe-step.done .pdot svg{width:8px;height:8px;stroke:#fff;stroke-width:3.5}\n.pipe-step.cur{color:var(--accent-ink)}\n.pipe-step.cur .pdot{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}\n.pipe-step.cur .pdot i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block}\n.pipe-line{width:8px;height:2px;background:var(--line-2);flex-shrink:0}\n.pipe-line.done{background:var(--accent)}\n/* facts row */\n.cmd-facts{display:flex;align-items:center;gap:7px;margin-top:10px;flex-wrap:wrap}\n.fact-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;font-size:11.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .14s}\n.fact-chip:hover{border-color:var(--accent);color:var(--accent)}\n.fact-chip svg{width:13px;height:13px;opacity:.8}\n.fact-chip.ok{background:var(--g-bg);border-color:transparent;color:var(--g);cursor:default}\n.fact-chip.ok:hover{border-color:transparent;color:var(--g)}\n.fact-chip.warn{background:var(--a-bg);border-color:transparent;color:var(--a)}\n.fact-chip.warn:hover{border-color:var(--a);color:var(--a)}\n.fact-chip .fc-k{font-weight:700;font-family:var(--mono);font-size:10px;opacity:.7}\n/* next-action smart hint */\n.next-hint{display:flex;align-items:center;gap:9px;margin-top:11px;padding:8px 11px;background:var(--ink);color:#fff;border-radius:9px;font-size:12px;font-weight:600}\n.next-hint .nh-ic{width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex-shrink:0}\n.next-hint .nh-ic svg{width:12px;height:12px;stroke:#fff;stroke-width:2.4}\n.next-hint .nh-text{flex:1;min-width:0;line-height:1.35}\n.next-hint .nh-text b{color:#fff}\n.next-hint .nh-text span{color:rgba(255,255,255,.62);font-weight:500}\n.next-hint .nh-act{flex-shrink:0;padding:5px 11px;border:none;background:#fff;color:var(--ink);border-radius:7px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}\n.next-hint .nh-act:hover{background:var(--accent);color:#fff}\n/* subthread chip: doc-missing flag */\n.st-chip .st-flag{width:6px;height:6px;border-radius:50%;background:var(--a);flex-shrink:0;margin-left:1px}\n.st-chip.on .st-flag{background:#ffd27a}\n/* task check */\n.task-check{flex-shrink:0;width:22px;height:22px;border:2px solid var(--line-2);border-radius:7px;background:var(--surface);display:grid;place-items:center;color:#fff;transition:all .14s}\n.task-check.on{background:var(--g);border-color:var(--g)}\n.task-check:hover{border-color:var(--accent)}\n/* selection data card */\n.seldata{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}\n.seldata-cell{text-align:center;padding:12px 6px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}\n.seldata-v{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}\n.seldata-l{font-size:10.5px;color:var(--muted);font-weight:500;margin-top:2px}\n.seldata-bar{height:4px;border-radius:2px;background:var(--gray-bg);margin-top:7px;overflow:hidden}\n.seldata-bar span{display:block;height:100%;background:var(--accent)}\n/* file upload */\n.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:22px 16px;border:1.5px dashed var(--line-2);border-radius:var(--r-md);background:var(--surface-2);cursor:pointer;text-align:center;transition:all .15s;margin-bottom:12px}\n.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:var(--accent-soft)}\n.dropzone svg{width:22px;height:22px;color:var(--muted)}\n.dropzone.drag svg,.dropzone:hover svg{color:var(--accent)}\n.dz-main{font-size:12.5px;font-weight:600;color:var(--ink-soft)}\n.dz-sub{font-size:11px;color:var(--faint)}\n.doc-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:var(--surface)}\n.doc-icon{min-width:42px;height:24px;display:grid;place-items:center;flex-shrink:0}\n.file-badge{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.3px;padding:3px 6px;border-radius:5px;line-height:1;white-space:nowrap;max-width:54px;overflow:hidden;text-overflow:ellipsis}\n.doc-slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n@media(max-width:560px){.doc-slots{grid-template-columns:1fr}}\n\n/* ══════════ モバイル最適化（スマホ実機 560px以下）━━ No25対応 ══════════ */\n@media(max-width:560px){\n  /* 全体レイアウト：サイドバーは引き出し式（920pxの設定を継承）、メインを全幅に */\n  .app.on{grid-template-columns:1fr}\n  .content{padding:14px 12px 60px}\n  .content-narrow{max-width:100%}\n  .topbar{padding:11px 13px;gap:10px}\n  .topbar h1,.topbar .page-title{font-size:16px}\n  .topbar .page-sub{display:none}\n\n  /* KPIカードは2列→内容が多ければ1列 */\n  .kpi-grid{grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}\n  .kpi{padding:12px 13px}\n  .kpi .kpi-val{font-size:20px}\n\n  /* テーブルは横スクロールできるように（潰さない） */\n  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}\n  .tbl{min-width:560px}\n  .tbl th,.tbl td{padding:9px 10px;font-size:12.5px}\n\n  /* ── メッセージ／チャット画面（実クラス対応版） ── */\n  /* .conv は720pxで既に1カラム化済み。560pxではさらに高さと余白を最適化 */\n  .conv{height:calc(100dvh - 150px);min-height:300px}\n  .cand-rail{max-height:120px}                            /* 上部の候補者レールを圧縮 */\n  .chat-head{padding:10px 12px;gap:8px}\n  .chat-body{padding:14px 10px;gap:7px}\n  .composer{padding:9px 10px;gap:7px}\n  .composer textarea{font-size:16px;min-height:38px}      /* iOSズーム防止に16px */\n  .msg-in,.msg-out{max-width:85%;font-size:13.5px}\n  .pin-bar{padding:7px 10px;font-size:11.5px}\n  .msg-search-wrap{margin-bottom:10px}\n\n  /* モーダルを画面いっぱいに近づけて操作しやすく */\n  .modal{width:calc(100vw - 24px) !important;max-width:calc(100vw - 24px) !important;max-height:88vh;overflow-y:auto}\n  .modal-grid{grid-template-columns:1fr !important}\n  .modal-actions{flex-wrap:wrap}\n  .modal-actions .btn{flex:1;min-width:120px}\n\n  /* ドロワー（候補者詳細など）を全幅に */\n  .drawer{width:100vw !important;max-width:100vw !important}\n\n  /* ボタンのタップ領域を確保 */\n  .btn{min-height:38px}\n  .btn-sm{min-height:32px}\n\n  /* セグメント・タブは横スクロール可 */\n  .seg{overflow-x:auto}\n\n  /* 収支グラフなどSVGははみ出さない */\n  svg{max-width:100%;height:auto}\n}\n/* 極小端末（380px以下）でKPIを1列に */\n@media(max-width:380px){\n  .kpi-grid{grid-template-columns:1fr}\n}\n.doc-slot{border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--surface)}\n.doc-slot.filled{border-color:#bbf7d0;background:#f4fdf7}\n.doc-slot-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}\n.doc-slot-label{font-size:12.5px;font-weight:700;color:var(--ink)}\n.doc-slot-ok{font-size:11px;font-weight:700;color:var(--g)}\n.doc-slot-need{font-size:10.5px;font-weight:700;color:#b45309;background:#fef3c7;padding:2px 8px;border-radius:999px}\n.dropzone.slim{padding:12px 10px;min-height:0}\n.dropzone.slim svg{width:20px;height:20px}\n.dropzone.slim .dz-main{font-size:12px}\n.reward-calc{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:4px 0 14px;background:var(--surface-2)}\n.rc-title{font-size:11.5px;font-weight:700;color:var(--ink);margin-bottom:7px}\n.rc-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:3px 0}\n.rc-row b{font-family:var(--mono);color:var(--ink);font-weight:700}\n.rc-row.hl{border-top:1px dashed var(--line-2);margin-top:3px;padding-top:7px}\n.rc-row.hl b{color:var(--g);font-size:14px}\n.rc-note{font-size:10.5px;color:var(--faint);margin-top:6px;line-height:1.5}\n.doc-meta{flex:1;min-width:0}\n.doc-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.doc-sub{font-size:10.5px;color:var(--muted)}\n.doc-act{flex-shrink:0;padding:4px 9px;border:1px solid var(--line-2);border-radius:6px;font-size:10.5px;font-weight:600;color:var(--ink-soft);background:var(--surface)}\n.doc-act:hover{border-color:var(--accent);color:var(--accent)}\n.doc-kind{flex-shrink:0;padding:4px 6px;border:1px solid var(--line-2);border-radius:6px;font-size:10.5px;font-weight:600;color:var(--ink-soft);background:var(--surface);outline:none}\n.docflag{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;font-size:10px;font-weight:700;background:var(--gray-bg);color:var(--faint);margin-right:2px}\n.docflag.on{background:var(--g-bg);color:var(--g)}\n.mention{color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:0 3px;font-weight:600}\n.msg-out .mention{background:rgba(255,255,255,.22);color:#fff}\n.mention-list{display:flex;flex-direction:column;gap:2px;max-height:200px;overflow-y:auto}\n.mention-opt{display:flex;align-items:center;gap:9px;padding:8px 10px;border:none;background:none;border-radius:8px;text-align:left;font-size:13px}\n.mention-opt:hover{background:var(--surface-2)}\n.mention-opt b{font-weight:600}\n/* detailed filter panel */\n.filter-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-bottom:14px}\n.fp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}\n.fp-field{display:flex;flex-direction:column;gap:6px}\n.fp-field>label{font-size:11px;font-weight:600;color:var(--ink-soft)}\n.fp-range{display:flex;align-items:center;gap:6px}\n.fp-range input{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line-2);border-radius:var(--r-sm);font-size:12px;background:var(--surface);color:var(--ink);outline:none}\n.fp-range span{color:var(--muted);font-size:12px}\n.fp-field>input{padding:7px 9px;border:1px solid var(--line-2);border-radius:var(--r-sm);font-size:12.5px;background:var(--surface);color:var(--ink);outline:none}\n.fp-field input:focus,.fp-range input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}\n.fp-check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);font-weight:500}\n.fp-check input{width:14px;height:14px;accent-color:var(--accent)}\n.fp-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}\n/* bulk action bar */\n.bulk-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r-md);padding:10px 14px;margin-bottom:12px}\n.bulk-n{font-size:13px;color:var(--accent-ink);font-weight:600}\n.bulk-n b{font-size:15px}\n.bulk-sep{width:1px;height:18px;background:var(--accent);opacity:.3}\n.rsel-cb{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}\n.tbl tr.row-sel{background:var(--accent-soft)}\n.acct-scroll{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r-md)}\n.acct-scroll table{margin:0}\n\n/* responsive */\n@media(max-width:760px){\n  .app.on{grid-template-columns:1fr}\n  .side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .26s var(--ease);width:236px;box-shadow:var(--sh-lg)}\n  .side.open{transform:translateX(0)}\n  .menu-btn{display:grid !important}\n  .content{padding:18px 16px 50px}\n  .topbar{padding:13px 16px}\n}\n.menu-btn{display:none;width:34px;height:34px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;place-items:center;color:var(--ink)}\n.login-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:18px;padding-top:15px;border-top:1px solid #ebeef2}\n.login-mode{font-size:10.5px;color:#a3aebc;font-family:var(--mono);letter-spacing:.06em}\n.login-foot-link{border:none;background:none;color:#a3aebc;font-size:11px;cursor:pointer;text-decoration:none;letter-spacing:.04em;transition:color .15s}\n.login-foot-link:hover{color:#1f3f63}\n.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:55}\n.scrim.on{display:block}\n</style>\n</head>\n<body>\n\n\n\n<!-- ══════════ LOGIN ══════════ -->\n<div id=\"bootSplash\" style=\"position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;background:radial-gradient(130% 100% at 50% 0%,#ffffff,#f4f7fa)\"><div style=\"width:34px;height:34px;border-radius:50%;border:3px solid #e6ebf1;border-top-color:#1f3f63;animation:kBootSpin .8s linear infinite\"></div><style>@keyframes kBootSpin{to{transform:rotate(360deg)}}</style></div>\n<div class=\"login-wrap\" id=\"loginWrap\" style=\"display:none\">\n  <canvas id=\"loginCanvas\"></canvas>\n  <div class=\"login-veil\"></div>\n  <header class=\"login-top\">\n    <div class=\"brand\">\n      <div class=\"brand-mark\"><svg viewBox=\"0 0 20 20\"><path d=\"M3 10 Q10 2 17 10 Q10 18 3 10Z\"></path></svg></div>\n      <span class=\"brand-name\">KANOA</span>\n      <div class=\"brand-divider\"></div>\n      <span class=\"brand-sub\">Partner Portal</span>\n    </div>\n    <div class=\"login-locale\">日本語 · JP</div>\n  </header>\n  <main class=\"login-stage\">\n    <div class=\"login-card\">\n      <div class=\"login-head\">\n        <div class=\"login-kicker\">Partner Access</div>\n        <h2 class=\"login-wordmark\">ログイン</h2>\n        <div class=\"login-title\" id=\"loginTitle\">パートナーログイン</div>\n        <div class=\"login-sub\" id=\"loginSub\">パートナー連携プラットフォーム</div>\n      </div>\n      <div class=\"login-tabs\">\n        <button class=\"login-tab on\" data-act=\"ltab\" data-tab=\"agency\">パートナーログイン</button>\n        <button class=\"login-tab\" data-act=\"ltab\" data-tab=\"kanoa\">KANOA管理</button>\n      </div>\n      <div class=\"login-body\" id=\"loginBody\"></div>\n      <div class=\"login-foot\">\n        <span class=\"login-mode\" id=\"loginMode\"></span>\n        <button class=\"login-foot-link\" data-act=\"supa-config\">Supabase接続設定</button>\n      </div>\n    </div>\n  </main>\n  <footer class=\"login-bottom\">\n    <span>© 2026 KANOA Inc.</span>\n    <span>Secure Partner Network</span>\n  </footer>\n</div>\n\n<!-- ══════════ APP ══════════ -->\n<div class=\"app\" id=\"app\">\n  <aside class=\"side\" id=\"side\">\n    <div class=\"side-brand\">\n      <div class=\"brand-mark\"><svg viewBox=\"0 0 20 20\"><path d=\"M3 10 Q10 2 17 10 Q10 18 3 10Z\"></path></svg></div>\n      <div class=\"side-brand-name\">KANOA</div>\n      <div class=\"side-role\" id=\"sideRole\">—</div>\n    </div>\n    <nav class=\"nav\" id=\"nav\"></nav>\n    <div class=\"side-foot\">\n      <div class=\"side-user\">\n        <div class=\"side-avatar\" id=\"userAvatar\">K</div>\n        <div class=\"side-user-info\">\n          <div class=\"side-user-name\" id=\"userName\">—</div>\n          <div class=\"side-user-sub\" id=\"userSub\">—</div>\n        </div>\n        <button class=\"side-logout\" data-act=\"logout\" title=\"ログアウト\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4\"></path><path d=\"M16 17l5-5-5-5M21 12H9\"></path></svg></button>\n      </div>\n      <div class=\"side-dev\" id=\"sideDev\" style=\"display:none\">\n        <button class=\"bulk-link\" data-act=\"reset-demo\" style=\"font-size:10.5px;color:var(--faint);padding:4px 8px;margin-top:2px\">デモデータをリセット</button>\n        <button class=\"bulk-link\" data-act=\"impl-guide\" style=\"font-size:10.5px;color:var(--faint);padding:4px 8px\">実装ガイド（Supabase）</button>\n      </div>\n      <button class=\"bulk-link\" id=\"switchAcct\" data-act=\"switch-account\" style=\"display:none;font-size:10.5px;color:var(--faint);padding:4px 8px\">別のアカウントでログイン</button>\n    </div>\n  </aside>\n  <div class=\"scrim\" id=\"scrim\" data-act=\"closeside\"></div>\n  <main class=\"main\">\n    <header class=\"topbar\">\n      <button class=\"menu-btn\" data-act=\"openside\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 6h18M3 12h18M3 18h18\"></path></svg></button>\n      <div>\n        <h1 id=\"pageTitle\">—</h1>\n        <div class=\"topbar-sub\" id=\"pageSub\"></div>\n      </div>\n      <div class=\"topbar-actions\" id=\"pageActions\"></div>\n    </header>\n    <div class=\"content\" id=\"content\"></div>\n  </main>\n</div>\n\n<!-- drawer / overlay / modal / toast -->\n<div class=\"overlay\" id=\"overlay\" data-act=\"closeoverlay\"></div>\n<aside class=\"drawer\" id=\"drawer\"></aside>\n<div class=\"modal\" id=\"modal\"><div class=\"overlay\" data-act=\"closemodal\" style=\"opacity:1;pointer-events:auto;z-index:0\"></div><div class=\"modal-card\" id=\"modalCard\"></div></div>\n<div class=\"toast\" id=\"toast\"></div>\n\n<script>\n/* ════════════════════ DATA ════════════════════ */\n/* ════════════════════ 本番設定（Supabase）════════════════════\n   ・このファイルは現在デモモード（localStorage）で単体動作します。\n   ・下記 CONFIG を埋めると本番モードに切替できる構造です。\n   ・テーブル定義は同梱の relay-schema.sql、手順は左下「実装ガイド」を参照。 */\nconst CONFIG = (()=>{\n  const DEFAULT = { SB_URL:'https://oicpfsfvywdhdriqehyr.supabase.co', SB_ANON_KEY:'sb_publishable_fBK1T1Xhx1Luj-OjbzFvaQ_4pUgNOms' };\n  try{ const s=JSON.parse(localStorage.getItem('kanoa_supa_cfg')||'null');\n    if(s && typeof s.url==='string'){ return s.url ? {SB_URL:s.url, SB_ANON_KEY:s.key||''} : {SB_URL:'',SB_ANON_KEY:''}; }\n  }catch(e){}\n  return DEFAULT;\n})();\nconst DEMO_MODE = !CONFIG.SB_URL;\n\n/* ════════════════════ SUPABASE ADAPTER（本番モード）════════════════════\n   ・CONFIG.SB_URL / SB_ANON_KEY を設定すると DEMO_MODE=false になり本番動作。\n   ・デモ時(既定)は本アダプタは一切呼ばれず、localStorage 単体で動きます。\n   ・テーブル定義: relay-schema.sql / 手順: IMPLEMENTATION.md・左下「実装ガイド」。 */\nconst SUPA = (()=>{\n  let sb=null, syncT=null;\n  const slice16=s=>(s||'').slice(0,16).replace('T',' ');\n  // ── camel(アプリ) ⇄ snake(DB) マッピング ──\n  const fromAgency=r=>({id:r.id,name:r.name,contact:r.contact,email:r.email,status:r.status,source:r.source,joined:r.joined,code:r.code,special:r.special||'',license:!!r.license,bank:r.bank||'',payRoute:r.pay_route||'A',pwHash:r.pw_hash||null,inviteToken:r.invite_token||null,inviteIssuedAt:r.invite_issued_at||null,inviteUsedAt:r.invite_used_at||null});\n  const toAgency  =a=>({id:a.id,name:a.name,contact:a.contact,email:a.email,status:a.status,source:a.source,joined:a.joined||null,code:a.code||null,special:a.special||null,license:!!a.license,bank:a.bank||null,pay_route:a.payRoute||'A',pw_hash:a.pwHash||null,invite_token:a.inviteToken||null,invite_issued_at:a.inviteIssuedAt||null,invite_used_at:a.inviteUsedAt||null});\n  const fromProject=r=>({id:r.id,name:r.name,client:r.client,logo:r.logo,color:r.color,status:r.status,position:r.position,employment:r.employment,salary:r.salary,location:r.location,summary:r.summary,conditions:r.conditions,requirements:r.requirements||[],flow:r.flow||[],rewardType:r.reward_type,re l||null,address:r.address||null,area:r.area||null,source:r.src||null,company:r.company||null,note:r.note||null,docs:JSON.stringify(r.docs||[]),source_type:r.source_type||'form'});\nconst fromRef=r=>({id:r.id,pj:r.project_id,ag:r.agency_id,name:r.name,kana:r.kana,phone:r.phone,email:r.email,address:r.address,area:r.area,src:r.source_company||'',resigned:!!r.resigned,resignedOn:r.resigned_on||null,resignFraud:!!r.resign_fraud,resignConfirmed:!!r.resign_confirmed,status:r.status,session:r.session||'—',joined:r.joined_on||'',created:(r.created_at||'').slice(0,10),note:r.note||'',docs:[],spi:r.spi_status||'none',compliance:r.compliance_status||'none',seenK:r.seen_kanoa!==false,docs:[]});\n  const toRef  =r=>({id:r.id,project_id:r.pj,agency_id:r.ag,name:r.name,kana:r.kana,phone:r.phone,email:r.email,address:r.address,area:r.area,source_company:r.src||null,resigned:!!r.resigned,resigned_on:r.resignedOn||null,resign_fraud:!!r.resignFraud,resign_confirmed:!!r.resignConfirmed,status:r.status,session:r.session==='—'?null:r.session,joined_on:r.joined||null,note:r.note||null,spi_status:r.spi||'none',compliance_status:r.compliance||'none',seen_kanoa:r.seenK!==false});\n  const fromReflog=r=>({id:r.id,refId:r.ref_id,ts:r.ts||'',by:r.by_name||'',byRole:r.by_role||'',action:r.action||'',detail:r.detail||''});\n  const toReflog=l=>({id:l.id,ref_id:l.refId,ts:l.ts||'',by_name:l.by||'',by_role:l.byRole||'',action:l.action||'',detail:l.detail||''});\n  const fromInvoice=r=>({id:r.id,no:r.no,agId:r.agency_id,status:r.status,items:r.items||[],subtotal:r.subtotal||0,tax:r.tax||0,total:r.total||0,issuedOn:r.issued_on||'',submittedOn:r.submitted_on||null,decidedOn:r.decided_on||null,paidOn:r.paid_on||null,rejectReason:r.reject_reason||'',history:r.history||[]});\n  const toInvoice=v=>({id:v.id,no:v.no,agency_id:v.agId,status:v.status,items:v.items||[],subtotal:v.subtotal||0,tax:v.tax||0,total:v.total||0,issued_on:v.issuedOn||null,submitted_on:v.submittedOn||null,decided_on:v.decidedOn||null,paid_on:v.paidOn||null,reject_reason:v.rejectReason||null,history:v.history||[]});\n  const fromMsg=r=>({id:r.id,ag:r.agency_id,from:r.sender,text:r.body,ts:slice16(r.created_at),read:r.read,refId:r.ref_id,replyTo:r.reply_to,reactions:r.reactions||[],mentions:r.mentions||[],stamp:r.stamp,pinned:r.pinned,edited:r.edited,deleted:r.deleted});\n  const toMsg  =m=>({id:m.id,agency_id:m.ag,sender:m.from,body:m.text,ref_id:m.refId||null,reply_to:m.replyTo||null,reactions:m.reactions||[],mentions:m.mentions||[],stamp:m.stamp||null,pinned:!!m.pinned,edited:!!m.edited,deleted:!!m.deleted,read:!!m.read});\n  const fromMember=r=>({id:r.id,org:r.org,name:r.name,email:r.email,title:r.title,created:(r.created_at||'').slice(0,10)});\n  const toMember  =m=>({id:m.id,org:m.org,name:m.name,email:m.email||null,title:m.title||null});\n  const fromTask=r=>({id:r.id,owner:r.owner,from:r.from_owner||r.owner,ag:r.agency_id,refId:r.ref_id,text:r.body,done:r.done,due:r.due||'',created:slice16(r.created_at)});\n  const toTask  =t=>({id:t.id,owner:t.owner,from_owner:t.from||t.owner,agency_id:t.ag||null,ref_id:t.refId||null,body:t.text,done:!!t.done,due:t.due||null});\n\n  async function ensureClient(){\n    if(sb) return sb;\n    if(!window.supabase){ await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }\n    sb=window.supabase.createClient(CONFIG.SB_URL, CONFIG.SB_ANON_KEY);\n    return sb;\n  }\n  async function whoami(){\n    const { data:{ user } } = await sb.auth.getUser();\n    if(!user) return null;\n    const { data:adm } = await sb.from('kanoa_admins').select('user_id').eq('user_id',user.id).maybeSingle();\n    if(adm) return { role:'kanoa' };\n    const { data:ag } = await sb.from('agencies').select('id').eq('auth_user_id',user.id).maybeSingle();\n    if(ag) return { role:'agency', agencyId:ag.id };\n    return { role:null };\n  }\n  async function loadAll(){\n    const [ags,pjs,asn,refs,msgs,mem,tsk,docs,llogs] = await Promise.all([\n      sb.from('agencies').select('*').order('id'), sb.from('projects').select('*'),\n      sb.from('assignments').select('*'), sb.from('referrals').select('*'),\n      sb.from('messages').select('*').order('created_at'), sb.from('members').select('*'),\n      sb.from('tasks').select('*'), sb.from('documents').select('*'),\n      sb.from('login_logs').select('*').order('created_at',{ascending:false}).limit(500) ]);\n    let invData=[]; try{ const iv=await sb.from('invoices').select('*'); invData=iv.data||[]; }catch(e){}\n    let logData=[]; try{ const lg=await sb.from('reflog').select('*').order('created_at',{ascending:false}).limit(1000); logData=lg.data||[]; }catch(e){}\n    let intakeData=[]; try{ const ik=await sb.from('intake').select('*').order('created_at',{ascending:false}); intakeData=ik.data||[]; }catch(e){}\n    const d={ agencies:(ags.data||[]).map(fromAgency), projects:(pjs.data||[]).map(fromProject),\n      assignments:(asn.data||[]).map(fromAssign), referrals:(refs.data||[]).map(fromRef),\n      messages:(msgs.data||[]).map(fromMsg), members:(mem.data||[]).map(fromMember),\n      tasks:(tsk.data||[]).map(fromTask), activity:[], invoices:invData.map(fromInvoice), reflog:logData.map(fromReflog), intake:intakeData.map(fromIntake),\n      logins:(llogs.data||[]).map(r=>({id:r.id,ag:r.agency_id,at:(r.created_at||'').slice(0,16).replace('T',' '),ok:r.success,via:r.method||'パスワード'})) };\n    const byRef={}; d.referrals.forEach(r=>byRef[r.id]=r);\n    (docs.data||[]).forEach(x=>{ const r=byRef[x.referral_id]; if(r) r.docs.push({id:x.id,name:x.name,size:x.size,type:x.mime,kind:x.kind,uploaded:slice16(x.created_at),path:x.storage_path}); });\n    return d;\n  }\n  /* 変更の書き戻し（MVP：デバウンスで全テーブル upsert。大規模化時は差分同期へ） */\n  function scheduleSync(){ if(!sb) return; clearTimeout(syncT); syncT=setTimeout(syncNow, 350); }\n  let _syncing=false;\n  // isBusy: 未同期のローカル変更がある間(syncT) と 実通信中(_syncing) は true。\n  // これで送信直後の未同期メッセージが、古いサーバー取得で一瞬消えるのを防ぐ。\n  // 待機は syncNow 冒頭で syncT=null により必ず解除されるため「止まったまま」にはならない\n  // （送信間隔350msより長く操作しなければ、すぐ最新化される）。\n  function isBusy(){ return _syncing || !!syncT; }\n  async function syncNow(){\n    if(!sb) return;\n    clearTimeout(syncT); syncT=null;   // ★重要: タイマーIDを解放。これが残ると isBusy() が永久true になり更新が止まる\n    _syncing=true;\n    // 各テーブルを独立してupsert。1つ失敗しても他テーブルの同期は継続する。\n    const one=async (table, rows)=>{\n      try{ const { error }=await sb.from(table).upsert(rows); if(error) console.warn('[sync]',table,error.message); }\n      catch(e){ console.warn('[sync]',table,e&&e.message); }\n    };\n    await one('agencies', DB.agencies.map(toAgency));\n    await one('projects', DB.projects.map(toProject));\n    await one('assignments', DB.assignments.map(toAssign));\n    await one('referrals', DB.referrals.map(toRef));\n    await one('messages', DB.messages.map(toMsg));\n    await one('members', DB.members.map(toMember));\n    await one('tasks', DB.tasks.map(toTask));\n    try{\n      if(DB.invoices&&DB.invoices.length) await one('invoices', DB.invoices.map(toInvoice));\n      if(DB.reflog&&DB.reflog.length) await one('reflog', DB.reflog.map(toReflog));\n      if(DB.intake&&DB.intake.length) await one('intake', DB.intake.map(toIntake));\n    } finally { _syncing=false; }\n  }\n  async function delRow(table,col,val){ if(!sb) return; try{ await sb.from(table).delete().eq(col,val); }catch(e){ console.error(e); } }\n  /* リアルタイム購読（postgres_changes）。RLSにより自分が見える行の変更のみ届く */\n  let _rtCh=null;\n  async function setRealtimeAuth(){\n    try{ const {data}=await sb.auth.getSession(); if(data&&data.session&&sb.realtime&&sb.realtime.setAuth) sb.realtime.setAuth(data.session.access_token); }catch(e){}\n  }\n  async function loadMessages(){   // 連絡のみ軽量取得（高速な新着検知用）\n    if(!sb) return null;\n    const { data, error } = await sb.from('messages').select('*').order('created_at');\n    if(error) return null;\n    return (data||[]).map(fromMsg);\n  }\n  let _rtStatus='closed', _rtOnChange=null, _rtWatchdog=null;\n  function subscribeRealtime(onChange){\n    if(!sb) return;\n    _rtOnChange=onChange;\n    if(_rtCh) return;  // 既存チャンネルがあれば維持（再接続はwatchdog経由でteardown後に呼ばれる）\n    try{\n      setRealtimeAuth();\n      _rtCh = sb.channel('kanoa-realtime-'+Date.now());\n      ['messages','referrals','tasks','assignments','projects','agencies','members','documents','login_logs','invoices','reflog'].forEach(tb=>{\n        _rtCh.on('postgres_changes', {event:'*', schema:'public', table:tb}, payload=>{ try{ onChange && onChange(tb, payload); }catch(e){} });\n      });\n      _rtCh.subscribe(status=>{\n        _rtStatus=status;\n        // 接続が切れた/エラーになったら、古いチャンネルを破棄して次のwatchdogサイクルで再接続する\n        if(status==='CHANNEL_ERROR' || status==='TIMED_OUT' || status==='CLOSED'){\n          try{ sb.removeChannel(_rtCh); }catch(e){}\n          _rtCh=null;\n        }\n      });\n      if(!_rtWatchdog){\n        // 30秒ごとに接続状態を点検し、切れていれば自動で繋ぎ直す（スリープ復帰・回線切替対策）\n        _rtWatchdog=setInterval(()=>{\n          if(DEMO_MODE) return;\n          if(!_rtCh || _rtStatus==='CHANNEL_ERROR' || _rtStatus==='TIMED_OUT' || _rtStatus==='CLOSED'){\n            if(_rtCh){ try{ sb.removeChannel(_rtCh); }catch(e){} _rtCh=null; }\n            subscribeRealtime(_rtOnChange);\n          }\n        }, 30000);\n      }\n    }catch(e){ console.warn('realtime subscribe failed', e); _rtCh=null; }\n  }\n  function forceReconnectRealtime(){\n    if(_rtCh){ try{ sb.removeChannel(_rtCh); }catch(e){} _rtCh=null; }\n    if(_rtOnChange) subscribeRealtime(_rtOnChange);\n  }\n  function unsubscribeRealtime(){ try{ if(_rtCh){ sb.removeChannel(_rtCh); _rtCh=null; } if(_rtWatchdog){ clearInterval(_rtWatchdog); _rtWatchdog=null; } _rtStatus='closed'; }catch(e){} }\n  async function signInPassword(email,pw){ const {error}=await sb.auth.signInWithPassword({email,password:pw}); return error; }\n  async function signInOtp(email){ const {error}=await sb.auth.signInWithOtp({email}); return error; }\n  async function signOut(){ try{ await sb.auth.signOut(); }catch(e){} }\n  async function resetPassword(email){ await ensureClient(); const redirectTo=location.origin+location.pathname; const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo}); return error; }\n  async function updatePassword(newPw){ await ensureClient(); const {error}=await sb.auth.updateUser({password:newPw}); return error; }\n\n  /* パートナーログイン（シンプル方式）：\n     supabase.auth は KANOA管理者のみ使用。\n     パートナーは agencies テーブルの login_id / pw_hash で照合。\n     RLSによりパートナーは自社行のみ読み取り可能（service_role keyをサーバーサイドで使うか、Edge Functionで照合）。\n     デモではlocalStorage内のpwをそのまま照合。 */\n  async function partnerLoginDirect(loginId, pw){\n    // Edge Function 未配備時のフォールバック（直接照合）。配備後は自動的に使われなくなる。\n    try{\n      await ensureClient();\n      const { data } = await sb.from('agencies').select('id,email,pw_hash,status').ilike('email', loginId).maybeSingle();\n      if(!data || !data.pw_hash) return null;\n      if(data.status==='suspended') throw new Error('このアカウントは停止されています。');\n      const hash=await hashPwAsync(pw);\n      return data.pw_hash===hash ? data.id : null;\n    }catch(e){ if(e && e.message && e.message.indexOf('停止')>=0) throw e; return null; }\n  }\n  async function partnerLogin(loginId, pw){\n    await ensureClient();\n    // 【セキュア版】pw_hash はクライアントに渡さない。\n    // Supabase Edge Function (partner-login) でサーバー側照合＋JWT発行。\n    // 成功時: パートナーJWTを Supabase クライアントに適用し、\n    //         以降のクエリは RLS により自社の行のみアクセス可能になる。\n    if(DEMO_MODE){\n      // デモモードのみ従来の簡易照合（localStorage）を許可\n      try{\n        const a=(DB.agencies||[]).find(x=>(x.email||'').toLowerCase()===(loginId||'').toLowerCase());\n        if(!a) return null;\n        if(a.status==='suspended') throw new Error('このアカウントは停止されています。');\n        const ok = a.pw===pw || a.pwHash===await hashPwAsync(pw);\n        return ok ? a.id : null;\n      }catch(e){ return null; }\n    }\n    let res=null;\n    try{\n      res = await fetch(`${CONFIG.SB_URL}/functions/v1/partner-login`, {\n        method:'POST',\n        headers:{ 'Content-Type':'application/json', 'apikey':CONFIG.SB_ANON_KEY },\n        body: JSON.stringify({ loginId, pw })\n      });\n    }catch(netErr){ return await partnerLoginDirect(loginId, pw); }\n    try{\n      if(!res.ok){\n        if(res.status===429) throw new Error('ログイン試行が多すぎます。しばらく待ってから再度お試しください。');\n        if(res.status===403) throw new Error('このアカウントは停止されています。');\n        if(res.status===404 || res.status>=500) return await partnerLoginDirect(loginId, pw); // Edge Function未配備時のフォールバック\n        return null; // 401 等は資格情報エラーとして null（呼び出し側でエラー表示）\n      }\n      const data = await res.json();\n      if(!data || !data.ok || !data.token) return null;\n      // 発行された JWT を Supabase クライアントに適用（以後のクエリは agency 権限）\n      try{ await sb.auth.setSession({ access_token:data.token, refresh_token:data.token }); }catch(e){}\n      try{ if(SUPA.setRealtimeAuth) SUPA.setRealtimeAuth(data.token); }catch(e){}\n      try{ localStorage.setItem('kanoa_partner_token', data.token); }catch(e){}\n      return data.agency_id;\n    }catch(e){ throw e; }\n  }\n  async function hashPwAsync(plain){\n    try{\n      const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('kanoa_salt_2026::'+plain));\n      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');\n    }catch(e){ return plain; }\n  }\n  async function uploadDoc(refId,file,kind){\n    const id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():uid('D');\n    const ext=(/\\.[A-Za-z0-9]+$/.exec(file.name)||[''])[0];   // 拡張子のみ流用（日本語名・空白でも安全なキーに）\n    const path=`${refId}/${id}${ext}`;\n    const k=kind||inferKind(file.name);\n    const up=await sb.storage.from('candidate-docs').upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false}); if(up.error) throw up.error;\n    await sb.from('documents').insert({ id, referral_id:refId, name:file.name, kind:k, size:file.size, mime:file.type, storage_path:path, uploaded_by:meId() });\n    return { id, name:file.name, size:file.size, type:file.type, kind:k, uploaded:nowTS(), path };\n  }\n  async function docUrl(path){ const {data}=await sb.storage.from('candidate-docs').createSignedUrl(path,300); return data&&data.signedUrl; }\n  async function removeDoc(path,id){ if(path) await sb.storage.from('candidate-docs').remove([path]); await sb.from('documents').delete().eq('id',id); }\n  async function boot(){\n    try{\n      // 応募フォーム(?form=)・招待(?invite=)のURLは、未ログインの外部の人が開くもの。\n      // 認証チェックやログイン画面表示をせず、CHECK_INVITE_THEN_LOGINが表示したフォームをそのまま維持する。\n      try{\n        const _p=new URLSearchParams(location.search);\n        if(_p.get('form') || (_p.get('invite') && _p.get('token'))) return;\n      }catch(e){}\n      await ensureClient();\n      try{ const _h=new URLSearchParams((location.hash||'').replace(/^#/,'')); const _q=new URLSearchParams(location.search); const _t=_h.get('type')||_q.get('type'); if(_t==='recovery'||_t==='invite'){ showSetPasswordScreen(); return; } }catch(e){}\n      try{ sb.auth.onAuthStateChange((event)=>{ if(event==='PASSWORD_RECOVERY') showSetPasswordScreen(); }); }catch(e){}\n      // テスト用：URLに ?login（または #login）が付いていれば、保持中のセッションをログアウトしてログイン画面へ\n      if(/(?:[?&]login(?:=|&|$))|#login/.test(location.search+location.hash)){\n        try{ localStorage.removeItem('kanoa_partner_session'); }catch(e){}\n        try{ await signOut(); }catch(e){}\n        try{ const u=new URL(location.href); u.searchParams.delete('login'); history.replaceState(null,'',u.pathname+u.search); }catch(e){}\n        renderLogin(); return;\n      }\n      // パートナー系ログインの復元（パスワード認証はAuthセッションを持たないため、保存済みIDから復帰）\n      try{\n        const raw=localStorage.getItem('kanoa_partner_session');\n        if(raw){\n          const ps=JSON.parse(raw);\n          if(ps && ps.role==='agency' && ps.agencyId){\n            // アカウントがまだ有効か再確認（停止・削除されていないか）\n            const { data:ag } = await sb.from('agencies').select('id,status,special').eq('id',ps.agencyId).maybeSingle();\n            if(ag && ag.status!=='suspended'){\n              DB = await loadAll();\n              S = {role:'agency', agencyId:ag.id, view:(ag.special==='recore'?'recore':'pjlist')};\n              enterApp(); return;\n            } else { localStorage.removeItem('kanoa_partner_session'); }\n          } else if(ps && ps.role==='sub' && ps.subId){\n            const { data:sa } = await sb.from('subaccounts').select('id,ag,company').eq('id',ps.subId).maybeSingle();\n            if(sa){\n              DB = await loadAll();\n              S = {role:'sub', parentAg:sa.ag, subCompany:sa.company, subId:sa.id, view:'subhome'};\n              enterApp(); return;\n            } else { localStorage.removeItem('kanoa_partner_session'); }\n          }\n        }\n      }catch(e){}\n      const who=await whoami();\n      if(who && who.role){\n        DB = await loadAll();\n        S = who.role==='kanoa' ? {role:'kanoa',view:'overview'} : {role:'agency',agencyId:who.agencyId,view:'pjlist'};\n        enterApp();\n      } else { renderLogin(); }\n    }catch(e){ console.error('Supabase boot failed; showing login', e); renderLogin(); }\n  }\n  async function loginThen(role){ // 認証成功後にデータ取得して入室\n    const who=await whoami();\n    if(!who || !who.role || (role && who.role!==role)){ return false; }\n    DB = await loadAll();\n    S = who.role==='kanoa' ? {role:'kanoa',view:'overview'} : {role:'agency',agencyId:who.agencyId,view:'pjlist'};\n    enterApp(); return true;\n  }\n  async function insertLoginLog(agId, success, method){\n    if(!sb) return;\n    try{ await sb.from('login_logs').insert({agency_id:agId,success:!!success,method:method||'パスワード'}); }catch(e){ console.warn('login_log insert failed',e); }\n  }\n  return { boot, ensureClient, signInPassword, signInOtp, signOut, resetPassword, updatePassword, partnerLogin, loginThen, loadAll, loadMessages, scheduleSync, syncNow, isBusy, delRow, uploadDoc, docUrl, removeDoc, insertLoginLog, subscribeRealtime, unsubscribeRealtime, setRealtimeAuth, forceReconnectRealtime };\n})();\n\nconst LS_KEY = 'kanoa_relay_v22';\nconst yen = n => '¥' + (n||0).toLocaleString('ja-JP');\nconst esc = s => String(s==null?'':s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst AG_COLORS=['#4f46e5','#0ea5e9','#0d9488','#16a34a','#d97706','#db2777','#7c3aed','#dc2626'];\nfunction agColor(id){ let h=0; const s=String(id||''); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return AG_COLORS[h%AG_COLORS.length]; }\nfunction agAvatar(a,size){ const s=size||32; return `<div style=\"width:${s}px;height:${s}px;border-radius:${Math.round(s*0.28)}px;background:${agColor(a.id)};color:#fff;display:grid;place-items:center;font-weight:700;font-size:${Math.round(s*0.42)}px;flex-shrink:0\">${esc((a.name||'?').slice(0,1))}</div>`; }\nconst uid = p => p + '-' + Math.random().toString(36).slice(2,7);\nconst todayISO = () => new Date().toISOString().slice(0,10);\nfunction joinedYM(r){ if(!r||!r.joined) return ''; const p=r.joined.slice(0,7).split('-'); return p.length===2?`${p[0]}年${Number(p[1])}月`:''; }\nfunction joinedM(r){ if(!r||!r.joined) return '—'; const m=Number(r.joined.slice(5,7)); return m?m+'月':'—'; }\nconst nowTS = () => new Date().toISOString().slice(0,16).replace('T',' ');\nfunction thread(ag){ return DB.messages.filter(m=>m.ag===ag).sort((a,b)=>a.ts<b.ts?-1:1); }\n/* ── 送客スレッド分割（refIdをスレッドキーに。null = 全体連絡） ── */\nfunction subThread(ag, refId){ return DB.messages.filter(m=>m.ag===ag && (m.refId||null)===(refId||null)).sort((a,b)=>a.ts<b.ts?-1:1); }\nfunction subThreadKeys(ag){\n  // このパートナーのメッセージに登場する refId 一覧に加え、\n  // 送客済みの候補者も（連絡がまだ無くても）自動でスレッドに出す。\n  // これで「送客登録した個人の名前が各社リストに自動表示される」（手動追加が不要）。\n  const set=new Set();\n  DB.messages.filter(m=>m.ag===ag).forEach(m=>{ if(m.refId) set.add(m.refId); });\n  DB.referrals.filter(r=>r.ag===ag && r.status!=='rejected' && r.status!=='declined').forEach(r=>set.add(r.id));\n  return Array.from(set);\n}\nlet _uIdx=null;\nfunction invalidateUnread(){ _uIdx=null; }\nfunction unreadIndex(){\n  if(_uIdx) return _uIdx;\n  const idx=new Map();\n  for(const m of DB.messages){ if(m.read||m.deleted) continue; const k=(m.ag||'')+'|'+(m.refId||''); let e=idx.get(k); if(!e){ e=[0,0]; idx.set(k,e); } if(m.from==='agency') e[0]++; else if(m.from==='kanoa') e[1]++; }\n  _uIdx=idx; return idx;\n}\nfunction subUnread(ag, refId, viewer){\n  const ent=unreadIndex().get((ag||'')+'|'+(refId||''));\n  return ent?(viewer==='kanoa'?ent[0]:ent[1]):0;\n}\nfunction markReadSub(ag, refId, viewer){\n  let changed=false;\n  DB.messages.forEach(m=>{ if(m.ag===ag && (m.refId||null)===(refId||null)){ if(viewer==='kanoa'&&m.from==='agency'&&!m.read){m.read=true;changed=true;} if(viewer==='agency'&&m.from==='kanoa'&&!m.read){m.read=true;changed=true;} } });\n  if(changed) invalidateUnread();\n}\nfunction unreadKanoaBy(ag){ const idx=unreadIndex(); let n=0; for(const [k,e] of idx){ if(k.slice(0,(ag||'').length+1)===(ag||'')+'|') n+=e[0]; } return n; }\n/* 案件ごと：新着連絡のある候補者の数（見る側の未読） */\nfunction projUnreadCands(pj){\n  const viewer=S.role==='kanoa'?'kanoa':'agency';\n  return DB.referrals.filter(r=>r.pj===pj && (viewer==='kanoa'||r.ag===S.agencyId) && subUnread(r.ag, r.id, viewer)>0).length;\n}\nfunction unreadKanoa(){ const idx=unreadIndex(); let n=0; for(const e of idx.values()) n+=e[0]; return n; }\nfunction unreadAgency(ag){ const idx=unreadIndex(); let n=0; for(const [k,e] of idx){ if(k.slice(0,(ag||'').length+1)===(ag||'')+'|') n+=e[1]; } return n; }\n\nfunction meRole(){ return S.role==='kanoa'?'kanoa':'agency'; }\nfunction meId(){ return S.role==='kanoa'?'kanoa':S.agencyId; }\nfunction curThreadAg(){ return S.role==='kanoa'?S.threadAg:S.agencyId; }\nfunction orgMembers(org){ return DB.members.filter(m=>m.org===org); }\nfunction threadMembers(ag){ return orgMembers('kanoa').concat(orgMembers(ag)); }\nfunction myOrg(){ return S.role==='kanoa'?'kanoa':S.agencyId; }\nfunction orgLabel(org){ return org==='kanoa'?'KANOA':(agency(org)?agency(org).name:org); }\nfunction addMember(org,name,email,title){ if(!name) return; DB.members.push({id:uid('U'),org,name,email:email||'',title:title||'',created:todayISO()}); save(); }\nfunction pushMsg(ag, from, text, extra){ const m=Object.assign({id:uid('M'),ag,from,text,ts:nowTS(),read:false,refId:null,reactions:{}}, extra||{}); DB.messages.push(m); save(); return m; }\n/* 自動通知メッセージ（システムからの連絡として、該当候補者スレッドに投稿） */\nfunction autoNotify(ag, from, text, refId){\n  const m={id:uid('M'), ag, from, text, ts:nowTS(), read:false, refId:refId||null, reactions:{}, auto:true};\n  DB.messages.push(m); save();\n  return m;\n}\n\nfunction toggleReaction(msgId, emoji){ const m=DB.messages.find(x=>x.id===msgId); if(!m) return; m.reactions=m.reactions||{}; const arr=m.reactions[emoji]||[]; const i=arr.indexOf(meId()); if(i>=0) arr.splice(i,1); else arr.push(meId()); if(arr.length) m.reactions[emoji]=arr; else delete m.reactions[emoji]; save(); }\n/* 選考データの可視化（対送客の通過率） */\nfunction selData(refs){\n  const N=refs.length||0;\n  const reach=set=>refs.filter(r=>set.includes(r.status)).length;\n  const docPass=reach(['interview','offer','joined']);\n  const offer=reach(['offer','joined']);\n  const joined=reach(['joined']);\n  const pct=(a)=>N?Math.round(a/N*100):0;\n  return {N, docPass, offer, joined, docRate:pct(docPass), offerRate:pct(offer), joinRate:pct(joined)};\n}\n/* メッセージ定型文・スタンプ・絵文字（LINE/Slack/Chatwork風） */\nconst MSG_TEMPLATES=[\n  {label:'日程調整', text:'選考会の日程調整のご連絡です。候補日をいくつかご提示いただけますか？'},\n  {label:'書類依頼', text:'恐れ入ります、書類選考にあたり職務経歴書のご提出をお願いできますでしょうか。'},\n  {label:'結果連絡', text:'選考結果のご連絡です。次のステップに進んでいただくことになりました。'},\n  {label:'リマインド', text:'選考会のリマインドです。当日の持ち物・集合時間を候補者へご共有ください。'},\n  {label:'お礼', text:'ご送客ありがとうございます。確認のうえ折り返しご連絡いたします。'},\n];\nconst STAMPS=['承知致しました','承知しました','承知いたしました','かしこまりました','了解です','了解しました','了解いたしました','ありがとうございます','ありがとうございました','助かります','助かりました','お願いします','お願いいたします','よろしくお願いします','よろしくお願いいたします','引き続きよろしくお願いいたします','お世話になっております','お疲れ様です','確認します','確認いたします','確認しました','確認済です','確認でき次第ご連絡します','ご確認ください','ご確認お願いします','把握しました','対応します','対応いたします','対応中です','ご対応お願いいたします','進めます','進めております','共有します','ご共有ありがとうございます','ご連絡ありがとうございます','少々お待ちください','お待ちしております','後ほどご連絡します','折り返しご連絡します','申し訳ございません','申し訳ありません','恐れ入ります','お忙しいところ恐れ入ります','お手数おかけします','問題ございません','問題ありません','大丈夫です','検討します','ご教示ください','失礼いたします'];\nconst TEXT_REACTIONS=['了解いたしました','承知しました','お願いいたします','確認します','確認済です','対応します','ありがとうございます'];\nconst STAMP_EMOJI=['👍','🙏','✅','🙇','🎉','😊','💪','🔥','📝','👀','💯','🆗','⭐️','😭','😅','🙆','🙌','✨','📌','⏰','🤝','👌','💡','🎊','❤️','😂','😀','🙏🏻','🗓️','💬','❗','❓','🈵','🆖'];\nconst REACTIONS=['👍','🙏','✅','😊','🎉','👀','🔥','💯','🙇','🤝','👌','❤️'];\n/* タスク（owner=担当者 'kanoa'|パートナーID, from=依頼元）*/\nfunction myTasks(){ const o=meId(); return DB.tasks.filter(t=>(t.owner||'kanoa')===o); }           // 自分が担当（受け取った/自分の）\nfunction tasksIAssigned(){ const me=meId(); return DB.tasks.filter(t=>(t.from||t.owner)===me && (t.owner||'kanoa')!==me); } // 自分が相手に依頼中\nfunction openTaskCount(){ return myTasks().filter(t=>!t.done).length; }\nfunction addTask(text, ag, refId){ const o=meId(); DB.tasks.unshift({id:uid('T'),text,owner:o,from:o,ag:ag||null,refId:refId||null,done:false,due:'',created:nowTS()}); save(); }\nfunction assignTask(text, to, ag, refId, due){ const me=meId(); DB.tasks.unshift({id:uid('T'),text,owner:to,from:me,ag:ag||(to!=='kanoa'?to:null)||null,refId:refId||null,done:false,due:due||'',created:nowTS()}); save(); }\nfunction partyLabel(id){ return id==='kanoa'?'KANOA':(agency(id)?agency(id).name:id); }\n\n/* ════════════════════ FILES（資料アップロード）════════════════════\n   ファイル本体は IndexedDB（容量大）、メタ情報のみ referrals.docs に保持。\n   本番は Supabase Storage バケットへ（documents テーブル＋署名URL）。 */\nlet _idb=null; const _memFiles={};\nfunction idb(){ return new Promise((res,rej)=>{ if(!window.indexedDB) return rej('no-idb'); if(_idb) return res(_idb);\n  const q=window.indexedDB.open('relay_files',1); q.onupgradeneeded=()=>q.result.createObjectStore('docs');\n  q.onsuccess=()=>{_idb=q.result;res(_idb)}; q.onerror=()=>rej(q.error); }); }\nasync function idbPut(id,blob){ try{ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction('docs','readwrite'); tx.objectStore('docs').put(blob,id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }catch(e){ _memFiles[id]=blob; } }\nasync function idbGet(id){ try{ const db=await idb(); return await new Promise((res,rej)=>{ const tx=db.transaction('docs','readonly'); const rq=tx.objectStore('docs').get(id); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }catch(e){ return _memFiles[id]; } }\nasync function idbDel(id){ try{ const db=await idb(); return new Promise((res)=>{ const tx=db.transaction('docs','readwrite'); tx.objectStore('docs').delete(id); tx.oncomplete=()=>res(); }); }catch(e){ delete _memFiles[id]; } }\n\nfunction fmtSize(n){ return !n&&n!==0?'':n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB'; }\nfunction fileExt(name){ const m=/\\.([a-z0-9]+)$/i.exec(name||''); return m?m[1].toLowerCase():''; }\nfunction fileTypeInfo(d){\n  const ext=fileExt(d&&d.name); const mime=(d&&d.type||'').toLowerCase();\n  const is=(...x)=>x.includes(ext);\n  if(ext==='pdf'||mime==='application/pdf') return {label:'PDF', bg:'#fdecec', fg:'#c0392b'};\n  if(is('xlsx','xls','xlsm','xlsb','csv','tsv','numbers')||/spreadsheet|excel|csv/.test(mime)) return {label:ext?ext.toUpperCase():'表計算', bg:'#e8f6ee', fg:'#15803d'};\n  if(is('doc','docx','rtf','odt','pages')||/word|document/.test(mime)) return {label:ext?ext.toUpperCase():'文書', bg:'#e8f0fe', fg:'#1a56db'};\n  if(is('ppt','pptx','key','odp')||/presentation|powerpoint/.test(mime)) return {label:ext?ext.toUpperCase():'スライド', bg:'#fff0e6', fg:'#c2410c'};\n  if(is('jpg','jpeg','png','gif','webp','heic','heif','bmp','svg','tiff')||/^image\\//.test(mime)) return {label:ext?ext.toUpperCase():'画像', bg:'#f3e8ff', fg:'#7c3aed'};\n  if(is('zip','rar','7z','tar','gz')) return {label:ext.toUpperCase(), bg:'#eef0f2', fg:'#475569'};\n  if(is('txt','md','json','xml')) return {label:ext.toUpperCase(), bg:'#eef0f2', fg:'#475569'};\n  if(is('mp4','mov','avi','webm','mp3','wav','m4a')) return {label:ext.toUpperCase(), bg:'#fdecf6', fg:'#be185d'};\n  return {label:ext?ext.toUpperCase():'FILE', bg:'#eef0f2', fg:'#475569'};\n}\nfunction fileBadge(d){ const t=fileTypeInfo(d); return `<span class=\"file-badge\" style=\"background:${t.bg};color:${t.fg}\">${esc(t.label)}</span>`; }\nconst DOC_KINDS=['履歴書','職務経歴書','源泉徴収票','給与明細','賞与明細','その他'];\nfunction inferKind(name){ const n=(name||'').toLowerCase();\n  if(/履歴書|resume|rireki/.test(n)) return '履歴書';\n  if(/職務|職歴|career|cv|shokumu/.test(n)) return '職務経歴書';\n  if(/源泉|徴収|gensen|withholding/.test(n)) return '源泉徴収票';\n  if(/賞与|ボーナス|bonus|shoyo/.test(n)) return '賞与明細';\n  if(/給与|給料|payslip|salary|kyuyo/.test(n)) return '給与明細';\n  return 'その他';\n}\nfunction docKind(d){ return d.kind || inferKind(d.name); }\nfunction docSet(r){ return new Set((r.docs||[]).map(docKind)); }\nfunction docStat(r){ const set=docSet(r); return { rireki:set.has('履歴書'), shoku:set.has('職務経歴書'), gensen:set.has('源泉徴収票'), kyuyo:set.has('給与明細'), shoyo:set.has('賞与明細'), n:(r.docs||[]).length, has:k=>set.has(k), kinds:set }; }\nfunction docFlags(r){ const s=docStat(r);\n  let base=`<span class=\"docflag ${s.rireki?'on':''}\" title=\"履歴書\">履</span><span class=\"docflag ${s.shoku?'on':''}\" title=\"職務経歴書\">職</span>`;\n  // 内定以降は内定後書類のフラグも表示\n  if(r.status==='offer'||r.status==='joined'){\n    const req=stageReq(r.pj,'offer');\n    if(req){ base+=`<span class=\"docflag ${s.gensen?'on':''}\" title=\"源泉徴収票\">源</span><span class=\"docflag ${s.kyuyo?'on':''}\" title=\"給与明細\">給</span>`; }\n  }\n  return base+`${s.n?`<span class=\"cell-sub\" style=\"margin-left:3px\">${s.n}</span>`:''}`;\n}\n/* 案件のステージ別必要書類（未設定の案件は履歴書・職務経歴書のみ）*/\nconst DEFAULT_DOCREQS = { interview:{required:['履歴書','職務経歴書']} };\nfunction projectDocReqs(pj){ const p=project(pj); return (p&&p.docReqs)||DEFAULT_DOCREQS; }\nfunction stageReq(pj, stage){ const dr=projectDocReqs(pj); return dr[stage]||null; }\nfunction missingDocsForStage(r, stage){ const req=stageReq(r.pj, stage); if(!req) return []; const set=docSet(r); return (req.required||[]).filter(k=>!set.has(k)); }\nfunction missingOptionalForStage(r, stage){ const req=stageReq(r.pj, stage); if(!req||!req.optional) return []; const set=docSet(r); return req.optional.filter(k=>!set.has(k)); }\n/* 進行ガード：選考会へ進むには interview ステージの必須書類が必要 */\nfunction advanceGuard(r, st){\n  // 選考会・内定・入社は、履歴書と職務経歴書が揃っていないと進めない\n  const gated={ interview:'選考会', offer:'内定', joined:'入社' };\n  if(gated[st]){\n    const miss=missingDocsForStage(r,'interview');  // interviewステージの必須(履歴書・職務経歴書)を全段階で要求\n    if(miss.length) return `${r.name}さんは${miss.join('・')}が未提出のため、${gated[st]}へ進めません。先に資料を回収してください。`;\n  }\n  return null;\n}\nasync function autofillReferral(r, file){\n  try{\n    let text=''; const ext=fileExt(file.name);\n    if(ext==='pdf'||file.type==='application/pdf') text=await extractPdfText(file);\n    else if(/^(txt|csv|md|json|tsv)$/.test(ext)||/^text\\//.test(file.type)) text=await file.text();\n    else return 0;\n    const f=parseResumeFields(text); let filled=0;\n    const setIf=(k,v)=>{ if(v && !(''+(r[k]||'')).trim()){ r[k]=v; filled++; } };\n    setIf('name',f.name); setIf('kana',f.kana); setIf('phone',f.phone); setIf('email',f.email); setIf('address',f.address); setIf('area',f.area);\n    return filled;\n  }catch(e){ return 0; }\n}\nasync function uploadDocs(refId, fileList, forceKind){\n  const r=DB.referrals.find(x=>x.id===refId); if(!r) return;\n  r.docs=r.docs||[];\n  let resumeFile=null;\n  let _upOk=0, _upSkip=0;\n  for(const f of Array.from(fileList)){\n    if(f.size>25*1048576){ toast(`${f.name} は25MBを超えています（上限25MB）`); _upSkip++; continue; }\n    const kind = forceKind || inferKind(f.name);\n    // 履歴書（またはPDF/テキスト）で、候補者情報が未入力なら自動入力の対象に\n    if(!resumeFile && (kind==='履歴書' || fileExt(f.name)==='pdf' || /^text\\//.test(f.type)) && (!r.name||!r.email||!r.phone||!r.kana)) resumeFile=f;\n    if(DEMO_MODE){ const id=uid('D'); await idbPut(id,f); r.docs.push({id, name:f.name, size:f.size, type:f.type, kind, uploaded:nowTS()}); _upOk++; }\n    else { try{ const meta=await SUPA.uploadDoc(refId,f,kind); r.docs.push(meta); _upOk++; }catch(e){ toast(`${f.name} のアップロードに失敗しました`); _upSkip++; } }\n  }\n  let filled=0;\n  if(resumeFile){ filled=await autofillReferral(r, resumeFile); }\n  save();\n  // 実際にアップロードできた件数で出し分け（サイズ超過などで0件なら成功メッセージを出さない）\n  if(_upOk>0){\n    let msg=`${_upOk}件の資料をアップロードしました`;\n    if(filled) msg+=`（${filled}項目を自動入力）`;\n    if(_upSkip>0) msg+=` / ${_upSkip}件はサイズ超過などで対象外`;\n    toast(msg);\n  } else if(_upSkip>0){\n    toast(`アップロードできませんでした（${_upSkip}件がサイズ超過などで対象外）`);\n  }\n  if(curRef===refId) openRefDrawer(refId);\n}\nfunction findDoc(id){ for(const r of DB.referrals){ const d=(r.docs||[]).find(x=>x.id===id); if(d) return {r,d}; } return {}; }\nasync function downloadDoc(id,name){\n  { const {d}=findDoc(id); if(d&&d.seeded){ toast('デモ用のサンプル資料です（実ファイルはありません）'); return; } }\n  if(!DEMO_MODE){ const {d}=findDoc(id); if(d&&d.path){ const u=await SUPA.docUrl(d.path); if(u){ const a=document.createElement('a'); a.href=u; a.download=name||d.name||'file'; document.body.appendChild(a); a.click(); a.remove(); return; } } toast('ファイルが見つかりません'); return; }\n  const b=await idbGet(id); if(!b){ toast('ファイルが見つかりません'); return; } const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name||'file'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); }\nasync function viewDoc(id){\n  { const {d}=findDoc(id); if(d&&d.seeded){ toast('デモ用のサンプル資料です（実ファイルはありません）'); return; } }\n  if(!DEMO_MODE){ const {d}=findDoc(id); if(d&&d.path){ const u=await SUPA.docUrl(d.path); if(u){ window.open(u,'_blank'); return; } } toast('ファイルが見つかりません'); return; }\n  const b=await idbGet(id); if(!b){ l>\n    ${items.map(d=>docItemRow(r,d)).join('')}\n  </div>`;\n}\nfunction docsSection(r){\n  const reqIv=stageReq(r.pj,'interview'); const reqOf=stageReq(r.pj,'offer');\n  const offerStage = r.status==='offer' || r.status==='joined';\n  // 内定後の必要書類スロット（楽天など offer 書類がある案件のみ）\n  const offerSlots = (offerStage && reqOf) ? (reqOf.required||[]).map(k=>docSlot(r,k,k)).join('') + (reqOf.optional||[]).map(k=>docSlot(r,k,k+'（任意）')).join('') : '';\n  const otherDocs=(r.docs||[]).filter(d=>!['履歴書','職務経歴書','源泉徴収票','給与明細','賞与明細'].includes(docKind(d)));\n  return `<div class=\"dt-block-title\">提案資料（選考会に必要）</div>\n    <div class=\"doc-slots\">\n      ${docSlot(r,'履歴書','履歴書','顔写真付き推奨')}\n      ${docSlot(r,'職務経歴書','職務経歴書','')}\n    </div>\n    ${offerSlots?`<div class=\"dt-block-title\" style=\"margin-top:14px\">内定後の必要書類</div><div class=\"doc-slots\">${offerSlots}</div>`:''}\n    <div class=\"dt-block-title\" style=\"margin-top:14px\">その他の資料</div>\n    <label class=\"dropzone slim\" data-ref=\"${r.id}\">\n      <input type=\"file\" multiple style=\"display:none\" data-act=\"doc-input\" data-ref=\"${r.id}\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4\"/><path d=\"M17 8l-5-5-5 5\"/><path d=\"M12 3v12\"/></svg>\n      <div class=\"dz-main\">その他の資料をドロップ／クリックで選択</div>\n      <div class=\"dz-sub\">PDF・Excel・CSV・Word・画像など、形式は問いません（最大25MB）</div>\n    </label>\n    ${otherDocs.map(d=>docItemRow(r,d)).join('')}`;\n}\n\nconst STATUS = {\n  entry:      {label:'送客済',   cls:'entry'},\n  screening:  {label:'書類選考', cls:'screening'},\n  interview:  {label:'選考会',   cls:'interview'},\n  offer:      {label:'内定',     cls:'offer'},\n  joined:     {label:'入社',     cls:'joined'},\n  rejected:   {label:'見送り',   cls:'rejected'},\n  declined:   {label:'辞退',     cls:'declined'},\n};\nconst STATUS_ORDER = ['entry','screening','interview','offer','joined','rejected ;\n  return { ref:p.referralReward, suc:p.successReward };\n}\n/* 楽天：基本給はエリアで変わる。基本給×14×30%＝KANOA受領、その85%＝各社報酬 */\nfunction baseSalaryFor(r){\n  const p=project(r.pj); const cfg=p&&p.baseSalaryByArea; if(!cfg) return 0;\n  const area=(r.area||r.address||'')+'';\n  for(const a of (cfg.areas||[])){ if((a.match||[]).some(m=>area.includes(m))) return a.salary; }\n  return cfg.default||0;\n}\nfunction kanoaRevenueFor(r){ const base=baseSalaryFor(r); return base?Math.round(base*14*0.30):0; }   // KANOA受領額\nfunction successRewardFor(r){\n  const p=project(r.pj);\n  if(p && p.rewardModel==='rakuten'){ const kr=kanoaRevenueFor(r); return kr?Math.round(kr*0.85):0; } // 各社報酬＝KANOA受領×85%\n  return effReward(r.pj,r.ag).suc;\n}\nfunction rewardBreakdown(r, forAgency){\n  const p=project(r.pj); if(!(p&&p.rewardModel==='rakuten')) return '';\n  const base=baseSalaryFor(r); const kr=kanoaRevenueFor(r); const fee=successRewardFor(r);\n  const areaTxt=(r.area||r.address||'').trim();\n  return `<div class=\"reward-calc\">\n    <div class=\"rc-title\">成果報酬の自動計算（楽天・エリア準拠）</div>\n    <div class=\"rc-row\"><span>エリア基本給${areaTxt?`（${esc(areaTxt)}）`:''}</span><b>${base?yen(base):'エリア未設定'}</b></div>\n    ${forAgency?'':`<div class=\"rc-row\"><span>KANOA受領（基本給×14×30%）</span><b>${yen(kr)}</b></div>`}\n    <div class=\"rc-row hl\"><span>${forAgency?'御社の成果報酬':'各社へ振込（×85%）'}</span><b>${yen(fee)}</b></div>\n    <div class=\"rc-note\">希望エリアの基本給で自動計算（入社確定で確定）。</div>\n  </div>`;\n}\n/* referrals visible to an agency = published projects */\nfunction agencyProjects(agId){\n  return DB.projects.filter(p=>{\n    const a=assignment(p.id,agId); return a && a.published;\n  });\n}\nfunction projectReferrals(pj){ return DB.referrals.filter(r=>r.pj===pj); }\nfunction agencyReferrals(ag){ return DB.referrals.filter(r=>r.ag===ag); }\n\n/* earnings: per (referral) -> referral reward always; success reward when joined */\nfunction refEarning(r){\n  const e = effReward(r.pj, r.ag);\n  let total = 0;\n  const p = project(r.pj);\n  if(r.status!=='rejected'){\n    if(p.rewardType==='referral' || p.rewardType==='both') total += e.ref;\n  }\n  if(r.status==='joined'){\n    if(p.rewardType==='success' || p.rewardType==='both') total += successRewardFor(r);\n  }\n  return total;\n}\nfunction splitEarn(refs){\n  let confirmed=0, pipeline=0;\n  refs.forEach(r=>{\n    const p=project(r.pj), e=effReward(r.pj,r.ag);\n    if(r.status==='rejected') return;\n    if(p.rewardType==='referral'||p.rewardType==='both') confirmed+=e.ref;\n    if(p.rewardType==='success'||p.rewardType==='both'){\n      const suc=successRewardFor(r);\n      if(r.status==='joined') confirmed+=suc; else pipeline+=suc;\n    }\n  });\n  return {confirmed, pipeline};\n}\n\n/* ════════════════════ SESSION ════════════════════ */\nlet S = { role:null, agencyId:null, view:null };\n\n/* ════════════════════ LOGIN ════════════════════ */\nlet loginTab = 'agency';\nconst LI_USER='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>';\nconst LI_LOCK='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"/></svg>';\nconst LI_EYE='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>';\nconst LI_ARROW='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/><polyline points=\"12 5 19 12 12 19\"/></svg>';\nfunction CHECK_INVITE_THEN_LOGIN(){\n  let p=null; try{ p=new URLSearchParams(location.search); }catch(e){}\n  const formAg=p&&p.get('form');\n  if(formAg){ const formPj=p&&p.get('pj'); handleFormUrl(formAg, formPj); return; }   // パートナー向け応募フォーム\n  const agId=p&&p.get('invite'), token=p&&p.get('token');\n  if(agId && token){ handleInviteUrl(agId, token); return; }\n  renderLogin();\n}\nasync function handleInviteUrl(agId, token){\n  inviteScreen(`<div style=\"font-family:var(--display);font-weight:800;font-size:18px;margin-bottom:8px\">確認しています…</div><div style=\"font-size:13px;color:var(--soft)\">招待リンクを確認しています。少しお待ちください。</div>`);\n  let a=agency(agId);\n  if(!a && !DEMO_MODE){\n    try{\n      const sb=await SUPA.ensureClient();\n      const r=await sb.from('agencies').select('*').eq('id',agId).maybeSingle();\n      if(r && r.data){\n        const d=r.data;\n        a={id:d.id,name:d.name,contact:d.contact,email:d.email,status:d.status,source:d.source,joined:d.joined,code:d.code,pwHash:d.pw_hash||null,inviteToken:d.invite_token||null,inviteIssuedAt:d.invite_issued_at||null,inviteUsedAt:d.invite_used_at||null};\n        DB.agencies=DB.agencies||[]; if(!DB.agencies.some(x=>x.id===a.id)) DB.agencies.push(a);\n      }\n    }catch(e){}\n  }\n  if(!a){ renderInviteError('このリンクは無効です（パートナーが見つかりません）。招待の再発行をKANOAにご依頼ください。'); return; }\n  if(!a.inviteToken || a.inviteToken!==token){ renderInviteError('このリンクは無効です。最新のリンクをKANOAにご確認ください。'); return; }\n  const stt=inviteState(a);\n  if(stt==='expired'){ renderInviteError('このリンクは有効期限（7日）が切れています。KANOAに再発行を依頼してください。'); return; }\n  if(stt==='used'){ renderInviteError('このリンクは既に使用済みです。ログイン画面からお進みください。'); return; }\n  renderInviteAccept(a);\n}\nfunction showSetPasswordScreen(){\n  loginTab='agency';\n  const app=document.getElementById('app'); if(app) app.classList.remove('on');\n  const wrap=document.getElementById('loginWrap'); if(wrap) wrap.style.display='flex';\n  const title=document.getElementById('loginTitle'); if(title) title.textContent='新しいパスワードの設定';\n  const sub=document.getElementById('loginSub'); if(sub) sub.textContent='初回ログイン用の安全なパスワードを入力してください';\n  const tabs=document.querySelector('.login-tabs'); if(tabs) tabs.style.display='none';\n  const body=document.getElementById('loginBody');\n  body.innerHTML = `\n    <div class=\"ix\">${LI_LOCK}<input id=\"npw1\" type=\"password\" autocomplete=\"new-password\" placeholder=\"新しいパスワード（8文字以上）\"><button type=\"button\" class=\"ix-eye\" data-act=\"pw-eye\">${LI_EYE}</button></div>\n    <div class=\"ix\">${LI_LOCK}<input id=\"npw2\" type=\"password\" autocomplete=\"new-password\" placeholder=\"新しいパスワード（確認）\"></div>\n    <div class=\"login-err\" id=\"liErr\"></div>\n    <button class=\"loginbtn\" data-act=\"set-password\"><span>パスワードを設定して入る</span>${LI_ARROW}</button>`;\n}\nfunction renderLogin(){\n  hideBootSplash();\n  try{ var _lw=document.getElementById('loginWrap'); if(_lw) _lw.style.display=''; }catch(e){}\n  const body = document.getElementById('loginBody');\n  const title = document.getElementById('loginTitle');\n  const sub = document.getElementById('loginSub');\n  const modeEl=document.getElementById('loginMode');\n  if(modeEl) modeEl.textContent = DEMO_MODE ? 'デモモード（端末内）' : '● 本番モード（Supabase）';\n  const footEl=document.querySelector('.login-foot');\n  if(footEl) footEl.style.display = DEMO_MODE ? '' : 'none';   // 本番ではSupabase関連を表示しない\n  document.querySelectorAll('.login-tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===loginTab));\n\n  if(loginTab==='agency'){\n    title.textContent='パートナーログイン';\n    sub.textContent='メールアドレスとパスワードでログイン';\n    body.innerHTML = `\n      <div class=\"ix\">${LI_USER}<input id=\"liId\" type=\"email\" value=\"${DEMO_MODE?'otsuka@alive.co.jp':''}\" autocomplete=\"off\" placeholder=\"メールアドレス\"></div>\n      <div class=\"ix\">${LI_LOCK}<input id=\"liPw\" type=\"password\" value=\"${DEMO_MODE?'alive2026':''}\" autocomplete=\"off\" placeholder=\"パスワード\"><button type=\"button\" class=\"ix-eye\" data-act=\"pw-eye\">${LI_EYE}</button></div>\n      <div class=\"lrow\"><label class=\"lcheck\"><input type=\"checkbox\" id=\"liRemember\"><span>ログイン状態を保持する</span></label><button type=\"button\" class=\"lforgot\" data-act=\"forgot-pw\">パスワードをお忘れの方</button></div>\n      <div class=\"login-err\" id=\"liErr\"></div>\n      <button class=\"loginbtn\" data-act=\"login-agency\"><span>ログイン</span>${LI_ARROW}</button>\n      ${DEMO_MODE?`<div class=\"login-quick\">\n        <div class=\"login-quick-label\">デモ：タップしてパートナーとして入る</div>\n        <div class=\"quick-row\">\n          ${DB.agencies.filter(a=>a.status==='active').map(a=>`<button class=\"quick-chip\" data-act=\"quick-agency\" data-id=\"${a.id}\">${esc(a.name)}</button>`).join('')}\n        </div>\n      </div>`:''}`;\n  } else if(loginTab==='kanoa'){\n    title.textContent='KANOA 管理';\n    sub.textContent='案件・パートナー・送客・成果を一元管理';\n    body.innerHTML = `\n      <div class=\"ix\">${LI_USER}<input id=\"liId\" type=\"${DEMO_MODE?'text':'email'}\" value=\"${DEMO_MODE?'KANOA-ADMIN':''}\" autocomplete=\"off\" placeholder=\"${DEMO_MODE?'管理ID':'メールアドレス'}\"></div>\n      <div class=\"ix\">${LI_LOCK}<input id=\"liPw\" type=\"password\" value=\"${DEMO_MODE?'kanoa2026':''}\" autocomplete=\"off\" placeholder=\"パスワード\"><button type=\"button\" class=\"ix-eye\" data-act=\"pw-eye\">${LI_EYE}</button></div>\n      <div class=\"lrow\"><label class=\"lcheck\"><input type=\"checkbox\" id=\"liRememberK\"><span>ログイン状態を保持する</span></label></div>\n      <div class=\"login-err\" id=\"liErr\"></div>\n      <button class=\"loginbtn\" data-act=\"login-kanoa\"><span>管理画面に入る</span>${LI_ARROW}</button>`;\n  } else {\n    title.textContent='掲載申請';\n    sub.textContent='パートナー・ブローカーとして案件の掲載を申請';\n    body.innerHTML = `\n      <div class=\"field\"><label>会社名 / 屋号</label><input id=\"apName\" placeholder=\"株式会社〇〇\"></div>\n      <div class=\"field\"><label>ご担当者名</label><input id=\"apContact\" placeholder=\"山田 太郎\"></div>\n      <div class=\"field\"><label>メールアドレス</label><input id=\"apEmail\" type=\"email\" placeholder=\"you@example.com\"></div>\n      <div class=\"login-err\" id=\"liErr\"></div>\n      <button class=\"btn btn-primary btn-block\" data-act=\"apply-submit\">申請を送信する</button>\n      <div class=\"login-quick\"><div class=\"login-quick-label\">送信後、KANOAの承認をもってログインできます</div></div>`;\n  }\n}\n\nfunction resolveAgency(input){\n  const v=(input||'').trim(); if(!v) return null;\n  const norm=s=>String(s).replace(/株式会社|合同会社|\\s/g,'').toLowerCase();\n  return DB.agencies.find(a=>(a.email||'').toLowerCase()===v.toLowerCase())\n      || agency(v.toUpperCase())\n      || DB.agencies.find(a=>a.name===v)\n      || DB.agencies.find(a=>norm(a.name)===norm(v));\n}\nfunction recordLogin(agId, ok, via){\n  if(!DB.logins) DB.logins=[];\n  const entry={id:uid('L'),ag:agId,at:nowTS(),ok:!!ok,via:via||'パスワード'};\n  DB.logins.unshift(entry);\n  // Supabase本番時はlogin_logsテーブルへinsert\n  if(!DEMO_MODE && typeof SUPA!=='undefined'){\n    try{ SUPA.insertLoginLog(agId, ok, via||'パスワード'); }catch(e){}\n  }\n  save();\n}\nfunction lastLogin(agId){ return (DB.logins||[]).filter(l=>l.ag===agId && l.ok).sort((a,b)=>a.at<b.at?1:-1)[0]; }\nfunction doLoginAgency(id, opts){\n  const a = typeof id==='object'?id:(agency(id)||resolveAgency(id));\n  const err=m=>{ const el=document.getElementById('liErr'); if(el) el.textContent=m; };\n  if(!a){ err('パートナーIDまたは会社名が見つかりません'); return; }\n  if(a.status==='pending'){ err('この申請はまだ承認待ちです'); return; }\n  if(a.status==='suspended'){ err('このアカウントは停止されています'); return; }\n  if(checkLoginLock(a.id)){ err('ログイン試行が多すぎます。5分後に再試行してください'); recordLogin(a.id,false,'ロック中'); return; }\n  if(opts && opts.checkPw && a.pw && (document.getElementById('liPw').value!==a.pw)){\n    recordLoginFail(a.id);\n    const f=_loginFails[a.id]; const remain=f?Math.max(0,5-f.count):0;\n    recordLogin(a.id,false,opts.via||'パスワード');\n    err('パスワードが違います'+(remain>0?`（残り${remain}回失敗でロック）`:' — アカウントがロックされました')); return;\n  }\n  clearLoginFails(a.id);\n  recordLogin(a.id, true, (opts&&opts.via)||'パスワード');\n  S = {role:'agency', agencyId:a.id, view:(a.special==='recore'?'recore':'pjlist')};\n  enterApp();\n}\n\n/* ════════════════════ APP ENTRY ════════════════════ */\nconst NAV_RECORE = [\n    {v:'recore', label:'収支管理', icon:'<path d=\"M3 3v18h18\"/><path d=\"M7 15l4-4 3 3 5-6\"/>'},\n    {v:'myrefs', label:'送客状況', icon:'<path d=\"M22 11.08V12a10 10 0 11-5.93-9.14\"/><path d=\"M22 4L12 14.01l-3-3\"/>'},\n    {v:'messages', label:'連絡', icon:'<path d=\"M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z\"/>'},\n  ];\n  const NAV_SUB = [\n    {v:'subhome', label:'紹介した方', icon:'<path d=\"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 00-3-3.87\"/><path d=\"M16 3.13a4 4 0 010 7.75\"/>'},\n  ];\n  function navFor(role){ if(role==='sub') return NAV_SUB; if(role==='agency' && isRecore()) return NAV_RECORE; return NAV[role]; }\n  const NAV = {\n  kanoa:[\n    {v:'overview', label:'概要',       icon:'<path d=\"M3 13h8V3H3zM13 21h8V3h-8zM3 21h8v-6H3z\"/>'},\n    {v:'projects', label:'案件',       icon:'<rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M3 9h18M8 4v16\"/>'},\n    {v:'agencies', label:'パートナー',     icon:'<path d=\"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75\"/>'},\n    {v:'referrals',label:'送客',       icon:'<path d=\"M22 11.08V12a10 10 0 11-5.93-9.14\"/><path d=\"M22 4L12 14.01l-3-3\"/>'},\n    {v:'intake',   label:'パートナー連携', icon:'<path d=\"M22 12h-6l-2 3h-4l-2-3H2\"/><path d=\"M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z\"/>'},\n    {v:'subpartners', label:'二次パートナー', icon:'<path d=\"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 00-3-3.87\"/><path d=\"M16 3.13a4 4 0 010 7.75\"/>'},\n
